# vah_val_configs.yaml
# Configuration complète pour VA (Value Area) et VAL (Value Area Low) dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 50
  max_data_points: 100000
  value_area_percentage: 70
  bin_size: 100
  max_bins: 500
  min_volume_for_profile: 100

# Types de zones de valeur
value_area_types:
  fixed_range:
    enabled: true
    description: "Fixed Range Value Area"
    bin_size: 100
    max_bins: 500
    min_volume: 100
    update_frequency: "realtime"
  rolling:
    enabled: true
    description: "Rolling Value Area"
    window_size: 20
    bin_size: 100
    max_bins: 500
    min_volume: 100
    update_frequency: "realtime"
  market:
    enabled: true
    description: "Market Profile Value Area"
    value_area_percentage: 70
    poc_calculation: true
    high_volume_nodes: true
    low_volume_nodes: true
    node_threshold: 10
    update_frequency: "realtime"
  session:
    enabled: true
    description: "Session Value Area"
    session_types:
      - "asia"
      - "london"
      - "newyork"
      - "overlap"
    value_area_percentage: 70
    poc_calculation: true
    update_frequency: "realtime"

# Seuils de zones de valeur
thresholds:
  vah_breakout:
    low: 1.0
    medium: 1.5
    high: 2.0
    extreme: 3.0
  val_breakout:
    low: -1.0
    medium: -1.5
    high: -2.0
    extreme: -3.0
  vah_rejection:
    low: 0.5
    medium: 1.0
    high: 1.5
    extreme: 2.0
  val_rejection:
    low: -0.5
    medium: -1.0
    high: -1.5
    extreme: -2.0
  value_area_width:
    low: 0.5
    medium: 1.0
    high: 2.0
    extreme: 3.0

# Indicateurs de zones de valeur
indicators:
  vah_level:
    enabled: true
    calculation: "fixed"
    smoothing: 0
    update_frequency: "realtime"
  val_level:
    enabled: true
    calculation: "fixed"
    smoothing: 0
    update_frequency: "realtime"
  poc_level:
    enabled: true
    calculation: "fixed"
    smoothing: 0
    update_frequency: "realtime"
  value_area_width:
    enabled: true
    calculation: "vah - val"
    smoothing: 3
    update_frequency: "realtime"
  value_area_mid:
    enabled: true
    calculation: "(vah + val) / 2"
    smoothing: 3
    update_frequency: "realtime"
  value_area_percentage:
    enabled: true
    calculation: "current_price / value_area"
    smoothing: 0
    update_frequency: "realtime"
  volume_node_strength:
    enabled: true
    calculation: "volume_at_poc / total_volume"
    smoothing: 0
    update_frequency: "realtime"
  high_volume_nodes:
    enabled: true
    calculation: "volume > threshold"
    smoothing: 0
    update_frequency: "realtime"
  low_volume_nodes:
    enabled: true
    calculation: "volume < threshold"
    smoothing: 0
    update_frequency: "realtime"

# Analyse des zones de valeur
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_vah_distribution: true
    compute_val_distribution: true
    compute_poc_distribution: true
    compute_value_area_width_distribution: true
    compute_vah_percentiles: true
    compute_val_percentiles: true
    percentile_values:
      - 1
      - 5
      - 10
      - 25
      - 50
      - 75
      - 90
      - 95
      - 99
    compute_vah_trend: true
    compute_val_trend: true
    compute_value_area_seasonality: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous_vah: true
    compute_instantaneous_val: true
    compute_instantaneous_poc: true
    compute_moving_average_vah: true
    compute_moving_average_val: true
    compute_exponential_vah: true
    compute_exponential_val: true
    compute_vah_velocity: true
    compute_val_velocity: true
    compute_vah_acceleration: true
    compute_val_acceleration: true
  predictive:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "xgboost"
      - "lightgbm"
    features:
      - "vah_current"
      - "val_current"
      - "poc_current"
      - "value_area_width"
      - "value_area_mid"
      - "volume_node_strength"
      - "high_volume_nodes"
      - "low_volume_nodes"
      - "price"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_threshold: 0.7
    retrain_frequency_hours: 24
  comparative:
    enabled: true
    compare_to_previous: true
    compare_to_historical: true
    compare_to_benchmark: true
    compare_to_sector: true
    benchmark_symbols:
      - "SP500"
      - "NASDAQ"
      - "BTCUSDT"
      - "ETHUSDT"

# Alertes et notifications
alerts:
  vah_breakout:
    enabled: true
    multiplier: 1.5
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "critical"
  val_breakout:
    enabled: true
    multiplier: 1.5
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "critical"
  vah_rejection:
    enabled: true
    multiplier: 1.0
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"
  val_rejection:
    enabled: true
    multiplier: 1.0
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"
  value_area_expansion:
    enabled: true
    multiplier: 2.0
    channels:
      - "telegram"
      - "push_notification"
    severity: "info"
  value_area_contraction:
    enabled: true
    multiplier: 0.5
    channels:
      - "telegram"
      - "push_notification"
    severity: "info"

# Actions automatiques
auto_actions:
  trade_execution:
    enabled: true
    action_types:
      - "enter_long_on_vah_breakout"
      - "enter_short_on_val_breakout"
      - "enter_long_on_val_rejection"
      - "enter_short_on_vah_rejection"
      - "exit_on_value_area"
    require_vah_val_signal: true
    require_confidence: 0.6
    max_position_size: 10000
    min_position_size: 100
  stop_loss:
    enabled: true
    methods:
      - "vah_based"
      - "val_based"
      - "value_area_based"
    vah_multiplier: 1.0
    val_multiplier: 1.0
    value_area_multiplier: 1.5
    min_stop_percent: 0.5
    max_stop_percent: 10.0
    update_frequency_seconds: 10
  take_profit:
    enabled: true
    methods:
      - "vah_projection"
      - "val_projection"
      - "value_area_projection"
    projection_multiplier: 1.0
    min_profit_percent: 1.0
    max_profit_percent: 20.0
    update_frequency_seconds: 10
  position_sizing:
    enabled: true
    method: "value_area_based"
    value_area_scale: 0.5
    max_position_percent: 10.0
    min_position_percent: 0.5
    scaling_function: "value_area_width"

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "transformer"
      - "xgboost"
      - "lightgbm"
    features:
      - "vah_current"
      - "val_current"
      - "poc_current"
      - "value_area_width"
      - "value_area_mid"
      - "value_area_percentage"
      - "volume_node_strength"
      - "high_volume_nodes"
      - "low_volume_nodes"
      - "vah_velocity"
      - "val_velocity"
      - "vah_acceleration"
      - "val_acceleration"
      - "price"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.20
      - 0.20
      - 0.20
      - 0.20
      - 0.20
  statistical_analysis:
    enabled: true
    calculate_descriptive_stats: true
    calculate_inferential_stats: true
    calculate_distribution_fitting: true
    calculate_value_area_probability: true
    calculate_breakout_probability: true
    calculate_rejection_probability: true
    confidence_level: 95
    p_value_threshold: 0.05
  volume_profile_analysis:
    enabled: true
    profile_types:
      - "fixed_range"
      - "rolling"
      - "session"
    calculate_volume_profile: true
    calculate_value_area: true
    calculate_poc: true
    calculate_high_volume_nodes: true
    calculate_low_volume_nodes: true
    profile_update_frequency: "realtime"

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "vah_current"
      - "val_current"
      - "poc_current"
      - "value_area_width"
      - "value_area_mid"
      - "value_area_percentage"
      - "volume_node_strength"
      - "high_volume_nodes_count"
      - "low_volume_nodes_count"
      - "vah_velocity"
      - "val_velocity"
      - "vah_acceleration"
      - "val_acceleration"
      - "breakout_status"
      - "rejection_status"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "value_area_chart"
      - "vah_val_analysis"
      - "poc_analysis"
      - "volume_profile"
      - "high_volume_nodes"
      - "low_volume_nodes"
      - "value_area_distribution"
      - "breakout_analysis"

# Backtesting
backtesting:
  enabled: true
  use_historical_value_area: true
  compute_value_area_accuracy: true
  compute_breakout_accuracy: true
  compute_rejection_accuracy: true
  compute_strategy_performance: true
  compute_risk_adjusted_returns: true
  report_metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "value_area_accuracy"
    - "breakout_accuracy"
    - "rejection_accuracy"

# Distribution des métriques
metrics_distribution:
  enabled: true
  distribution:
    - metric: "vah_current"
      bins: 100
      update_frequency: "realtime"
    - metric: "val_current"
      bins: 100
      update_frequency: "realtime"
    - metric: "value_area_width"
      bins: 50
      update_frequency: "realtime"
    - metric: "volume_node_strength"
      bins: 50
      update_frequency: "realtime"
  percentiles:
    - 1
    - 5
    - 10
    - 25
    - 50
    - 75
    - 90
    - 95
    - 99

# Configuration de la base de données
database:
  enabled: true
  table_name: "value_area_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
      - "7d"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/value-area"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "value_area_alert"
    - url: "https://nexustradingia.com/api/webhooks/value-area-breakout"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "value_area_breakout"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "value_area_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/value-area"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/value-area/current"
    - "/api/v1/value-area/history"
    - "/api/v1/value-area/metrics"
    - "/api/v1/value-area/status"
    - "/api/v1/value-area/indicators"
    - "/api/v1/value-area/profile"
    - "/api/v1/value-area/breakout"
    - "/api/v1/value-area/forecast"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/value-area/"
  encrypt: true
  encryption_key_id: "nexus-value-area-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/value-area"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_volume"
      - "low_volume"
      - "volatile_market"
      - "stable_market"
      - "breakout_scenario"
      - "rejection_scenario"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "thresholds.vah_breakout.low < thresholds.vah_breakout.medium"
      - "thresholds.vah_breakout.medium < thresholds.vah_breakout.high"
      - "thresholds.vah_breakout.high < thresholds.vah_breakout.extreme"
      - "thresholds.val_breakout.low > thresholds.val_breakout.medium"
      - "thresholds.val_breakout.medium > thresholds.val_breakout.high"
      - "thresholds.val_breakout.high > thresholds.val_breakout.extreme"
      - "value_area_percentage > 0"
      - "value_area_percentage < 100"
      - "bin_size > 0"
      - "max_bins > bin_size"
      - "min_volume_for_profile > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "trending"
      - "ranging"
      - "volatile"
      - "stable"
      - "breakout"
      - "rejection"
  regime_parameters:
    trending:
      value_area_multiplier: 0.8
      threshold_multiplier: 0.7
      confidence_multiplier: 1.2
    ranging:
      value_area_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
    volatile:
      value_area_multiplier: 1.5
      threshold_multiplier: 1.3
      confidence_multiplier: 0.7
    stable:
      value_area_multiplier: 0.6
      threshold_multiplier: 0.8
      confidence_multiplier: 1.3
    breakout:
      value_area_multiplier: 0.5
      threshold_multiplier: 0.5
      confidence_multiplier: 1.5
    rejection:
      value_area_multiplier: 0.5
      threshold_multiplier: 0.5
      confidence_multiplier: 1.5

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      value_area_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
    london:
      start: "08:00"
      end: "16:00"
      value_area_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
    newyork:
      start: "13:00"
      end: "22:00"
      value_area_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      value_area_multiplier: 1.5
      threshold_multiplier: 0.7
      confidence_multiplier: 1.2

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    value_area_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    bin_size: 100
    max_bins: 500
    value_area_percentage: 70
  ETHUSDT:
    value_area_multiplier: 1.1
    threshold_multiplier: 0.9
    confidence_multiplier: 1.0
    bin_size: 80
    max_bins: 400
    value_area_percentage: 70
  SOLUSDT:
    value_area_multiplier: 1.2
    threshold_multiplier: 0.8
    confidence_multiplier: 0.9
    bin_size: 60
    max_bins: 300
    value_area_percentage: 70
  ADAUSDT:
    value_area_multiplier: 0.9
    threshold_multiplier: 1.1
    confidence_multiplier: 1.1
    bin_size: 50
    max_bins: 250
    value_area_percentage: 70
  XRPUSDT:
    value_area_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    bin_size: 50
    max_bins: 250
    value_area_percentage: 70
