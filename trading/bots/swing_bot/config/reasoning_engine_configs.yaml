# Swing Bot Reasoning Engine Configuration
# Core Reasoning Engine & Logical Inference Parameters

# General Reasoning Engine Settings
reasoning_engine:
  enabled: true
  engine_mode: "hybrid"  # hybrid, symbolic, connectionist, probabilistic
  reasoning_paradigm: "multi_method"  # multi_method, single_method, adaptive
  engine_level: "advanced"  # basic, intermediate, advanced, expert
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "inference_engine"
    - "knowledge_base"
    - "logic_engine"
    - "probabilistic_engine"
    - "causal_engine"
    - "case_based_engine"
    - "rule_engine"
    - "fuzzy_engine"
    - "decision_engine"
    - "explanation_engine"
  module_interaction: "pipeline"  # pipeline, event_driven, message_based
  parallel_execution: true
  max_workers: 8
  pipeline_buffer_size: 10000

# Inference Engine
inference_engine:
  enabled: true
  inference_methods:
    - "forward_chaining"
    - "backward_chaining"
    - "hybrid_chaining"
    - "resolution"
    - "unification"
    - "modus_ponens"
    - "modus_tollens"
  primary_method: "hybrid_chaining"
  inference_depth: 10
  conflict_resolution: true
  truth_maintenance: true
  explanation_generation: true

# Knowledge Base
knowledge_base:
  enabled: true
  knowledge_types:
    - "declarative_knowledge"
    - "procedural_knowledge"
    - "structural_knowledge"
    - "strategic_knowledge"
    - "meta_knowledge"
  knowledge_representation:
    - "rules"
    - "facts"
    - "frames"
    - "semantic_networks"
    - "ontologies"
  primary_representation: "rules"
  knowledge_acquisition: true
  knowledge_validation: true
  knowledge_update: true

# Logic Engine
logic_engine:
  enabled: true
  logic_types:
    - "propositional_logic"
    - "first_order_logic"
    - "modal_logic"
    - "temporal_logic"
    - "deontic_logic"
    - "epistemic_logic"
  primary_type: "first_order_logic"
  inference_rules:
    - "modus_ponens"
    - "modus_tollens"
    - "hypothetical_syllogism"
    - "disjunctive_syllogism"
    - "constructive_dilemma"
    - "destructive_dilemma"
    - "simplification"
    - "conjunction"
    - "addition"
  logical_consistency_check: true

# Probabilistic Engine
probabilistic_engine:
  enabled: true
  probabilistic_methods:
    - "bayesian_networks"
    - "markov_networks"
    - "belief_networks"
    - "bayesian_inference"
    - "maximum_likelihood"
    - "expectation_maximization"
  primary_method: "bayesian_networks"
  probability_calculation: true
  belief_update: true
  uncertainty_handling: true
  confidence_intervals: true
  prior_distributions: true

# Causal Engine
causal_engine:
  enabled: true
  causal_methods:
    - "granger_causality"
    - "structural_equation_modeling"
    - "directed_acyclic_graphs"
    - "do_calculus"
    - "counterfactual_analysis"
    - "intervention_analysis"
  primary_method: "structural_equation_modeling"
  causal_discovery: true
  causal_inference: true
  confounder_control: true
  causal_graph_visualization: true
  causal_validation: true

# Case-Based Engine
case_based_engine:
  enabled: true
  case_retrieval_methods:
    - "knn"
    - "similarity_based"
    - "distance_based"
    - "feature_weighting"
  case_adaptation_methods:
    - "parametric_adaptation"
    - "structural_adaptation"
    - "reuse_adaptation"
  primary_retrieval: "knn"
  k_value: 5
  similarity_measure: "euclidean"  # euclidean, manhattan, cosine, custom
  case_base_size: 1000
  case_retention: true
  case_revision: true

# Rule Engine
rule_engine:
  enabled: true
  rule_types:
    - "production_rules"
    - "if_then_rules"
    - "decision_rules"
    - "constraint_rules"
    - "reactive_rules"
    - "event_condition_action_rules"
  rule_execution: "forward_chaining"  # forward_chaining, backward_chaining, hybrid
  rule_priority: true
  rule_conflict_resolution: true
  rule_explanation: true
  rule_validation: true
  rule_optimization: true

# Fuzzy Engine
fuzzy_engine:
  enabled: true
  fuzzy_methods:
    - "mamdani_fuzzy"
    - "sugeno_fuzzy"
    - "tsukamoto_fuzzy"
  primary_method: "mamdani_fuzzy"
  membership_functions:
    - "triangular"
    - "trapezoidal"
    - "gaussian"
    - "sigmoidal"
    - "bell"
  defuzzification_method: "centroid"  # centroid, bisector, mom, lom, som
  fuzzy_inference: true
  fuzzy_rules: true
  fuzzy_aggregation: true

# Decision Engine
decision_engine:
  enabled: true
  decision_frameworks:
    - "multi_criteria_decision"
    - "probabilistic_decision"
    - "heuristic_decision"
    - "game_theoretic"
  primary_framework: "multi_criteria_decision"
  decision_criteria:
    - "expected_return"
    - "risk_adjusted_return"
    - "drawdown_risk"
    - "liquidity_risk"
    - "market_impact"
    - "execution_quality"
    - "compliance_constraints"
  decision_weights:
    expected_return: 0.20
    risk_adjusted_return: 0.20
    drawdown_risk: 0.15
    liquidity_risk: 0.10
    market_impact: 0.10
    execution_quality: 0.10
    compliance_constraints: 0.15
  decision_confidence_threshold: 0.70
  decision_timeout_seconds: 5

# Explanation Engine
explanation_engine:
  enabled: true
  explanation_methods:
    - "rule_trace"
    - "inference_trace"
    - "decision_tree"
    - "causal_graph"
    - "probabilistic_explanation"
    - "counterfactual_explanation"
  primary_method: "rule_trace"
  explanation_depth: "comprehensive"  # basic, intermediate, comprehensive
  explanation_visualization: true
  explanation_storage: true

# Reasoning Quality
quality:
  enabled: true
  quality_metrics:
    - "inference_accuracy"
    - "consistency_score"
    - "completeness_score"
    - "reliability_score"
    - "confidence_score"
    - "coherence_score"
  quality_thresholds:
    poor: 0.40
    moderate: 0.60
    good: 0.80
    excellent: 0.95
  quality_monitoring: true
  quality_optimization: true

# Performance
performance:
  enabled: true
  performance_metrics:
    - "inference_speed"
    - "throughput"
    - "latency"
    - "resource_usage"
    - "error_rate"
  performance_targets:
    inference_speed_ms: 50
    throughput_per_second: 1000
    latency_ms: 20
    error_rate_max: 0.01

# Visualization
visualization:
  enabled: true
  charts:
    - "reasoning_dashboard"
    - "inference_tree"
    - "decision_graph"
    - "causal_graph"
    - "bayesian_network"
    - "rule_chains"
    - "explanation_tree"
    - "quality_chart"
  update_interval_seconds: 10
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "inference_failure"
    - "logic_inconsistency"
    - "uncertainty_high"
    - "confidence_low"
    - "quality_drop"
    - "performance_drop"
    - "knowledge_conflict"
  alert_thresholds:
    confidence_low: 0.50
    uncertainty_high: 0.70
    quality_drop: 0.15
    performance_drop: 0.20
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600

# Reporting
reporting:
  enabled: true
  report_types:
    - "reasoning_summary"
    - "inference_report"
    - "decision_report"
    - "quality_report"
    - "performance_report"
    - "explanation_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "risk@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "reasoning_data"
    - "knowledge_base"
    - "inference_history"
    - "decision_history"
    - "quality_data"
    - "performance_data"
    - "explanation_data"
    - "alert_history"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/reasoning-engine"
  api_endpoint: "/api/v1/trading/reasoning-engine"
  dashboard_url: "http://localhost:3000/reasoning-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "decision_engine"
    - "knowledge_management"
    - "research_platform"
