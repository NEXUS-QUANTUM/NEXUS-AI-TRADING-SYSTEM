# fuzzy_configs.yaml
# Configuration complète pour la logique floue dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 50
  max_data_points: 100000
  fuzzy_version: "4.0.0"
  environment: "production"

# Types de logique floue
fuzzy_types:
  membership_functions:
    enabled: true
    description: "Fuzzy Membership Functions"
    functions:
      - "triangular"
      - "trapezoidal"
      - "gaussian"
      - "bell"
      - "sigmoid"
      - "s_shaped"
      - "z_shaped"
    update_frequency_seconds: 60
  fuzzy_rules:
    enabled: true
    description: "Fuzzy Inference Rules"
    rule_types:
      - "if_then"
      - "if_then_else"
      - "and"
      - "or"
      - "not"
    operators:
      - "min"
      - "max"
      - "product"
      - "sum"
      - "probabilistic_or"
    update_frequency_seconds: 60
  fuzzy_sets:
    enabled: true
    description: "Fuzzy Sets"
    sets:
      - "low"
      - "medium"
      - "high"
      - "very_low"
      - "very_high"
      - "extreme_low"
      - "extreme_high"
    update_frequency_seconds: 60
  fuzzy_control:
    enabled: true
    description: "Fuzzy Control Systems"
    controllers:
      - "pid_fuzzy"
      - "mandani"
      - "sugeno"
      - "tsukamoto"
    update_frequency_seconds: 60
  fuzzy_patterns:
    enabled: true
    description: "Fuzzy Pattern Recognition"
    patterns:
      - "bullish"
      - "bearish"
      - "neutral"
      - "overbought"
      - "oversold"
      - "trending"
      - "ranging"
    update_frequency_seconds: 60

# Seuils flous
thresholds:
  membership:
    low: 0.0
    medium_low: 0.3
    medium: 0.5
    medium_high: 0.7
    high: 1.0
  confidence:
    min: 0.3
    default: 0.6
    high: 0.8
    max: 1.0
  rule_activation:
    min: 0.1
    default: 0.5
    high: 0.7
    max: 1.0
  inference:
    min: 0.2
    default: 0.5
    high: 0.7
    max: 1.0

# Variables floues
fuzzy_variables:
  inputs:
    rsi:
      enabled: true
      range: [0, 100]
      sets:
        oversold: [0, 20, 30]
        neutral: [25, 50, 75]
        overbought: [70, 80, 100]
    macd:
      enabled: true
      range: [-10, 10]
      sets:
        bearish: [-10, -5, -1]
        neutral: [-2, 0, 2]
        bullish: [1, 5, 10]
    volume:
      enabled: true
      range: [0, 1000]
      sets:
        low: [0, 100, 200]
        medium: [150, 300, 450]
        high: [400, 600, 1000]
    volatility:
      enabled: true
      range: [0, 100]
      sets:
        low: [0, 10, 20]
        medium: [15, 30, 45]
        high: [40, 60, 100]
    momentum:
      enabled: true
      range: [-100, 100]
      sets:
        negative: [-100, -50, -10]
        neutral: [-20, 0, 20]
        positive: [10, 50, 100]
  outputs:
    signal:
      enabled: true
      range: [-1, 1]
      sets:
        strong_sell: [-1, -0.7, -0.5]
        sell: [-0.6, -0.3, -0.1]
        neutral: [-0.2, 0, 0.2]
        buy: [0.1, 0.3, 0.6]
        strong_buy: [0.5, 0.7, 1]
    position_size:
      enabled: true
      range: [0, 1]
      sets:
        zero: [0, 0, 0.1]
        small: [0.05, 0.2, 0.35]
        medium: [0.3, 0.5, 0.7]
        large: [0.6, 0.8, 0.95]
        full: [0.9, 1, 1]
    risk_level:
      enabled: true
      range: [0, 1]
      sets:
        very_low: [0, 0, 0.1]
        low: [0.05, 0.2, 0.3]
        medium: [0.25, 0.5, 0.75]
        high: [0.7, 0.8, 0.95]
        very_high: [0.9, 1, 1]

# Règles floues
fuzzy_rules_config:
  trading_rules:
    enabled: true
    rules:
      - condition: "rsi is oversold and macd is bullish"
        action: "strong_buy"
        weight: 1.0
      - condition: "rsi is overbought and macd is bearish"
        action: "strong_sell"
        weight: 1.0
      - condition: "rsi is neutral and volume is high"
        action: "buy"
        weight: 0.8
      - condition: "rsi is neutral and volume is low"
        action: "neutral"
        weight: 0.6
      - condition: "momentum is positive and volatility is low"
        action: "buy"
        weight: 0.7
      - condition: "momentum is negative and volatility is high"
        action: "sell"
        weight: 0.7
      - condition: "rsi is oversold and volume is high"
        action: "buy"
        weight: 0.9
      - condition: "rsi is overbought and volume is high"
        action: "sell"
        weight: 0.9
      - condition: "macd is bullish and momentum is positive"
        action: "strong_buy"
        weight: 0.9
      - condition: "macd is bearish and momentum is negative"
        action: "strong_sell"
        weight: 0.9
  position_sizing_rules:
    enabled: true
    rules:
      - condition: "signal is strong_buy and risk is low"
        action: "full"
        weight: 0.9
      - condition: "signal is buy and risk is medium"
        action: "medium"
        weight: 0.8
      - condition: "signal is neutral or risk is high"
        action: "small"
        weight: 0.7
      - condition: "signal is strong_sell and risk is high"
        action: "zero"
        weight: 1.0
      - condition: "signal is sell and risk is medium"
        action: "small"
        weight: 0.8
  risk_rules:
    enabled: true
    rules:
      - condition: "volatility is high and volume is high"
        action: "very_high"
        weight: 0.9
      - condition: "volatility is medium and volume is medium"
        action: "medium"
        weight: 0.8
      - condition: "volatility is low and volume is low"
        action: "low"
        weight: 0.8
      - condition: "momentum is negative and volatility is high"
        action: "very_high"
        weight: 0.9
      - condition: "momentum is positive and volatility is low"
        action: "very_low"
        weight: 0.7

# Méthodes de défuzzification
defuzzification:
  methods:
    - "centroid"
    - "bisector"
    - "middle_of_maximum"
    - "largest_of_maximum"
    - "smallest_of_maximum"
    - "mean_of_maximum"
    - "weighted_average"
  current_method: "centroid"
  update_frequency_seconds: 60

# Indicateurs flous
indicators:
  fuzzy_signal:
    enabled: true
    calculation: "fuzzy_inference"
    period: 14
    smoothing: 3
    threshold: 0.5
  fuzzy_strength:
    enabled: true
    calculation: "fuzzy_membership"
    period: 14
    smoothing: 3
    threshold: 0.5
  fuzzy_confidence:
    enabled: true
    calculation: "fuzzy_rule_activation"
    period: 14
    smoothing: 0
    threshold: 0.6
  fuzzy_velocity:
    enabled: true
    period: 5
    smoothing: 0
    threshold: 0.2
  fuzzy_acceleration:
    enabled: true
    period: 10
    smoothing: 0
    threshold: 0.1

# Analyse floue
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_fuzzy_accuracy: true
    compute_fuzzy_signal_probability: true
    compute_fuzzy_distribution: true
    compute_fuzzy_patterns: true
    compute_fuzzy_rule_effectiveness: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous_fuzzy: true
    compute_moving_average_fuzzy: true
    compute_exponential_fuzzy: true
    compute_weighted_fuzzy: true
    compute_fuzzy_velocity: true
    compute_fuzzy_acceleration: true
  predictive:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "xgboost"
      - "lightgbm"
    features:
      - "fuzzy_signal"
      - "fuzzy_strength"
      - "fuzzy_confidence"
      - "fuzzy_velocity"
      - "fuzzy_acceleration"
      - "rsi"
      - "macd"
      - "volume"
      - "volatility"
      - "momentum"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_threshold: 0.7
    retrain_frequency_hours: 24

# Alertes et notifications
alerts:
  fuzzy_signal_generated:
    enabled: true
    confidence_threshold: 0.7
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "warning"
  fuzzy_signal_strong:
    enabled: true
    confidence_threshold: 0.8
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"
  fuzzy_signal_confirmed:
    enabled: true
    confidence_threshold: 0.9
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "info"
  fuzzy_signal_invalid:
    enabled: true
    confidence_threshold: 0.5
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"

# Actions automatiques
auto_actions:
  trade_entry:
    enabled: true
    action_types:
      - "enter_on_fuzzy_signal"
      - "enter_on_confirmation"
      - "enter_on_strong_signal"
    require_fuzzy_confirmation: true
    require_confidence: 0.6
    max_position_size: 10000
    min_position_size: 100
  stop_loss:
    enabled: true
    methods:
      - "fuzzy_based"
      - "membership_based"
      - "rule_based"
    fuzzy_multiplier: 1.0
    min_stop_percent: 0.5
    max_stop_percent: 10.0
    update_frequency_seconds: 10
  take_profit:
    enabled: true
    methods:
      - "fuzzy_projection"
      - "membership_projection"
      - "rule_projection"
    projection_multiplier: 1.0
    min_profit_percent: 1.0
    max_profit_percent: 20.0
    update_frequency_seconds: 10

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"
      - "lstm"
    features:
      - "fuzzy_signal"
      - "fuzzy_strength"
      - "fuzzy_confidence"
      - "fuzzy_velocity"
      - "fuzzy_acceleration"
      - "rsi"
      - "macd"
      - "volume"
      - "volatility"
      - "momentum"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.25
      - 0.25
      - 0.25
      - 0.25
  rule_optimization:
    enabled: true
    optimize_rules: true
    optimization_method: "genetic_algorithm"
    population_size: 50
    generations: 50
    mutation_rate: 0.1
    crossover_rate: 0.7
    random_state: 42
  membership_optimization:
    enabled: true
    optimize_membership: true
    optimization_method: "gradient_descent"
    learning_rate: 0.001
    epochs: 100
    batch_size: 32

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "fuzzy_signal"
      - "fuzzy_strength"
      - "fuzzy_confidence"
      - "fuzzy_velocity"
      - "fuzzy_acceleration"
      - "rule_activation_count"
      - "signal_accuracy"
      - "membership_values"
      - "defuzzification_values"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "fuzzy_signal_analysis"
      - "membership_functions"
      - "rule_activation"
      - "fuzzy_confidence"
      - "signal_distribution"
      - "defuzzification_analysis"
      - "fuzzy_velocity"
      - "fuzzy_acceleration"

# Backtesting
backtesting:
  enabled: true
  use_historical_fuzzy: true
  compute_fuzzy_accuracy: true
  compute_rule_effectiveness: true
  compute_membership_effectiveness: true
  compute_risk_adjusted_returns: true
  report_metrics:
    - "fuzzy_accuracy"
    - "rule_effectiveness"
    - "membership_effectiveness"
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"

# Configuration de la base de données
database:
  enabled: true
  table_name: "fuzzy_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/fuzzy"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "fuzzy_alert"
    - url: "https://nexustradingia.com/api/webhooks/fuzzy-signal"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "fuzzy_signal"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "fuzzy_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/fuzzy"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/fuzzy/current"
    - "/api/v1/fuzzy/history"
    - "/api/v1/fuzzy/metrics"
    - "/api/v1/fuzzy/status"
    - "/api/v1/fuzzy/rules"
    - "/api/v1/fuzzy/membership"
    - "/api/v1/fuzzy/signal"
    - "/api/v1/fuzzy/forecast"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/fuzzy/"
  encrypt: true
  encryption_key_id: "nexus-fuzzy-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/fuzzy"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_fuzzy_volume"
      - "low_fuzzy_volume"
      - "rule_activation"
      - "membership_calculation"
      - "defuzzification"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "confidence_threshold > 0.0"
      - "confidence_threshold <= 1.0"
      - "thresholds.membership.low < thresholds.membership.medium_low"
      - "thresholds.membership.medium_low < thresholds.membership.medium"
      - "thresholds.membership.medium < thresholds.membership.medium_high"
      - "thresholds.membership.medium_high < thresholds.membership.high"
      - "fuzzy_variables.inputs.rsi.range[0] < fuzzy_variables.inputs.rsi.range[1]"
      - "fuzzy_variables.inputs.macd.range[0] < fuzzy_variables.inputs.macd.range[1]"
      - "defuzzification.current_method in ['centroid', 'bisector', 'middle_of_maximum', 'largest_of_maximum', 'smallest_of_maximum', 'mean_of_maximum', 'weighted_average']"
      - "min_data_points > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "trending"
      - "ranging"
      - "volatile"
      - "stable"
      - "bull"
      - "bear"
  regime_parameters:
    trending:
      fuzzy_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
      rule_weight_multiplier: 1.1
    ranging:
      fuzzy_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
      rule_weight_multiplier: 0.9
    volatile:
      fuzzy_multiplier: 0.7
      threshold_multiplier: 1.3
      confidence_multiplier: 0.8
      rule_weight_multiplier: 0.8
    stable:
      fuzzy_multiplier: 1.0
      threshold_multiplier: 0.9
      confidence_multiplier: 1.2
      rule_weight_multiplier: 1.0
    bull:
      fuzzy_multiplier: 1.1
      threshold_multiplier: 0.9
      confidence_multiplier: 1.0
      rule_weight_multiplier: 1.0
    bear:
      fuzzy_multiplier: 0.9
      threshold_multiplier: 1.1
      confidence_multiplier: 0.9
      rule_weight_multiplier: 0.9

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      fuzzy_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
      rule_weight_multiplier: 0.9
    london:
      start: "08:00"
      end: "16:00"
      fuzzy_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
      rule_weight_multiplier: 1.1
    newyork:
      start: "13:00"
      end: "22:00"
      fuzzy_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
      rule_weight_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      fuzzy_multiplier: 1.5
      threshold_multiplier: 0.7
      confidence_multiplier: 1.2
      rule_weight_multiplier: 1.2

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    fuzzy_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    rule_weight_multiplier: 1.0
    confidence_threshold: 0.7
    rule_activation_threshold: 0.5
  ETHUSDT:
    fuzzy_multiplier: 1.1
    threshold_multiplier: 0.9
    confidence_multiplier: 1.0
    rule_weight_multiplier: 1.0
    confidence_threshold: 0.7
    rule_activation_threshold: 0.5
  SOLUSDT:
    fuzzy_multiplier: 1.2
    threshold_multiplier: 0.8
    confidence_multiplier: 0.9
    rule_weight_multiplier: 0.9
    confidence_threshold: 0.7
    rule_activation_threshold: 0.5
  ADAUSDT:
    fuzzy_multiplier: 0.9
    threshold_multiplier: 1.1
    confidence_multiplier: 1.1
    rule_weight_multiplier: 1.1
    confidence_threshold: 0.7
    rule_activation_threshold: 0.5
  XRPUSDT:
    fuzzy_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    rule_weight_multiplier: 1.0
    confidence_threshold: 0.7
    rule_activation_threshold: 0.5
