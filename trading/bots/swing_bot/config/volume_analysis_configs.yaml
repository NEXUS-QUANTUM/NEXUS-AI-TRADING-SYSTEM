# volume_analysis_configs.yaml
# Configuration complète pour l'analyse de volume dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "adaptive"
  analysis_type: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
    - 1000
  history_length_days: 730
  min_volume_threshold: 100
  max_volume_threshold: 10000000
  min_trades_for_analysis: 50
  max_trades_for_analysis: 50000

# Types d'analyse de volume
analysis_types:
  absolute:
    enabled: true
    calculate_absolute_volume: true
    calculate_volume_velocity: true
    calculate_volume_acceleration: true
    smoothing: 0
  relative:
    enabled: true
    calculate_percentile_rank: true
    calculate_z_score: true
    calculate_volume_ratio: true
    calculate_volume_change: true
    smoothing: 3
  comparative:
    enabled: true
    compare_to_average: true
    compare_to_median: true
    compare_to_previous_period: true
    compare_to_same_time: true
    smoothing: 5
  distributional:
    enabled: true
    calculate_volume_distribution: true
    calculate_volume_profile: true
    calculate_volume_nodes: true
    calculate_volume_clusters: true
    smoothing: 0
  temporal:
    enabled: true
    calculate_intraday_patterns: true
    calculate_weekly_patterns: true
    calculate_monthly_patterns: true
    calculate_seasonal_patterns: true
    smoothing: 3

# Indicateurs d'analyse de volume
indicators:
  volume_weighted:
    vwap:
      enabled: true
      period: 20
      smoothing: 3
      calculate_deviation: true
      calculate_bands: true
      band_width: 2.0
    twap:
      enabled: true
      period: 10
      smoothing: 3
      calculate_deviation: true
    volume_weighted_sma:
      enabled: true
      period: 20
      smoothing: 3
    volume_weighted_ema:
      enabled: true
      period: 20
      smoothing: 3
      alpha: 0.2
  volume_momentum:
    volume_rsi:
      enabled: true
      period: 14
      overbought: 70
      oversold: 30
      smoothing: 3
    volume_macd:
      enabled: true
      fast_period: 12
      slow_period: 26
      signal_period: 9
      smoothing: 5
    volume_stochastic:
      enabled: true
      k_period: 14
      d_period: 3
      smoothing: 3
    volume_cci:
      enabled: true
      period: 20
      smoothing: 3
  volume_trend:
    volume_trend_line:
      enabled: true
      period: 20
      smoothing: 3
    volume_breakout:
      enabled: true
      period: 20
      multiplier: 2.0
      smoothing: 0
    volume_channel:
      enabled: true
      period: 20
      multiplier: 2.0
      smoothing: 3
    volume_ma_envelope:
      enabled: true
      period: 20
      envelope_percent: 10.0
      smoothing: 3
  volume_divergence:
    bullish_divergence:
      enabled: true
      lookback: 20
      min_confidence: 0.7
    bearish_divergence:
      enabled: true
      lookback: 20
      min_confidence: 0.7
    hidden_divergence:
      enabled: true
      lookback: 20
      min_confidence: 0.7
    volume_price_divergence:
      enabled: true
      lookback: 20
      min_confidence: 0.6
  volume_patterns:
    accumulation:
      enabled: true
      lookback: 30
      min_confidence: 0.7
    distribution:
      enabled: true
      lookback: 30
      min_confidence: 0.7
    climax:
      enabled: true
      lookback: 20
      min_confidence: 0.8
    exhaustion:
      enabled: true
      lookback: 20
      min_confidence: 0.7
    absorption:
      enabled: true
      lookback: 10
      min_confidence: 0.6

# Seuils d'analyse
thresholds:
  volume_spike:
    low: 2.0
    medium: 3.0
    high: 5.0
    extreme: 10.0
  volume_dry_up:
    low: 0.5
    medium: 0.3
    high: 0.1
    extreme: 0.05
  volume_change:
    low: 10.0
    medium: 25.0
    high: 50.0
    extreme: 100.0
  volume_velocity:
    low: 1.0
    medium: 2.0
    high: 5.0
    extreme: 10.0
  volume_acceleration:
    low: 0.5
    medium: 1.0
    high: 2.0
    extreme: 5.0
  volume_percentile:
    low: 10
    medium: 25
    high: 75
    extreme: 90

# Analyse profonde
deep_analysis:
  volume_profile_analysis:
    enabled: true
    bin_size: 100
    max_bins: 500
    min_volume_for_profile: 100
    profile_update_frequency: "realtime"
    poc_calculation: true
    value_area_calculation: true
    high_volume_node_identification: true
    low_volume_node_identification: true
  volume_anomaly_detection:
    enabled: true
    detection_method: "isolation_forest"
    contamination: 0.1
    random_state: 42
    update_frequency_seconds: 60
    sensitivity: 0.5
  volume_pattern_recognition:
    enabled: true
    pattern_types:
      - "squeeze"
      - "expansion"
      - "breakout"
      - "breakdown"
      - "accumulation"
      - "distribution"
      - "exhaustion"
    min_confidence: 0.6
    lookback_period: 50
  volume_flow_analysis:
    enabled: true
    calculate_cumulative_delta: true
    calculate_volume_delta: true
    calculate_bid_ask_imbalance: true
    calculate_aggressive_volume: true
    calculate_passive_volume: true
    smoothing: 3

# Analyse prédictive
predictive_analysis:
  volume_forecasting:
    enabled: true
    model_type: "lstm"
    features:
      - "volume_sma_5"
      - "volume_sma_10"
      - "volume_sma_20"
      - "volume_sma_50"
      - "volume_sma_200"
      - "volume_velocity"
      - "volume_acceleration"
      - "volume_rsi"
      - "volume_macd"
      - "vwap"
      - "price_change"
      - "time_of_day"
      - "day_of_week"
    lookback_sequences: 50
    prediction_horizon: 5
    confidence_threshold: 0.7
    retrain_frequency_hours: 24
  volume_impact_analysis:
    enabled: true
    calculate_price_impact: true
    calculate_liquidity_impact: true
    calculate_slippage_impact: true
    calculate_market_impact: true
    smoothing: 5
    lookback_period: 50
  volume_sentiment_analysis:
    enabled: true
    sentiment_sources:
      - "social_media"
      - "news"
      - "on_chain"
    volume_sentiment_correlation: true
    sentiment_threshold: 0.6
    update_frequency_seconds: 60

# Alertes et notifications
alerts:
  volume_spike_detected:
    enabled: true
    multiplier: 3.0
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "warning"
    include_volume_data: true
  volume_dry_up_detected:
    enabled: true
    multiplier: 0.3
    channels:
      - "email"
      - "telegram"
    severity: "info"
    include_volume_data: true
  volume_pattern_detected:
    enabled: true
    pattern_confidence: 0.7
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"
    include_pattern_details: true
  volume_anomaly_detected:
    enabled: true
    anomaly_score: 0.8
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "warning"
    include_anomaly_details: true
  volume_divergence_detected:
    enabled: true
    divergence_confidence: 0.7
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"
    include_divergence_details: true
  volume_flow_change:
    enabled: true
    change_threshold: 100000
    channels:
      - "email"
      - "telegram"
    severity: "info"
    include_flow_details: true

# Actions automatiques
auto_actions:
  trade_execution:
    enabled: true
    action_types:
      - "enter_long"
      - "enter_short"
      - "exit_long"
      - "exit_short"
      - "increase_position"
      - "decrease_position"
      - "scale_in"
      - "scale_out"
    require_volume_signal: true
    require_confidence: 0.6
    max_position_size: 10000
    min_position_size: 100
    volume_multiplier: 1.5
    pattern_confidence_threshold: 0.7
  position_adjustment:
    enabled: true
    adjustment_types:
      - "increase_by_volume"
      - "decrease_by_volume"
      - "adjust_by_volume_pattern"
      - "adjust_by_volume_divergence"
    adjustment_factor: 0.5
    max_adjustment_percent: 50.0
    min_position_percent: 0.5
  risk_management:
    enabled: true
    volume_based_stop_loss: true
    volume_based_take_profit: true
    volume_based_trailing_stop: true
    stop_loss_volume_multiplier: 2.0
    take_profit_volume_multiplier: 4.0
    trailing_stop_volume_multiplier: 1.5

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"
      - "lstm"
    features:
      - "volume_sma_5"
      - "volume_sma_10"
      - "volume_sma_20"
      - "volume_sma_50"
      - "volume_sma_200"
      - "volume_ema_5"
      - "volume_ema_10"
      - "volume_ema_20"
      - "volume_rsi"
      - "volume_macd"
      - "volume_bb_upper"
      - "volume_bb_lower"
      - "obv"
      - "volume_velocity"
      - "volume_acceleration"
      - "vwap"
      - "price"
      - "price_change"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.25
      - 0.25
      - 0.25
      - 0.25
  statistical_analysis:
    enabled: true
    calculate_descriptive_stats: true
    calculate_inferential_stats: true
    calculate_regression_analysis: true
    calculate_correlation_analysis: true
    calculate_factor_analysis: true
    confidence_level: 95
    p_value_threshold: 0.05
  volume_clustering:
    enabled: true
    algorithm: "kmeans"
    n_clusters: 5
    features:
      - "volume"
      - "volume_sma_20"
      - "volume_rsi"
      - "volume_velocity"
      - "volume_acceleration"
    update_frequency_hours: 12
    random_seed: 42

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "current_volume"
      - "volume_sma_5"
      - "volume_sma_10"
      - "volume_sma_20"
      - "volume_sma_50"
      - "volume_sma_200"
      - "volume_rsi"
      - "volume_macd"
      - "obv"
      - "volume_velocity"
      - "volume_acceleration"
      - "volume_spike_multiplier"
      - "volume_divergence"
      - "volume_poc"
      - "volume_flow_delta"
      - "volume_anomaly_score"
      - "volume_pattern_confidence"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "volume_chart"
      - "volume_profile"
      - "volume_indicators"
      - "volume_distribution"
      - "volume_patterns"
      - "volume_poc"
      - "volume_velocity"
      - "volume_divergence"
      - "volume_flow"
      - "volume_anomaly"
      - "volume_predictive"
      - "volume_sentiment"

# Backtesting
backtesting:
  enabled: true
  use_historical_volume: true
  compute_volume_distribution: true
  compute_pattern_accuracy: true
  compute_signal_accuracy: true
  compute_strategy_performance: true
  compute_volume_impact: true
  compute_volume_efficiency: true
  report_metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_win_loss"
    - "volume_accuracy"
    - "pattern_accuracy"
    - "volume_efficiency"
    - "impact_ratio"

# Distribution des métriques
metrics_distribution:
  enabled: true
  distribution:
    - metric: "volume"
      bins: 100
      update_frequency: "realtime"
    - metric: "volume_sma_20"
      bins: 50
      update_frequency: "realtime"
    - metric: "volume_velocity"
      bins: 30
      update_frequency: "realtime"
    - metric: "volume_acceleration"
      bins: 30
      update_frequency: "realtime"
    - metric: "volume_flow_delta"
      bins: 50
      update_frequency: "realtime"
  percentiles:
    - 1
    - 5
    - 10
    - 25
    - 50
    - 75
    - 90
    - 95
    - 99

# Configuration de la base de données
database:
  enabled: true
  table_name: "volume_analysis_metrics"
  retention_days: 730
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
      - "7d"
      - "30d"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30
  partitioning:
    enabled: true
    partition_by: "month"

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/volume_analysis"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "volume_analysis_alert"
    - url: "https://nexustradingia.com/api/webhooks/volume_pattern"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "volume_pattern_detected"
    - url: "https://nexustradingia.com/api/webhooks/volume_anomaly"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "volume_anomaly"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "volume_analysis_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/volume_analysis"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/volume-analysis/current"
    - "/api/v1/volume-analysis/history"
    - "/api/v1/volume-analysis/metrics"
    - "/api/v1/volume-analysis/status"
    - "/api/v1/volume-analysis/indicators"
    - "/api/v1/volume-analysis/profile"
    - "/api/v1/volume-analysis/patterns"
    - "/api/v1/volume-analysis/anomalies"
    - "/api/v1/volume-analysis/predictive"
    - "/api/v1/volume-analysis/sentiment"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/volume-analysis/"
  encrypt: true
  encryption_key_id: "nexus-volume-analysis-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/volume-analysis"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"
  order_book:
    enabled: true
    sync_frequency_ms: 50
    depth_levels: 10
  sentiment_analyzer:
    enabled: true
    sync_frequency_seconds: 60
    data_endpoint: "http://sentiment-analyzer:8000/api/v1/sentiment"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_volume"
      - "low_volume"
      - "volume_spike"
      - "volume_dry_up"
      - "flash_crash"
      - "black_swan"
      - "high_frequency"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "thresholds.volume_spike.low < thresholds.volume_spike.medium"
      - "thresholds.volume_spike.medium < thresholds.volume_spike.high"
      - "thresholds.volume_spike.high < thresholds.volume_spike.extreme"
      - "thresholds.volume_dry_up.extreme < thresholds.volume_dry_up.high"
      - "thresholds.volume_dry_up.high < thresholds.volume_dry_up.medium"
      - "thresholds.volume_dry_up.medium < thresholds.volume_dry_up.low"
      - "min_volume_threshold > 0"
      - "max_volume_threshold > min_volume_threshold"
      - "lookback_periods[0] > 0"
      - "confidence_threshold > 0.0"
      - "confidence_threshold <= 1.0"
      - "min_trades_for_analysis > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "bull"
      - "bear"
      - "sideways"
      - "volatile"
      - "low_volume"
      - "high_volume"
      - "institutional"
      - "retail"
  regime_parameters:
    bull:
      volume_multiplier: 1.2
      threshold_multiplier: 0.8
      pattern_confidence: 0.7
    bear:
      volume_multiplier: 0.8
      threshold_multiplier: 1.2
      pattern_confidence: 0.6
    sideways:
      volume_multiplier: 1.0
      threshold_multiplier: 1.0
      pattern_confidence: 0.5
    volatile:
      volume_multiplier: 0.6
      threshold_multiplier: 1.5
      pattern_confidence: 0.4
    low_volume:
      volume_multiplier: 0.5
      threshold_multiplier: 2.0
      pattern_confidence: 0.3
    high_volume:
      volume_multiplier: 1.5
      threshold_multiplier: 0.7
      pattern_confidence: 0.8
    institutional:
      volume_multiplier: 1.3
      threshold_multiplier: 0.8
      pattern_confidence: 0.8
    retail:
      volume_multiplier: 0.7
      threshold_multiplier: 1.2
      pattern_confidence: 0.4

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      volume_multiplier: 0.8
      threshold_multiplier: 1.2
      pattern_confidence: 0.5
    london:
      start: "08:00"
      end: "16:00"
      volume_multiplier: 1.2
      threshold_multiplier: 0.8
      pattern_confidence: 0.7
    newyork:
      start: "13:00"
      end: "22:00"
      volume_multiplier: 1.0
      threshold_multiplier: 1.0
      pattern_confidence: 0.6
    overlap:
      start: "13:00"
      end: "16:00"
      volume_multiplier: 1.5
      threshold_multiplier: 0.7
      pattern_confidence: 0.8
  day_of_week:
    monday:
      volume_multiplier: 0.9
      threshold_multiplier: 1.1
    tuesday:
      volume_multiplier: 1.1
      threshold_multiplier: 0.9
    wednesday:
      volume_multiplier: 1.0
      threshold_multiplier: 1.0
    thursday:
      volume_multiplier: 1.1
      threshold_multiplier: 0.9
    friday:
      volume_multiplier: 0.9
      threshold_multiplier: 1.1
    saturday:
      volume_multiplier: 0.5
      threshold_multiplier: 2.0
    sunday:
      volume_multiplier: 0.6
      threshold_multiplier: 1.8

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    volume_multiplier: 1.0
    threshold_multiplier: 1.0
    min_volume: 1000
    max_volume: 10000000
    min_trades: 100
    max_trades: 10000
    pattern_confidence: 0.7
  ETHUSDT:
    volume_multiplier: 1.1
    threshold_multiplier: 0.9
    min_volume: 500
    max_volume: 5000000
    min_trades: 50
    max_trades: 5000
    pattern_confidence: 0.6
  SOLUSDT:
    volume_multiplier: 1.2
    threshold_multiplier: 0.8
    min_volume: 200
    max_volume: 2000000
    min_trades: 20
    max_trades: 2000
    pattern_confidence: 0.6
  ADAUSDT:
    volume_multiplier: 0.9
    threshold_multiplier: 1.1
    min_volume: 100
    max_volume: 1000000
    min_trades: 10
    max_trades: 1000
    pattern_confidence: 0.5
  XRPUSDT:
    volume_multiplier: 1.0
    threshold_multiplier: 1.0
    min_volume: 100
    max_volume: 1000000
    min_trades: 10
    max_trades: 1000
    pattern_confidence: 0.5
