# Swing Bot Speculative Trading Configuration
# Speculative Trading Strategy & Risk Parameters

# General Speculative Settings
speculative:
  enabled: true
  strategy_type: "momentum_spec"  # momentum_spec, contrarian_spec, event_spec, hybrid_spec
  risk_profile: "aggressive"  # conservative, moderate, aggressive, extreme
  time_horizon: "short"  # ultra_short, short, medium, flexible
  version: "3.0.0"

# Speculative Components
components:
  enabled: true
  primary_components:
    - "momentum_speculation"
    - "breakout_speculation"
    - "event_driven_speculation"
    - "volatility_speculation"
    - "sentiment_speculation"
    - "liquidity_speculation"
  secondary_components:
    - "scalping_speculation"
    - "arbitrage_speculation"
    - "pairs_speculation"
    - "rotation_speculation"
    - "mean_reversion_spec"
  component_weights:
    momentum_speculation: 0.25
    breakout_speculation: 0.20
    event_driven_speculation: 0.15
    volatility_speculation: 0.15
    sentiment_speculation: 0.15
    liquidity_speculation: 0.10

# Momentum Speculation
momentum_spec:
  enabled: true
  momentum_indicators:
    - "price_momentum"
    - "volume_momentum"
    - "relative_strength"
    - "macd"
    - "rsi"
    - "adx"
  momentum_parameters:
    lookback_period_bars: 10
    momentum_threshold: 0.05
    acceleration_threshold: 0.02
    volume_confirm_threshold: 1.5
  entry_threshold: 0.60
  exit_threshold: 0.40

# Breakout Speculation
breakout_spec:
  enabled: true
  breakout_indicators:
    - "donchian_channels"
    - "bollinger_bands"
    - "keltner_channels"
    - "atr"
    - "volume_breakout"
    - "pivot_breakout"
  breakout_parameters:
    lookback_period_bars: 20
    breakout_percentage: 0.02
    volume_multiplier: 1.5
    atr_multiplier: 1.0
    confirmation_bars: 2
  entry_threshold: 0.60
  exit_threshold: 0.40

# Event-Driven Speculation
event_driven:
  enabled: true
  event_types:
    - "earnings_announcement"
    - "economic_data_release"
    - "regulatory_change"
    - "geopolitical_event"
    - "product_launch"
    - "management_change"
    - "merger_announcement"
    - "analyst_upgrade"
  event_parameters:
    event_window_bars: 10
    pre_event_volatility: 0.10
    post_event_volatility: 0.20
    event_impact_multiplier: 0.50
  entry_threshold: 0.60
  exit_threshold: 0.40

# Volatility Speculation
volatility_spec:
  enabled: true
  volatility_indicators:
    - "historical_volatility"
    - "implied_volatility"
    - "vix"
    - "atr"
    - "volatility_spike"
  volatility_parameters:
    volatility_threshold: 0.15
    spike_threshold: 2.0
    mean_reversion_period: 20
    vol_adjustment_factor: 0.50
  entry_threshold: 0.60
  exit_threshold: 0.40

# Sentiment Speculation
sentiment_spec:
  enabled: true
  sentiment_indicators:
    - "fear_greed_index"
    - "put_call_ratio"
    - "vix_curve"
    - "margin_debt"
    - "sentiment_surveys"
    - "social_media_sentiment"
    - "news_sentiment"
  sentiment_parameters:
    sentiment_threshold: 0.30
    extreme_sentiment: 0.70
    contrarian_factor: 0.50
    sentiment_confirmation: true
  entry_threshold: 0.60
  exit_threshold: 0.40

# Liquidity Speculation
liquidity_spec:
  enabled: true
  liquidity_indicators:
    - "order_book_depth"
    - "bid_ask_spread"
    - "volume_velocity"
    - "liquidity_pools"
    - "dark_pool_activity"
  liquidity_parameters:
    depth_threshold: 100000
    spread_threshold: 0.01
    volume_spike_threshold: 2.0
    liquidity_confirmation: true
  entry_threshold: 0.60
  exit_threshold: 0.40

# Position Sizing
position_sizing:
  enabled: true
  methods:
    - "risk_based"
    - "kelly_criterion"
    - "volatility_based"
    - "dynamic"
    - "aggressive_sizing"
  primary_method: "risk_based"
  risk_per_trade: 0.03
  max_position_size: 0.10
  min_position_size: 0.01
  kelly_fraction: 0.25
  aggressive_multiplier: 1.5

# Risk Management
risk_management:
  enabled: true
  stop_loss:
    methods:
      - "fixed_percent"
      - "volatility_based"
      - "atr_based"
      - "trailing"
      - "dynamic"
    default_percent: 0.03
    atr_multiplier: 1.0
    trailing_activation: 0.02
    trailing_distance: 0.015
    dynamic_adjustment: true
  take_profit:
    methods:
      - "fixed_percent"
      - "risk_reward_ratio"
      - "target_based"
      - "trailing"
      - "dynamic"
    default_percent: 0.06
    risk_reward_ratio: 2.0
    target_multiplier: 1.5
    trailing_activation: 0.02
    trailing_distance: 0.015
    dynamic_adjustment: true
  risk_limits:
    max_daily_loss: 0.05
    max_drawdown: 0.15
    max_position_exposure: 0.30
    max_correlation: 0.60

# Speculative Signals
signals:
  enabled: true
  signal_types:
    - "strong_buy"
    - "buy"
    - "neutral"
    - "sell"
    - "strong_sell"
    - "speculative_buy"
    - "speculative_sell"
  confirmation_requirements:
    min_indicators_confirmed: 2
    volume_confirmation: true
    price_confirmation: true
    sentiment_confirmation: true
  signal_strength_calculation: "weighted_average"
  min_signal_strength: 0.60

# Performance Metrics
performance:
  enabled: true
  metrics:
    - "speculative_accuracy"
    - "signal_accuracy"
    - "win_rate"
    - "average_return"
    - "profit_factor"
    - "sharpe_ratio"
    - "maximum_drawdown"
    - "average_hold_time"
    - "speculative_efficiency"
  evaluation_period_days: 30
  rolling_window_days: 30
  benchmark_comparison: true

# Visualization
visualization:
  enabled: true
  charts:
    - "speculative_dashboard"
    - "momentum_chart"
    - "sentiment_chart"
    - "volatility_chart"
    - "signal_chart"
    - "performance_chart"
    - "risk_chart"
  update_interval_seconds: 5
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "speculative_signal"
    - "momentum_shift"
    - "breakout_signal"
    - "event_driven_opportunity"
    - "sentiment_extreme"
    - "volatility_spike"
    - "risk_breach"
  alert_thresholds:
    signal_confidence: 0.70
    momentum_shift: 0.05
    sentiment_extreme: 0.70
    volatility_spike: 2.0
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_speculative_summary"
    - "weekly_speculative_analysis"
    - "monthly_speculative_report"
    - "performance_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "risk@example.com"
    - "strategy@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "speculative_data"
    - "signal_history"
    - "trade_history"
    - "performance_metrics"
    - "risk_metrics"
    - "alert_history"
    - "sentiment_data"
    - "volatility_data"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/speculative"
  api_endpoint: "/api/v1/trading/speculative"
  dashboard_url: "http://localhost:3000/speculative"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "sentiment_platform"
    - "research_platform"
