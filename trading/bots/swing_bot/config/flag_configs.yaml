# flag_configs.yaml
# Configuration complète pour la détection des drapeaux (flags) dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 50
  max_data_points: 100000
  flag_detection_version: "4.0.0"
  environment: "production"

# Types de drapeaux
flag_types:
  bull_flag:
    enabled: true
    description: "Bull Flag Pattern"
    pole_length_min: 10
    pole_length_max: 100
    flag_length_min: 5
    flag_length_max: 50
    flag_slope: "downward"
    breakout_direction: "upward"
    min_confidence: 0.6
    volume_requirement: "decreasing"
  bear_flag:
    enabled: true
    description: "Bear Flag Pattern"
    pole_length_min: 10
    pole_length_max: 100
    flag_length_min: 5
    flag_length_max: 50
    flag_slope: "upward"
    breakout_direction: "downward"
    min_confidence: 0.6
    volume_requirement: "decreasing"
  pennant:
    enabled: true
    description: "Pennant Pattern"
    pole_length_min: 10
    pole_length_max: 100
    flag_length_min: 5
    flag_length_max: 40
    flag_slope: "converging"
    breakout_direction: "both"
    min_confidence: 0.6
    volume_requirement: "decreasing"
  wedge:
    enabled: true
    description: "Wedge Pattern"
    pole_length_min: 10
    pole_length_max: 100
    flag_length_min: 5
    flag_length_max: 50
    flag_slope: "converging"
    breakout_direction: "both"
    min_confidence: 0.6
    volume_requirement: "decreasing"

# Seuils de détection
thresholds:
  pole:
    min_height_percent: 2.0
    max_height_percent: 20.0
    min_length: 10
    max_length: 100
  flag:
    min_length: 5
    max_length: 50
    min_width_percent: 0.5
    max_width_percent: 5.0
    angle_min: 10
    angle_max: 45
  breakout:
    min_breakout_percent: 1.0
    max_breakout_percent: 10.0
    breakout_volume_multiplier: 1.5
    breakout_confidence: 0.7
  volume:
    decreasing_volume_multiplier: 0.8
    increasing_volume_multiplier: 1.2
    min_volume_threshold: 1000

# Indicateurs de drapeaux
indicators:
  flag_strength:
    enabled: true
    calculation: "weighted_average"
    factors:
      - "pole_height"
      - "flag_length"
      - "volume_confirmation"
      - "breakout_momentum"
      - "pattern_symmetry"
    factor_weights:
      pole_height: 0.25
      flag_length: 0.25
      volume_confirmation: 0.20
      breakout_momentum: 0.15
      pattern_symmetry: 0.15
  flag_probability:
    enabled: true
    period: 14
    smoothing: 3
    threshold: 0.6
  flag_momentum:
    enabled: true
    period: 14
    smoothing: 3
    threshold: 0.3
  flag_velocity:
    enabled: true
    period: 5
    smoothing: 0
    threshold: 0.2
  flag_acceleration:
    enabled: true
    period: 10
    smoothing: 0
    threshold: 0.1
  flag_confidence:
    enabled: true
    period: 14
    smoothing: 0
    threshold: 0.6

# Analyse des drapeaux
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_flag_accuracy: true
    compute_flag_probability: true
    compute_flag_distribution: true
    compute_flag_patterns: true
    compute_flag_cycles: true
    compute_flag_success_rate: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous_flag: true
    compute_moving_average_flag: true
    compute_exponential_flag: true
    compute_weighted_flag: true
    compute_flag_velocity: true
    compute_flag_acceleration: true
  predictive:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "xgboost"
      - "lightgbm"
    features:
      - "flag_strength"
      - "flag_probability"
      - "flag_momentum"
      - "flag_velocity"
      - "flag_acceleration"
      - "flag_confidence"
      - "pole_height"
      - "flag_length"
      - "volume_confirmation"
      - "breakout_momentum"
      - "pattern_symmetry"
      - "price_change"
      - "volume"
      - "volatility"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_threshold: 0.7
    retrain_frequency_hours: 24

# Alertes et notifications
alerts:
  flag_detected:
    enabled: true
    confidence_threshold: 0.7
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "warning"
  flag_breakout:
    enabled: true
    confidence_threshold: 0.8
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"
  flag_confirmed:
    enabled: true
    confidence_threshold: 0.9
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "info"
  flag_invalid:
    enabled: true
    confidence_threshold: 0.5
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"

# Actions automatiques
auto_actions:
  trade_entry:
    enabled: true
    action_types:
      - "enter_on_breakout"
      - "enter_on_retest"
      - "enter_on_confirmation"
    require_flag_confirmation: true
    require_confidence: 0.7
    max_position_size: 10000
    min_position_size: 100
  stop_loss:
    enabled: true
    methods:
      - "flag_pole_based"
      - "flag_length_based"
      - "breakout_based"
    flag_multiplier: 1.0
    min_stop_percent: 0.5
    max_stop_percent: 10.0
    update_frequency_seconds: 10
  take_profit:
    enabled: true
    methods:
      - "flag_projection"
      - "pole_projection"
      - "breakout_projection"
    projection_multiplier: 1.0
    min_profit_percent: 1.0
    max_profit_percent: 20.0
    update_frequency_seconds: 10
  position_sizing:
    enabled: true
    method: "flag_strength_based"
    flag_scale: 0.5
    max_position_percent: 10.0
    min_position_percent: 0.5
    scaling_function: "linear"

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"
      - "lstm"
    features:
      - "flag_strength"
      - "flag_probability"
      - "flag_momentum"
      - "flag_velocity"
      - "flag_acceleration"
      - "flag_confidence"
      - "pole_height"
      - "flag_length"
      - "volume_confirmation"
      - "breakout_momentum"
      - "pattern_symmetry"
      - "rsi"
      - "macd"
      - "bollinger_width"
      - "atr"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.25
      - 0.25
      - 0.25
      - 0.25
  statistical_analysis:
    enabled: true
    calculate_flag_accuracy: true
    calculate_flag_probability: true
    calculate_flag_significance: true
    calculate_flag_correlation: true
    calculate_flag_success_rate: true
    confidence_level: 95
    p_value_threshold: 0.05
  pattern_recognition:
    enabled: true
    patterns:
      - "bull_flag"
      - "bear_flag"
      - "bull_pennant"
      - "bear_pennant"
      - "bull_wedge"
      - "bear_wedge"
    pattern_confidence_threshold: 0.7
    pattern_accuracy_threshold: 0.8

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "flag_strength"
      - "flag_probability"
      - "flag_momentum"
      - "flag_velocity"
      - "flag_acceleration"
      - "flag_confidence"
      - "flag_count"
      - "flag_accuracy"
      - "flag_success_rate"
      - "breakout_count"
      - "confirmed_flags"
      - "invalid_flags"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "flag_detection"
      - "flag_analysis"
      - "flag_accuracy"
      - "flag_distribution"
      - "flag_patterns"
      - "breakout_analysis"
      - "flag_success_rate"
      - "flag_predictive"

# Backtesting
backtesting:
  enabled: true
  use_historical_flags: true
  compute_flag_accuracy: true
  compute_breakout_effectiveness: true
  compute_pattern_accuracy: true
  compute_risk_adjusted_returns: true
  report_metrics:
    - "flag_accuracy"
    - "breakout_effectiveness"
    - "pattern_accuracy"
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"

# Configuration de la base de données
database:
  enabled: true
  table_name: "flag_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/flag"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "flag_alert"
    - url: "https://nexustradingia.com/api/webhooks/flag-breakout"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "flag_breakout"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "flag_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/flag"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/flag/current"
    - "/api/v1/flag/history"
    - "/api/v1/flag/metrics"
    - "/api/v1/flag/status"
    - "/api/v1/flag/patterns"
    - "/api/v1/flag/probability"
    - "/api/v1/flag/accuracy"
    - "/api/v1/flag/forecast"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/flag/"
  encrypt: true
  encryption_key_id: "nexus-flag-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/flag"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_flag_volume"
      - "low_flag_volume"
      - "pattern_volume"
      - "accuracy_validation"
      - "false_positive"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "confidence_threshold > 0.0"
      - "confidence_threshold <= 1.0"
      - "flag_types.bull_flag.pole_length_min > 0"
      - "flag_types.bull_flag.pole_length_max > flag_types.bull_flag.pole_length_min"
      - "flag_types.bull_flag.flag_length_min > 0"
      - "flag_types.bull_flag.flag_length_max > flag_types.bull_flag.flag_length_min"
      - "thresholds.pole.min_height_percent >= 0.0"
      - "thresholds.pole.max_height_percent > threshold.pole.min_height_percent"
      - "thresholds.flag.min_length > 0"
      - "thresholds.flag.max_length > threshold.flag.min_length"
      - "indicators.flag_strength.factor_weights.sum() == 1.0"
      - "min_data_points > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "trending"
      - "ranging"
      - "volatile"
      - "stable"
      - "bull"
      - "bear"
  regime_parameters:
    trending:
      flag_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
    ranging:
      flag_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
    volatile:
      flag_multiplier: 0.7
      threshold_multiplier: 1.3
      confidence_multiplier: 0.8
    stable:
      flag_multiplier: 1.0
      threshold_multiplier: 0.9
      confidence_multiplier: 1.2
    bull:
      flag_multiplier: 1.1
      threshold_multiplier: 0.9
      confidence_multiplier: 1.0
    bear:
      flag_multiplier: 0.9
      threshold_multiplier: 1.1
      confidence_multiplier: 0.9

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      flag_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
    london:
      start: "08:00"
      end: "16:00"
      flag_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
    newyork:
      start: "13:00"
      end: "22:00"
      flag_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      flag_multiplier: 1.5
      threshold_multiplier: 0.7
      confidence_multiplier: 1.2

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    flag_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    pole_length_min: 10
    pole_length_max: 100
    flag_length_min: 5
    flag_length_max: 50
  ETHUSDT:
    flag_multiplier: 1.1
    threshold_multiplier: 0.9
    confidence_multiplier: 1.0
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    pole_length_min: 8
    pole_length_max: 80
    flag_length_min: 5
    flag_length_max: 40
  SOLUSDT:
    flag_multiplier: 1.2
    threshold_multiplier: 0.8
    confidence_multiplier: 0.9
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    pole_length_min: 8
    pole_length_max: 80
    flag_length_min: 5
    flag_length_max: 40
  ADAUSDT:
    flag_multiplier: 0.9
    threshold_multiplier: 1.1
    confidence_multiplier: 1.1
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    pole_length_min: 10
    pole_length_max: 100
    flag_length_min: 5
    flag_length_max: 50
  XRPUSDT:
    flag_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    pole_length_min: 10
    pole_length_max: 100
    flag_length_min: 5
    flag_length_max: 50
