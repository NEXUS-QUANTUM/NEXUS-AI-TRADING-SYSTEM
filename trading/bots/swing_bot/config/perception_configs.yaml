# Swing Bot Perception Configuration
# Market Perception & Awareness Parameters

# General Perception Settings
perception:
  enabled: true
  perception_mode: "comprehensive"  # comprehensive, basic, advanced, real-time
  awareness_level: "full"  # full, selective, focused, adaptive
  update_frequency_seconds: 5
  version: "3.0.0"

# Perception Channels
channels:
  enabled: true
  primary_channels:
    - "market_data"
    - "price_action"
    - "volume_analysis"
    - "order_flow"
    - "technical_indicators"
    - "pattern_recognition"
    - "sentiment_analysis"
  secondary_channels:
    - "news_analysis"
    - "social_media"
    - "fundamental_data"
    - "economic_data"
    - "alternative_data"
    - "institutional_flow"
    - "retail_flow"
  channel_weights:
    market_data: 0.20
    price_action: 0.20
    volume_analysis: 0.15
    order_flow: 0.10
    technical_indicators: 0.10
    pattern_recognition: 0.10
    sentiment_analysis: 0.10
    news_analysis: 0.05

# Market Awareness
awareness:
  enabled: true
  awareness_dimensions:
    - "price_awareness"
    - "volume_awareness"
    - "volatility_awareness"
    - "momentum_awareness"
    - "trend_awareness"
    - "regime_awareness"
    - "sentiment_awareness"
    - "liquidity_awareness"
    - "risk_awareness"
  awareness_thresholds:
    low: 0.30
    moderate: 0.50
    high: 0.70
    very_high: 0.90
  awareness_update_frequency_seconds: 5

# Price Perception
price_perception:
  enabled: true
  price_metrics:
    - "current_price"
    - "price_trend"
    - "price_velocity"
    - "price_acceleration"
    - "price_momentum"
    - "price_volatility"
    - "price_distribution"
    - "price_anomalies"
  price_lookback_bars: 50
  price_thresholds:
    minor_move: 0.01
    moderate_move: 0.03
    major_move: 0.05
    extreme_move: 0.10

# Volume Perception
volume_perception:
  enabled: true
  volume_metrics:
    - "current_volume"
    - "volume_trend"
    - "volume_velocity"
    - "volume_acceleration"
    - "volume_momentum"
    - "volume_volatility"
    - "volume_distribution"
    - "volume_anomalies"
  volume_lookback_bars: 30
  volume_thresholds:
    low: 100000
    moderate: 500000
    high: 1000000
    extreme: 5000000

# Volatility Perception
volatility_perception:
  enabled: true
  volatility_metrics:
    - "historical_volatility"
    - "implied_volatility"
    - "volatility_trend"
    - "volatility_regime"
    - "volatility_clustering"
    - "volatility_skew"
    - "volatility_term_structure"
    - "volatility_anomalies"
  volatility_lookback_days: 20
  volatility_thresholds:
    low: 0.10
    moderate: 0.20
    high: 0.30
    extreme: 0.50

# Momentum Perception
momentum_perception:
  enabled: true
  momentum_metrics:
    - "price_momentum"
    - "volume_momentum"
    - "relative_momentum"
    - "acceleration"
    - "deceleration"
    - "momentum_distribution"
    - "momentum_anomalies"
  momentum_lookback_bars: 20
  momentum_thresholds:
    weak: 0.10
    moderate: 0.30
    strong: 0.50
    extreme: 0.70

# Trend Perception
trend_perception:
  enabled: true
  trend_metrics:
    - "trend_direction"
    - "trend_strength"
    - "trend_velocity"
    - "trend_persistence"
    - "trend_reversal"
    - "trend_continuation"
    - "trend_breakout"
    - "trend_failure"
  trend_lookback_bars: 50
  trend_thresholds:
    weak: 0.20
    moderate: 0.40
    strong: 0.60
    very_strong: 0.80

# Regime Perception
regime_perception:
  enabled: true
  regime_metrics:
    - "current_regime"
    - "regime_strength"
    - "regime_persistence"
    - "regime_transition"
    - "regime_volatility"
    - "regime_liquidity"
    - "regime_sentiment"
  regime_detection_methods:
    - "volatility_regime"
    - "trend_regime"
    - "correlation_regime"
    - "liquidity_regime"
    - "sentiment_regime"
  regime_confidence_threshold: 0.70

# Sentiment Perception
sentiment_perception:
  enabled: true
  sentiment_metrics:
    - "market_sentiment"
    - "investor_sentiment"
    - "news_sentiment"
    - "social_sentiment"
    - "institutional_sentiment"
    - "retail_sentiment"
    - "fear_greed_index"
  sentiment_lookback_days: 10
  sentiment_thresholds:
    extreme_fear: 20
    fear: 40
    neutral: 50
    greed: 60
    extreme_greed: 80

# Liquidity Perception
liquidity_perception:
  enabled: true
  liquidity_metrics:
    - "market_depth"
    - "bid_ask_spread"
    - "order_book_imbalance"
    - "liquidity_velocity"
    - "liquidity_pools"
    - "dark_pool_liquidity"
    - "liquidity_anomalies"
  liquidity_lookback_bars: 20
  liquidity_thresholds:
    low: 100000
    moderate: 500000
    high: 1000000
    extreme: 5000000

# Risk Perception
risk_perception:
  enabled: true
  risk_metrics:
    - "market_risk"
    - "volatility_risk"
    - "liquidity_risk"
    - "correlation_risk"
    - "tail_risk"
    - "systemic_risk"
    - "regulatory_risk"
  risk_lookback_days: 30
  risk_thresholds:
    low: 0.20
    moderate: 0.40
    high: 0.60
    critical: 0.80

# Perception Integration
integration:
  enabled: true
  perception_fusion: "late_fusion"  # early_fusion, late_fusion, hybrid_fusion
  perception_aggregation: "weighted_average"
  perception_confidence: true
  perception_scoring: true
  awareness_index: true

# Perception Visualization
visualization:
  enabled: true
  charts:
    - "perception_dashboard"
    - "market_awareness_chart"
    - "sentiment_chart"
    - "volatility_chart"
    - "liquidity_chart"
    - "risk_chart"
    - "regime_chart"
    - "trend_chart"
  update_interval_seconds: 5
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "regime_change"
    - "sentiment_extreme"
    - "volatility_spike"
    - "liquidity_drop"
    - "risk_threshold_breach"
    - "trend_change"
    - "momentum_reversal"
  alert_thresholds:
    regime_change_confidence: 0.70
    sentiment_extreme: 80
    volatility_spike: 2.0
    liquidity_drop_percent: 30
    risk_threshold: 0.70
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_perception_summary"
    - "weekly_perception_analysis"
    - "monthly_perception_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "risk@example.com"
    - "strategy@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "perception_data"
    - "awareness_metrics"
    - "regime_data"
    - "sentiment_data"
    - "volatility_data"
    - "liquidity_data"
    - "risk_data"
    - "alert_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/perception"
  api_endpoint: "/api/v1/trading/perception"
  dashboard_url: "http://localhost:3000/perception"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "strategy_engine"
    - "research_platform"
    - "sentiment_platform"
