# Swing Bot Implementation Shortfall Configuration
# Implementation Shortfall Analysis & Optimization Parameters for Trade Execution

# General Implementation Shortfall Settings
implementation_shortfall:
  enabled: true
  analysis_mode: "real_time"
  benchmark_type: "arrival_price"
  optimization_level: "adaptive"
  update_frequency_seconds: 5
  version: "3.0.0"

# Cost Components
cost_components:
  market_impact:
    enabled: true
    estimation_method: "almgren_chriss"
    permanent_impact_coefficient: 0.001
    temporary_impact_coefficient: 0.002
    impact_decay_rate: 0.50
    impact_model_type: "linear"
    daily_volume_factor: 0.10
    execution_horizon_hours: 4
    market_cap_adjustment: true
    volatility_adjustment: true
  opportunity_cost:
    enabled: true
    estimation_method: "historical"
    price_movement_volatility: 0.20
    opportunity_time_horizon_minutes: 30
    missed_trade_penalty: 0.001
    market_condition_adjustment: true
    volatility_regime_adjustment: true
    price_trend_factor: 0.50
  timing_cost:
    enabled: true
    estimation_method: "rolling"
    lookback_window_minutes: 60
    price_trend_adjustment: true
    volatility_adjustment: true
    momentum_factor: 0.30
    mean_reversion_factor: 0.20
    delay_penalty_bps: 0.50
  spread_cost:
    enabled: true
    estimation_method: "current"
    spread_multiplier: 0.50
    dynamic_spread_capture: true
    volume_weighted_spread: true
    spread_forecast_horizon_seconds: 60
    spread_regression_model: true
  delay_cost:
    enabled: true
    latency_penalty_bps_per_second: 0.01
    network_latency_ms: 50
    processing_latency_ms: 10
    queue_delay_ms: 100
    slippage_delay_factor: 1.50

# Almgren-Chriss Model
almgren_chriss:
  daily_volume: 1000000
  volatility_annual: 0.25
  liquidity_parameter: 0.50
  risk_aversion: 0.10
  optimal_trajectory: true
  trade_rate_limit: 0.10
  time_horizon_hours: 8
  gamma_parameter: 0.01
  eta_parameter: 0.02
  lambda_parameter: 0.0001
  sigma_parameter: 0.20
  phi_parameter: 0.50
  informed_trading_probability: 0.30
  noise_trading_variance: 0.10

# Kyle Model
kyle:
  lambda_parameter: 0.0001
  sigma_parameter: 0.20
  phi_parameter: 0.50
  informed_trading_probability: 0.30
  noise_trading_variance: 0.10
  order_flow_sensitivity: 0.05
  price_impact_slope: 0.0002
  market_depth_parameter: 10000

# Huberman-Stanzl Model
huberman_stanzl:
  gamma_parameter: 0.01
  eta_parameter: 0.02
  beta_parameter: 0.50
  theta_parameter: 0.10
  tau_parameter: 60
  alpha_parameter: 0.001
  delta_parameter: 0.0005
  rho_parameter: 0.30
  omega_parameter: 0.40

# Benchmark Settings
benchmark:
  arrival_price:
    lookback_window_seconds: 60
    calculation_method: "volume_weighted"
    price_source: "mid_price"
    adjustment_factor: 1.00
  decision_price:
    lookback_window_seconds: 300
    calculation_method: "time_weighted"
    price_source: "last_price"
    adjustment_factor: 1.05
  open_price:
    calculation_method: "first_trade"
    price_source: "open_price"
    adjustment_factor: 1.00
  close_price:
    calculation_method: "last_trade"
    price_source: "close_price"
    adjustment_factor: 1.00
  vwap:
    lookback_window_seconds: 300
    calculation_method: "volume_weighted"
    price_source: "weighted_price"
    adjustment_factor: 1.02
  market_close:
    calculation_method: "auction"
    price_source: "closing_auction"
    adjustment_factor: 1.01

# Market Impact Prediction
market_impact_prediction:
  prediction_models:
    - "linear_regression"
    - "random_forest"
    - "xgboost"
    - "neural_network"
    - "gradient_boosting"
  primary_model: "random_forest"
  feature_columns:
    - "order_size"
    - "total_volume"
    - "spread"
    - "volatility"
    - "depth_at_price"
    - "trade_count"
    - "time_of_day"
    - "day_of_week"
    - "market_cap"
    - "liquidity_score"
    - "order_flow_imbalance"
    - "bid_ask_imbalance"
    - "trade_intensity"
    - "price_momentum"
  prediction_horizon_seconds: 300
  model_retrain_frequency_hours: 24
  min_observations_for_training: 1000
  validation_split: 0.20
  feature_importance_analysis: true

# Slippage Analysis
slippage:
  expected_slippage_bps: 2
  max_acceptable_slippage_bps: 10
  slippage_distribution: "normal"
  slippage_confidence_level: 0.95
  slippage_component:
    - "market_impact"
    - "spread"
    - "delay"
    - "timing"
    - "opportunity"
    - "network_latency"
    - "queue_depth"
  slippage_model: "garch"
  slippage_forecast_horizon_seconds: 60
  slippage_volatility_adjustment: true

# Execution Cost Breakdown
cost_breakdown:
  categories:
    - "explicit_cost":
        - "commission"
        - "fees"
        - "taxes"
        - "clearing_fees"
    - "implicit_cost":
        - "market_impact"
        - "spread"
        - "slippage"
        - "price_concession"
    - "opportunity_cost":
        - "missed_trades"
        - "price_movement"
        - "timing_risk"
    - "timing_cost":
        - "delay"
        - "timing_risk"
        - "execution_drift"
  display_format: "percentage"
  aggregation_level: "detailed"
  cost_benchmarking: true

# Optimization Parameters
optimization:
  objective_function: "minimize_shortfall"
  constraints:
    max_market_impact_bps: 10
    max_time_horizon_minutes: 60
    min_participation_rate: 0.05
    max_participation_rate: 0.20
    max_volume_participation: 0.15
    max_price_impact_bps: 5
    min_execution_quality_score: 0.70
    max_opportunity_cost_bps: 5
  optimization_algorithm: "genetic"
  optimization_iterations: 1000
  population_size: 100
  mutation_rate: 0.10
  crossover_rate: 0.80
  convergence_threshold: 0.001
  parallel_optimization: true

# Trade Schedule Optimization
trade_schedule:
  slice_count: 20
  slice_interval_seconds: 60
  schedule_method: "adaptive"
  aggressive_schedule_factor: 0.50
  passive_schedule_factor: 1.50
  randomize_schedule: true
  schedule_randomization_variance: 20
  volume_profile_aware: true
  time_profile_aware: true
  market_condition_adaptive: true
  schedule_optimization_frequency_minutes: 5

# Risk Constraints
risk_constraints:
  var_limit_percent: 5.0
  expected_shortfall_limit_percent: 7.5
  max_drawdown_limit_percent: 10.0
  volatility_risk_limit: 0.30
  liquidity_risk_limit: 0.20
  market_risk_limit: 0.15
  execution_risk_limit: 0.10
  tail_risk_threshold: 0.05
  stress_scenario_analysis: true

# Performance Metrics
performance_metrics:
  - "implementation_shortfall_bps"
  - "market_impact_bps"
  - "timing_cost_bps"
  - "opportunity_cost_bps"
  - "slippage_bps"
  - "execution_delay_seconds"
  - "participation_rate"
  - "fill_rate"
  - "trade_efficiency_ratio"
  - "cost_percentile"
  - "relative_benchmark_difference"
  - "execution_quality_score"
  - "price_improvement_bps"
  - "order_completion_rate"
  - "variance_ratio"

# Benchmarking
benchmarking:
  peer_comparison: true
  historical_benchmark: true
  industry_average_shortfall_bps: 15
  best_practice_shortfall_bps: 5
  target_shortfall_bps: 8
  percentile_ranking: true
  competitor_comparison: true
  best_execution_analysis: true
  cost_efficiency_rating: true
  execution_quality_rating: true

# Visualization
visualization:
  cost_breakdown_chart: true
  market_impact_curve: true
  execution_timeline: true
  performance_comparison: true
  dashboard_integration: true
  update_interval_seconds: 10
  real_time_cost_tracking: true
  trade_cost_heatmap: true
  cost_distribution_plot: true
  cumulative_cost_chart: true
  benchmark_comparison_chart: true

# Reporting
reporting:
  daily_report: true
  weekly_report: true
  monthly_report: true
  trade_analysis_report: true
  executive_summary: true
  export_formats:
    - "pdf"
    - "excel"
    - "json"
    - "csv"
    - "html"
    - "parquet"
  report_automation: true
  scheduled_reporting: true
  report_recipients:
    - "trading@example.com"
    - "risk@example.com"
    - "compliance@example.com"

# Data Storage
storage:
  trade_execution_data: true
  cost_analysis: true
  performance_metrics: true
  optimization_results: true
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"
  database: "timescaledb"
  backup_frequency_hours: 24
  archival_policy: "auto"

# Alert Settings
alerts:
  shortfall_exceeded_alert: true
  market_impact_exceeded_alert: true
  slippage_exceeded_alert: true
  execution_delay_alert: true
  optimization_failure_alert: true
  performance_degradation_alert: true
  threshold_shortfall_bps: 10
  threshold_market_impact_bps: 5
  threshold_slippage_bps: 8
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "sms"
  alert_cooldown_seconds: 300
  escalation_policy: true

# Integration
integration:
  trading_engine: true
  order_management: true
  execution_platform: true
  risk_management: true
  compliance: true
  webhook_endpoint: "http://localhost:8080/implementation_shortfall"
  api_endpoint: "/api/v1/trading/implementation-shortfall"
  real_time_streaming: true
  data_sync_frequency_seconds: 10
  external_systems:
    - "bloomberg"
    - "reuters"
    - "factset"
  apis:
    - "rest"
    - "websocket"
    - "fps"

# Machine Learning Optimization
ml_optimization:
  enabled: true
  models:
    - "random_forest"
    - "xgboost"
    - "lightgbm"
    - "neural_network"
    - "lstm"
  feature_engineering: true
  hyperparameter_optimization: true
  cross_validation_folds: 5
  early_stopping_patience: 10
  model_selection_method: "cross_validation"
  ensemble_method: "stacking"
  retrain_frequency_days: 7
  online_learning: true
  drift_detection: true

# Execution Quality
execution_quality:
  quality_criteria:
    - "cost_efficiency"
    - "timeliness"
    - "market_impact"
    - "fill_rate"
    - "price_improvement"
    - "order_completion"
  quality_scoring_weights:
    cost_efficiency: 0.30
    timeliness: 0.20
    market_impact: 0.20
    fill_rate: 0.15
    price_improvement: 0.10
    order_completion: 0.05
  minimum_quality_score: 0.70
  quality_dashboard: true

# Compliance
compliance:
  reg_nms: true
  reg_mifi: true
  reg_best_execution: true
  trade_reporting: true
  order_book_visibility: true
  regulatory_limits: true
  audit_trail: true
  transaction_reporting: true
  systematic_internaliser: false
  algorithmic_trading_reporting: true
  compliance_check_frequency_minutes: 5
  regulatory_breach_alert: true
