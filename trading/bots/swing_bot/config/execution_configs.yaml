# execution_configs.yaml
# Configuration complète pour l'exécution des ordres dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 50
  max_data_points: 100000
  execution_engine_version: "4.0.0"
  environment: "production"

# Types d'exécution
execution_types:
  market:
    enabled: true
    description: "Market Order Execution"
    slippage_tolerance: 0.001
    max_slippage: 0.005
    urgency: "high"
    require_confirmation: true
  limit:
    enabled: true
    description: "Limit Order Execution"
    price_offset: 0.0005
    max_price_offset: 0.002
    urgency: "medium"
    require_confirmation: true
  stop:
    enabled: true
    description: "Stop Order Execution"
    trigger_offset: 0.001
    max_trigger_offset: 0.005
    urgency: "high"
    require_confirmation: true
  stop_limit:
    enabled: true
    description: "Stop Limit Order Execution"
    trigger_offset: 0.001
    price_offset: 0.0005
    max_offset: 0.005
    urgency: "medium"
    require_confirmation: true
  trailing_stop:
    enabled: true
    description: "Trailing Stop Execution"
    trailing_percent: 0.5
    min_trailing_percent: 0.1
    max_trailing_percent: 2.0
    urgency: "medium"
    require_confirmation: true
  iceberg:
    enabled: true
    description: "Iceberg Execution"
    display_quantity: 1000
    min_display_quantity: 100
    max_display_quantity: 10000
    urgency: "low"
    require_confirmation: true
  twap:
    enabled: true
    description: "TWAP Execution"
    duration_seconds: 300
    min_duration_seconds: 60
    max_duration_seconds: 3600
    urgency: "low"
    require_confirmation: true
  vwap:
    enabled: true
    description: "VWAP Execution"
    duration_seconds: 300
    min_duration_seconds: 60
    max_duration_seconds: 3600
    urgency: "low"
    require_confirmation: true
  pov:
    enabled: true
    description: "POV Execution"
    participation_rate: 0.1
    min_participation_rate: 0.05
    max_participation_rate: 0.5
    urgency: "low"
    require_confirmation: true
  implementation_shortfall:
    enabled: true
    description: "Implementation Shortfall Execution"
    urgency: "medium"
    aggressiveness: 0.5
    require_confirmation: true

# Algorithmes d'exécution
algorithms:
  smart_routing:
    enabled: true
    routing_method: "dynamic"
    brokers:
      - "binance"
      - "bybit"
      - "coinbase"
      - "kraken"
    routing_criteria:
      - "best_price"
      - "best_execution"
      - "fastest_execution"
      - "lowest_fee"
    update_frequency_seconds: 5
  order_splitting:
    enabled: true
    splitting_method: "adaptive"
    max_slice_size: 1000
    min_slice_size: 100
    slice_interval_seconds: 1
    randomize_slices: true
  order_cancellation:
    enabled: true
    cancel_on_error: true
    cancel_on_timeout: true
    cancel_on_trigger: true
    max_cancellation_attempts: 3
    cancellation_timeout_seconds: 5
  order_amendment:
    enabled: true
    max_amendments: 5
    amendment_timeout_seconds: 5
    allow_price_update: true
    allow_quantity_update: true
    allow_type_update: true

# Stratégies d'exécution
strategies:
  aggressive:
    enabled: true
    description: "Aggressive Execution"
    execution_type: "market"
    urgency: "high"
    slippage_tolerance: 0.002
    market_impact: "high"
  moderate:
    enabled: true
    description: "Moderate Execution"
    execution_type: "limit"
    urgency: "medium"
    price_offset: 0.0005
    market_impact: "medium"
    duration_seconds: 300
  passive:
    enabled: true
    description: "Passive Execution"
    execution_type: "limit"
    urgency: "low"
    price_offset: 0.001
    market_impact: "low"
    duration_seconds: 600
  stealth:
    enabled: true
    description: "Stealth Execution"
    execution_type: "iceberg"
    urgency: "low"
    display_quantity: 500
    market_impact: "very_low"
    duration_seconds: 900
  smart:
    enabled: true
    description: "Smart Execution"
    execution_type: "adaptive"
    urgency: "medium"
    adaptation_factor: 0.5
    market_impact_model: true
    liquidity_sensitivity: 0.5

# Optimisation d'exécution
optimization:
  slippage_optimization:
    enabled: true
    minimize_slippage: true
    max_slippage: 0.005
    optimization_factor: 0.5
  market_impact:
    enabled: true
    minimize_market_impact: true
    impact_model: "linear"
    impact_factor: 0.5
  timing_optimization:
    enabled: true
    optimize_timing: true
    time_horizon_seconds: 300
    optimization_factor: 0.5
  price_optimization:
    enabled: true
    optimize_price: true
    price_improvement: true
    optimization_factor: 0.5
  cost_optimization:
    enabled: true
    minimize_cost: true
    cost_model: "linear"
    cost_factor: 0.5

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"
      - "lstm"
    features:
      - "execution_type"
      - "order_size"
      - "price_level"
      - "spread"
      - "volume"
      - "volatility"
      - "liquidity"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.25
      - 0.25
      - 0.25
      - 0.25
  execution_quality:
    enabled: true
    measure_execution_quality: true
    quality_metrics:
      - "slippage"
      - "market_impact"
      - "timing"
      - "price_improvement"
      - "execution_speed"
      - "fill_rate"
    quality_threshold: 0.8
  risk_management:
    enabled: true
    max_exposure: 100000
    max_position_per_symbol: 50000
    max_order_size: 10000
    max_orders_per_minute: 100
    max_orders_per_hour: 1000
    risk_check_frequency_seconds: 5

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "order_count"
      - "executed_orders"
      - "filled_volume"
      - "slippage"
      - "market_impact"
      - "execution_speed"
      - "fill_rate"
      - "execution_quality"
      - "order_failures"
      - "order_cancellations"
      - "order_amendments"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "order_flow"
      - "execution_quality"
      - "slippage_analysis"
      - "market_impact"
      - "fill_rate"
      - "order_distribution"
      - "execution_speed"
      - "risk_metrics"

# Backtesting
backtesting:
  enabled: true
  use_historical_execution: true
  compute_execution_quality: true
  compute_strategy_performance: true
  compute_risk_adjusted_returns: true
  compute_slippage_analysis: true
  report_metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "execution_quality"
    - "slippage_avg"
    - "market_impact"
    - "fill_rate"

# Configuration de la base de données
database:
  enabled: true
  table_name: "execution_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/execution"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "execution_alert"
    - url: "https://nexustradingia.com/api/webhooks/execution-quality"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "execution_quality"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "execution_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/execution"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/execution/orders"
    - "/api/v1/execution/executions"
    - "/api/v1/execution/metrics"
    - "/api/v1/execution/status"
    - "/api/v1/execution/algorithms"
    - "/api/v1/execution/strategies"
    - "/api/v1/execution/quality"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/execution/"
  encrypt: true
  encryption_key_id: "nexus-execution-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"
  broker_api:
    enabled: true
    sync_frequency_seconds: 1
    data_endpoint: "ws://broker-api:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_order_volume"
      - "low_liquidity"
      - "high_volatility"
      - "system_errors"
      - "broker_errors"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "execution_types.market.slippage_tolerance >= 0.0"
      - "execution_types.market.max_slippage >= execution_types.market.slippage_tolerance"
      - "execution_types.limit.price_offset >= 0.0"
      - "execution_types.limit.max_price_offset >= execution_types.limit.price_offset"
      - "execution_types.twap.duration_seconds > 0"
      - "execution_types.twap.min_duration_seconds > 0"
      - "execution_types.twap.max_duration_seconds > execution_types.twap.min_duration_seconds"
      - "algorithms.order_splitting.max_slice_size > 0"
      - "algorithms.order_splitting.min_slice_size < algorithms.order_splitting.max_slice_size"
      - "advanced.risk_management.max_exposure > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "low_volatility"
      - "normal_volatility"
      - "high_volatility"
      - "extreme_volatility"
      - "low_liquidity"
      - "high_liquidity"
  regime_parameters:
    low_volatility:
      urgency_multiplier: 0.8
      slippage_tolerance: 0.5
      market_impact: 0.5
    normal_volatility:
      urgency_multiplier: 1.0
      slippage_tolerance: 1.0
      market_impact: 1.0
    high_volatility:
      urgency_multiplier: 1.2
      slippage_tolerance: 1.5
      market_impact: 1.5
    extreme_volatility:
      urgency_multiplier: 1.5
      slippage_tolerance: 2.0
      market_impact: 2.0
    low_liquidity:
      urgency_multiplier: 0.6
      slippage_tolerance: 2.0
      market_impact: 2.0
    high_liquidity:
      urgency_multiplier: 1.2
      slippage_tolerance: 0.5
      market_impact: 0.5

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      urgency_multiplier: 0.8
      market_impact: 1.2
    london:
      start: "08:00"
      end: "16:00"
      urgency_multiplier: 1.2
      market_impact: 0.8
    newyork:
      start: "13:00"
      end: "22:00"
      urgency_multiplier: 1.0
      market_impact: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      urgency_multiplier: 1.5
      market_impact: 0.7

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    urgency_multiplier: 1.0
    slippage_tolerance: 1.0
    market_impact: 1.0
    max_order_size: 10000
    min_order_size: 10
  ETHUSDT:
    urgency_multiplier: 1.1
    slippage_tolerance: 0.9
    market_impact: 1.1
    max_order_size: 8000
    min_order_size: 10
  SOLUSDT:
    urgency_multiplier: 1.2
    slippage_tolerance: 0.8
    market_impact: 1.2
    max_order_size: 6000
    min_order_size: 10
  ADAUSDT:
    urgency_multiplier: 0.9
    slippage_tolerance: 1.1
    market_impact: 0.9
    max_order_size: 4000
    min_order_size: 10
  XRPUSDT:
    urgency_multiplier: 1.0
    slippage_tolerance: 1.0
    market_impact: 1.0
    max_order_size: 4000
    min_order_size: 10
