# ============================================================================
#
# Description: Complete Continuation configuration for swing trading bot
# Framework: Continuation Patterns - Trend Continuation Analysis
# Version: 3.0.0
#
# The Continuation configuration enables the bot to identify and trade
# continuation patterns including flags, pennants, and consolidation breaks.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
continuation:
  enabled: true
  version: "3.0.0"
  description: "Continuation Pattern Trading for swing trading"
  
  # Continuation types
  types:
    - "flag"
    - "pennant"
    - "triangle"
    - "rectangle"
    - "wedge"
    - "channel"
    - "gap"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "1h"

# ----------------------------------------------------------------------------
# Flag Pattern
# ----------------------------------------------------------------------------
flag:
  enabled: true
  description: "Flag pattern configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_flag_duration: 5  # bars
    max_flag_duration: 20  # bars
    volume_threshold: 0.5
    confidence_threshold: 0.7
  
  # Pattern detection
  detection:
    flagpole_min_length: 5
    flagpole_max_length: 15
    flag_width: 0.02
    flag_slope: 0.1
  
  # Signals
  signals:
    bullish_flag:
      description: "Bullish flag continuation"
      conditions:
        - "flag_detected"
        - "volume_decreasing"
        - "breakout_up"
        - "trend_up"
      confidence: 0.75
    
    bearish_flag:
      description: "Bearish flag continuation"
      conditions:
        - "flag_detected"
        - "volume_decreasing"
        - "breakout_down"
        - "trend_down"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Pennant Pattern
# ----------------------------------------------------------------------------
pennant:
  enabled: true
  description: "Pennant pattern configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_pennant_duration: 5  # bars
    max_pennant_duration: 20  # bars
    volume_threshold: 0.5
    confidence_threshold: 0.7
  
  # Pattern detection
  detection:
    pole_min_length: 5
    pole_max_length: 15
    pennant_width: 0.02
    pennant_slope: 0.2
  
  # Signals
  signals:
    bullish_pennant:
      description: "Bullish pennant continuation"
      conditions:
        - "pennant_detected"
        - "volume_decreasing"
        - "breakout_up"
        - "trend_up"
      confidence: 0.75
    
    bearish_pennant:
      description: "Bearish pennant continuation"
      conditions:
        - "pennant_detected"
        - "volume_decreasing"
        - "breakout_down"
        - "trend_down"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Triangle Pattern
# ----------------------------------------------------------------------------
triangle:
  enabled: true
  description: "Triangle pattern configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_triangle_duration: 10  # bars
    max_triangle_duration: 30  # bars
    volume_threshold: 0.5
    confidence_threshold: 0.7
  
  # Triangle types
  types:
    - "ascending"
    - "descending"
    - "symmetrical"
  
  # Pattern detection
  detection:
    min_touches: 2
    max_touches: 5
    triangle_width: 0.02
    triangle_slope: 0.1
  
  # Signals
  signals:
    ascending_triangle:
      description: "Ascending triangle continuation"
      conditions:
        - "ascending_triangle_detected"
        - "volume_confirmation"
        - "breakout_up"
        - "trend_up"
      confidence: 0.8
    
    descending_triangle:
      description: "Descending triangle continuation"
      conditions:
        - "descending_triangle_detected"
        - "volume_confirmation"
        - "breakout_down"
        - "trend_down"
      confidence: 0.8
    
    symmetrical_triangle:
      description: "Symmetrical triangle continuation"
      conditions:
        - "symmetrical_triangle_detected"
        - "volume_confirmation"
        - "breakout_detected"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Rectangle Pattern
# ----------------------------------------------------------------------------
rectangle:
  enabled: true
  description: "Rectangle pattern configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_rectangle_duration: 10  # bars
    max_rectangle_duration: 30  # bars
    volume_threshold: 0.5
    confidence_threshold: 0.7
  
  # Pattern detection
  detection:
    min_touches: 2
    max_touches: 5
    rectangle_width: 0.02
    rectangle_height: 0.03
  
  # Signals
  signals:
    rectangle_breakout:
      description: "Rectangle breakout continuation"
      conditions:
        - "rectangle_detected"
        - "volume_confirmation"
        - "breakout_up"
        - "trend_up"
      confidence: 0.75
    
    rectangle_breakdown:
      description: "Rectangle breakdown continuation"
      conditions:
        - "rectangle_detected"
        - "volume_confirmation"
        - "breakout_down"
        - "trend_down"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Gap Continuation
# ----------------------------------------------------------------------------
gap:
  enabled: true
  description: "Gap continuation configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_gap_size: 0.01
    max_gap_size: 0.05
    volume_threshold: 1.5
    confidence_threshold: 0.7
  
  # Gap types
  types:
    - "breakaway"
    - "runaway"
    - "exhaustion"
  
  # Pattern detection
  detection:
    min_volume: 1000
    gap_confirmation: true
  
  # Signals
  signals:
    breakaway_gap:
      description: "Breakaway gap continuation"
      conditions:
        - "breakaway_gap_detected"
        - "volume_confirmation"
        - "trend_confirmed"
      confidence: 0.8
    
    runaway_gap:
      description: "Runaway gap continuation"
      conditions:
        - "runaway_gap_detected"
        - "volume_confirmation"
        - "trend_confirmed"
      confidence: 0.85
    
    exhaustion_gap:
      description: "Exhaustion gap reversal"
      conditions:
        - "exhaustion_gap_detected"
        - "volume_confirmation"
        - "trend_reversing"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Continuation Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Continuation-based trading signals"
  
  # Signal types
  types:
    continuation_buy:
      description: "Continuation buy signal"
      conditions:
        - "continuation_pattern_detected"
        - "volume_confirmation"
        - "trend_up"
        - "momentum_increasing"
      confidence: 0.8
    
    continuation_sell:
      description: "Continuation sell signal"
      conditions:
        - "continuation_pattern_detected"
        - "volume_confirmation"
        - "trend_down"
        - "momentum_decreasing"
      confidence: 0.8
    
    continuation_hedge:
      description: "Continuation hedge signal"
      conditions:
        - "continuation_pattern_detected"
        - "volume_confirmation"
        - "trend_uncertain"
        - "momentum_uncertain"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "volume"
      - "momentum"
      - "price_action"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for continuation trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Continuation-based stop loss
    stop_loss:
      type: "continuation_based"
      distance: 0.01
      atr_multiplier: 1.5
      min: 0.005
      max: 0.02
    
    # Continuation-based take profit
    take_profit:
      type: "continuation_based"
      multiplier: 2.5
      min: 0.01
      max: 0.05

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for continuation trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/continuation_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    patterns: true
    debugging: false
