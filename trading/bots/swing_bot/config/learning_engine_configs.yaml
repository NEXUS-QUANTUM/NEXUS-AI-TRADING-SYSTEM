# Swing Bot Learning Engine Configuration
# Core Learning Engine & Cognitive Development Parameters

# General Learning Engine Settings
learning_engine:
  enabled: true
  engine_mode: "autonomous"  # autonomous, supervised, semi_supervised, hybrid
  learning_paradigm: "meta_learning"  # meta_learning, transfer_learning, multi_task_learning
  development_stage: "advanced"  # basic, intermediate, advanced, expert
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "data_processor"
    - "feature_extractor"
    - "model_trainer"
    - "model_evaluator"
    - "model_selector"
    - "hyperparameter_optimizer"
    - "ensemble_manager"
    - "prediction_engine"
    - "adaptation_manager"
    - "knowledge_base"
    - "performance_monitor"
  module_interaction: "pipeline"
  parallel_execution: true
  max_workers: 8
  pipeline_buffer_size: 10000

# Data Processing Module
data_processor:
  enabled: true
  data_sources:
    - "market_data"
    - "trade_data"
    - "performance_data"
    - "risk_data"
    - "alternative_data"
    - "external_data"
  data_pipeline_stages:
    - "ingestion"
    - "cleaning"
    - "validation"
    - "transformation"
    - "normalization"
    - "augmentation"
    - "encoding"
    - "sequencing"
  batch_size: 1000
  processing_mode: "streaming"
  data_quality_threshold: 0.95
  outlier_removal: true
  missing_value_handling: "interpolate"

# Feature Extraction Module
feature_extractor:
  enabled: true
  feature_types:
    - "technical_indicators"
    - "price_features"
    - "volume_features"
    - "volatility_features"
    - "momentum_features"
    - "trend_features"
    - "statistical_features"
    - "pattern_features"
    - "sentiment_features"
    - "fundamental_features"
    - "alternative_features"
  feature_selection_method: "mutual_information"
  max_features: 100
  min_feature_importance: 0.005
  auto_feature_engineering: true
  feature_interaction: true
  polynomial_features: true

# Model Training Module
model_trainer:
  enabled: true
  model_types:
    - "linear_models"
    - "tree_based_models"
    - "ensemble_models"
    - "neural_networks"
    - "deep_learning_models"
    - "reinforcement_learning_models"
    - "probabilistic_models"
    - "hybrid_models"
  training_paradigm: "hybrid"
  training_strategy: "adaptive"
  batch_size: 64
  epochs: 100
  early_stopping_patience: 10
  validation_split: 0.20
  cross_validation_folds: 5
  learning_rate: 0.001
  optimization_algorithm: "adam"
  loss_function: "custom"

# Model Evaluation Module
model_evaluator:
  enabled: true
  evaluation_metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
    - "mse"
    - "mae"
    - "rmse"
    - "r2_score"
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "win_rate"
    - "profit_factor"
  evaluation_strategy: "cross_validation"
  test_split: 0.10
  confusion_matrix: true
  feature_importance: true
  model_interpretability: true
  benchmarking: true

# Model Selection Module
model_selector:
  enabled: true
  selection_method: "ensemble"
  selection_criteria:
    - "performance_score"
    - "generalization_capability"
    - "computational_efficiency"
    - "robustness"
    - "interpretability"
    - "adaptability"
  selection_weights:
    performance_score: 0.30
    generalization: 0.20
    computational_efficiency: 0.15
    robustness: 0.15
    interpretability: 0.10
    adaptability: 0.10
  top_k_models: 5
  min_performance_threshold: 0.70

# Hyperparameter Optimizer
hyperparameter_optimizer:
  enabled: true
  optimization_methods:
    - "bayesian_optimization"
    - "grid_search"
    - "random_search"
    - "genetic_algorithm"
    - "hyperband"
    - "optuna"
  primary_method: "bayesian_optimization"
  max_iterations: 100
  early_stopping_rounds: 10
  validation_folds: 3
  objective_function: "maximize_f1"
  parallel_execution: true
  result_logging: true
  visualization: true

# Ensemble Manager
ensemble_manager:
  enabled: true
  ensemble_methods:
    - "voting"
    - "averaging"
    - "stacking"
    - "bagging"
    - "boosting"
    - "blending"
    - "weighted_average"
  primary_method: "stacking"
  base_models_count: 5
  meta_model: "linear_regression"
  cross_validation: true
  diversity_measurement: true
  dynamic_weighting: true

# Prediction Engine
prediction_engine:
  enabled: true
  prediction_types:
    - "price_prediction"
    - "trend_prediction"
    - "volatility_prediction"
    - "volume_prediction"
    - "signal_prediction"
    - "risk_prediction"
    - "performance_prediction"
  prediction_horizons:
    - "ultra_short": "1m"
    - "short_term": "5m"
    - "medium_term": "1h"
    - "long_term": "24h"
  prediction_confidence_level: 0.95
  prediction_uncertainty: true
  prediction_calibration: true
  real_time_predictions: true
  batch_predictions: true

# Adaptation Manager
adaptation_manager:
  enabled: true
  adaptation_types:
    - "parameter_adaptation"
    - "structure_adaptation"
    - "strategy_adaptation"
    - "model_adaptation"
    - "regime_adaptation"
    - "environment_adaptation"
  adaptation_frequency_minutes: 5
  adaptation_threshold: 0.50
  adaptation_speed: "adaptive"
  drift_detection: true
  drift_threshold: 0.15
  concept_drift_handling: "retraining"
  periodic_retraining_hours: 6

# Knowledge Base
knowledge_base:
  enabled: true
  knowledge_types:
    - "model_performance"
    - "feature_importance"
    - "pattern_knowledge"
    - "strategy_knowledge"
    - "risk_knowledge"
    - "market_knowledge"
    - "historical_knowledge"
  storage_method: "vector_database"
  retrieval_strategy: "semantic_search"
  similarity_threshold: 0.75
  knowledge_retention_days: 365
  knowledge_update_frequency_hours: 6
  knowledge_sharing: true
  knowledge_consolidation: true

# Performance Monitor
performance_monitor:
  enabled: true
  monitoring_frequency_seconds: 10
  metrics:
    - "model_accuracy"
    - "inference_speed"
    - "training_speed"
    - "memory_usage"
    - "cpu_usage"
    - "gpu_usage"
    - "error_rate"
    - "drift_metrics"
    - "performance_degradation"
  alert_thresholds:
    accuracy_drop: 0.10
    inference_time_ms: 50
    error_rate: 0.05
    memory_usage_percent: 85
    cpu_usage_percent: 80
  dashboard_integration: true
  real_time_alerts: true

# Learning Strategies
learning_strategies:
  enabled: true
  strategies:
    - "curriculum_learning"
    - "self_paced_learning"
    - "active_learning"
    - "semi_supervised_learning"
    - "multi_task_learning"
    - "federated_learning"
    - "distributed_learning"
  primary_strategy: "curriculum_learning"
  difficulty_ranking: true
  task_scheduling: "adaptive"
  knowledge_transfer: true

# Curriculum Learning
curriculum:
  enabled: true
  difficulty_metrics:
    - "data_complexity"
    - "volatility_level"
    - "noise_level"
    - "task_difficulty"
  pacing_function: "exponential"
  start_difficulty: 0.1
  max_difficulty: 1.0
  min_difficulty: 0.0
  pace_factor: 0.01
  adaptive_pacing: true
  student_performance_based: true

# Self-Paced Learning
self_paced:
  enabled: true
  difficulty_metric: "loss_value"
  loss_threshold: 0.80
  learning_pace: "adaptive"
  min_confidence: 0.50
  max_confidence: 0.95
  confidence_adjustment_rate: 0.05
  sample_reweighting: true
  gradual_unfreezing: true

# Active Learning
active_learning:
  enabled: true
  strategies:
    - "uncertainty_sampling"
    - "query_by_committee"
    - "expected_model_change"
    - "expected_error_reduction"
  query_size: 10
  labeling_budget: 1000
  human_in_loop: true
  confidence_threshold: 0.70
  annotation_frequency_days: 1

# Multi-Task Learning
multi_task:
  enabled: true
  tasks:
    - "price_prediction"
    - "trend_prediction"
    - "volatility_prediction"
    - "risk_prediction"
    - "signal_generation"
  task_weights:
    price_prediction: 0.25
    trend_prediction: 0.20
    volatility_prediction: 0.20
    risk_prediction: 0.20
    signal_generation: 0.15
  hard_parameter_sharing: true
  loss_weighting: "dynamic"
  task_relationships: true

# Federated Learning
federated:
  enabled: true
  nodes: 5
  aggregation_method: "fedavg"
  local_epochs: 5
  global_epochs: 100
  learning_rate: 0.01
  batch_size: 64
  client_sampling: 0.50
  secure_aggregation: true
  differential_privacy: true
  privacy_budget: 10.0

# Distributed Learning
distributed:
  enabled: true
  nodes: 4
  communication_method: "parameter_server"
  synchronization: "asynchronous"
  gradient_compression: true
  gradient_quantization: true
  communication_efficiency: true
  fault_tolerance: true
  load_balancing: true

# Model Storage
model_storage:
  enabled: true
  storage_method: "s3"
  model_formats:
    - "pytorch"
    - "tensorflow"
    - "onnx"
    - "pickle"
    - "joblib"
  version_control: true
  retention_days: 365
  compression: true
  backup_frequency_days: 1

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/learning_engine"
  api_endpoint: "/api/v1/trading/learning-engine"
  dashboard_url: "http://localhost:3000/learning-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "mlflow"
    - "wandb"
    - "kubeflow"
    - "tensorboard"
    - "grafana"
    - "prometheus"

# Logging
logging:
  enabled: true
  log_level: "info"
  log_categories:
    - "training"
    - "evaluation"
    - "prediction"
    - "adaptation"
    - "performance"
    - "errors"
    - "system"
  log_rotation: true
  max_log_size_mb: 100
  retention_days: 30
  audit_trail: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "model_degradation"
    - "training_failure"
    - "data_quality_issue"
    - "drift_detected"
    - "performance_drop"
    - "system_failure"
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600
  escalation_policy: true
