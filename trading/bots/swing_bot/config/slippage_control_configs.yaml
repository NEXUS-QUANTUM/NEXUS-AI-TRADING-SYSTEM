# Swing Bot Slippage Control Configuration
# Slippage Management & Mitigation Parameters

# General Slippage Control Settings
slippage_control:
  enabled: true
  analysis_mode: "comprehensive"  # comprehensive, basic, advanced, real-time
  control_method: "multi_factor"  # multi_factor, dynamic, adaptive, predictive
  mitigation_level: "full"  # full, partial, critical
  version: "3.0.0"

# Slippage Calculation
calculation:
  enabled: true
  methods:
    - "historical_slippage"
    - "expected_slippage"
    - "realized_slippage"
    - "conditional_slippage"
    - "volatility_adjusted"
  primary_method: "historical_slippage"
  secondary_method: "expected_slippage"
  lookback_period_days: 30
  confidence_level: 0.95
  calculation_frequency_seconds: 5

# Slippage Metrics
metrics:
  enabled: true
  primary_metrics:
    - "expected_slippage_bps"
    - "realized_slippage_bps"
    - "slippage_ratio"
    - "slippage_volatility"
    - "slippage_distribution"
    - "slippage_percentile"
  secondary_metrics:
    - "slippage_by_order_type"
    - "slippage_by_venue"
    - "slippage_by_time"
    - "slippage_by_size"
    - "slippage_by_volatility"
  metric_aggregation: "weighted_average"

# Slippage Models
models:
  enabled: true
  model_types:
    - "linear_regression"
    - "machine_learning"
    - "deep_learning"
    - "ensemble"
    - "statistical"
  primary_model: "ensemble"
  feature_columns:
    - "order_size"
    - "total_volume"
    - "spread"
    - "volatility"
    - "depth_at_price"
    - "time_of_day"
    - "day_of_week"
    - "market_cap"
    - "liquidity_score"
    - "order_flow_imbalance"
  model_retrain_frequency_hours: 24
  prediction_horizon_seconds: 300

# Slippage Thresholds
thresholds:
  enabled: true
  thresholds:
    acceptable_bps: 2
    warning_bps: 5
    critical_bps: 10
    maximum_bps: 15
  threshold_actions:
    warning: "alert"
    critical: "pause_trading"
    maximum: "stop_trading"
  dynamic_thresholds: true
  volatility_adjustment: true

# Slippage Mitigation
mitigation:
  enabled: true
  methods:
    - "order_slicing"
    - "timing_optimization"
    - "venue_selection"
    - "price_improvement"
    - "liquidity_provision"
    - "dark_pool_usage"
    - "participation_rate_control"
  primary_method: "order_slicing"
  mitigation_effectiveness_monitoring: true
  mitigation_optimization: true

# Order Slicing
order_slicing:
  enabled: true
  slicing_strategies:
    - "fixed_size"
    - "adaptive_size"
    - "volume_weighted"
    - "time_weighted"
    - "price_weighted"
    - "smart"
  primary_strategy: "smart"
  slice_count: 10
  min_slice_size: 100
  max_slice_size: 10000
  slice_interval_seconds: 30
  adaptive_slicing: true

# Timing Optimization
timing_optimization:
  enabled: true
  optimization_objectives:
    - "minimize_slippage"
    - "minimize_cost"
    - "maximize_speed"
    - "balance"
  optimization_algorithm: "genetic"
  timing_window_seconds: 300
  trade_scheduling: true
  market_condition_aware: true
  volume_profile_aware: true

# Venue Selection
venue_selection:
  enabled: true
  venues:
    - "primary_exchange"
    - "secondary_exchange"
    - "dark_pool_1"
    - "dark_pool_2"
    - "ecn"
    - "market_maker"
  venue_selection_criteria:
    - "liquidity"
    - "slippage_cost"
    - "execution_speed"
    - "fill_rate"
    - "anonymity"
  dynamic_venue_allocation: true

# Price Improvement
price_improvement:
  enabled: true
  improvement_methods:
    - "mid_price_trading"
    - "order_book_matching"
    - "dark_pool_pricing"
    - "market_maker_pricing"
    - "intelligent_quoting"
  improvement_target_bps: 1
  improvement_monitoring: true
  improvement_optimization: true

# Liquidity Provision
liquidity_provision:
  enabled: true
  provision_methods:
    - "limit_order_provision"
    - "market_making"
    - "dark_pool_liquidity"
    - "ecn_liquidity"
  provision_size: 1000
  provision_spread_bps: 2
  provision_duration_seconds: 60

# Dark Pool Usage
dark_pool_usage:
  enabled: true
  dark_pool_allocation: 0.20
  dark_pool_venues:
    - "dp_primary"
    - "dp_secondary"
    - "dp_alternative"
  dark_pool_criteria:
    - "anonymity"
    - "price_improvement"
    - "execution_speed"
    - "fill_rate"
  dynamic_dark_pool_allocation: true

# Participation Rate
participation_rate:
  enabled: true
  rate: 0.10
  max_rate: 0.20
  min_rate: 0.05
  adaptive_rate: true
  rate_optimization: true

# Slippage Forecasting
forecasting:
  enabled: true
  forecast_horizons:
    - "ultra_short": "1m"
    - "short_term": "5m"
    - "medium_term": "1h"
  forecast_models:
    - "time_series"
    - "machine_learning"
    - "deep_learning"
    - "ensemble"
  primary_model: "ensemble"
  confidence_interval: 0.90

# Performance Metrics
performance:
  enabled: true
  metrics:
    - "slippage_efficiency"
    - "slippage_reduction_rate"
    - "mitigation_effectiveness"
    - "cost_reduction_rate"
    - "execution_quality"
  evaluation_period_days: 30
  rolling_window_days: 30

# Visualization
visualization:
  enabled: true
  charts:
    - "slippage_dashboard"
    - "slippage_distribution"
    - "slippage_trend_chart"
    - "mitigation_effectiveness"
    - "venue_comparison_chart"
    - "performance_chart"
  update_interval_seconds: 5
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "slippage_exceeded"
    - "slippage_spike"
    - "mitigation_failure"
    - "forecast_deviation"
    - "threshold_breach"
    - "venue_degradation"
  alert_thresholds:
    slippage_exceeded_bps: 5
    slippage_spike_bps: 3
    forecast_deviation_percent: 30
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_slippage_summary"
    - "weekly_slippage_analysis"
    - "monthly_slippage_report"
    - "mitigation_effectiveness_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "risk@example.com"
    - "execution@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "slippage_data"
    - "forecast_results"
    - "mitigation_data"
    - "venue_data"
    - "performance_metrics"
    - "alert_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/slippage-control"
  api_endpoint: "/api/v1/trading/slippage-control"
  dashboard_url: "http://localhost:3000/slippage-control"
  real_time_updates: true
  data_sync_frequency_seconds: 3
  external_systems:
    - "trading_engine"
    - "execution_engine"
    - "order_management"
    - "risk_management"
