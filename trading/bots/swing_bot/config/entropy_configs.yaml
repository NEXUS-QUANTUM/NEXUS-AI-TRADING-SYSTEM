# entropy_configs.yaml
# Configuration complète pour l'analyse d'entropie dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 50
  max_data_points: 100000
  entropy_types:
    - "shannon"
    - "renyi"
    - "tsallis"
    - "approximate"
    - "sample"
    - "permutation"
    - "spectral"
    - "transfer"

# Types d'entropie
entropy_types:
  shannon:
    enabled: true
    description: "Shannon Entropy"
    base: 2
    smoothing: 0
    normalization: true
    binning_method: "auto"
    n_bins: 10
  renyi:
    enabled: true
    description: "Renyi Entropy"
    alpha: 0.5
    base: 2
    smoothing: 0
    normalization: true
    binning_method: "auto"
    n_bins: 10
  tsallis:
    enabled: true
    description: "Tsallis Entropy"
    q: 0.5
    base: 2
    smoothing: 0
    normalization: true
    binning_method: "auto"
    n_bins: 10
  approximate:
    enabled: true
    description: "Approximate Entropy"
    m: 2
    r: 0.2
    smoothing: 0
    normalization: true
  sample:
    enabled: true
    description: "Sample Entropy"
    m: 2
    r: 0.2
    smoothing: 0
    normalization: true
  permutation:
    enabled: true
    description: "Permutation Entropy"
    m: 3
    delay: 1
    smoothing: 0
    normalization: true
  spectral:
    enabled: true
    description: "Spectral Entropy"
    method: "welch"
    nperseg: 256
    smoothing: 0
    normalization: true
  transfer:
    enabled: true
    description: "Transfer Entropy"
    lag: 1
    binning_method: "auto"
    n_bins: 10
    smoothing: 0
    normalization: true

# Seuils d'entropie
thresholds:
  low:
    value: 0.3
    action: "monitor"
    description: "Low entropy - structured market"
    confidence: 0.3
  medium:
    value: 0.5
    action: "alert"
    description: "Medium entropy - mixed market"
    confidence: 0.5
  high:
    value: 0.7
    action: "take_action"
    description: "High entropy - chaotic market"
    confidence: 0.7
  extreme:
    value: 0.9
    action: "emergency"
    description: "Extreme entropy - unpredictable market"
    confidence: 0.9

# Indicateurs d'entropie
indicators:
  entropy_velocity:
    enabled: true
    period: 5
    smoothing: 3
    threshold: 0.1
  entropy_acceleration:
    enabled: true
    period: 10
    smoothing: 5
    threshold: 0.05
  entropy_momentum:
    enabled: true
    period: 14
    smoothing: 3
    threshold: 0.15
  entropy_trend:
    enabled: true
    period: 20
    smoothing: 5
    threshold: 0.2
  entropy_volatility:
    enabled: true
    period: 20
    smoothing: 3
    threshold: 0.1
  entropy_ratio:
    enabled: true
    period: 14
    smoothing: 0
    threshold: 0.5
  entropy_divergence:
    enabled: true
    period: 20
    smoothing: 0
    threshold: 0.3
  entropy_complexity:
    enabled: true
    period: 50
    smoothing: 0
    threshold: 0.4

# Analyse d'entropie
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_mean_entropy: true
    compute_median_entropy: true
    compute_std_entropy: true
    compute_percentiles: true
    percentile_values:
      - 1
      - 5
      - 10
      - 25
      - 50
      - 75
      - 90
      - 95
      - 99
    compute_entropy_distribution: true
    compute_entropy_patterns: true
    compute_entropy_cycles: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous_entropy: true
    compute_moving_average_entropy: true
    compute_exponential_entropy: true
    compute_weighted_entropy: true
    compute_entropy_velocity: true
    compute_entropy_acceleration: true
    compute_entropy_divergence: true
  predictive:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "xgboost"
      - "lightgbm"
    features:
      - "entropy_shannon"
      - "entropy_renyi"
      - "entropy_tsallis"
      - "entropy_approximate"
      - "entropy_sample"
      - "entropy_permutation"
      - "entropy_spectral"
      - "entropy_velocity"
      - "entropy_acceleration"
      - "entropy_momentum"
      - "entropy_trend"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_threshold: 0.7
    retrain_frequency_hours: 24
  comparative:
    enabled: true
    compare_to_market: true
    compare_to_sector: true
    compare_to_benchmark: true
    compare_to_historical: true
    benchmark_symbols:
      - "SP500"
      - "NASDAQ"
      - "BTCUSDT"
      - "ETHUSDT"

# Alertes et notifications
alerts:
  entropy_spike:
    enabled: true
    threshold: 0.8
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "critical"
  entropy_drop:
    enabled: true
    threshold: 0.2
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "warning"
  entropy_divergence:
    enabled: true
    threshold: 0.3
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"
  entropy_pattern:
    enabled: true
    threshold: 0.5
    channels:
      - "telegram"
      - "push_notification"
    severity: "info"
  entropy_breakout:
    enabled: true
    threshold: 0.6
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"

# Actions automatiques
auto_actions:
  trade_execution:
    enabled: true
    action_types:
      - "enter_long"
      - "enter_short"
      - "exit_long"
      - "exit_short"
    require_entropy_signal: true
    require_confidence: 0.6
    max_position_size: 10000
    min_position_size: 100
  position_sizing:
    enabled: true
    method: "entropy_based"
    entropy_scale: 0.5
    max_position_percent: 10.0
    min_position_percent: 0.5
    scaling_function: "inverse_entropy"
  stop_loss:
    enabled: true
    method: "entropy_based"
    entropy_multiplier: 1.5
    min_stop_percent: 0.5
    max_stop_percent: 10.0
    update_frequency_seconds: 10
  take_profit:
    enabled: true
    method: "entropy_based"
    entropy_multiplier: 2.0
    min_profit_percent: 1.0
    max_profit_percent: 20.0
    update_frequency_seconds: 10

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "transformer"
      - "xgboost"
      - "lightgbm"
    features:
      - "entropy_shannon"
      - "entropy_renyi"
      - "entropy_tsallis"
      - "entropy_approximate"
      - "entropy_sample"
      - "entropy_permutation"
      - "entropy_spectral"
      - "entropy_velocity"
      - "entropy_acceleration"
      - "entropy_momentum"
      - "entropy_trend"
      - "entropy_volatility"
      - "entropy_ratio"
      - "entropy_divergence"
      - "entropy_complexity"
      - "price"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.20
      - 0.20
      - 0.20
      - 0.20
      - 0.20
  statistical_analysis:
    enabled: true
    calculate_descriptive_stats: true
    calculate_inferential_stats: true
    calculate_distribution_fitting: true
    calculate_complexity_analysis: true
    calculate_predictability_analysis: true
    confidence_level: 95
    p_value_threshold: 0.05
  complexity_analysis:
    enabled: true
    complexity_metrics:
      - "lempel_ziv"
      - "lyapunov_exponent"
      - "hurst_exponent"
      - "correlation_dimension"
      - "ks_entropy"
    calculate_complexity: true
    complexity_threshold: 0.5

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "entropy_shannon"
      - "entropy_renyi"
      - "entropy_tsallis"
      - "entropy_approximate"
      - "entropy_sample"
      - "entropy_permutation"
      - "entropy_spectral"
      - "entropy_velocity"
      - "entropy_acceleration"
      - "entropy_momentum"
      - "entropy_trend"
      - "entropy_volatility"
      - "entropy_divergence"
      - "entropy_complexity"
      - "entropy_regime"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "entropy_chart"
      - "entropy_distribution"
      - "entropy_velocity"
      - "entropy_acceleration"
      - "entropy_trend"
      - "entropy_complexity"
      - "entropy_regime"
      - "entropy_comparison"

# Backtesting
backtesting:
  enabled: true
  use_historical_entropy: true
  compute_entropy_distribution: true
  compute_pattern_accuracy: true
  compute_signal_accuracy: true
  compute_strategy_performance: true
  compute_complexity_metrics: true
  report_metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "entropy_accuracy"
    - "pattern_accuracy"
    - "complexity_score"

# Distribution des métriques
metrics_distribution:
  enabled: true
  distribution:
    - metric: "entropy_shannon"
      bins: 100
      update_frequency: "realtime"
    - metric: "entropy_sample"
      bins: 50
      update_frequency: "realtime"
    - metric: "entropy_velocity"
      bins: 30
      update_frequency: "realtime"
  percentiles:
    - 1
    - 5
    - 10
    - 25
    - 50
    - 75
    - 90
    - 95
    - 99

# Configuration de la base de données
database:
  enabled: true
  table_name: "entropy_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
      - "7d"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/entropy"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "entropy_alert"
    - url: "https://nexustradingia.com/api/webhooks/entropy-pattern"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "entropy_pattern"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "entropy_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/entropy"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/entropy/current"
    - "/api/v1/entropy/history"
    - "/api/v1/entropy/metrics"
    - "/api/v1/entropy/status"
    - "/api/v1/entropy/indicators"
    - "/api/v1/entropy/patterns"
    - "/api/v1/entropy/complexity"
    - "/api/v1/entropy/forecast"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/entropy/"
  encrypt: true
  encryption_key_id: "nexus-entropy-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/entropy"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_entropy"
      - "low_entropy"
      - "entropy_spike"
      - "entropy_drop"
      - "regime_change"
      - "complex_market"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "thresholds.low.value < thresholds.medium.value"
      - "thresholds.medium.value < thresholds.high.value"
      - "thresholds.high.value < thresholds.extreme.value"
      - "entropy_types.shannon.n_bins > 0"
      - "entropy_types.approximate.m > 0"
      - "entropy_types.sample.m > 0"
      - "entropy_types.permutation.m > 0"
      - "min_data_points > 0"
      - "confidence_threshold > 0.0"
      - "confidence_threshold <= 1.0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "trending"
      - "ranging"
      - "volatile"
      - "stable"
      - "complex"
      - "simple"
  regime_parameters:
    trending:
      entropy_multiplier: 0.8
      threshold_multiplier: 0.7
      confidence_multiplier: 1.2
    ranging:
      entropy_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
    volatile:
      entropy_multiplier: 1.5
      threshold_multiplier: 1.3
      confidence_multiplier: 0.7
    stable:
      entropy_multiplier: 0.6
      threshold_multiplier: 0.8
      confidence_multiplier: 1.3
    complex:
      entropy_multiplier: 1.8
      threshold_multiplier: 1.5
      confidence_multiplier: 0.5
    simple:
      entropy_multiplier: 0.5
      threshold_multiplier: 0.6
      confidence_multiplier: 1.5

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      entropy_multiplier: 0.8
      threshold_multiplier: 1.2
    london:
      start: "08:00"
      end: "16:00"
      entropy_multiplier: 1.2
      threshold_multiplier: 0.8
    newyork:
      start: "13:00"
      end: "22:00"
      entropy_multiplier: 1.0
      threshold_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      entropy_multiplier: 1.5
      threshold_multiplier: 0.7

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    entropy_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    complexity_threshold: 0.5
  ETHUSDT:
    entropy_multiplier: 1.1
    threshold_multiplier: 0.9
    confidence_multiplier: 1.0
    complexity_threshold: 0.5
  SOLUSDT:
    entropy_multiplier: 1.2
    threshold_multiplier: 0.8
    confidence_multiplier: 0.9
    complexity_threshold: 0.6
  ADAUSDT:
    entropy_multiplier: 0.9
    threshold_multiplier: 1.1
    confidence_multiplier: 1.1
    complexity_threshold: 0.4
  XRPUSDT:
    entropy_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    complexity_threshold: 0.5
