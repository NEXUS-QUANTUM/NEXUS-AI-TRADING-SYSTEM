# ============================================================================
#
# Description: Complete Channel configuration for swing trading bot
# Framework: Channel Trading - Price Channel Analysis & Trading
# Version: 3.0.0
#
# The Channel configuration enables the bot to identify and trade
# price channels including trend channels, regression channels,
# and volatility channels.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
channel:
  enabled: true
  version: "3.0.0"
  description: "Channel Trading for swing trading"
  
  # Channel types
  types:
    - "trend_channel"
    - "regression_channel"
    - "volatility_channel"
    - "equal_width_channel"
    - "adaptive_channel"
    - "donchian_channel"
    - "keltner_channel"
    - "bollinger_band"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "1h"

# ----------------------------------------------------------------------------
# Trend Channel
# ----------------------------------------------------------------------------
trend_channel:
  enabled: true
  description: "Trend Channel configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_touches: 2
    max_touches: 5
    tolerance: 0.001
    channel_width_min: 0.01
    channel_width_max: 0.05
  
  # Detection
  detection:
    method: "linear_regression"
    confidence_level: 0.95
    min_slope: 0.001
    max_slope: 0.05
  
  # Signals
  signals:
    channel_buy:
      description: "Channel buy signal"
      conditions:
        - "price_at_support"
        - "support_confirmed"
        - "volume_increasing"
      confidence: 0.7
    
    channel_sell:
      description: "Channel sell signal"
      conditions:
        - "price_at_resistance"
        - "resistance_confirmed"
        - "volume_increasing"
      confidence: 0.7
    
    channel_breakout:
      description: "Channel breakout signal"
      conditions:
        - "price_above_resistance"
        - "volume_confirmation"
        - "momentum_increasing"
      confidence: 0.8
    
    channel_breakdown:
      description: "Channel breakdown signal"
      conditions:
        - "price_below_support"
        - "volume_confirmation"
        - "momentum_decreasing"
      confidence: 0.8

# ----------------------------------------------------------------------------
# Regression Channel
# ----------------------------------------------------------------------------
regression_channel:
  enabled: true
  description: "Regression Channel configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    regression_method: "least_squares"
    std_dev_multiplier: 2.0
    confidence_level: 0.95
    min_width: 0.01
    max_width: 0.05
  
  # Detection
  detection:
    method: "standard_deviation"
    min_touches: 2
    max_touches: 5
    tolerance: 0.001
  
  # Signals
  signals:
    regression_buy:
      description: "Regression channel buy signal"
      conditions:
        - "price_at_lower_band"
        - "support_confirmed"
        - "volume_increasing"
      confidence: 0.7
    
    regression_sell:
      description: "Regression channel sell signal"
      conditions:
        - "price_at_upper_band"
        - "resistance_confirmed"
        - "volume_increasing"
      confidence: 0.7
    
    regression_breakout:
      description: "Regression channel breakout"
      conditions:
        - "price_above_upper_band"
        - "volume_confirmation"
        - "momentum_increasing"
      confidence: 0.8

# ----------------------------------------------------------------------------
# Volatility Channel
# ----------------------------------------------------------------------------
volatility_channel:
  enabled: true
  description: "Volatility Channel configuration"
  
  # Parameters
  parameters:
    lookback_period: 20
    std_dev_multiplier: 2.0
    atr_multiplier: 1.5
    min_width: 0.01
    max_width: 0.05
    channel_type: "atr_based"
  
  # Detection
  detection:
    method: "atr"
    confidence_level: 0.95
    min_touches: 2
  
  # Signals
  signals:
    volatility_buy:
      description: "Volatility channel buy"
      conditions:
        - "price_at_lower_band"
        - "volatility_low"
        - "volume_increasing"
      confidence: 0.7
    
    volatility_sell:
      description: "Volatility channel sell"
      conditions:
        - "price_at_upper_band"
        - "volatility_high"
        - "volume_increasing"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Equal Width Channel
# ----------------------------------------------------------------------------
equal_width_channel:
  enabled: true
  description: "Equal Width Channel configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    channel_width: 0.02
    min_touches: 2
    max_touches: 5
    tolerance: 0.001
  
  # Detection
  detection:
    method: "fixed_width"
    min_slope: 0.001
    max_slope: 0.05
  
  # Signals
  signals:
    equal_width_buy:
      description: "Equal width channel buy"
      conditions:
        - "price_at_support"
        - "support_confirmed"
        - "volume_increasing"
      confidence: 0.7
    
    equal_width_sell:
      description: "Equal width channel sell"
      conditions:
        - "price_at_resistance"
        - "resistance_confirmed"
        - "volume_increasing"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Adaptive Channel
# ----------------------------------------------------------------------------
adaptive_channel:
  enabled: true
  description: "Adaptive Channel configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    adaptation_method: "volatility"
    min_width: 0.005
    max_width: 0.05
    adaptation_factor: 0.5
  
  # Detection
  detection:
    method: "adaptive"
    min_touches: 2
    max_touches: 5
    tolerance: 0.001
  
  # Signals
  signals:
    adaptive_buy:
      description: "Adaptive channel buy"
      conditions:
        - "price_at_support"
        - "support_confirmed"
        - "volume_increasing"
      confidence: 0.75
    
    adaptive_sell:
      description: "Adaptive channel sell"
      conditions:
        - "price_at_resistance"
        - "resistance_confirmed"
        - "volume_increasing"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Channel Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Channel-based trading signals"
  
  # Signal types
  types:
    channel_buy:
      description: "Channel buy signal"
      conditions:
        - "channel_support_touch"
        - "volume_confirmation"
        - "momentum_increasing"
      confidence: 0.75
    
    channel_sell:
      description: "Channel sell signal"
      conditions:
        - "channel_resistance_touch"
        - "volume_confirmation"
        - "momentum_decreasing"
      confidence: 0.75
    
    channel_breakout:
      description: "Channel breakout signal"
      conditions:
        - "breakout_detected"
        - "volume_confirmation"
        - "momentum_confirmed"
      confidence: 0.85
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "volume"
      - "momentum"
      - "price_action"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for channel trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Channel-based stop loss
    stop_loss:
      type: "channel_based"
      distance: 0.01
      atr_multiplier: 1.5
      min: 0.005
      max: 0.02
    
    # Channel-based take profit
    take_profit:
      type: "channel_based"
      multiplier: 2.5
      min: 0.01
      max: 0.05

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for channel trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/channel_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    debugging: false
