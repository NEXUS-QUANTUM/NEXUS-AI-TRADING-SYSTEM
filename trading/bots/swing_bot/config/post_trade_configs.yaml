# Swing Bot Post-Trade Configuration
# Post-Trade Analysis, Reporting & Optimization Parameters

# General Post-Trade Settings
post_trade:
  enabled: true
  analysis_mode: "comprehensive"  # comprehensive, basic, advanced, real-time
  analysis_frequency: "continuous"  # continuous, batch, scheduled
  reporting_level: "detailed"  # basic, standard, detailed, comprehensive
  version: "3.0.0"

# Trade Analysis
trade_analysis:
  enabled: true
  analysis_components:
    - "execution_quality"
    - "cost_analysis"
    - "slippage_analysis"
    - "timing_analysis"
    - "market_impact"
    - "performance_analysis"
    - "risk_analysis"
    - "compliance_analysis"
  analysis_horizon_days: 30
  analysis_depth: "comprehensive"
  statistical_significance: true

# Execution Quality
execution_quality:
  enabled: true
  quality_metrics:
    - "implementation_shortfall"
    - "market_impact_cost"
    - "timing_cost"
    - "opportunity_cost"
    - "spread_cost"
    - "slippage"
    - "fill_rate"
    - "order_completion_rate"
    - "average_execution_speed"
    - "price_improvement"
  benchmarking: true
  peer_comparison: true
  target_quality_score: 0.80
  quality_thresholds:
    poor: 0.40
    moderate: 0.60
    good: 0.80
    excellent: 0.95

# Cost Analysis
cost_analysis:
  enabled: true
  cost_categories:
    - "explicit_costs"
    - "implicit_costs"
    - "opportunity_costs"
    - "timing_costs"
    - "spread_costs"
    - "commission_costs"
    - "tax_costs"
  cost_attribution: true
  cost_benchmarking: true
  cost_optimization: true
  cost_analysis_frequency_hours: 1

# Slippage Analysis
slippage_analysis:
  enabled: true
  slippage_metrics:
    - "expected_slippage"
    - "realized_slippage"
    - "slippage_distribution"
    - "slippage_percentile"
    - "slippage_volatility"
    - "slippage_direction"
    - "slippage_factors"
  calculation_method: "historical"
  lookback_period_days: 30
  confidence_level: 0.95
  slippage_thresholds:
    acceptable_bps: 2
    warning_bps: 5
    critical_bps: 10

# Timing Analysis
timing_analysis:
  enabled: true
  timing_metrics:
    - "execution_timing"
    - "order_delay"
    - "fill_timing"
    - "cancel_timing"
    - "modification_timing"
  timing_distribution: true
  timing_benchmarking: true
  timing_optimization: true

# Market Impact
market_impact_analysis:
  enabled: true
  impact_metrics:
    - "permanent_impact"
    - "temporary_impact"
    - "price_reversion"
    - "impact_cost"
    - "impact_velocity"
  impact_model: "almgren_chriss"
  impact_attribution: true
  impact_optimization: true

# Performance Analysis
performance_analysis:
  enabled: true
  performance_metrics:
    - "pnl_analysis"
    - "return_attribution"
    - "risk_adjusted_returns"
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "win_rate"
    - "profit_factor"
    - "average_return"
    - "maximum_drawdown"
  evaluation_period_days: 30
  rolling_window_days: 30
  benchmark_comparison: true

# Risk Analysis
risk_analysis:
  enabled: true
  risk_metrics:
    - "var_analysis"
    - "expected_shortfall"
    - "drawdown_analysis"
    - "volatility_analysis"
    - "correlation_analysis"
    - "beta_analysis"
    - "concentration_analysis"
    - "liquidity_analysis"
  risk_reporting: true
  risk_monitoring: true

# Compliance Analysis
compliance_analysis:
  enabled: true
  compliance_checks:
    - "regulatory_compliance"
    - "position_limits"
    - "risk_limits"
    - "trading_limits"
    - "best_execution"
    - "market_manipulation"
    - "insider_trading"
    - "money_laundering"
  compliance_reporting: true
  audit_trail: true

# Trade Reconciliation
reconciliation:
  enabled: true
  reconciliation_components:
    - "order_reconciliation"
    - "trade_reconciliation"
    - "position_reconciliation"
    - "balance_reconciliation"
  reconciliation_frequency_minutes: 15
  reconciliation_threshold: 0.001
  mismatch_handling: "alert"
  reconciliation_retry_attempts: 3

# Reporting
reporting_post_trade:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_trade_analysis"
    - "daily_execution_quality"
    - "weekly_performance_analysis"
    - "weekly_risk_analysis"
    - "monthly_comprehensive_report"
    - "quarterly_portfolio_review"
    - "annual_trade_summary"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "risk@example.com"
    - "compliance@example.com"
    - "management@example.com"
  report_automation: true

# Performance Optimization
optimization_post_trade:
  enabled: true
  optimization_areas:
    - "execution_optimization"
    - "cost_reduction"
    - "risk_reduction"
    - "timing_improvement"
    - "quality_improvement"
  optimization_methods:
    - "algorithm_adjustment"
    - "parameter_tuning"
    - "strategy_refinement"
    - "process_improvement"
    - "system_enhancement"
  optimization_frequency_days: 7
  performance_targets:
    cost_reduction_percent: 5
    quality_improvement_percent: 10
    risk_reduction_percent: 5

# Visualization
visualization:
  enabled: true
  charts:
    - "post_trade_dashboard"
    - "execution_quality_chart"
    - "cost_breakdown_chart"
    - "slippage_distribution"
    - "performance_chart"
    - "risk_metrics_chart"
    - "timing_analysis_chart"
    - "compliance_status"
  update_interval_seconds: 30
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "quality_breach"
    - "slippage_exceeded"
    - "cost_exceeded"
    - "performance_drop"
    - "risk_breach"
    - "compliance_breach"
    - "reconciliation_mismatch"
  alert_thresholds:
    quality_breach: 0.70
    slippage_exceeded_bps: 5
    cost_exceeded_bps: 10
    performance_drop_percent: 10
    risk_breach: 0.80
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 300

# Storage
storage:
  enabled: true
  storage_categories:
    - "trade_analysis"
    - "execution_quality"
    - "cost_analysis"
    - "slippage_data"
    - "timing_data"
    - "market_impact"
    - "performance_data"
    - "risk_data"
    - "compliance_data"
    - "reconciliation_data"
    - "optimization_data"
    - "report_history"
    - "alert_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/post-trade"
  api_endpoint: "/api/v1/trading/post-trade"
  dashboard_url: "http://localhost:3000/post-trade"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "order_management"
    - "execution_platform"
    - "reporting_system"
