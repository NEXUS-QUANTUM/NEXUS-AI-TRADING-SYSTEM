# ============================================================================
#
# Description: Complete Auction Process configuration for swing trading bot
# Framework: Market Auction Theory - Price Discovery & Order Flow
# Version: 3.0.0
#
# The Auction Process configuration enables the bot to analyze market
# auction dynamics, order flow, and price discovery mechanisms.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
auction_process:
  enabled: true
  version: "3.0.0"
  description: "Market Auction Process for swing trading"
  
  # Auction types
  types:
    - "continuous"
    - "open"
    - "close"
    - "cross"
    - "periodic"
    - "call"
  
  default_type: "continuous"
  
  # Auction phases
  phases:
    - "pre_open"
    - "opening"
    - "continuous"
    - "closing"
    - "post_close"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"

# ----------------------------------------------------------------------------
# Order Book Analysis
# ----------------------------------------------------------------------------
order_book:
  enabled: true
  description: "Order book analysis configuration"
  
  # Book levels
  levels:
    bid_levels: 20
    ask_levels: 20
    min_level_size: 0.001
    max_level_size: 100
  
  # Book metrics
  metrics:
    spread:
      enabled: true
      calculation: "weighted"
      threshold: 0.001
    
    depth:
      enabled: true
      calculation: "total"
      threshold: 1000
    
    imbalance:
      enabled: true
      calculation: "ratio"
      threshold: 1.5
    
    pressure:
      enabled: true
      calculation: "weighted"
      threshold: 0.3
  
  # Book analysis
  analysis:
    order_flow:
      enabled: true
      lookback_period: 10
      flow_types:
        - "aggressive"
        - "passive"
        - "iceberg"
    
    volume_profile:
      enabled: true
      lookback_period: 50
      profile_method: "standard"
    
    market_depth:
      enabled: true
      lookback_period: 20
      depth_metrics:
        - "total_volume"
        - "weighted_price"
        - "depth_ratio"

# ----------------------------------------------------------------------------
# Price Discovery
# ----------------------------------------------------------------------------
price_discovery:
  enabled: true
  description: "Price discovery configuration"
  
  # Discovery methods
  methods:
    - "order_book"
    - "volume_weighted"
    - "time_weighted"
    - "auction_clearing"
  
  default_method: "order_book"
  
  # Discovery parameters
  parameters:
    lookback_period: 20
    min_volume: 1000
    min_trades: 10
    max_spread: 0.005
    imbalance_threshold: 1.5
  
  # Discovery signals
  signals:
    fair_value:
      enabled: true
      calculation: "weighted"
      components:
        - "bid_ask_mid"
        - "volume_weighted"
        - "vwap"
    
    auction_price:
      enabled: true
      calculation: "clearing"
      conditions:
        - "volume_balanced"
        - "spread_minimal"
    
    discovery_range:
      enabled: true
      calculation: "statistical"
      confidence_level: 0.95

# ----------------------------------------------------------------------------
# Volume-Weighted Average Price
# ----------------------------------------------------------------------------
vwap:
  enabled: true
  description: "VWAP configuration"
  
  # VWAP parameters
  parameters:
    calculation_method: "standard"
    lookback_period: 20
    reset_time: "daily"
    min_volume: 100
    max_volume: 10000
  
  # VWAP bands
  bands:
    enabled: true
    deviation_levels:
      - 1
      - 2
      - 3
    calculation_method: "standard_deviation"
  
  # VWAP signals
  signals:
    below_vwap:
      description: "Price below VWAP"
      conditions:
        - "price_<_vwap"
        - "volume_confirmation"
      confidence: 0.6
    
    above_vwap:
      description: "Price above VWAP"
      conditions:
        - "price_>_vwap"
        - "volume_confirmation"
      confidence: 0.6
    
    vwap_touch:
      description: "VWAP touch"
      conditions:
        - "price_touching_vwap"
        - "volume_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Volume Profile
# ----------------------------------------------------------------------------
volume_profile:
  enabled: true
  description: "Volume profile configuration"
  
  # Profile parameters
  parameters:
    lookback_period: 50
    volume_bins: 30
    value_area_volume: 0.7
    poc_method: "highest_volume"
    min_volume: 100
  
  # Profile metrics
  metrics:
    poc:
      enabled: true
      calculation: "volume_weighted"
      confidence_threshold: 0.8
    
    value_area:
      enabled: true
      calculation: "cumulative_volume"
      confidence_threshold: 0.7
    
    distribution:
      enabled: true
      calculation: "statistical"
      confidence_threshold: 0.6
  
  # Profile signals
  signals:
    poc_rejection:
      description: "Rejection at POC"
      conditions:
        - "price_at_poc"
        - "volume_spike"
        - "price_rejection"
      confidence: 0.7
    
    value_breakout:
      description: "Breakout from value area"
      conditions:
        - "price_above_value_area"
        - "volume_confirmation"
        - "trend_confirmed"
      confidence: 0.75
    
    low_volume_node:
      description: "Low volume node"
      conditions:
        - "low_volume_detected"
        - "price_breakthrough"
        - "volume_confirmation"
      confidence: 0.65

# ----------------------------------------------------------------------------
# Market Profile
# ----------------------------------------------------------------------------
market_profile:
  enabled: true
  description: "Market profile configuration"
  
  # Profile parameters
  parameters:
    period: "daily"
    time_buckets: 30
    value_area_volume: 0.7
    poc_method: "volume_weighted"
    min_volume: 100
  
  # Profile types
  types:
    - "normal"
    - "b_distribution"
    - "p_shape"
    - "d_shape"
    - "single_print"
    - "double_distribution"
    - "price_extension"
  
  # Profile analysis
  analysis:
    distribution:
      enabled: true
      methods:
        - "normal_distribution"
        - "skewed_distribution"
        - "bimodal_distribution"
    
    balance_area:
      enabled: true
      calculation: "volume_weighted"
      confidence_threshold: 0.7
    
    price_extensions:
      enabled: true
      calculation: "statistical"
      confidence_level: 0.95

# ----------------------------------------------------------------------------
# Auction Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Auction-based trading signals"
  
  # Signal types
  types:
    auction_entry:
      description: "Auction entry signal"
      conditions:
        - "auction_price_discovered"
        - "volume_confirmation"
        - "order_flow_aligned"
      confidence: 0.7
    
    auction_exit:
      description: "Auction exit signal"
      conditions:
        - "auction_phase_change"
        - "volume_decrease"
        - "order_flow_reversal"
      confidence: 0.7
    
    auction_hedge:
      description: "Auction hedge signal"
      conditions:
        - "auction_uncertainty"
        - "order_flow_imbalance"
        - "volume_spike"
      confidence: 0.65
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "volume_profile"
      - "order_flow"
      - "price_action"
      - "market_profile"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for auction trading"
  
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    stop_loss:
      type: "auction_based"
      multiplier: 1.5
      min: 0.005
      max: 0.02
    
    take_profit:
      type: "auction_based"
      multiplier: 2.5
      min: 0.01
      max: 0.05

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for auction trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/auction_process.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    debugging: false
