# Copyright © 2026 NEXUS QUANTUM LTD - All Rights Reserved
# ============================================================================
#
# Description: Complete Bayesian configuration for swing trading bot
# Framework: Bayesian Inference - Probabilistic Decision Making
# Version: 3.0.0
#
# The Bayesian configuration enables the bot to make probabilistic trading
# decisions using Bayesian inference, incorporating prior knowledge and
# updating beliefs based on new evidence.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
bayesian:
  enabled: true
  version: "3.0.0"
  description: "Bayesian Analysis for swing trading"
  
  # Bayesian methods
  methods:
    - "naive_bayes"
    - "gaussian_process"
    - "bayesian_optimization"
    - "bayesian_inference"
    - "bayesian_network"
    - "variational_inference"
  
  default_method: "bayesian_inference"
  
  # Priors
  priors:
    - "uniform"
    - "normal"
    - "beta"
    - "gamma"
    - "dirichlet"
    - "custom"
  
  default_prior: "normal"

# ----------------------------------------------------------------------------
# Naive Bayes
# ----------------------------------------------------------------------------
naive_bayes:
  enabled: true
  description: "Naive Bayes classifier configuration"
  
  # Parameters
  parameters:
    feature_types:
      - "continuous"
      - "categorical"
      - "binary"
    smoothing: 1.0
    prior_type: "uniform"
    update_interval: 50  # bars
  
  # Features
  features:
    - "price_momentum"
    - "volume_ratio"
    - "rsi"
    - "macd"
    - "volatility"
    - "trend_strength"
  
  # Classes
  classes:
    - "buy"
    - "sell"
    - "hold"
  
  # Priors
  priors:
    buy: 0.33
    sell: 0.33
    hold: 0.34
  
  # Thresholds
  thresholds:
    min_confidence: 0.6
    max_confidence: 0.9
    decision_threshold: 0.5

# ----------------------------------------------------------------------------
# Gaussian Process
# ----------------------------------------------------------------------------
gaussian_process:
  enabled: true
  description: "Gaussian Process configuration"
  
  # Parameters
  parameters:
    kernel_type: "rbf"
    length_scale: 1.0
    variance: 1.0
    noise: 0.1
    optimization_iterations: 100
    update_interval: 50  # bars
  
  # Kernels
  kernels:
    - "rbf"
    - "matern"
    - "rational_quadratic"
    - "periodic"
    - "white_noise"
  
  default_kernel: "rbf"
  
  # Prediction
  prediction:
    confidence_interval: 0.95
    max_predictions: 10
    prediction_horizon: 5  # bars

# ----------------------------------------------------------------------------
# Bayesian Optimization
# ----------------------------------------------------------------------------
bayesian_optimization:
  enabled: true
  description: "Bayesian Optimization configuration"
  
  # Parameters
  parameters:
    acquisition_function: "ei"
    exploration_rate: 0.1
    n_initial_points: 10
    n_iterations: 50
    random_state: 42
    update_interval: 100  # bars
  
  # Acquisition functions
  acquisition_functions:
    - "ei"  # Expected Improvement
    - "ucb"  # Upper Confidence Bound
    - "poi"  # Probability of Improvement
    - "mvg"  # Multi-Value Gain
  
  default_acquisition: "ei"
  
  # Optimization space
  space:
    entry_threshold: [0.3, 0.9]
    exit_threshold: [0.2, 0.8]
    stop_loss_multiplier: [1.0, 3.0]
    take_profit_multiplier: [2.0, 6.0]
    position_size: [0.001, 0.05]
  
  # Constraints
  constraints:
    max_risk: 0.02
    max_drawdown: 0.1
    min_sharpe: 0.5

# ----------------------------------------------------------------------------
# Bayesian Inference
# ----------------------------------------------------------------------------
bayesian_inference:
  enabled: true
  description: "Bayesian Inference configuration"
  
  # Parameters
  parameters:
    prior_type: "normal"
    likelihood_type: "normal"
    update_method: "sequential"
    confidence_level: 0.95
    max_iterations: 100
    convergence_threshold: 0.001
    update_interval: 20  # bars
  
  # Prior parameters
  prior:
    mean: 0.0
    variance: 1.0
    alpha: 1.0
    beta: 1.0
  
  # Likelihood parameters
  likelihood:
    mean: 0.0
    variance: 0.5
  
  # Inference types
  types:
    - "parameter_estimation"
    - "hypothesis_testing"
    - "model_comparison"
    - "prediction"
  
  default_type: "parameter_estimation"

# ----------------------------------------------------------------------------
# Bayesian Network
# ----------------------------------------------------------------------------
bayesian_network:
  enabled: true
  description: "Bayesian Network configuration"
  
  # Parameters
  parameters:
    structure: "dag"
    learning_method: "score_based"
    scoring_function: "bic"
    max_parents: 3
    update_interval: 100  # bars
  
  # Nodes
  nodes:
    - "price"
    - "volume"
    - "momentum"
    - "volatility"
    - "trend"
    - "signal"
    - "trade"
  
  # Edges
  edges:
    - ["price", "momentum"]
    - ["price", "volatility"]
    - ["volume", "momentum"]
    - ["volume", "volatility"]
    - ["momentum", "trend"]
    - ["volatility", "trend"]
    - ["trend", "signal"]
    - ["signal", "trade"]
  
  # Conditional probability tables
  cpts:
    price:
      states: ["up", "down", "sideways"]
      probabilities: [0.33, 0.33, 0.34]
    
    volume:
      states: ["high", "medium", "low"]
      probabilities: [0.33, 0.33, 0.34]
    
    momentum:
      states: ["positive", "negative", "neutral"]
      parents: ["price"]
      probabilities: {
        "price=up": [0.6, 0.2, 0.2],
        "price=down": [0.2, 0.6, 0.2],
        "price=sideways": [0.33, 0.33, 0.34]
      }

# ----------------------------------------------------------------------------
# Variational Inference
# ----------------------------------------------------------------------------
variational_inference:
  enabled: true
  description: "Variational Inference configuration"
  
  # Parameters
  parameters:
    family: "mean_field"
    optimizer: "adam"
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    convergence_threshold: 0.001
    update_interval: 100  # bars
  
  # Variational families
  families:
    - "mean_field"
    - "full_rank"
    - "structured"
    - "normalizing_flow"
  
  default_family: "mean_field"
  
  # Inference types
  types:
    - "posterior_approximation"
    - "model_selection"
    - "prediction"
  
  default_type: "posterior_approximation"

# ----------------------------------------------------------------------------
# Bayesian Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Bayesian-based trading signals"
  
  # Signal types
  types:
    bayesian_buy:
      description: "Bayesian buy signal"
      conditions:
        - "posterior_probability_>_0.7"
        - "confidence_interval_positive"
        - "expected_value_positive"
      confidence: 0.8
    
    bayesian_sell:
      description: "Bayesian sell signal"
      conditions:
        - "posterior_probability_>_0.7"
        - "confidence_interval_negative"
        - "expected_value_negative"
      confidence: 0.8
    
    bayesian_hold:
      description: "Bayesian hold signal"
      conditions:
        - "posterior_probability_<_0.6"
        - "confidence_interval_uncertain"
        - "expected_value_neutral"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for Bayesian trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Bayesian risk
    bayesian_risk:
      enabled: true
      confidence_level: 0.95
      value_at_risk: true
      expected_shortfall: true
  
  # Stop loss
  stop_loss:
    enabled: true
    type: "bayesian"
    threshold: 0.95
    update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for Bayesian trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
    - "calibration_score"
    - "brier_score"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/bayesian_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    inference: true
    debugging: false
