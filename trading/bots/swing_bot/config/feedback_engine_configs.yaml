# feedback_engine_configs.yaml
# Configuration complète pour le moteur de feedback dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 730
  min_data_points: 100
  max_data_points: 100000
  feedback_engine_version: "4.0.0"
  environment: "production"

# Types de moteurs de feedback
engine_types:
  performance_engine:
    enabled: true
    description: "Performance Feedback Engine"
    metrics:
      - "win_rate"
      - "profit_factor"
      - "sharpe_ratio"
      - "sortino_ratio"
      - "calmar_ratio"
    update_frequency_seconds: 60
    feedback_weight: 0.30
    improvement_threshold: 0.05
  risk_engine:
    enabled: true
    description: "Risk Feedback Engine"
    metrics:
      - "max_drawdown"
      - "var_95"
      - "cvar_95"
      - "volatility"
      - "beta"
    update_frequency_seconds: 60
    feedback_weight: 0.25
    improvement_threshold: 0.05
  execution_engine:
    enabled: true
    description: "Execution Feedback Engine"
    metrics:
      - "slippage"
      - "market_impact"
      - "execution_speed"
      - "fill_rate"
      - "execution_quality"
    update_frequency_seconds: 60
    feedback_weight: 0.20
    improvement_threshold: 0.05
  quality_engine:
    enabled: true
    description: "Quality Feedback Engine"
    metrics:
      - "accuracy"
      - "precision"
      - "recall"
      - "f1_score"
      - "auc"
    update_frequency_seconds: 60
    feedback_weight: 0.15
    improvement_threshold: 0.05
  innovation_engine:
    enabled: true
    description: "Innovation Feedback Engine"
    metrics:
      - "novelty"
      - "creativity"
      - "adaptability"
      - "evolution_rate"
      - "learning_rate"
    update_frequency_seconds: 60
    feedback_weight: 0.10
    improvement_threshold: 0.05
  composite_engine:
    enabled: true
    description: "Composite Feedback Engine"
    engines:
      - "performance_engine"
      - "risk_engine"
      - "execution_engine"
      - "quality_engine"
      - "innovation_engine"
    engine_weights:
      performance_engine: 0.30
      risk_engine: 0.25
      execution_engine: 0.20
      quality_engine: 0.15
      innovation_engine: 0.10
    update_frequency_seconds: 60

# Algorithmes de feedback
algorithms:
  positive_reinforcement:
    enabled: true
    method: "gradient_ascent"
    learning_rate: 0.001
    momentum: 0.9
    weight_decay: 0.0001
    batch_size: 32
    epochs: 100
    random_state: 42
  negative_correction:
    enabled: true
    method: "gradient_descent"
    learning_rate: 0.001
    momentum: 0.9
    weight_decay: 0.0001
    batch_size: 32
    epochs: 100
    random_state: 42
  adaptive_learning:
    enabled: true
    method: "reinforcement_learning"
    learning_rate: 0.001
    discount_factor: 0.95
    exploration_rate: 0.1
    exploration_decay: 0.995
    min_exploration_rate: 0.01
    batch_size: 32
    memory_size: 10000
    random_state: 42
  ensemble_feedback:
    enabled: true
    method: "ensemble"
    feedback_methods:
      - "positive_reinforcement"
      - "negative_correction"
      - "adaptive_learning"
    ensemble_weights:
      - 0.4
      - 0.3
      - 0.3
    update_frequency_seconds: 60

# Mécanismes de feedback
feedback_mechanisms:
  signal_generation:
    enabled: true
    signal_types:
      - "performance_improvement"
      - "performance_decline"
      - "risk_reduction"
      - "risk_increase"
      - "quality_improvement"
      - "quality_decline"
    signal_threshold: 0.05
    confidence_threshold: 0.7
  signal_validation:
    enabled: true
    validation_method: "cross_validation"
    n_folds: 5
    validation_metrics:
      - "accuracy"
      - "precision"
      - "recall"
      - "f1_score"
    confidence_threshold: 0.95
  signal_application:
    enabled: true
    application_method: "weighted_update"
    update_frequency_seconds: 60
    max_update_percent: 10.0
    min_update_percent: 0.5

# Stratégies de feedback
feedback_strategies:
  immediate_feedback:
    enabled: true
    description: "Immediate Feedback"
    response_time_seconds: 1
    update_frequency_seconds: 5
    feedback_intensity: 0.5
  delayed_feedback:
    enabled: true
    description: "Delayed Feedback"
    delay_seconds: 60
    update_frequency_seconds: 300
    feedback_intensity: 0.7
  cumulative_feedback:
    enabled: true
    description: "Cumulative Feedback"
    accumulation_window: 100
    update_frequency_seconds: 600
    feedback_intensity: 0.9
  adaptive_feedback:
    enabled: true
    description: "Adaptive Feedback"
    adaptation_method: "reinforcement_learning"
    learning_rate: 0.001
    discount_factor: 0.95
    exploration_rate: 0.1
    feedback_intensity: 0.6

# Analyse des feedbacks
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_feedback_effectiveness: true
    compute_feedback_efficiency: true
    compute_feedback_distribution: true
    compute_feedback_patterns: true
    compute_feedback_cycles: true
    compute_feedback_correlation: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous_feedback: true
    compute_moving_average_feedback: true
    compute_exponential_feedback: true
    compute_weighted_feedback: true
    compute_feedback_velocity: true
    compute_feedback_acceleration: true
  predictive:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "xgboost"
      - "lightgbm"
      - "random_forest"
    features:
      - "feedback_performance"
      - "feedback_risk"
      - "feedback_execution"
      - "feedback_quality"
      - "feedback_innovation"
      - "feedback_velocity"
      - "feedback_acceleration"
      - "performance_score"
      - "risk_score"
      - "execution_score"
      - "quality_score"
      - "innovation_score"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_threshold: 0.7
    retrain_frequency_hours: 24

# Alertes et notifications
alerts:
  feedback_improvement:
    enabled: true
    threshold: 0.05
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "success"
  feedback_decline:
    enabled: true
    threshold: 0.05
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "critical"
  feedback_breakthrough:
    enabled: true
    threshold: 0.1
    channels:
      - "telegram"
      - "push_notification"
    severity: "success"
  feedback_stagnation:
    enabled: true
    threshold: 0.02
    channels:
      - "email"
      - "telegram"
    severity: "warning"
  feedback_anomaly:
    enabled: true
    threshold: 0.2
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "critical"

# Actions automatiques
auto_actions:
  feedback_implementation:
    enabled: true
    action_types:
      - "adjust_parameters"
      - "modify_strategy"
      - "optimize_models"
      - "improve_execution"
      - "enhance_quality"
    implementation_factor: 0.1
    max_implementation_percent: 20.0
    action_frequency_seconds: 60
  feedback_optimization:
    enabled: true
    action_types:
      - "rebalance_weights"
      - "adjust_learning_rate"
      - "modify_adaptation"
      - "enhance_feedback"
      - "optimize_signals"
    optimization_factor: 0.1
    max_optimization_percent: 15.0
    action_frequency_seconds: 300
  feedback_correction:
    enabled: true
    action_types:
      - "correct_errors"
      - "adjust_deviations"
      - "reset_parameters"
      - "recalibrate_models"
      - "fix_signals"
    correction_factor: 0.1
    max_correction_percent: 10.0
    action_frequency_seconds: 600

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "feedback_performance"
      - "feedback_risk"
      - "feedback_execution"
      - "feedback_quality"
      - "feedback_innovation"
      - "feedback_velocity"
      - "feedback_acceleration"
      - "feedback_effectiveness"
      - "feedback_efficiency"
      - "feedback_significance"
      - "feedback_improvement"
      - "feedback_anomaly_score"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "feedback_score_chart"
      - "feedback_analysis"
      - "feedback_velocity"
      - "feedback_acceleration"
      - "feedback_distribution"
      - "feedback_effectiveness"
      - "feedback_improvement"
      - "feedback_predictive"
      - "feedback_anomaly"
      - "engine_status"

# Backtesting
backtesting:
  enabled: true
  use_historical_feedback: true
  compute_feedback_accuracy: true
  compute_improvement_effectiveness: true
  compute_optimization_effectiveness: true
  compute_correction_effectiveness: true
  compute_anomaly_detection: true
  report_metrics:
    - "feedback_accuracy"
    - "improvement_rate"
    - "optimization_effectiveness"
    - "correction_effectiveness"
    - "anomaly_detection_rate"
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"

# Configuration de la base de données
database:
  enabled: true
  table_name: "feedback_engine_metrics"
  retention_days: 730
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
      - "7d"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/feedback-engine"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "feedback_engine_alert"
    - url: "https://nexustradingia.com/api/webhooks/feedback-improvement"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "feedback_improvement"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "feedback_engine_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/feedback-engine"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: true
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/feedback-engine/current"
    - "/api/v1/feedback-engine/history"
    - "/api/v1/feedback-engine/metrics"
    - "/api/v1/feedback-engine/status"
    - "/api/v1/feedback-engine/engines"
    - "/api/v1/feedback-engine/algorithms"
    - "/api/v1/feedback-engine/mechanisms"
    - "/api/v1/feedback-engine/strategies"
    - "/api/v1/feedback-engine/forecast"
    - "/api/v1/feedback-engine/anomaly"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/feedback-engine/"
  encrypt: true
  encryption_key_id: "nexus-feedback-engine-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/feedback-engine"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_feedback_volume"
      - "low_feedback_quality"
      - "feedback_loop_failure"
      - "adaptation_failure"
      - "optimization_failure"
      - "anomaly_detection"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "engine_types.performance_engine.feedback_weight >= 0.0"
      - "engine_types.performance_engine.feedback_weight <= 1.0"
      - "engine_types.risk_engine.feedback_weight >= 0.0"
      - "engine_types.risk_engine.feedback_weight <= 1.0"
      - "engine_types.execution_engine.feedback_weight >= 0.0"
      - "engine_types.execution_engine.feedback_weight <= 1.0"
      - "engine_types.quality_engine.feedback_weight >= 0.0"
      - "engine_types.quality_engine.feedback_weight <= 1.0"
      - "engine_types.innovation_engine.feedback_weight >= 0.0"
      - "engine_types.innovation_engine.feedback_weight <= 1.0"
      - "engine_types.composite_engine.engine_weights.sum() == 1.0"
      - "algorithms.ensemble_feedback.ensemble_weights.sum() == 1.0"
      - "feedback_mechanisms.signal_generation.signal_threshold >= 0.0"
      - "feedback_mechanisms.signal_generation.signal_threshold <= 1.0"
      - "min_data_points > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "bull"
      - "bear"
      - "sideways"
      - "volatile"
      - "stable"
      - "transitional"
  regime_parameters:
    bull:
      feedback_multiplier: 1.2
      threshold_multiplier: 0.8
      reinforcement_multiplier: 1.2
      correction_multiplier: 0.8
    bear:
      feedback_multiplier: 0.8
      threshold_multiplier: 1.2
      reinforcement_multiplier: 0.8
      correction_multiplier: 1.2
    sideways:
      feedback_multiplier: 1.0
      threshold_multiplier: 1.0
      reinforcement_multiplier: 1.0
      correction_multiplier: 1.0
    volatile:
      feedback_multiplier: 0.7
      threshold_multiplier: 1.3
      reinforcement_multiplier: 0.7
      correction_multiplier: 1.3
    stable:
      feedback_multiplier: 1.0
      threshold_multiplier: 0.9
      reinforcement_multiplier: 1.1
      correction_multiplier: 0.9
    transitional:
      feedback_multiplier: 1.3
      threshold_multiplier: 1.1
      reinforcement_multiplier: 1.3
      correction_multiplier: 1.1

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      feedback_multiplier: 0.8
      threshold_multiplier: 1.2
      reinforcement_multiplier: 0.8
      correction_multiplier: 1.2
    london:
      start: "08:00"
      end: "16:00"
      feedback_multiplier: 1.2
      threshold_multiplier: 0.8
      reinforcement_multiplier: 1.2
      correction_multiplier: 0.8
    newyork:
      start: "13:00"
      end: "22:00"
      feedback_multiplier: 1.0
      threshold_multiplier: 1.0
      reinforcement_multiplier: 1.0
      correction_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      feedback_multiplier: 1.5
      threshold_multiplier: 0.7
      reinforcement_multiplier: 1.5
      correction_multiplier: 0.7

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    feedback_multiplier: 1.0
    threshold_multiplier: 1.0
    reinforcement_multiplier: 1.0
    correction_multiplier: 1.0
    feedback_weight: 0.5
    improvement_threshold: 0.05
  ETHUSDT:
    feedback_multiplier: 1.1
    threshold_multiplier: 0.9
    reinforcement_multiplier: 1.1
    correction_multiplier: 0.9
    feedback_weight: 0.5
    improvement_threshold: 0.05
  SOLUSDT:
    feedback_multiplier: 1.2
    threshold_multiplier: 0.8
    reinforcement_multiplier: 1.2
    correction_multiplier: 0.8
    feedback_weight: 0.5
    improvement_threshold: 0.05
  ADAUSDT:
    feedback_multiplier: 0.9
    threshold_multiplier: 1.1
    reinforcement_multiplier: 0.9
    correction_multiplier: 1.1
    feedback_weight: 0.5
    improvement_threshold: 0.05
  XRPUSDT:
    feedback_multiplier: 1.0
    threshold_multiplier: 1.0
    reinforcement_multiplier: 1.0
    correction_multiplier: 1.0
    feedback_weight: 0.5
    improvement_threshold: 0.05
