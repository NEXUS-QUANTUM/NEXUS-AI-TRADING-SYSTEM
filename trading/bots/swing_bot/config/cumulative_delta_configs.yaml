# ============================================================================
#
# Description: Complete Cumulative Delta configuration for swing trading bot
# Framework: Cumulative Delta Analysis - Order Flow & Market Pressure
# Version: 3.0.0
#
# The Cumulative Delta configuration enables the bot to analyze order flow
# and market pressure through cumulative delta analysis, identifying
# buying and selling pressure imbalances.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
cumulative_delta:
  enabled: true
  version: "3.0.0"
  description: "Cumulative Delta Analysis for swing trading"
  
  # Delta types
  types:
    - "bid_ask"
    - "trade"
    - "volume"
    - "imbalance"
    - "cumulative"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "15m"
  
  # Data sources
  data_sources:
    - "order_book"
    - "trades"
    - "volume"
    - "market_depth"

# ----------------------------------------------------------------------------
# Bid-Ask Delta
# ----------------------------------------------------------------------------
bid_ask_delta:
  enabled: true
  description: "Bid-Ask Delta configuration"
  
  # Parameters
  parameters:
    lookback_period: 20
    min_delta: 100
    max_delta: 10000
    delta_threshold: 0.3
    confidence_threshold: 0.7
  
  # Delta metrics
  metrics:
    bid_volume:
      enabled: true
      calculation: "sum"
      lookback_period: 10
    
    ask_volume:
      enabled: true
      calculation: "sum"
      lookback_period: 10
    
    bid_ask_imbalance:
      enabled: true
      calculation: "difference"
      lookback_period: 10
    
    bid_ask_ratio:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
  
  # Signals
  signals:
    buyer_aggression:
      description: "Buyer aggression signal"
      conditions:
        - "bid_volume_>_ask_volume"
        - "imbalance_positive"
        - "ratio_>_1.2"
        - "volume_confirmation"
      confidence: 0.75
    
    seller_aggression:
      description: "Seller aggression signal"
      conditions:
        - "ask_volume_>_bid_volume"
        - "imbalance_negative"
        - "ratio_<_0.8"
        - "volume_confirmation"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Trade Delta
# ----------------------------------------------------------------------------
trade_delta:
  enabled: true
  description: "Trade Delta configuration"
  
  # Parameters
  parameters:
    lookback_period: 20
    min_trade_size: 100
    max_trade_size: 10000
    delta_threshold: 0.3
    confidence_threshold: 0.7
  
  # Delta metrics
  metrics:
    buyer_initiated:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    seller_initiated:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    trade_imbalance:
      enabled: true
      calculation: "difference"
      lookback_period: 10
    
    trade_ratio:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
  
  # Signals
  signals:
    buyer_initiated_dominance:
      description: "Buyer initiated dominance"
      conditions:
        - "buyer_initiated_>_seller_initiated"
        - "imbalance_positive"
        - "ratio_>_1.2"
        - "volume_confirmation"
      confidence: 0.75
    
    seller_initiated_dominance:
      description: "Seller initiated dominance"
      conditions:
        - "seller_initiated_>_buyer_initiated"
        - "imbalance_negative"
        - "ratio_<_0.8"
        - "volume_confirmation"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Volume Delta
# ----------------------------------------------------------------------------
volume_delta:
  enabled: true
  description: "Volume Delta configuration"
  
  # Parameters
  parameters:
    lookback_period: 20
    min_volume: 1000
    max_volume: 100000
    delta_threshold: 0.3
    confidence_threshold: 0.7
  
  # Delta metrics
  metrics:
    up_volume:
      enabled: true
      calculation: "sum"
      lookback_period: 10
    
    down_volume:
      enabled: true
      calculation: "sum"
      lookback_period: 10
    
    volume_imbalance:
      enabled: true
      calculation: "difference"
      lookback_period: 10
    
    volume_ratio:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
  
  # Signals
  signals:
    volume_imbalance_buy:
      description: "Volume imbalance buy signal"
      conditions:
        - "up_volume_>_down_volume"
        - "imbalance_positive"
        - "ratio_>_1.2"
        - "price_confirmation"
      confidence: 0.7
    
    volume_imbalance_sell:
      description: "Volume imbalance sell signal"
      conditions:
        - "down_volume_>_up_volume"
        - "imbalance_negative"
        - "ratio_<_0.8"
        - "price_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Cumulative Delta
# ----------------------------------------------------------------------------
cumulative:
  enabled: true
  description: "Cumulative Delta configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_delta: 100
    max_delta: 10000
    delta_threshold: 0.3
    confidence_threshold: 0.7
  
  # Cumulative metrics
  metrics:
    cumulative_bid_ask:
      enabled: true
      calculation: "cumulative_sum"
      lookback_period: 50
    
    cumulative_trade:
      enabled: true
      calculation: "cumulative_sum"
      lookback_period: 50
    
    cumulative_volume:
      enabled: true
      calculation: "cumulative_sum"
      lookback_period: 50
    
    cumulative_imbalance:
      enabled: true
      calculation: "cumulative_sum"
      lookback_period: 50
  
  # Signals
  signals:
    cumulative_bullish:
      description: "Cumulative bullish signal"
      conditions:
        - "cumulative_positive"
        - "trend_increasing"
        - "volume_confirmation"
        - "price_support"
      confidence: 0.8
    
    cumulative_bearish:
      description: "Cumulative bearish signal"
      conditions:
        - "cumulative_negative"
        - "trend_decreasing"
        - "volume_confirmation"
        - "price_resistance"
      confidence: 0.8
    
    cumulative_divergence:
      description: "Cumulative divergence signal"
      conditions:
        - "cumulative_diverging_from_price"
        - "volume_confirmation"
        - "momentum_change"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Delta Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Delta-based trading signals"
  
  # Signal types
  types:
    delta_buy:
      description: "Delta buy signal"
      conditions:
        - "buyer_aggression"
        - "cumulative_bullish"
        - "volume_confirmation"
        - "price_support"
      confidence: 0.8
    
    delta_sell:
      description: "Delta sell signal"
      conditions:
        - "seller_aggression"
        - "cumulative_bearish"
        - "volume_confirmation"
        - "price_resistance"
      confidence: 0.8
    
    delta_hedge:
      description: "Delta hedge signal"
      conditions:
        - "mixed_delta_signals"
        - "uncertain_direction"
        - "volume_confirmation"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for delta trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Delta-based stop loss
    stop_loss:
      type: "delta_based"
      threshold: 0.3
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for delta trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/cumulative_delta.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    delta: true
    debugging: false
