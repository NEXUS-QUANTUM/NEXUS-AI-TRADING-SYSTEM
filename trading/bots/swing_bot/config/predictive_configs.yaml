# Swing Bot Predictive Analysis Configuration
# Predictive Analysis & Forecasting Parameters

# General Predictive Settings
predictive:
  enabled: true
  analysis_mode: "comprehensive"  # comprehensive, basic, advanced, real-time
  prediction_type: "multi_horizon"  # multi_horizon, single_horizon, probabilistic
  forecasting_method: "hybrid"  # hybrid, ml_based, statistical, ensemble
  version: "3.0.0"

# Predictive Components
components:
  enabled: true
  primary_components:
    - "price_prediction"
    - "trend_prediction"
    - "volatility_prediction"
    - "volume_prediction"
    - "momentum_prediction"
    - "reversal_prediction"
  secondary_components:
    - "support_resistance_prediction"
    - "breakout_prediction"
    - "pattern_prediction"
    - "sentiment_prediction"
    - "risk_prediction"
    - "performance_prediction"
  component_weights:
    price_prediction: 0.20
    trend_prediction: 0.15
    volatility_prediction: 0.15
    volume_prediction: 0.10
    momentum_prediction: 0.10
    reversal_prediction: 0.10
    support_resistance_prediction: 0.05
    breakout_prediction: 0.05
    pattern_prediction: 0.05
    sentiment_prediction: 0.05

# Price Prediction
price_prediction:
  enabled: true
  prediction_horizons:
    ultra_short_bars: 5
    short_term_bars: 20
    medium_term_bars: 50
    long_term_bars: 100
  prediction_models:
    - "arima"
    - "prophet"
    - "lstm"
    - "transformer"
    - "xgboost"
    - "ensemble"
  primary_model: "ensemble"
  confidence_interval: 0.95
  prediction_uncertainty: true
  feature_columns:
    - "price_history"
    - "volume_history"
    - "volatility"
    - "momentum"
    - "technical_indicators"
  model_retrain_frequency_hours: 6

# Trend Prediction
trend_prediction:
  enabled: true
  trend_indicators:
    - "adx"
    - "moving_average_crossover"
    - "linear_regression_slope"
    - "ichimoku"
    - "trend_strength"
  prediction_horizons:
    short_term_bars: 10
    medium_term_bars: 30
    long_term_bars: 60
  trend_strength_threshold: 25
  trend_direction: true
  trend_reversal_detection: true

# Volatility Prediction
volatility_prediction:
  enabled: true
  volatility_models:
    - "garch"
    - "egarch"
    - "gjr_garch"
    - "stochastic_volatility"
    - "implied_volatility"
    - "machine_learning"
  primary_model: "garch"
  prediction_horizons:
    short_term_bars: 5
    medium_term_bars: 20
    long_term_bars: 50
  confidence_interval: 0.95
  volatility_clustering: true
  leverage_effect: true

# Volume Prediction
volume_prediction:
  enabled: true
  volume_models:
    - "time_series"
    - "machine_learning"
    - "deep_learning"
    - "ensemble"
  primary_model: "ensemble"
  prediction_horizons:
    short_term_bars: 5
    medium_term_bars: 20
    long_term_bars: 50
  feature_columns:
    - "volume_history"
    - "price_history"
    - "volatility"
    - "seasonal_patterns"
  volume_spike_prediction: true
  volume_trend_prediction: true

# Momentum Prediction
momentum_prediction:
  enabled: true
  momentum_indicators:
    - "rsi"
    - "macd"
    - "stochastic"
    - "cci"
    - "momentum_oscillator"
  prediction_horizons:
    short_term_bars: 5
    medium_term_bars: 15
    long_term_bars: 30
  momentum_threshold: 0.30
  divergence_detection: true
  exhaustion_detection: true

# Reversal Prediction
reversal_prediction:
  enabled: true
  reversal_indicators:
    - "divergence"
    - "candlestick_patterns"
    - "overbought_oversold"
    - "support_resistance"
    - "exhaustion"
  prediction_horizons:
    short_term_bars: 3
    medium_term_bars: 10
    long_term_bars: 20
  reversal_confidence: 0.70
  pattern_confirmation: true

# Support/Resistance Prediction
s_r_prediction:
  enabled: true
  prediction_methods:
    - "swing_high_low"
    - "pivot_points"
    - "fibonacci"
    - "machine_learning"
  prediction_horizons:
    short_term_bars: 5
    medium_term_bars: 20
    long_term_bars: 50
  level_strength_threshold: 0.50
  breakout_prediction: true

# Breakout Prediction
breakout_prediction:
  enabled: true
  breakout_indicators:
    - "bollinger_bands"
    - "keltner_channels"
    - "donchian_channels"
    - "volume_spike"
  prediction_horizons:
    short_term_bars: 3
    medium_term_bars: 10
    long_term_bars: 20
  breakout_confidence: 0.70
  volume_confirmation: true

# Pattern Prediction
pattern_prediction:
  enabled: true
  pattern_types:
    - "continuation_patterns"
    - "reversal_patterns"
    - "trend_patterns"
    - "consolidation_patterns"
  pattern_completion_probability: true
  pattern_target_projection: true
  pattern_confidence_threshold: 0.70

# Sentiment Prediction
sentiment_prediction:
  enabled: true
  sentiment_sources:
    - "news_sentiment"
    - "social_sentiment"
    - "market_sentiment"
    - "economic_sentiment"
  prediction_horizons:
    short_term_bars: 5
    medium_term_bars: 15
    long_term_bars: 30
  sentiment_models:
    - "finbert"
    - "custom_sentiment"
    - "ensemble_sentiment"
  sentiment_threshold: 0.30

# Risk Prediction
risk_prediction:
  enabled: true
  risk_models:
    - "var_models"
    - "expected_shortfall"
    - "drawdown_models"
    - "volatility_models"
  prediction_horizons:
    short_term_bars: 5
    medium_term_bars: 20
    long_term_bars: 50
  confidence_level: 0.95
  risk_scenarios: true

# Performance Prediction
performance_prediction:
  enabled: true
  performance_metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "win_rate"
    - "profit_factor"
  prediction_horizons:
    short_term_days: 7
    medium_term_days: 30
    long_term_days: 90
  benchmark_comparison: true

# Signal Generation
signals:
  enabled: true
  signal_types:
    - "buy_signal"
    - "sell_signal"
    - "hold_signal"
    - "strong_buy"
    - "strong_sell"
    - "neutral"
  signal_strength_calculation: "weighted_average"
  min_signal_strength: 0.60
  signal_confidence_threshold: 0.70

# Visualization
visualization:
  enabled: true
  charts:
    - "prediction_dashboard"
    - "forecast_chart"
    - "trend_prediction_chart"
    - "volatility_forecast"
    - "reversal_prediction"
    - "signal_chart"
    - "performance_chart"
  update_interval_seconds: 30
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "prediction_signal"
    - "trend_change"
    - "volatility_spike"
    - "reversal_signal"
    - "breakout_signal"
    - "pattern_detected"
    - "sentiment_change"
    - "risk_breach"
  alert_thresholds:
    signal_confidence: 0.70
    trend_change: 0.30
    volatility_spike: 2.0
    reversal_confidence: 0.70
    breakout_confidence: 0.70
    sentiment_change: 0.30
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 600

# Reporting
reporting:
  enabled: true
  report_types:
    - "prediction_summary"
    - "trend_report"
    - "volatility_report"
    - "reversal_report"
    - "performance_report"
    - "signal_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "risk@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "prediction_data"
    - "trend_data"
    - "volatility_data"
    - "signal_history"
    - "performance_metrics"
    - "alert_history"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/predictive"
  api_endpoint: "/api/v1/trading/predictive"
  dashboard_url: "http://localhost:3000/predictive"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "strategy_engine"
    - "research_platform"
