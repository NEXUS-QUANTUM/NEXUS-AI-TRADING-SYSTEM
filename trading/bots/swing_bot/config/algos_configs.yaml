#
# Description: Complete Algorithmic Trading configuration for swing trading bot
# Framework: Algorithmic Trading - Automated Strategy Execution
# Version: 3.0.0
#
# This configuration defines all algorithmic trading strategies, including
# execution algorithms, order types, and performance parameters.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
algos:
  enabled: true
  version: "3.0.0"
  description: "Algorithmic Trading for swing trading"
  
  # Algorithm types
  types:
    - "trend_following"
    - "mean_reversion"
    - "breakout"
    - "momentum"
    - "volatility"
    - "arbitrage"
    - "grid_trading"
    - "dca"
    - "martingale"
    - "pair_trading"
  
  # Execution modes
  modes:
    - "aggressive"
    - "moderate"
    - "conservative"
    - "passive"
  
  default_mode: "moderate"

# ----------------------------------------------------------------------------
# Trend Following Algorithms
# ----------------------------------------------------------------------------
trend_following:
  enabled: true
  description: "Trend Following algorithms"
  
  # Moving Average Crossover
  ma_crossover:
    enabled: true
    description: "Moving Average Crossover strategy"
    parameters:
      fast_ma_period: 9
      slow_ma_period: 21
      signal_ma_period: 9
      entry_threshold: 0.01
      exit_threshold: 0.005
    
    conditions:
      buy:
        - "fast_ma_cross_above_slow_ma"
        - "price_above_both_ma"
        - "volume_confirmation"
      sell:
        - "fast_ma_cross_below_slow_ma"
        - "price_below_both_ma"
        - "volume_confirmation"
    
    performance:
      min_win_rate: 0.45
      min_profit_factor: 1.2
      max_drawdown: 0.15
  
  # MACD Strategy
  macd:
    enabled: true
    description: "MACD strategy"
    parameters:
      fast_period: 12
      slow_period: 26
      signal_period: 9
      entry_threshold: 0.001
      exit_threshold: 0.0005
    
    conditions:
      buy:
        - "macd_cross_above_signal"
        - "macd_positive"
        - "histogram_increasing"
      sell:
        - "macd_cross_below_signal"
        - "macd_negative"
        - "histogram_decreasing"
    
    performance:
      min_win_rate: 0.45
      min_profit_factor: 1.2
      max_drawdown: 0.15
  
  # Parabolic SAR
  parabolic_sar:
    enabled: true
    description: "Parabolic SAR strategy"
    parameters:
      step: 0.02
      max_step: 0.2
      entry_threshold: 0.01
    
    conditions:
      buy:
        - "price_above_sar"
        - "sar_increasing"
        - "trend_confirmed"
      sell:
        - "price_below_sar"
        - "sar_decreasing"
        - "trend_confirmed"
    
    performance:
      min_win_rate: 0.4
      min_profit_factor: 1.15
      max_drawdown: 0.18

# ----------------------------------------------------------------------------
# Mean Reversion Algorithms
# ----------------------------------------------------------------------------
mean_reversion:
  enabled: true
  description: "Mean Reversion algorithms"
  
  # Bollinger Bands
  bollinger_bands:
    enabled: true
    description: "Bollinger Bands strategy"
    parameters:
      period: 20
      std_dev: 2
      entry_threshold: 0.01
      exit_threshold: 0.005
    
    conditions:
      buy:
        - "price_below_lower_band"
        - "price_returning_to_mean"
        - "volume_confirmation"
      sell:
        - "price_above_upper_band"
        - "price_returning_to_mean"
        - "volume_confirmation"
    
    performance:
      min_win_rate: 0.5
      min_profit_factor: 1.3
      max_drawdown: 0.12
  
  # RSI Strategy
  rsi_strategy:
    enabled: true
    description: "RSI strategy"
    parameters:
      period: 14
      overbought_threshold: 70
      oversold_threshold: 30
      entry_threshold: 0.01
    
    conditions:
      buy:
        - "rsi_below_oversold"
        - "rsi_crossing_above_30"
        - "price_confirmation"
      sell:
        - "rsi_above_overbought"
        - "rsi_crossing_below_70"
        - "price_confirmation"
    
    performance:
      min_win_rate: 0.5
      min_profit_factor: 1.3
      max_drawdown: 0.12
  
  # Mean Reversion with Z-Score
  zscore_reversion:
    enabled: true
    description: "Z-Score Mean Reversion strategy"
    parameters:
      lookback_period: 20
      zscore_entry: 2
      zscore_exit: 0.5
      min_volume: 1000
    
    conditions:
      buy:
        - "zscore_>_2"
        - "price_above_mean"
        - "volume_confirmation"
      sell:
        - "zscore_<_-2"
        - "price_below_mean"
        - "volume_confirmation"
    
    performance:
      min_win_rate: 0.5
      min_profit_factor: 1.3
      max_drawdown: 0.12

# ----------------------------------------------------------------------------
# Breakout Algorithms
# ----------------------------------------------------------------------------
breakout:
  enabled: true
  description: "Breakout algorithms"
  
  # Donchian Channels
  donchian:
    enabled: true
    description: "Donchian Channels breakout strategy"
    parameters:
      period: 20
      entry_threshold: 0.01
      exit_threshold: 0.005
    
    conditions:
      buy:
        - "price_above_upper_channel"
        - "volume_confirmation"
        - "momentum_increasing"
      sell:
        - "price_below_lower_channel"
        - "volume_confirmation"
        - "momentum_decreasing"
    
    performance:
      min_win_rate: 0.4
      min_profit_factor: 1.2
      max_drawdown: 0.18
  
  # Keltner Channels
  keltner:
    enabled: true
    description: "Keltner Channels breakout strategy"
    parameters:
      period: 20
      atr_multiplier: 2
      entry_threshold: 0.01
    
    conditions:
      buy:
        - "price_above_upper_channel"
        - "volume_confirmation"
        - "trend_increasing"
      sell:
        - "price_below_lower_channel"
        - "volume_confirmation"
        - "trend_decreasing"
    
    performance:
      min_win_rate: 0.4
      min_profit_factor: 1.2
      max_drawdown: 0.18
  
  # Pivot Point Breakout
  pivot_breakout:
    enabled: true
    description: "Pivot Point breakout strategy"
    parameters:
      lookback_period: 10
      breakout_threshold: 0.01
      volume_threshold: 1.5
    
    conditions:
      buy:
        - "price_above_pivot_high"
        - "volume_spike"
        - "breakout_confirmed"
      sell:
        - "price_below_pivot_low"
        - "volume_spike"
        - "breakout_confirmed"
    
    performance:
      min_win_rate: 0.4
      min_profit_factor: 1.2
      max_drawdown: 0.18

# ----------------------------------------------------------------------------
# Momentum Algorithms
# ----------------------------------------------------------------------------
momentum:
  enabled: true
  description: "Momentum algorithms"
  
  # Relative Strength Index
  rsi_momentum:
    enabled: true
    description: "RSI Momentum strategy"
    parameters:
      period: 14
      momentum_threshold: 50
      entry_threshold: 0.01
    
    conditions:
      buy:
        - "rsi_>_50"
        - "momentum_increasing"
        - "price_confirmation"
      sell:
        - "rsi_<_50"
        - "momentum_decreasing"
        - "price_confirmation"
    
    performance:
      min_win_rate: 0.45
      min_profit_factor: 1.2
      max_drawdown: 0.15
  
  # Stochastic Oscillator
  stochastic:
    enabled: true
    description: "Stochastic Oscillator strategy"
    parameters:
      k_period: 14
      d_period: 3
      overbought: 80
      oversold: 20
    
    conditions:
      buy:
        - "k_below_oversold"
        - "k_crossing_above_d"
        - "price_confirmation"
      sell:
        - "k_above_overbought"
        - "k_crossing_below_d"
        - "price_confirmation"
    
    performance:
      min_win_rate: 0.45
      min_profit_factor: 1.2
      max_drawdown: 0.15
  
  # Rate of Change
  roc:
    enabled: true
    description: "Rate of Change strategy"
    parameters:
      period: 10
      entry_threshold: 0.02
      exit_threshold: 0.01
    
    conditions:
      buy:
        - "roc_positive"
        - "roc_increasing"
        - "volume_confirmation"
      sell:
        - "roc_negative"
        - "roc_decreasing"
        - "volume_confirmation"
    
    performance:
      min_win_rate: 0.45
      min_profit_factor: 1.2
      max_drawdown: 0.15

# ----------------------------------------------------------------------------
# Volatility Algorithms
# ----------------------------------------------------------------------------
volatility:
  enabled: true
  description: "Volatility algorithms"
  
  # Average True Range
  atr:
    enabled: true
    description: "ATR Volatility strategy"
    parameters:
      period: 14
      multiplier: 2
      entry_threshold: 0.01
    
    conditions:
      buy:
        - "volatility_increasing"
        - "price_above_atr_band"
        - "trend_confirmed"
      sell:
        - "volatility_decreasing"
        - "price_below_atr_band"
        - "trend_confirmed"
    
    performance:
      min_win_rate: 0.45
      min_profit_factor: 1.2
      max_drawdown: 0.15
  
  # Volatility Breakout
  volatility_breakout:
    enabled: true
    description: "Volatility Breakout strategy"
    parameters:
      lookback_period: 20
      volatility_threshold: 0.02
      breakout_multiplier: 1.5
    
    conditions:
      buy:
        - "volatility_>_threshold"
        - "price_breakout_up"
        - "volume_confirmation"
      sell:
        - "volatility_>_threshold"
        - "price_breakout_down"
        - "volume_confirmation"
    
    performance:
      min_win_rate: 0.4
      min_profit_factor: 1.1
      max_drawdown: 0.2

# ----------------------------------------------------------------------------
# Grid Trading Algorithms
# ----------------------------------------------------------------------------
grid_trading:
  enabled: true
  description: "Grid Trading algorithms"
  
  # Grid parameters
  grid:
    num_levels: 10
    grid_spacing: 0.01
    max_grid_range: 0.1
    order_size: 0.001
    
    entry:
      min_price: 0.9
      max_price: 1.1
    
    exit:
      take_profit: 0.02
      stop_loss: 0.05
  
  # Grid rules
  rules:
    buy_at_support:
      description: "Buy at grid support levels"
      conditions:
        - "price_at_grid_level"
        - "support_confirmed"
    
    sell_at_resistance:
      description: "Sell at grid resistance levels"
      conditions:
        - "price_at_grid_level"
        - "resistance_confirmed"
    
    rebalance:
      description: "Rebalance grid"
      interval: 60  # minutes

# ----------------------------------------------------------------------------
# Dollar Cost Averaging
# ----------------------------------------------------------------------------
dca:
  enabled: true
  description: "Dollar Cost Averaging algorithm"
  
  # DCA parameters
  parameters:
    interval: "daily"
    amount: 100  # dollars
    max_investments: 10
    target_asset: "BTCUSDT"
    
    entry:
      price_multiplier: 0.95
      volume_threshold: 1.2
    
    exit:
      take_profit: 0.1
      stop_loss: 0.2
  
  # DCA rules
  rules:
    buy_on_dip:
      description: "Buy on price dip"
      conditions:
        - "price_below_ma50"
        - "volume_confirmation"
    
    sell_on_rally:
      description: "Sell on price rally"
      conditions:
        - "price_above_ma50"
        - "volume_confirmation"
    
    average_down:
      description: "Average down on losses"
      conditions:
        - "loss_>_5%"
        - "funds_available"

# ----------------------------------------------------------------------------
# Pair Trading Algorithms
# ----------------------------------------------------------------------------
pair_trading:
  enabled: true
  description: "Pair Trading algorithms"
  
  # Pair parameters
  parameters:
    correlation_threshold: 0.8
    lookback_period: 50
    entry_zscore: 2
    exit_zscore: 0.5
    max_position: 0.05
    min_position: 0.001
  
  # Pair selection
  selection:
    method: "correlation"
    min_correlation: 0.8
    max_correlation: 0.95
    cointegration_test: true
    p_value_threshold: 0.05
  
  # Trading rules
  rules:
    long_short:
      description: "Long one, short the other"
      conditions:
        - "zscore_>_2"
        - "correlation_maintained"
    
    exit:
      description: "Exit when zscore normalizes"
      conditions:
        - "zscore_<_0.5"
        - "profit_target_hit"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for algorithms"
  
  parameters:
    max_position: 0.1
    max_daily_loss: 0.02
    max_drawdown: 0.15
    risk_per_trade: 0.01
    
    stop_loss:
      type: "atr"
      multiplier: 1.5
      min: 0.005
      max: 0.02
    
    take_profit:
      type: "risk_reward"
      ratio: 2.5
      min: 0.01
      max: 0.05

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for algorithms"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.45
    min_profit_factor: 1.2
    min_sharpe_ratio: 0.5
    max_max_drawdown: 0.15

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/algos_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    debugging: false
