# forecast_configs.yaml
# Configuration complète pour le système de prévision dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 730
  min_data_points: 100
  max_data_points: 100000
  forecast_version: "4.0.0"
  environment: "production"

# Types de prévision
forecast_types:
  price_forecast:
    enabled: true
    description: "Price Prediction Forecast"
    horizons:
      - 1
      - 5
      - 10
      - 20
      - 50
      - 100
    confidence_interval: 95
    model_type: "ensemble"
    update_frequency_seconds: 60
  volatility_forecast:
    enabled: true
    description: "Volatility Prediction Forecast"
    horizons:
      - 1
      - 5
      - 10
      - 20
      - 50
    confidence_interval: 95
    model_type: "garch"
    update_frequency_seconds: 60
  volume_forecast:
    enabled: true
    description: "Volume Prediction Forecast"
    horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_interval: 95
    model_type: "ensemble"
    update_frequency_seconds: 60
  trend_forecast:
    enabled: true
    description: "Trend Prediction Forecast"
    horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_interval: 90
    model_type: "pattern"
    update_frequency_seconds: 60
  risk_forecast:
    enabled: true
    description: "Risk Prediction Forecast"
    horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_interval: 99
    model_type: "ensemble"
    update_frequency_seconds: 60
  sentiment_forecast:
    enabled: true
    description: "Sentiment Prediction Forecast"
    horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_interval: 90
    model_type: "nlp"
    update_frequency_seconds: 60

# Modèles de prévision
forecast_models:
  lstm:
    enabled: true
    units: 64
    layers: 2
    dropout: 0.2
    recurrent_dropout: 0.2
    activation: "tanh"
    recurrent_activation: "sigmoid"
    optimizer: "adam"
    learning_rate: 0.001
    batch_size: 32
    epochs: 50
    random_state: 42
  gru:
    enabled: true
    units: 64
    layers: 2
    dropout: 0.2
    recurrent_dropout: 0.2
    activation: "tanh"
    recurrent_activation: "sigmoid"
    optimizer: "adam"
    learning_rate: 0.001
    batch_size: 32
    epochs: 50
    random_state: 42
  transformer:
    enabled: true
    d_model: 64
    n_heads: 4
    d_ff: 128
    n_layers: 2
    dropout: 0.1
    optimizer: "adam"
    learning_rate: 0.001
    batch_size: 32
    epochs: 50
    random_state: 42
  xgboost:
    enabled: true
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    gamma: 0
    reg_alpha: 0
    reg_lambda: 1
    random_state: 42
  lightgbm:
    enabled: true
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 1
    reg_alpha: 0
    reg_lambda: 1
    random_state: 42
  prophet:
    enabled: true
    growth: "linear"
    seasonality_mode: "additive"
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: true
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10.0
    holidays_prior_scale: 10.0
  arima:
    enabled: true
    p: 2
    d: 1
    q: 2
    seasonal: true
    seasonal_p: 1
    seasonal_d: 1
    seasonal_q: 1
    seasonal_m: 12
  garch:
    enabled: true
    p: 1
    q: 1
    distribution: "normal"
    resi_corr: true

# Méthodes d'ensemble
ensemble_methods:
  averaging:
    enabled: true
    description: "Simple Averaging"
    models:
      - "lstm"
      - "gru"
      - "transformer"
      - "xgboost"
      - "lightgbm"
    weights:
      - 0.25
      - 0.20
      - 0.20
      - 0.20
      - 0.15
  weighted:
    enabled: true
    description: "Weighted Averaging"
    models:
      - "lstm"
      - "gru"
      - "transformer"
      - "xgboost"
      - "lightgbm"
    weights:
      - 0.30
      - 0.25
      - 0.20
      - 0.15
      - 0.10
  stacking:
    enabled: true
    description: "Stacking Ensemble"
    base_models:
      - "lstm"
      - "gru"
      - "transformer"
      - "xgboost"
      - "lightgbm"
    meta_model: "xgboost"
    cv_folds: 5
  boosting:
    enabled: true
    description: "Boosting Ensemble"
    base_models:
      - "xgboost"
      - "lightgbm"
    n_estimators: 100
    learning_rate: 0.1

# Paramètres de prévision
forecast_parameters:
  horizon:
    short_term:
      periods: 1
      confidence: 90
    medium_term:
      periods: 5
      confidence: 95
    long_term:
      periods: 20
      confidence: 99
  intervals:
    confidence_levels:
      - 90
      - 95
      - 99
    interval_method: "bootstrap"
    bootstrap_iterations: 1000
  validation:
    train_split: 0.8
    validation_split: 0.1
    test_split: 0.1
    random_state: 42

# Indicateurs de prévision
indicators:
  forecast_accuracy:
    enabled: true
    calculation: "mape"
    period: 14
    smoothing: 3
    threshold: 0.1
  forecast_bias:
    enabled: true
    calculation: "mean_error"
    period: 14
    smoothing: 3
    threshold: 0.05
  forecast_confidence:
    enabled: true
    calculation: "prediction_interval"
    period: 14
    smoothing: 0
    threshold: 0.7
  forecast_stability:
    enabled: true
    calculation: "variance"
    period: 20
    smoothing: 0
    threshold: 0.1
  forecast_reliability:
    enabled: true
    calculation: "hit_rate"
    period: 14
    smoothing: 0
    threshold: 0.7

# Analyse de prévision
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_forecast_accuracy: true
    compute_forecast_bias: true
    compute_forecast_distribution: true
    compute_forecast_patterns: true
    compute_forecast_cycles: true
    compute_forecast_correlation: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous_forecast: true
    compute_moving_average_forecast: true
    compute_exponential_forecast: true
    compute_weighted_forecast: true
    compute_forecast_velocity: true
    compute_forecast_acceleration: true
  comparative:
    enabled: true
    compare_to_actual: true
    compare_to_benchmark: true
    compare_to_historical: true
    compare_to_models: true

# Alertes et notifications
alerts:
  forecast_change:
    enabled: true
    threshold: 0.05
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "warning"
  forecast_accuracy_decline:
    enabled: true
    threshold: 0.1
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "critical"
  forecast_confidence_decline:
    enabled: true
    threshold: 0.1
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"
  forecast_break:
    enabled: true
    threshold: 0.1
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"

# Actions automatiques
auto_actions:
  forecast_adjustment:
    enabled: true
    action_types:
      - "adjust_parameters"
      - "retrain_models"
      - "update_weights"
      - "change_models"
    adjustment_factor: 0.1
    max_adjustment_percent: 20.0
  forecast_optimization:
    enabled: true
    action_types:
      - "rebalance_ensemble"
      - "adjust_hyperparameters"
      - "optimize_features"
      - "improve_accuracy"
    optimization_factor: 0.1
    max_optimization_percent: 15.0

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "forecast_accuracy"
      - "forecast_bias"
      - "forecast_confidence"
      - "forecast_stability"
      - "forecast_reliability"
      - "mse"
      - "rmse"
      - "mae"
      - "mape"
      - "r2_score"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "forecast_chart"
      - "forecast_accuracy"
      - "forecast_distribution"
      - "forecast_confidence"
      - "model_comparison"
      - "forecast_velocity"
      - "forecast_acceleration"

# Backtesting
backtesting:
  enabled: true
  use_historical_forecasts: true
  compute_forecast_accuracy: true
  compute_model_performance: true
  compute_ensemble_effectiveness: true
  report_metrics:
    - "forecast_accuracy"
    - "model_performance"
    - "ensemble_effectiveness"
    - "mse"
    - "rmse"
    - "mae"
    - "mape"
    - "r2_score"

# Configuration de la base de données
database:
  enabled: true
  table_name: "forecast_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/forecast"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "forecast_alert"
    - url: "https://nexustradingia.com/api/webhooks/forecast-accuracy"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "forecast_accuracy"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "forecast_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/forecast"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: true
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/forecast/current"
    - "/api/v1/forecast/history"
    - "/api/v1/forecast/metrics"
    - "/api/v1/forecast/status"
    - "/api/v1/forecast/models"
    - "/api/v1/forecast/accuracy"
    - "/api/v1/forecast/confidence"
    - "/api/v1/forecast/ensemble"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/forecast/"
  encrypt: true
  encryption_key_id: "nexus-forecast-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/forecast"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_forecast_volume"
      - "low_forecast_volume"
      - "model_retraining"
      - "ensemble_rebalancing"
      - "accuracy_validation"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "forecast_types.price_forecast.horizons[0] > 0"
      - "forecast_types.price_forecast.confidence_interval > 0"
      - "forecast_types.price_forecast.confidence_interval < 100"
      - "forecast_models.lstm.units > 0"
      - "forecast_models.lstm.layers > 0"
      - "forecast_models.prophet.yearly_seasonality in [True, False]"
      - "ensemble_methods.averaging.weights.sum() == 1.0"
      - "forecast_parameters.horizon.short_term.periods > 0"
      - "forecast_parameters.horizon.short_term.confidence > 0"
      - "forecast_parameters.horizon.short_term.confidence < 100"
      - "min_data_points > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "trending"
      - "ranging"
      - "volatile"
      - "stable"
      - "bull"
      - "bear"
  regime_parameters:
    trending:
      forecast_multiplier: 1.2
      confidence_multiplier: 1.1
      accuracy_multiplier: 1.1
    ranging:
      forecast_multiplier: 0.8
      confidence_multiplier: 0.9
      accuracy_multiplier: 0.9
    volatile:
      forecast_multiplier: 0.7
      confidence_multiplier: 0.8
      accuracy_multiplier: 0.8
    stable:
      forecast_multiplier: 1.0
      confidence_multiplier: 1.2
      accuracy_multiplier: 1.2
    bull:
      forecast_multiplier: 1.1
      confidence_multiplier: 1.0
      accuracy_multiplier: 1.0
    bear:
      forecast_multiplier: 0.9
      confidence_multiplier: 0.9
      accuracy_multiplier: 0.9

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      forecast_multiplier: 0.8
      confidence_multiplier: 0.9
      accuracy_multiplier: 0.9
    london:
      start: "08:00"
      end: "16:00"
      forecast_multiplier: 1.2
      confidence_multiplier: 1.1
      accuracy_multiplier: 1.1
    newyork:
      start: "13:00"
      end: "22:00"
      forecast_multiplier: 1.0
      confidence_multiplier: 1.0
      accuracy_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      forecast_multiplier: 1.5
      confidence_multiplier: 1.2
      accuracy_multiplier: 1.2

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    forecast_multiplier: 1.0
    confidence_multiplier: 1.0
    accuracy_multiplier: 1.0
    horizon_short: 1
    horizon_medium: 5
    horizon_long: 20
  ETHUSDT:
    forecast_multiplier: 1.1
    confidence_multiplier: 0.9
    accuracy_multiplier: 1.0
    horizon_short: 1
    horizon_medium: 5
    horizon_long: 20
  SOLUSDT:
    forecast_multiplier: 1.2
    confidence_multiplier: 0.8
    accuracy_multiplier: 0.9
    horizon_short: 1
    horizon_medium: 5
    horizon_long: 20
  ADAUSDT:
    forecast_multiplier: 0.9
    confidence_multiplier: 1.1
    accuracy_multiplier: 1.1
    horizon_short: 1
    horizon_medium: 5
    horizon_long: 20
  XRPUSDT:
    forecast_multiplier: 1.0
    confidence_multiplier: 1.0
    accuracy_multiplier: 1.0
    horizon_short: 1
    horizon_medium: 5
    horizon_long: 20
