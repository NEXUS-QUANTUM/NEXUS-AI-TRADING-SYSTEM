# Swing Bot Planning Configuration
# Strategic Planning & Execution Parameters

# General Planning Settings
planning:
  enabled: true
  planning_mode: "adaptive"  # adaptive, strategic, tactical, operational
  planning_horizon: "medium"  # short, medium, long, multi
  planning_cycle: "continuous"  # continuous, periodic, event_driven
  version: "3.0.0"

# Planning Components
components:
  enabled: true
  primary_components:
    - "goal_setting"
    - "strategy_development"
    - "resource_allocation"
    - "risk_planning"
    - "execution_planning"
    - "contingency_planning"
    - "performance_monitoring"
    - "plan_adjustment"
  secondary_components:
    - "scenario_planning"
    - "time_management"
    - "cost_optimization"
    - "resource_optimization"
    - "schedule_planning"
    - "milestone_tracking"
  component_priorities:
    goal_setting: 1
    strategy_development: 2
    resource_allocation: 3
    risk_planning: 4
    execution_planning: 5
    contingency_planning: 6
    performance_monitoring: 7
    plan_adjustment: 8

# Goal Setting
goal_setting:
  enabled: true
  goal_types:
    - "performance_goals"
    - "risk_goals"
    - "growth_goals"
    - "efficiency_goals"
    - "learning_goals"
    - "adaptation_goals"
  goal_parameters:
    target_return: 0.15
    max_drawdown: 0.10
    min_sharpe: 1.0
    min_win_rate: 0.50
    target_growth: 0.20
  goal_priorities:
    performance: 0.30
    risk: 0.25
    growth: 0.15
    efficiency: 0.15
    learning: 0.10
    adaptation: 0.05

# Strategy Development
strategy_development:
  enabled: true
  strategy_types:
    - "active"
    - "passive"
    - "hybrid"
    - "adaptive"
    - "quantitative"
    - "fundamental"
    - "technical"
  development_methods:
    - "research_based"
    - "data_driven"
    - "model_based"
    - "experience_based"
    - "hybrid"
  strategy_parameters:
    time_horizon_days: 30
    risk_tolerance: 0.50
    expected_return: 0.10
    max_exposure: 0.80

# Resource Allocation
resource_allocation:
  enabled: true
  allocation_types:
    - "capital_allocation"
    - "risk_allocation"
    - "time_allocation"
    - "attention_allocation"
    - "tool_allocation"
  allocation_methods:
    - "strategic"
    - "tactical"
    - "dynamic"
    - "optimization_based"
  allocation_parameters:
    capital_per_trade: 0.02
    max_capital_use: 0.80
    risk_per_trade: 0.02
    max_risk_exposure: 0.10
    time_per_analysis: 0.10

# Risk Planning
risk_planning:
  enabled: true
  risk_types:
    - "market_risk"
    - "liquidity_risk"
    - "operational_risk"
    - "regulatory_risk"
    - "credit_risk"
    - "systemic_risk"
  risk_parameters:
    var_limit: 0.05
    expected_shortfall: 0.07
    max_drawdown: 0.10
    max_correlation: 0.70
    risk_budget: 0.10
  risk_mitigation:
    - "diversification"
    - "hedging"
    - "position_sizing"
    - "stop_loss"
    - "limits"
    - "monitoring"

# Execution Planning
execution_planning:
  enabled: true
  execution_types:
    - "immediate"
    - "scheduled"
    - "conditional"
    - "adaptive"
    - "algorithmic"
  execution_parameters:
    timing_strategy: "market_adaptive"
    order_types: ["limit", "market", "stop"]
    execution_priority: "quality"  # speed, quality, cost
    max_slippage: 0.01
    min_execution_quality: 0.80

# Contingency Planning
contingency:
  enabled: true
  contingency_types:
    - "market_contingency"
    - "operational_contingency"
    - "risk_contingency"
    - "system_contingency"
    - "compliance_contingency"
  contingency_plans:
    - "emergency_stop"
    - "position_reduction"
    - "hedge_activation"
    - "system_switch"
    - "manual_intervention"
  activation_triggers:
    - "drawdown_threshold"
    - "var_breach"
    - "system_failure"
    - "regulatory_change"

# Performance Monitoring
performance_monitoring_plan:
  enabled: true
  monitoring_metrics:
    - "strategy_performance"
    - "execution_performance"
    - "risk_performance"
    - "resource_performance"
    - "goal_progress"
  monitoring_frequency:
    real_time: true
    hourly: true
    daily: true
    weekly: true
    monthly: true
  monitoring_actions:
    - "report_generation"
    - "alert_triggering"
    - "plan_adjustment"
    - "strategy_review"

# Plan Adjustment
plan_adjustment:
  enabled: true
  adjustment_types:
    - "strategic_adjustment"
    - "tactical_adjustment"
    - "operational_adjustment"
    - "resource_adjustment"
    - "risk_adjustment"
  adjustment_triggers:
    - "performance_deviation"
    - "market_regime_change"
    - "risk_regime_change"
    - "goal_update"
    - "new_information"
  adjustment_frequency:
    continuous: true
    triggered: true
    scheduled: true

# Scenario Planning
scenario_planning:
  enabled: true
  scenario_types:
    - "bull_case"
    - "base_case"
    - "bear_case"
    - "worst_case"
    - "best_case"
    - "black_swan"
  scenario_parameters:
    probability: true
    impact_assessment: true
    response_plans: true
    trigger_points: true

# Timeline Management
timeline:
  enabled: true
  timeline_types:
    - "strategic_plan"
    - "tactical_plan"
    - "operational_plan"
    - "execution_plan"
  timeline_periods:
    short_term_days: 7
    medium_term_days: 30
    long_term_days: 90
    strategic_term_days: 365
  milestone_tracking: true

# Cost Optimization
cost_optimization:
  enabled: true
  cost_types:
    - "execution_cost"
    - "opportunity_cost"
    - "operational_cost"
    - "risk_cost"
  optimization_methods:
    - "cost_benefit_analysis"
    - "efficiency_improvement"
    - "resource_optimization"
    - "process_optimization"
  cost_parameters:
    max_execution_cost: 0.01
    max_operational_cost: 0.05
    target_efficiency: 0.80

# Visualization
visualization:
  enabled: true
  charts:
    - "planning_dashboard"
    - "goal_tracking_chart"
    - "resource_allocation_chart"
    - "risk_planning_chart"
    - "execution_timeline"
    - "performance_vs_plan"
    - "contingency_status"
  update_interval_seconds: 60
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "goal_deviation"
    - "plan_deviation"
    - "risk_threshold_breach"
    - "contingency_trigger"
    - "performance_deviation"
    - "resource_depletion"
  alert_thresholds:
    goal_deviation: 0.10
    risk_threshold: 0.80
    performance_drop: 0.20
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600

# Reporting
reporting:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_plan_summary"
    - "weekly_plan_review"
    - "monthly_plan_report"
    - "quarterly_strategic_review"
    - "annual_planning_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "management@example.com"
    - "trading@example.com"
    - "risk@example.com"
    - "strategy@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "plan_data"
    - "goal_data"
    - "resource_data"
    - "risk_data"
    - "execution_data"
    - "contingency_data"
    - "performance_data"
    - "adjustment_data"
    - "scenario_data"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/planning"
  api_endpoint: "/api/v1/trading/planning"
  dashboard_url: "http://localhost:3000/planning"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "execution_engine"
    - "resource_management"
