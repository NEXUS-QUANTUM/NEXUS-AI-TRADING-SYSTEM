# Swing Bot Retail Trading Configuration
# Retail Trader Analysis & Trading Parameters

# General Retail Settings
retail:
  enabled: true
  analysis_mode: "comprehensive"  # comprehensive, basic, advanced, real-time
  trading_style: "retail"  # retail, institutional, hybrid
  risk_profile: "moderate"  # conservative, moderate, aggressive
  version: "3.0.0"

# Retail Components
components:
  enabled: true
  primary_components:
    - "retail_sentiment"
    - "retail_flow"
    - "retail_positioning"
    - "retail_activity"
    - "retail_patterns"
    - "retail_behavior"
  secondary_components:
    - "retail_confidence"
    - "retail_bias"
    - "retail_momentum"
    - "retail_exposure"
    - "retail_rotation"
    - "retail_concentration"
  component_weights:
    retail_sentiment: 0.20
    retail_flow: 0.15
    retail_positioning: 0.15
    retail_activity: 0.15
    retail_patterns: 0.10
    retail_behavior: 0.10
    retail_confidence: 0.10
    retail_bias: 0.05

# Retail Sentiment
sentiment:
  enabled: true
  sentiment_indicators:
    - "retail_sentiment_score"
    - "bullish_bearish_ratio"
    - "retail_confidence_index"
    - "fear_greed_index"
    - "put_call_ratio"
    - "margin_debt"
    - "short_interest"
  sentiment_sources:
    - "broker_data"
    - "survey_data"
    - "social_media"
    - "trading_platforms"
    - "forums"
  sentiment_thresholds:
    extreme_bullish: 80
    bullish: 60
    neutral: 40
    bearish: 20
    extreme_bearish: 10
  update_frequency_minutes: 15

# Retail Flow
flow:
  enabled: true
  flow_indicators:
    - "retail_net_flow"
    - "retail_buy_sell_ratio"
    - "retail_velocity"
    - "retail_momentum"
    - "retail_flow_consistency"
    - "retail_flow_concentration"
  flow_sources:
    - "order_flow"
    - "trade_flow"
    - "volume_flow"
    - "execution_flow"
  flow_thresholds:
    strong_buy: 0.30
    moderate_buy: 0.10
    neutral: 0.10
    moderate_sell: -0.10
    strong_sell: -0.30

# Retail Positioning
positioning:
  enabled: true
  positioning_indicators:
    - "retail_long_short_ratio"
    - "retail_net_exposure"
    - "retail_concentration"
    - "retail_diversification"
    - "retail_leverage"
    - "retail_margin_usage"
  positioning_sources:
    - "broker_positions"
    - "exchange_positions"
    - "regulatory_filings"
  positioning_thresholds:
    extreme_long: 80
    long: 60
    neutral: 40
    short: 20
    extreme_short: 10

# Retail Activity
activity:
  enabled: true
  activity_indicators:
    - "retail_trade_count"
    - "retail_volume_share"
    - "retail_order_count"
    - "retail_execution_speed"
    - "retail_fill_rate"
    - "retail_cancel_rate"
  activity_sources:
    - "exchange_data"
    - "broker_data"
    - "trade_data"
  activity_thresholds:
    high: 80
    moderate: 60
    low: 40
    very_low: 20

# Retail Patterns
patterns:
  enabled: true
  pattern_types:
    - "retail_buying_pattern"
    - "retail_selling_pattern"
    - "retail_chasing_pattern"
    - "retail_panic_pattern"
    - "retail_fomo_pattern"
    - "retail_dca_pattern"
    - "retail_scalp_pattern"
    - "retail_swing_pattern"
  pattern_detection_confidence: 0.70
  pattern_confirmation_bars: 3
  pattern_lookback_bars: 20

# Retail Behavior
behavior:
  enabled: true
  behavior_metrics:
    - "retail_herding"
    - "retail_contrarian"
    - "retail_momentum_chasing"
    - "retail_mean_reversion"
    - "retail_reaction_speed"
    - "retail_holding_period"
    - "retail_risk_taking"
  behavior_analysis: true
  behavior_scoring: true
  behavior_adaptation: true

# Retail Confidence
confidence:
  enabled: true
  confidence_indicators:
    - "retail_confidence_score"
    - "retail_conviction"
    - "retail_decision_speed"
    - "retail_position_size"
    - "retail_holding_duration"
  confidence_thresholds:
    high: 70
    moderate: 50
    low: 30
  confidence_update_frequency_minutes: 30

# Retail Bias
bias:
  enabled: true
  bias_indicators:
    - "retail_bullish_bias"
    - "retail_bearish_bias"
    - "retail_neutral_bias"
    - "retail_home_bias"
    - "retail_familiarity_bias"
    - "retail_recency_bias"
    - "retail_confirmation_bias"
  bias_detection: true
  bias_correction: true
  bias_adaptation: true

# Retail Signals
signals:
  enabled: true
  signal_types:
    - "retail_buy_signal"
    - "retail_sell_signal"
    - "retail_contrarian_buy"
    - "retail_contrarian_sell"
    - "retail_momentum_follow"
    - "retail_flow_signal"
  signal_strength_calculation: "weighted_average"
  min_signal_strength: 0.60
  signal_confidence_threshold: 0.70

# Trading Strategies
strategies:
  enabled: true
  retail_strategies:
    - "contrarian_retail"
    - "follow_retail"
    - "retail_flow_following"
    - "retail_pattern_trading"
    - "retail_sentiment_trading"
    - "retail_rotation_trading"
  strategy_selection: "context_based"
  strategy_confidence_threshold: 0.70
  strategy_confirmation_bars: 2

# Risk Management
risk_management:
  enabled: true
  risk_limits:
    retail_exposure: 0.20
    retail_concentration: 0.15
    retail_correlation: 0.60
  position_sizing: "risk_based"
  stop_loss_adjustment: true
  take_profit_adjustment: true

# Performance Metrics
performance:
  enabled: true
  metrics:
    - "retail_accuracy"
    - "contrarian_accuracy"
    - "signal_accuracy"
    - "win_rate"
    - "average_return"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
  evaluation_period_days: 30
  rolling_window_days: 30

# Visualization
visualization:
  enabled: true
  charts:
    - "retail_dashboard"
    - "sentiment_chart"
    - "flow_chart"
    - "positioning_chart"
    - "activity_chart"
    - "pattern_chart"
    - "signal_chart"
    - "performance_chart"
  update_interval_seconds: 30
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "retail_extreme_sentiment"
    - "retail_flow_change"
    - "retail_pattern_detected"
    - "retail_signal"
    - "retail_bias_change"
    - "retail_confidence_change"
  alert_thresholds:
    sentiment_extreme: 80
    flow_change: 0.20
    pattern_confidence: 0.70
    signal_confidence: 0.70
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_retail_summary"
    - "weekly_retail_analysis"
    - "monthly_retail_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "strategy@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "retail_data"
    - "sentiment_data"
    - "flow_data"
    - "positioning_data"
    - "activity_data"
    - "pattern_data"
    - "behavior_data"
    - "confidence_data"
    - "bias_data"
    - "signal_history"
    - "performance_metrics"
    - "alert_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/retail"
  api_endpoint: "/api/v1/trading/retail"
  dashboard_url: "http://localhost:3000/retail"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "strategy_engine"
    - "sentiment_platform"
