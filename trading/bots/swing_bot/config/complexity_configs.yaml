# ============================================================================
#
# Description: Complete Complexity configuration for swing trading bot
# Framework: Complexity Analysis - Market Structure & Dynamics
# Version: 3.0.0
#
# The Complexity configuration enables the bot to analyze and trade
# based on market complexity, including fractal dimensions, entropy,
# and other complexity metrics.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
complexity:
  enabled: true
  version: "3.0.0"
  description: "Complexity Analysis for swing trading"
  
  # Complexity methods
  methods:
    - "fractal_dimension"
    - "lyapunov_exponent"
    - "hurst_exponent"
    - "entropy"
    - "mutual_information"
    - "correlation_dimension"
    - "approximate_entropy"
    - "sample_entropy"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "1h"

# ----------------------------------------------------------------------------
# Fractal Dimension
# ----------------------------------------------------------------------------
fractal_dimension:
  enabled: true
  description: "Fractal Dimension configuration"
  
  # Parameters
  parameters:
    lookback_period: 100
    min_dimension: 1.0
    max_dimension: 2.0
    confidence_threshold: 0.7
  
  # Calculation methods
  methods:
    - "box_counting"
    - "hausdorff"
    - "correlation"
    - "information"
  
  default_method: "box_counting"
  
  # Signals
  signals:
    high_complexity:
      description: "High complexity signal"
      conditions:
        - "fractal_dimension_>_1.5"
        - "entropy_high"
        - "volume_confirmation"
      confidence: 0.7
    
    low_complexity:
      description: "Low complexity signal"
      conditions:
        - "fractal_dimension_<_1.3"
        - "entropy_low"
        - "volume_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Entropy Analysis
# ----------------------------------------------------------------------------
entropy:
  enabled: true
  description: "Entropy Analysis configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_entropy: 0.1
    max_entropy: 1.0
    confidence_threshold: 0.7
  
  # Entropy types
  types:
    - "shannon_entropy"
    - "approximate_entropy"
    - "sample_entropy"
    - "permutation_entropy"
  
  default_type: "shannon_entropy"
  
  # Signals
  signals:
    high_entropy:
      description: "High entropy signal"
      conditions:
        - "entropy_>_0.7"
        - "uncertain_behavior"
        - "volume_confirmation"
      confidence: 0.7
    
    low_entropy:
      description: "Low entropy signal"
      conditions:
        - "entropy_<_0.3"
        - "deterministic_behavior"
        - "volume_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Mutual Information
# ----------------------------------------------------------------------------
mutual_information:
  enabled: true
  description: "Mutual Information configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_mi: 0.1
    max_mi: 1.0
    confidence_threshold: 0.7
  
  # Calculation methods
  methods:
    - "kde"
    - "histogram"
    - "kernel"
  
  default_method: "kde"
  
  # Signals
  signals:
    high_mi:
      description: "High mutual information signal"
      conditions:
        - "mi_>_0.5"
        - "strong_dependence"
        - "volume_confirmation"
      confidence: 0.7
    
    low_mi:
      description: "Low mutual information signal"
      conditions:
        - "mi_<_0.2"
        - "weak_dependence"
        - "volume_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Correlation Dimension
# ----------------------------------------------------------------------------
correlation_dimension:
  enabled: true
  description: "Correlation Dimension configuration"
  
  # Parameters
  parameters:
    lookback_period: 100
    min_dimension: 1.0
    max_dimension: 2.0
    confidence_threshold: 0.7
  
  # Calculation methods
  methods:
    - "grassberger_procaccia"
    - "takens"
  
  default_method: "grassberger_procaccia"
  
  # Signals
  signals:
    high_dimension:
      description: "High dimension signal"
      conditions:
        - "dimension_>_1.5"
        - "complex_behavior"
        - "volume_confirmation"
      confidence: 0.7
    
    low_dimension:
      description: "Low dimension signal"
      conditions:
        - "dimension_<_1.3"
        - "simple_behavior"
        - "volume_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Complexity Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Complexity-based trading signals"
  
  # Signal types
  types:
    complexity_buy:
      description: "Complexity buy signal"
      conditions:
        - "low_complexity"
        - "low_entropy"
        - "high_mi"
        - "low_dimension"
      confidence: 0.75
    
    complexity_sell:
      description: "Complexity sell signal"
      conditions:
        - "high_complexity"
        - "high_entropy"
        - "low_mi"
        - "high_dimension"
      confidence: 0.75
    
    complexity_hedge:
      description: "Complexity hedge signal"
      conditions:
        - "mixed_complexity"
        - "uncertain_behavior"
        - "volume_increasing"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for complexity trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Complexity-based stop loss
    stop_loss:
      type: "complexity_based"
      threshold: 0.5
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for complexity trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/complexity_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    complexity: true
    debugging: false
