      confidence: 0.6

# ----------------------------------------------------------------------------
# Commercial Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Commercial-based trading signals"
  
  # Signal types
  types:
    commercial_buy:
      description: "Commercial buy signal"
      conditions:
        - "institutional_buying"
        - "commercial_buying"
        - "hedge_fund_buying"
      confidence: 0.85
    
    commercial_sell:
      description: "Commercial sell signal"
      conditions:
        - "institutional_selling"
        - "commercial_selling"
        - "hedge_fund_selling"
      confidence: 0.85
    
    commercial_hedge:
      description: "Commercial hedge signal"
      conditions:
        - "mixed_activity"
        - "uncertain_direction"
        - "volume_increasing"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for commercial trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Commercial-based stop loss
    stop_loss:
      type: "commercial_based"
      threshold: 0.5
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for commercial trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/commercial_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    commercial: true
    debugging: false
