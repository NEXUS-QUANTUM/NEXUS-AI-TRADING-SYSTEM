#
# Description: Complete Commercial configuration for swing trading bot
# Framework: Commercial Trading - Institutional & Commercial Analysis
# Version: 3.0.0
#
# The Commercial configuration enables the bot to analyze and trade
# based on commercial and institutional activity in the market.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
commercial:
  enabled: true
  version: "3.0.0"
  description: "Commercial Trading Analysis for swing trading"
  
  # Commercial types
  types:
    - "institutional"
    - "commercial"
    - "hedge_fund"
    - "proprietary"
    - "retail"
    - "market_maker"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "1h"

# ----------------------------------------------------------------------------
# Institutional Activity
# ----------------------------------------------------------------------------
institutional_activity:
  enabled: true
  description: "Institutional Activity configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_position_size: 100000
    max_position_size: 10000000
    activity_threshold: 0.3
    confidence_threshold: 0.7
  
  # Activity metrics
  metrics:
    institutional_volume:
      enabled: true
      calculation: "volume_weighted"
      lookback_period: 10
    
    institutional_trades:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    institutional_pressure:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
    
    institutional_net:
      enabled: true
      calculation: "difference"
      lookback_period: 10
  
  # Signals
  signals:
    institutional_buying:
      description: "Institutional buying signal"
      conditions:
        - "net_positive"
        - "pressure_>_0.5"
        - "volume_increasing"
      confidence: 0.8
    
    institutional_selling:
      description: "Institutional selling signal"
      conditions:
        - "net_negative"
        - "pressure_<_0.5"
        - "volume_increasing"
      confidence: 0.8

