# Swing Bot Sentiment Engine Configuration
# Core Sentiment Analysis & Market Psychology Parameters

# General Sentiment Engine Settings
sentiment_engine:
  enabled: true
  engine_mode: "hybrid"  # hybrid, ml_based, rule_based, ensemble
  analysis_level: "comprehensive"  # basic, intermediate, advanced, comprehensive
  processing_paradigm: "parallel"  # parallel, sequential, distributed
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "data_collector"
    - "preprocessor"
    - "sentiment_analyzer"
    - "context_analyzer"
    - "aggregator"
    - "scoring_module"
    - "signal_generator"
    - "visualization_module"
    - "reporting_module"
  module_interaction: "pipeline"  # pipeline, event_driven, message_based
  parallel_execution: true
  max_workers: 8
  pipeline_buffer_size: 10000

# Data Collector
data_collector:
  enabled: true
  data_sources:
    - "financial_news"
    - "social_media"
    - "earning_calls"
    - "regulatory_filings"
    - "analyst_reports"
    - "company_communications"
    - "market_data"
    - "economic_data"
    - "alternative_data"
  source_priorities:
    financial_news: 1
    social_media: 2
    earning_calls: 3
    regulatory_filings: 4
    analyst_reports: 5
    company_communications: 6
    market_data: 7
    economic_data: 8
    alternative_data: 9
  collection_frequency_seconds: 60
  data_retention_days: 30

# Preprocessor
preprocessor:
  enabled: true
  preprocessing_steps:
    - "text_cleaning"
    - "tokenization"
    - "stopword_removal"
    - "stemming"
    - "lemmatization"
    - "named_entity_recognition"
    - "part_of_speech_tagging"
    - "dependency_parsing"
    - "sentiment_lexicon"
    - "feature_extraction"
  language_support:
    - "en"
    - "fr"
    - "de"
    - "es"
    - "zh"
    - "ja"
  custom_dictionary: true
  domain_specific: true

# Sentiment Analyzer
sentiment_analyzer:
  enabled: true
  analysis_methods:
    - "lexicon_based"
    - "machine_learning"
    - "deep_learning"
    - "transformer_based"
    - "hybrid"
  primary_method: "transformer_based"
  secondary_method: "machine_learning"
  models:
    - "finbert"
    - "bloomberg_bert"
    - "custom_sentiment_model"
    - "lstm_sentiment"
    - "transformer_sentiment"
  model_parameters:
    finbert:
      version: "v1.0"
      confidence_threshold: 0.70
    bloomberg_bert:
      version: "v2.0"
      confidence_threshold: 0.75
    custom_sentiment_model:
      version: "v3.0"
      confidence_threshold: 0.80

# Context Analyzer
context_analyzer:
  enabled: true
  context_types:
    - "market_context"
    - "economic_context"
    - "sector_context"
    - "company_context"
    - "temporal_context"
    - "geographic_context"
  context_factors:
    - "market_regime"
    - "economic_cycle"
    - "sector_health"
    - "company_health"
    - "time_of_day"
    - "day_of_week"
    - "region_events"
  context_confidence_threshold: 0.70

# Aggregator
aggregator:
  enabled: true
  aggregation_methods:
    - "weighted_average"
    - "voting"
    - "consensus"
    - "majority"
    - "trust_based"
  primary_method: "weighted_average"
  weights:
    financial_news: 0.25
    social_media: 0.15
    earning_calls: 0.15
    regulatory_filings: 0.10
    analyst_reports: 0.10
    company_communications: 0.10
    market_data: 0.05
    economic_data: 0.05
    alternative_data: 0.05
  time_decay_factor: 0.90
  confidence_threshold: 0.70

# Scoring Module
scoring_module:
  enabled: true
  sentiment_scales:
    - "very_negative"
    - "negative"
    - "slightly_negative"
    - "neutral"
    - "slightly_positive"
    - "positive"
    - "very_positive"
  score_range: [-1.0, 1.0]
  thresholds:
    very_negative: -0.80
    negative: -0.40
    slightly_negative: -0.10
    neutral: 0.10
    slightly_positive: 0.10
    positive: 0.40
    very_positive: 0.80
  dynamic_thresholds: true
  normalization: true

# Signal Generator
signal_generator:
  enabled: true
  signal_types:
    - "sentiment_bullish"
    - "sentiment_bearish"
    - "sentiment_shift"
    - "sentiment_extreme"
    - "sentiment_divergence"
    - "sentiment_reversal"
    - "sentiment_confirmation"
  generation_rules:
    min_confidence: 0.70
    min_signal_strength: 0.60
    confirmation_required: true
    confirmation_sources: 2
  signal_priority: "high_confidence"

# Sentiment Metrics
metrics:
  enabled: true
  primary_metrics:
    - "overall_sentiment"
    - "sector_sentiment"
    - "asset_sentiment"
    - "market_sentiment"
    - "economic_sentiment"
    - "investor_sentiment"
    - "retail_sentiment"
    - "institutional_sentiment"
  secondary_metrics:
    - "sentiment_velocity"
    - "sentiment_acceleration"
    - "sentiment_divergence"
    - "sentiment_consensus"
    - "sentiment_volatility"
    - "sentiment_skew"
  metric_update_frequency_seconds: 30

# Sentiment Indicators
indicators:
  enabled: true
  primary_indicators:
    - "fear_greed_index"
    - "put_call_ratio"
    - "vix_index"
    - "margin_debt"
    - "short_interest"
    - "sentiment_surveys"
    - "news_sentiment"
    - "social_sentiment"
  secondary_indicators:
    - "institutional_sentiment"
    - "retail_sentiment"
    - "smart_money_sentiment"
    - "analyst_sentiment"
    - "insider_sentiment"
    - "arbitrage_sentiment"
  indicator_weights:
    fear_greed_index: 0.15
    put_call_ratio: 0.15
    vix_index: 0.10
    margin_debt: 0.10
    short_interest: 0.10
    sentiment_surveys: 0.10
    news_sentiment: 0.10
    social_sentiment: 0.10
    institutional_sentiment: 0.05
    retail_sentiment: 0.05

# Sentiment Scoring
scoring:
  enabled: true
  score_components:
    - "news_sentiment": 0.20
    - "social_sentiment": 0.15
    - "market_sentiment": 0.15
    - "institutional_sentiment": 0.15
    - "retail_sentiment": 0.10
    - "technical_sentiment": 0.10
    - "fundamental_sentiment": 0.10
    - "economic_sentiment": 0.05
  score_thresholds:
    extreme_bullish: 0.80
    bullish: 0.50
    neutral: 0.30
    bearish: -0.50
    extreme_bearish: -0.80

# Visualization
visualization:
  enabled: true
  charts:
    - "sentiment_dashboard"
    - "sentiment_trend_chart"
    - "sector_sentiment_chart"
    - "asset_sentiment_chart"
    - "indicator_dashboard"
    - "signal_chart"
    - "divergence_chart"
    - "correlation_chart"
  update_interval_seconds: 30
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "sentiment_extreme"
    - "sentiment_shift"
    - "sentiment_divergence"
    - "sentiment_reversal"
    - "indicator_extreme"
    - "signal_generation"
    - "correlation_break"
    - "consensus_break"
  alert_thresholds:
    sentiment_extreme: 0.80
    sentiment_shift: 0.30
    indicator_extreme: 0.90
    signal_confidence: 0.70
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_sentiment_summary"
    - "weekly_sentiment_analysis"
    - "monthly_sentiment_report"
    - "sector_sentiment_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "risk@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "sentiment_data"
    - "indicator_data"
    - "score_data"
    - "signal_history"
    - "alert_history"
    - "report_history"
    - "model_data"
    - "training_data"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/sentiment-engine"
  api_endpoint: "/api/v1/trading/sentiment-engine"
  dashboard_url: "http://localhost:3000/sentiment-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "strategy_engine"
    - "news_platform"
    - "social_media_platform"
