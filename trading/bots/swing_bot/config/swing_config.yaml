# swing_config.yaml
# Configuration principale pour Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux du bot
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 50
  max_data_points: 100000
  swing_bot_version: "4.0.0"
  environment: "production"
  base_currency: "USD"
  timezone: "UTC"

# Paramètres de trading
trading:
  enabled: true
  mode: "swing"
  timeframes:
    - "1h"
    - "4h"
    - "1d"
    - "1w"
  primary_timeframe: "4h"
  secondary_timeframe: "1d"
  tertiary_timeframe: "1h"
  max_positions: 5
  max_position_size: 10000
  min_position_size: 100
  leverage: 1.0
  max_leverage: 3.0
  margin_call_threshold: 0.5
  liquidation_threshold: 0.8

# Stratégies de swing
strategies:
  trend_following:
    enabled: true
    description: "Trend Following Strategy"
    indicators:
      - "ema_50"
      - "ema_200"
      - "macd"
      - "rsi"
    entry_conditions:
      - "price_above_ema50"
      - "price_above_ema200"
      - "macd_bullish"
      - "rsi_above_50"
    exit_conditions:
      - "price_below_ema50"
      - "price_below_ema200"
      - "macd_bearish"
      - "rsi_below_50"
    confidence_threshold: 0.6
  mean_reversion:
    enabled: true
    description: "Mean Reversion Strategy"
    indicators:
      - "bollinger_bands"
      - "rsi"
      - "stochastic"
      - "macd"
    entry_conditions:
      - "price_below_bb_lower"
      - "rsi_oversold"
      - "stochastic_oversold"
      - "macd_bullish_divergence"
    exit_conditions:
      - "price_above_bb_middle"
      - "rsi_neutral"
      - "stochastic_neutral"
      - "macd_bearish_cross"
    confidence_threshold: 0.6
  breakout:
    enabled: true
    description: "Breakout Strategy"
    indicators:
      - "support_resistance"
      - "volume"
      - "atr"
      - "trendline"
    entry_conditions:
      - "breakout_above_resistance"
      - "volume_confirmation"
      - "atr_expansion"
      - "trendline_break"
    exit_conditions:
      - "breakout_failure"
      - "volume_decline"
      - "atr_contraction"
      - "trendline_rejection"
    confidence_threshold: 0.6
  momentum:
    enabled: true
    description: "Momentum Strategy"
    indicators:
      - "momentum"
      - "rsi"
      - "macd"
      - "volume"
    entry_conditions:
      - "momentum_increasing"
      - "rsi_above_50"
      - "macd_bullish"
      - "volume_increasing"
    exit_conditions:
      - "momentum_decreasing"
      - "rsi_below_50"
      - "macd_bearish"
      - "volume_decreasing"
    confidence_threshold: 0.6
  swing_high_low:
    enabled: true
    description: "Swing High/Low Strategy"
    indicators:
      - "swing_points"
      - "fibonacci"
      - "trendline"
      - "volume"
    entry_conditions:
      - "swing_high_break"
      - "fibonacci_retracement"
      - "trendline_confirmation"
      - "volume_confirmation"
    exit_conditions:
      - "swing_low_break"
      - "fibonacci_extension"
      - "trendline_reversal"
      - "volume_decline"
    confidence_threshold: 0.6

# Gestion des risques
risk_management:
  max_drawdown: 0.20
  max_daily_loss: 0.05
  max_weekly_loss: 0.10
  max_monthly_loss: 0.15
  position_sizing:
    method: "fixed_fractional"
    risk_per_trade: 0.01
    kelly_fraction: 0.25
    max_position_percent: 0.10
  stop_loss:
    method: "volatility_based"
    atr_multiplier: 1.5
    min_stop_percent: 0.5
    max_stop_percent: 5.0
  take_profit:
    method: "risk_reward"
    risk_reward_ratio: 2.0
    min_profit_percent: 1.0
    max_profit_percent: 20.0

# Gestion de portefeuille
portfolio_management:
  allocation_method: "equal_weight"
  rebalance_frequency: "daily"
  max_concentration: 0.25
  min_diversification: 0.50
  correlation_threshold: 0.7
  sectors:
    - "cryptocurrency"
    - "technology"
    - "finance"
    - "energy"
    - "commodities"
  instruments:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "ADAUSDT"
    - "XRPUSDT"

# Analyse technique
technical_analysis:
  indicators:
    trend:
      - "ema_9"
      - "ema_20"
      - "ema_50"
      - "ema_200"
      - "sma_50"
      - "sma_200"
      - "adx"
      - "ichimoku"
    momentum:
      - "rsi"
      - "macd"
      - "stochastic"
      - "cci"
      - "williams_r"
      - "ultimate_oscillator"
    volatility:
      - "bollinger_bands"
      - "atr"
      - "keltner_channels"
      - "donchian_channels"
    volume:
      - "volume"
      - "obv"
      - "volume_rsi"
      - "volume_macd"
    patterns:
      - "double_top"
      - "double_bottom"
      - "head_and_shoulders"
      - "inverse_head_and_shoulders"
      - "triangle"
      - "flag"
      - "pennant"
      - "wedge"
  timeframe_analysis:
    enabled: true
    confirmation_timeframes:
      - "1h"
      - "4h"
      - "1d"
    confirmation_required: 2

# Entrée et sortie
entry_exit:
  entry:
    methods:
      - "market"
      - "limit"
      - "stop_limit"
    confirmation_bars: 2
    min_confidence: 0.6
    max_slippage: 0.002
  exit:
    methods:
      - "market"
      - "limit"
      - "stop_limit"
    confirmation_bars: 1
    min_confidence: 0.5
    max_slippage: 0.002

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"
      - "lstm"
    features:
      - "trend_indicators"
      - "momentum_indicators"
      - "volatility_indicators"
      - "volume_indicators"
      - "pattern_indicators"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
  adaptive_learning:
    enabled: true
    learning_rate: 0.001
    adaptation_frequency_hours: 12
    min_adaptation: 0.1
    max_adaptation: 0.5
  optimization:
    enabled: true
    optimize_parameters: true
    optimization_frequency_hours: 24
    optimization_method: "bayesian"
    optimization_iterations: 100

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "positions"
      - "pnl"
      - "win_rate"
      - "profit_factor"
      - "sharpe_ratio"
      - "max_drawdown"
      - "exposure"
      - "hedge_ratio"
      - "correlation"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "portfolio_overview"
      - "performance"
      - "risk_metrics"
      - "market_analysis"
      - "position_management"
      - "strategy_performance"

# Backtesting
backtesting:
  enabled: true
  use_historical_data: true
  compute_strategy_performance: true
  compute_risk_adjusted_returns: true
  compute_drawdown_analysis: true
  report_metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "max_drawdown"
    - "average_win_loss"

# Configuration de la base de données
database:
  enabled: true
  table_name: "swing_bot_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/swing-bot"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "swing_bot_alert"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "swing_bot_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/swing-bot"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: true
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/swing-bot/status"
    - "/api/v1/swing-bot/positions"
    - "/api/v1/swing-bot/performance"
    - "/api/v1/swing-bot/risk"
    - "/api/v1/swing-bot/strategies"
    - "/api/v1/swing-bot/parameters"
    - "/api/v1/swing-bot/backtest"
    - "/api/v1/swing-bot/forecast"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/swing-bot/"
  encrypt: true
  encryption_key_id: "nexus-swing-bot-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/swing-bot"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_volatility"
      - "low_volatility"
      - "trending_market"
      - "ranging_market"
      - "flash_crash"
      - "bull_market"
      - "bear_market"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "trading.max_positions > 0"
      - "trading.max_position_size > 0"
      - "trading.min_position_size < trading.max_position_size"
      - "trading.leverage >= 1.0"
      - "trading.max_leverage >= trading.leverage"
      - "risk_management.max_drawdown > 0"
      - "risk_management.max_drawdown <= 1.0"
      - "risk_management.position_sizing.risk_per_trade > 0"
      - "risk_management.position_sizing.risk_per_trade <= 1.0"
      - "portfolio_management.max_concentration > 0"
      - "portfolio_management.max_concentration <= 1.0"
      - "entry_exit.entry.min_confidence >= 0.0"
      - "entry_exit.entry.min_confidence <= 1.0"
      - "min_data_points > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "trending"
      - "ranging"
      - "volatile"
      - "stable"
      - "bull"
      - "bear"
      - "recovery"
      - "crisis"
  regime_parameters:
    trending:
      multiplier: 1.2
      threshold: 0.8
      risk: 0.8
      position_size: 1.2
    ranging:
      multiplier: 0.8
      threshold: 1.2
      risk: 1.0
      position_size: 1.0
    volatile:
      multiplier: 0.7
      threshold: 1.3
      risk: 1.5
      position_size: 0.7
    stable:
      multiplier: 1.0
      threshold: 0.9
      risk: 0.7
      position_size: 1.3
    bull:
      multiplier: 1.1
      threshold: 0.9
      risk: 0.9
      position_size: 1.1
    bear:
      multiplier: 0.9
      threshold: 1.1
      risk: 1.3
      position_size: 0.8
    recovery:
      multiplier: 1.0
      threshold: 1.0
      risk: 1.0
      position_size: 1.0
    crisis:
      multiplier: 0.5
      threshold: 2.0
      risk: 2.0
      position_size: 0.5

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      multiplier: 0.8
      threshold: 1.2
      risk: 1.2
      position_size: 0.8
    london:
      start: "08:00"
      end: "16:00"
      multiplier: 1.2
      threshold: 0.8
      risk: 0.8
      position_size: 1.2
    newyork:
      start: "13:00"
      end: "22:00"
      multiplier: 1.0
      threshold: 1.0
      risk: 1.0
      position_size: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      multiplier: 1.5
      threshold: 0.7
      risk: 0.7
      position_size: 1.5

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    multiplier: 1.0
    threshold: 1.0
    risk: 1.0
    position_size: 1.0
    max_position: 10000
    min_position: 100
    confidence_threshold: 0.7
  ETHUSDT:
    multiplier: 1.1
    threshold: 0.9
    risk: 1.1
    position_size: 0.9
    max_position: 8000
    min_position: 80
    confidence_threshold: 0.7
  SOLUSDT:
    multiplier: 1.2
    threshold: 0.8
    risk: 1.2
    position_size: 0.8
    max_position: 6000
    min_position: 60
    confidence_threshold: 0.7
  ADAUSDT:
    multiplier: 0.9
    threshold: 1.1
    risk: 0.9
    position_size: 1.1
    max_position: 4000
    min_position: 40
    confidence_threshold: 0.7
  XRPUSDT:
    multiplier: 1.0
    threshold: 1.0
    risk: 1.0
    position_size: 1.0
    max_position: 4000
    min_position: 40
    confidence_threshold: 0.7
