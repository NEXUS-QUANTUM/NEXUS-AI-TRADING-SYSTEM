# Swing Bot Production Configuration
# Production Environment & Deployment Parameters

# General Production Settings
production:
  enabled: true
  environment: "production"  # production, staging, development
  deployment_mode: "live"  # live, paper, simulation, hybrid
  availability_zone: "multi_zone"  # single_zone, multi_zone, multi_region
  version: "3.0.0"

# Production Components
components:
  enabled: true
  core_components:
    - "trading_engine"
    - "execution_engine"
    - "risk_engine"
    - "order_management"
    - "portfolio_management"
    - "market_data"
    - "monitoring"
    - "logging"
    - "alerting"
    - "reporting"
  support_components:
    - "backup_system"
    - "disaster_recovery"
    - "load_balancing"
    - "auto_scaling"
    - "security"
    - "compliance"
    - "audit_trail"
  component_priorities:
    trading_engine: 1
    execution_engine: 2
    risk_engine: 3
    order_management: 4
    market_data: 5
    monitoring: 6
    logging: 7
    alerting: 8

# Trading Engine
trading_engine:
  enabled: true
  engine_mode: "live"  # live, paper, simulation
  processing_mode: "real_time"  # real_time, batch, hybrid
  max_transactions_per_second: 1000
  latency_target_ms: 50
  throughput_target: 10000
  error_rate_target: 0.001

# Execution Engine
execution_engine:
  enabled: true
  execution_mode: "automated"  # automated, semi_automated, manual
  order_types:
    - "market"
    - "limit"
    - "stop"
    - "stop_limit"
    - "trailing_stop"
    - "iceberg"
  max_orders_per_second: 100
  fill_rate_target: 0.95
  slippage_control: true

# Risk Engine
risk_engine:
  enabled: true
  risk_mode: "active"  # active, passive, hybrid
  risk_metrics:
    - "var"
    - "expected_shortfall"
    - "drawdown"
    - "volatility"
    - "concentration"
  var_limit: 0.05
  drawdown_limit: 0.10
  exposure_limit: 0.80
  risk_check_frequency_ms: 100

# Order Management
order_management:
  enabled: true
  order_processing: "async"  # async, sync, hybrid
  max_pending_orders: 100
  order_timeout_seconds: 30
  cancel_on_error: true
  order_audit_trail: true

# Portfolio Management
portfolio_management:
  enabled: true
  portfolio_mode: "active"  # active, passive, hybrid
  rebalancing_frequency: "adaptive"  # adaptive, daily, weekly, monthly
  max_positions: 50
  position_limits: true
  diversification_requirements: true

# Market Data
market_data:
  enabled: true
  data_sources:
    - "primary_feed"
    - "backup_feed"
    - "alternative_feed"
  data_frequency_ms: 100
  data_quality_check: true
  data_redundancy: true
  failover_enabled: true

# Monitoring
monitoring:
  enabled: true
  monitoring_metrics:
    - "system_health"
    - "performance_metrics"
    - "trading_metrics"
    - "risk_metrics"
    - "resource_usage"
  monitoring_frequency_seconds: 10
  real_time_monitoring: true
  dashboard_integration: true

# Logging
logging:
  enabled: true
  log_level: "info"  # debug, info, warn, error, critical
  log_categories:
    - "trade_logs"
    - "system_logs"
    - "error_logs"
    - "audit_logs"
    - "performance_logs"
    - "security_logs"
  log_retention_days: 30
  log_rotation: true
  log_compression: true

# Alerting
alerting:
  enabled: true
  alert_levels:
    - "info"
    - "warning"
    - "critical"
    - "emergency"
  alert_conditions:
    - "system_failure"
    - "performance_degradation"
    - "risk_breach"
    - "error_rate_spike"
    - "latency_spike"
    - "resource_exhaustion"
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
    - "sms"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "daily_trading_report"
    - "daily_risk_report"
    - "weekly_performance_report"
    - "monthly_summary_report"
    - "quarterly_review"
    - "annual_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "risk@example.com"
    - "management@example.com"
    - "compliance@example.com"

# Backup System
backup:
  enabled: true
  backup_types:
    - "data_backup"
    - "config_backup"
    - "state_backup"
    - "model_backup"
  backup_frequency_hours: 6
  backup_retention_days: 365
  backup_compression: true
  backup_encryption: true

# Disaster Recovery
disaster_recovery:
  enabled: true
  recovery_types:
    - "data_recovery"
    - "system_recovery"
    - "application_recovery"
  rpo_minutes: 15
  rto_minutes: 60
  failover_enabled: true
  auto_failover: true
  recovery_testing: true
  recovery_testing_frequency_days: 30

# Load Balancing
load_balancing:
  enabled: true
  algorithm: "round_robin"  # round_robin, least_connections, weighted, adaptive
  health_check_enabled: true
  health_check_interval_seconds: 10
  max_connections: 1000
  connection_timeout_seconds: 30

# Auto Scaling
auto_scaling:
  enabled: true
  scaling_metrics:
    - "cpu_usage"
    - "memory_usage"
    - "request_rate"
    - "response_time"
  min_instances: 2
  max_instances: 10
  target_cpu_usage: 70
  target_memory_usage: 80
  scaling_cooldown_seconds: 300

# Security
security:
  enabled: true
  security_measures:
    - "authentication"
    - "authorization"
    - "encryption"
    - "firewall"
    - "ids_ips"
    - "anti_ddos"
    - "rate_limiting"
  security_protocols:
    - "https"
    - "wss"
    - "oauth2"
    - "jwt"
    - "tls1.3"
  security_audit_frequency_days: 7
  vulnerability_scanning: true

# Compliance
compliance:
  enabled: true
  regulatory_requirements:
    - "sec"
    - "finra"
    - "cftc"
    - "esma"
    - "fca"
    - "mas"
  compliance_checks:
    - "trade_reporting"
    - "position_limits"
    - "risk_limits"
    - "best_execution"
    - "market_manipulation"
    - "insider_trading"
  compliance_reporting: true
  audit_trail: true

# Audit Trail
audit_trail:
  enabled: true
  audit_categories:
    - "trade_audit"
    - "system_audit"
    - "user_audit"
    - "compliance_audit"
    - "security_audit"
  audit_retention_days: 1825
  audit_integrity: true
  audit_reporting: true

# Performance Optimization
performance_optimization:
  enabled: true
  optimization_areas:
    - "latency_reduction"
    - "throughput_increase"
    - "resource_optimization"
    - "cost_optimization"
  optimization_frequency_hours: 24
  performance_targets:
    latency_ms: 50
    throughput_per_second: 10000
    cpu_usage_percent: 70
    memory_usage_percent: 80

# Visualization
visualization:
  enabled: true
  charts:
    - "production_dashboard"
    - "system_health_chart"
    - "performance_chart"
    - "trading_metrics_chart"
    - "risk_metrics_chart"
    - "resource_usage_chart"
  update_interval_seconds: 10
  dashboard_integration: true
  real_time_updates: true

# Storage
storage:
  enabled: true
  storage_categories:
    - "production_data"
    - "trade_data"
    - "risk_data"
    - "log_data"
    - "backup_data"
    - "report_data"
    - "audit_data"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/production"
  api_endpoint: "/api/v1/production"
  dashboard_url: "http://localhost:3000/production"
  real_time_updates: true
  data_sync_frequency_seconds: 10
  external_systems:
    - "broker_api"
    - "market_data"
    - "reporting_system"
    - "compliance_system"
