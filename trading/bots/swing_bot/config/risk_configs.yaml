# Swing Bot Risk Management Configuration
# Risk Management & Control Parameters

# General Risk Settings
risk:
  enabled: true
  risk_level: "moderate"  # conservative, moderate, aggressive, dynamic
  risk_management_style: "active"  # active, passive, hybrid, adaptive
  risk_monitoring: "continuous"  # continuous, periodic, event_driven
  version: "3.0.0"

# Risk Components
components:
  enabled: true
  primary_components:
    - "market_risk"
    - "credit_risk"
    - "liquidity_risk"
    - "operational_risk"
    - "regulatory_risk"
    - "model_risk"
  secondary_components:
    - "concentration_risk"
    - "systemic_risk"
    - "reputation_risk"
    - "strategic_risk"
    - "compliance_risk"
    - "execution_risk"
  component_weights:
    market_risk: 0.25
    credit_risk: 0.15
    liquidity_risk: 0.15
    operational_risk: 0.15
    regulatory_risk: 0.10
    model_risk: 0.10
    concentration_risk: 0.05
    systemic_risk: 0.05

# Market Risk
market_risk:
  enabled: true
  risk_metrics:
    - "value_at_risk"
    - "expected_shortfall"
    - "maximum_drawdown"
    - "volatility"
    - "beta"
    - "correlation"
    - "tail_risk"
    - "jump_risk"
  var_confidence_level: 0.95
  var_time_horizon_days: 1
  var_method: "historical"  # historical, parametric, monte_carlo
  max_drawdown_limit: 0.10
  volatility_limit: 0.20
  beta_limit: 1.20

# Credit Risk
credit_risk:
  enabled: true
  credit_metrics:
    - "counterparty_risk"
    - "default_probability"
    - "credit_spread"
    - "credit_rating"
  counterparty_limit: 0.10
  default_probability_threshold: 0.05
  credit_spread_limit: 0.02
  minimum_credit_rating: "BBB"

# Liquidity Risk
liquidity_risk:
  enabled: true
  liquidity_metrics:
    - "bid_ask_spread"
    - "market_depth"
    - "volume_velocity"
    - "liquidity_ratio"
  spread_limit: 0.01
  depth_limit: 100000
  volume_velocity_threshold: 0.10
  liquidity_ratio_min: 0.20

# Operational Risk
operational_risk:
  enabled: true
  operational_metrics:
    - "system_failure_risk"
    - "human_error_risk"
    - "process_risk"
    - "technology_risk"
  risk_limits:
    system_failure: 0.05
    human_error: 0.03
    process_error: 0.02
    technology_failure: 0.04
  mitigation_measures:
    - "redundant_systems"
    - "backup_procedures"
    - "training_programs"
    - "process_controls"

# Regulatory Risk
regulatory_risk:
  enabled: true
  regulatory_metrics:
    - "compliance_risk"
    - "reporting_risk"
    - "legal_risk"
    - "tax_risk"
  compliance_limits:
    reporting_accuracy: 0.99
    legal_compliance: 1.0
    tax_compliance: 1.0
  monitoring_frequency_hours: 24

# Model Risk
model_risk:
  enabled: true
  model_metrics:
    - "model_accuracy"
    - "model_stability"
    - "model_robustness"
    - "model_transparency"
  accuracy_threshold: 0.80
  stability_threshold: 0.90
  robustness_threshold: 0.85
  validation_frequency_days: 7

# Concentration Risk
concentration_risk:
  enabled: true
  concentration_metrics:
    - "asset_concentration"
    - "sector_concentration"
    - "region_concentration"
    - "counterparty_concentration"
  limits:
    max_asset_concentration: 0.25
    max_sector_concentration: 0.35
    max_region_concentration: 0.40
    max_counterparty_concentration: 0.10
  herfindahl_limit: 0.20

# Systemic Risk
systemic_risk:
  enabled: true
  systemic_metrics:
    - "interconnectedness"
    - "common_exposure"
    - "contagion_risk"
    - "market_impact"
  limits:
    interconnectedness_limit: 0.30
    common_exposure_limit: 0.20
    contagion_risk_limit: 0.15
    market_impact_limit: 0.05
  monitoring_frequency_hours: 6

# Risk Limits
limits:
  enabled: true
  hard_limits:
    - "max_var_breach"
    - "max_drawdown_breach"
    - "max_volatility_breach"
    - "max_concentration_breach"
    - "max_exposure_breach"
    - "max_position_breach"
    - "max_loss_breach"
  soft_limits:
    - "warning_var"
    - "warning_drawdown"
    - "warning_volatility"
    - "warning_concentration"
    - "warning_exposure"
    - "warning_position"
    - "warning_loss"
  breach_actions:
    - "alert"
    - "reduce_position"
    - "stop_trading"
    - "increase_hedge"
    - "review_strategy"

# Risk Monitoring
monitoring:
  enabled: true
  monitoring_frequency_seconds: 5
  real_time_monitoring: true
  batch_monitoring: true
  continuous_monitoring: true
  metrics:
    - "current_risk"
    - "risk_trends"
    - "risk_limits_status"
    - "risk_exceptions"
    - "risk_breaches"
  dashboard_integration: true

# Risk Reporting
reporting:
  enabled: true
  report_types:
    - "daily_risk_report"
    - "weekly_risk_analysis"
    - "monthly_risk_report"
    - "quarterly_risk_review"
    - "stress_test_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "risk@example.com"
    - "trading@example.com"
    - "management@example.com"

# Visualization
visualization:
  enabled: true
  charts:
    - "risk_dashboard"
    - "var_chart"
    - "drawdown_chart"
    - "concentration_chart"
    - "limits_status_chart"
    - "trend_chart"
  update_interval_seconds: 10
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "var_breach"
    - "drawdown_breach"
    - "concentration_breach"
    - "exposure_breach"
    - "limit_breach"
    - "volatility_spike"
    - "correlation_break"
    - "liquidity_drop"
  alert_thresholds:
    var_breach: 0.80
    drawdown_breach: 0.80
    concentration_breach: 0.80
    exposure_breach: 0.80
    volatility_spike: 2.0
    correlation_break: 0.30
    liquidity_drop: 0.30
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "sms"
  alert_cooldown_seconds: 300

# Storage
storage:
  enabled: true
  storage_categories:
    - "risk_metrics"
    - "limit_data"
    - "breach_history"
    - "alert_history"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/risk"
  api_endpoint: "/api/v1/risk"
  dashboard_url: "http://localhost:3000/risk"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "portfolio_management"
    - "compliance_system"
