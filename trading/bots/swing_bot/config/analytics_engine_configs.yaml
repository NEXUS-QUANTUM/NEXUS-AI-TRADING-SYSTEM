# trading/bots/swing_bot/config/analytics_engine_configs.yaml

# ============================================================================
# NEXUS AI TRADING SYSTEM - Swing Bot Analytics Engine Configuration
# Copyright © 2026 NEXUS QUANTUM LTD - All Rights Reserved
# ============================================================================
#
# Description: Complete Analytics Engine configuration for swing trading bot
# Framework: Advanced Analytics - Data Analysis & Visualization
# Version: 3.0.0
#
# The Analytics Engine provides comprehensive data analysis, visualization,
# and reporting capabilities for the swing trading bot.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
analytics_engine:
  enabled: true
  version: "3.0.0"
  description: "Analytics Engine for swing trading"
  
  # Analytics modes
  modes:
    - "real_time"
    - "historical"
    - "predictive"
    - "diagnostic"
    - "prescriptive"
  
  default_mode: "real_time"
  
  # Update frequencies
  frequencies:
    real_time: 60  # seconds
    intraday: 3600  # 1 hour
    daily: 86400  # 1 day
    weekly: 604800  # 1 week
  
  # Data sources
  data_sources:
    - "market_data"
    - "trading_data"
    - "performance_data"
    - "risk_data"
    - "sentiment_data"

# ----------------------------------------------------------------------------
# Performance Analytics
# ----------------------------------------------------------------------------
performance_analytics:
  enabled: true
  description: "Performance analytics configuration"
  
  # Performance metrics
  metrics:
    returns:
      - "total_return"
      - "daily_return"
      - "weekly_return"
      - "monthly_return"
      - "annual_return"
    
    risk:
      - "volatility"
      - "max_drawdown"
      - "sharpe_ratio"
      - "sortino_ratio"
      - "calmar_ratio"
      - "beta"
      - "alpha"
    
    efficiency:
      - "win_rate"
      - "profit_factor"
      - "average_trade"
      - "consecutive_wins"
      - "consecutive_losses"
      - "recovery_factor"
  
  # Performance benchmarks
  benchmarks:
    - "SPY"
    - "BTC_USD"
    - "ETH_USD"
    - "risk_free_rate"
  
  # Performance analysis
  analysis:
    rolling_windows:
      - 10
      - 20
      - 50
      - 200
    
    period_comparisons:
      - "daily"
      - "weekly"
      - "monthly"
      - "quarterly"
      - "yearly"
    
    attribution:
      enabled: true
      factors:
        - "market"
        - "sector"
        - "style"
        - "strategy"
      breakdown:
        - "by_symbol"
        - "by_strategy"
        - "by_timeframe"
        - "by_risk_level"

# ----------------------------------------------------------------------------
# Risk Analytics
# ----------------------------------------------------------------------------
risk_analytics:
  enabled: true
  description: "Risk analytics configuration"
  
  # Risk metrics
  metrics:
    var:
      confidence_levels:
        - 0.95
        - 0.99
      horizon:
        - 1  # day
        - 5  # days
        - 10  # days
    
    cvar:
      confidence_levels:
        - 0.95
        - 0.99
      horizon:
        - 1  # day
        - 5  # days
    
    stress_test:
      scenarios:
        - "market_crash_2008"
        - "covid_2020"
        - "crypto_winter_2022"
        - "flash_crash_2023"
    
    drawdown:
      lookback_periods:
        - 50
        - 100
        - 200
      max_drawdown_limits:
        - 0.05
        - 0.1
        - 0.15
  
  # Risk analysis
  analysis:
    concentration:
      enabled: true
      metrics:
        - "herfindahl_index"
        - "concentration_ratio"
        - "sector_exposure"
        - "asset_exposure"
    
    correlation:
      enabled: true
      lookback_periods:
        - 50
        - 100
        - 200
      methods:
        - "pearson"
        - "spearman"
        - "kendall"
    
    sensitivity:
      enabled: true
      factors:
        - "market"
        - "interest_rates"
        - "volatility"
        - "liquidity"

# ----------------------------------------------------------------------------
# Trading Analytics
# ----------------------------------------------------------------------------
trading_analytics:
  enabled: true
  description: "Trading analytics configuration"
  
  # Trading metrics
  metrics:
    execution:
      - "fill_rate"
      - "slippage"
      - "execution_time"
      - "order_queue_depth"
    
    strategy:
      - "strategy_performance"
      - "strategy_win_rate"
      - "strategy_profit_factor"
      - "strategy_sharpe_ratio"
    
    timing:
      - "trade_duration"
      - "entry_timing"
      - "exit_timing"
      - "time_in_market"
  
  # Trading analysis
  analysis:
    pattern_recognition:
      enabled: true
      patterns:
        - "head_and_shoulders"
        - "double_top"
        - "double_bottom"
        - "triangles"
        - "flags"
        - "pennants"
    
    trade_sequence:
      enabled: true
      lookback_period: 50
      sequence_analysis:
        - "consecutive_wins"
        - "consecutive_losses"
        - "win_loss_patterns"
    
    session_analysis:
      enabled: true
      sessions:
        - "asia"
        - "europe"
        - "americas"
      metrics:
        - "volume"
        - "volatility"
        - "returns"
        - "win_rate"

# ----------------------------------------------------------------------------
# Market Analytics
# ----------------------------------------------------------------------------
market_analytics:
  enabled: true
  description: "Market analytics configuration"
  
  # Market metrics
  metrics:
    sentiment:
      - "fear_greed_index"
      - "put_call_ratio"
      - "vix"
      - "social_sentiment"
    
    liquidity:
      - "order_book_depth"
      - "bid_ask_spread"
      - "volume"
      - "market_cap"
    
    volatility:
      - "realized_volatility"
      - "implied_volatility"
      - "volatility_skew"
      - "volatility_term_structure"
  
  # Market analysis
  analysis:
    regime_detection:
      enabled: true
      regimes:
        - "bull"
        - "bear"
        - "range"
        - "volatile"
      lookback_period: 50
    
    correlation:
      enabled: true
      assets:
        - "major_cryptos"
        - "indices"
        - "commodities"
        - "forex_pairs"
    
    seasonality:
      enabled: true
      periods:
        - "daily"
        - "weekly"
        - "monthly"
        - "quarterly"
        - "yearly"

# ----------------------------------------------------------------------------
# Predictive Analytics
# ----------------------------------------------------------------------------
predictive_analytics:
  enabled: true
  description: "Predictive analytics configuration"
  
  # Prediction models
  models:
    price_prediction:
      enabled: true
      horizon:
        - 1  # bar
        - 5  # bars
        - 10  # bars
      confidence_level: 0.7
    
    trend_prediction:
      enabled: true
      horizon:
        - 1  # bar
        - 5  # bars
      confidence_level: 0.75
    
    volatility_prediction:
      enabled: true
      horizon:
        - 1  # bar
        - 5  # bars
      confidence_level: 0.65
    
    signal_prediction:
      enabled: true
      horizon:
        - 1  # bar
        - 5  # bars
      confidence_level: 0.7
  
  # Prediction analysis
  analysis:
    accuracy:
      enabled: true
      lookback_period: 50
      metrics:
        - "mae"
        - "mse"
        - "rmse"
        - "mape"
    
    calibration:
      enabled: true
      methods:
        - "reliability_diagram"
        - "brier_score"
        - "log_loss"
    
    feature_importance:
      enabled: true
      methods:
        - "shap"
        - "lime"
        - "permutation_importance"

# ----------------------------------------------------------------------------
# Diagnostic Analytics
# ----------------------------------------------------------------------------
diagnostic_analytics:
  enabled: true
  description: "Diagnostic analytics configuration"
  
  # Diagnostic metrics
  metrics:
    system:
      - "cpu_usage"
      - "memory_usage"
      - "disk_usage"
      - "network_latency"
    
    performance:
      - "model_accuracy"
      - "prediction_latency"
      - "throughput"
      - "error_rate"
    
    data:
      - "data_quality"
      - "data_completeness"
      - "data_freshness"
      - "data_consistency"
  
  # Diagnostic analysis
  analysis:
    anomaly_detection:
      enabled: true
      methods:
        - "zscore"
        - "isolation_forest"
        - "autoencoder"
      threshold: 3
    
    root_cause:
      enabled: true
      lookback_period: 100
      methods:
        - "correlation_analysis"
        - "causal_inference"
        - "decision_trees"
    
    optimization:
      enabled: true
      methods:
        - "grid_search"
        - "bayesian_optimization"
        - "genetic_algorithm"

# ----------------------------------------------------------------------------
# Reporting
# ----------------------------------------------------------------------------
reporting:
  enabled: true
  description: "Reporting configuration"
  
  # Report types
  types:
    daily_report:
      enabled: true
      time: "23:59"
      format: "html"
      sections:
        - "performance_summary"
        - "risk_metrics"
        - "trading_activity"
        - "market_update"
    
    weekly_report:
      enabled: true
      time: "Sunday 23:59"
      format: "pdf"
      sections:
        - "performance_summary"
        - "risk_metrics"
        - "trading_activity"
        - "market_update"
        - "strategy_analysis"
    
    monthly_report:
      enabled: true
      time: "Last day of month 23:59"
      format: "pdf"
      sections:
        - "performance_summary"
        - "risk_metrics"
        - "trading_activity"
        - "market_update"
        - "strategy_analysis"
        - "forecast"
  
  # Report delivery
  delivery:
    email:
      enabled: true
      recipients:
        - "trader@nexus.com"
        - "analytics@nexus.com"
      subject: "NEXUS Swing Bot Report"
    
    slack:
      enabled: true
      webhook_url: "https://hooks.slack.com/services/..."
      channel: "#trading-reports"
    
    dashboard:
      enabled: true
      refresh_interval: 60  # seconds

# ----------------------------------------------------------------------------
# Visualization
# ----------------------------------------------------------------------------
visualization:
  enabled: true
  description: "Visualization configuration"
  
  # Chart types
  charts:
    - "candlestick"
    - "line"
    - "bar"
    - "scatter"
    - "heatmap"
    - "histogram"
    - "box"
    - "violin"
    - "treemap"
    - "sankey"
  
  # Chart settings
  settings:
    theme: "dark"
    color_palette: "nexus"
    font: "Arial"
    responsive: true
    interactive: true
    
    default_chart: "candlestick"
    default_timeframe: "1h"
    default_indicators:
      - "rsi"
      - "macd"
      - "bb"
      - "volume"
  
  # Dashboard
  dashboard:
    enabled: true
    layout: "grid"
    columns: 3
    widgets:
      - "price_chart"
      - "performance_metrics"
      - "risk_metrics"
      - "trading_activity"
      - "market_data"
      - "alerts"

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/analytics_engine.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    metrics: true
    analysis: true
    reporting: true
    errors: true
    performance: true
    debugging: false
