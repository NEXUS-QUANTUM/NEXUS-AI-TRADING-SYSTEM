# ----------------------------------------------------------------------------
# Periodic Profile
# ----------------------------------------------------------------------------
periodic_profile:
  enabled: true
  description: "Periodic volume profile configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    volume_bins: 30
    value_area_volume: 0.7
    poc_method: "highest_volume"
    min_volume: 100
    confidence_threshold: 0.7
  
  # Periodic metrics
  metrics:
    periodic_poc:
      enabled: true
      calculation: "highest_volume"
      lookback_period: 50
    
    periodic_value_area:
      enabled: true
      calculation: "cumulative_volume"
      lookback_period: 50
    
    periodic_low_volume_node:
      enabled: true
      calculation: "volume_ratio"
      lookback_period: 50
    
    periodic_high_volume_node:
      enabled: true
      calculation: "volume_ratio"
      lookback_period: 50
  
  # Signals
  signals:
    periodic_poc_support:
      description: "Periodic POC support signal"
      conditions:
        - "price_at_periodic_poc"
        - "volume_confirmation"
        - "support_confirmed"
      confidence: 0.75
    
    periodic_poc_resistance:
      description: "Periodic POC resistance signal"
      conditions:
        - "price_at_periodic_poc"
        - "volume_confirmation"
        - "resistance_confirmed"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Volume Profile Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Volume profile-based trading signals"
  
  # Signal types
  types:
    profile_buy:
      description: "Volume profile buy signal"
      conditions:
        - "poc_support"
        - "value_area_support"
        - "volume_confirmation"
        - "momentum_increasing"
      confidence: 0.8
    
    profile_sell:
      description: "Volume profile sell signal"
      conditions:
        - "poc_resistance"
        - "value_area_resistance"
        - "volume_confirmation"
        - "momentum_decreasing"
      confidence: 0.8
    
    profile_hedge:
      description: "Volume profile hedge signal"
      conditions:
        - "mixed_profile_signals"
        - "uncertain_direction"
        - "volume_confirmation"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for volume profile trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Profile-based stop loss
    stop_loss:
      type: "profile_based"
      distance: 0.01
      atr_multiplier: 1.5
      min: 0.005
      max: 0.02
    
    # Profile-based take profit
    take_profit:
      type: "profile_based"
      multiplier: 2.5
      min: 0.01
      max: 0.05

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for volume profile trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
    - "profile_accuracy"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/volume_profile.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    profile: true
    debugging: false
