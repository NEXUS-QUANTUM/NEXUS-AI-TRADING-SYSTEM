#
# Description: Complete Volume Profile configuration for swing trading bot
# Framework: Volume Profile Analysis - Market Structure & Volume Distribution
# Version: 3.0.0
#
# The Volume Profile configuration enables the bot to analyze volume
# distribution across price levels, identify key support/resistance
# levels, and make trading decisions based on volume nodes.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
volume_profile:
  enabled: true
  version: "3.0.0"
  description: "Volume Profile Analysis for swing trading"
  
  # Profile types
  types:
    - "standard"
    - "composite"
    - "session"
    - "periodic"
    - "cumulative"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "1h"

# ----------------------------------------------------------------------------
# Standard Profile
# ----------------------------------------------------------------------------
standard_profile:
  enabled: true
  description: "Standard volume profile configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    volume_bins: 30
    value_area_volume: 0.7
    poc_method: "highest_volume"
    min_volume: 100
    confidence_threshold: 0.7
  
  # Profile metrics
  metrics:
    poc:
      enabled: true
      calculation: "highest_volume"
      lookback_period: 50
    
    value_area:
      enabled: true
      calculation: "cumulative_volume"
      lookback_period: 50
    
    low_volume_node:
      enabled: true
      calculation: "volume_ratio"
      lookback_period: 50
    
    high_volume_node:
      enabled: true
      calculation: "volume_ratio"
      lookback_period: 50
  
  # Signals
  signals:
    poc_support:
      description: "POC support signal"
      conditions:
        - "price_at_poc"
        - "volume_confirmation"
        - "support_confirmed"
      confidence: 0.75
    
    poc_resistance:
      description: "POC resistance signal"
      conditions:
        - "price_at_poc"
        - "volume_confirmation"
        - "resistance_confirmed"
      confidence: 0.75
    
    value_area_breakout:
      description: "Value area breakout signal"
      conditions:
        - "price_above_value_area"
        - "volume_confirmation"
        - "momentum_increasing"
      confidence: 0.8
    
    value_area_breakdown:
      description: "Value area breakdown signal"
      conditions:
        - "price_below_value_area"
        - "volume_confirmation"
        - "momentum_decreasing"
      confidence: 0.8

# ----------------------------------------------------------------------------
# Composite Profile
# ----------------------------------------------------------------------------
composite_profile:
  enabled: true
  description: "Composite volume profile configuration"
  
  # Parameters
  parameters:
    lookback_period: 100
    volume_bins: 30
    value_area_volume: 0.7
    poc_method: "highest_volume"
    min_volume: 100
    confidence_threshold: 0.7
  
  # Composite metrics
  metrics:
    composite_poc:
      enabled: true
      calculation: "highest_volume"
      lookback_period: 100
    
    composite_value_area:
      enabled: true
      calculation: "cumulative_volume"
      lookback_period: 100
    
    composite_low_volume_node:
      enabled: true
      calculation: "volume_ratio"
      lookback_period: 100
    
    composite_high_volume_node:
      enabled: true
      calculation: "volume_ratio"
      lookback_period: 100
  
  # Signals
  signals:
    composite_poc_support:
      description: "Composite POC support signal"
      conditions:
        - "price_at_composite_poc"
        - "volume_confirmation"
        - "support_confirmed"
      confidence: 0.8
    
    composite_poc_resistance:
      description: "Composite POC resistance signal"
      conditions:
        - "price_at_composite_poc"
        - "volume_confirmation"
        - "resistance_confirmed"
      confidence: 0.8

