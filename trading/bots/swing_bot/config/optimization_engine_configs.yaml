# Swing Bot Optimization Engine Configuration
# Core Optimization Engine & Performance Tuning Parameters

# General Optimization Engine Settings
optimization_engine:
  enabled: true
  engine_mode: "autonomous"  # autonomous, supervised, hybrid, manual
  optimization_paradigm: "meta_optimization"  # meta_optimization, multi_objective, pareto
  engine_level: "advanced"  # basic, intermediate, advanced, expert
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "objective_manager"
    - "parameter_space"
    - "optimizer_selector"
    - "optimization_runner"
    - "convergence_detector"
    - "performance_evaluator"
    - "constraint_handler"
    - "pareto_manager"
    - "result_analyzer"
    - "visualization_engine"
    - "report_generator"
  module_interaction: "pipeline"  # pipeline, event_driven, message_based
  parallel_execution: true
  max_workers: 8
  pipeline_buffer_size: 10000

# Objective Manager
objective_manager:
  enabled: true
  objective_functions:
    - "maximize_sharpe_ratio"
    - "maximize_total_return"
    - "minimize_maximum_drawdown"
    - "maximize_win_rate"
    - "maximize_profit_factor"
    - "minimize_volatility"
    - "maximize_calmar_ratio"
    - "maximize_sortino_ratio"
    - "maximize_omega_ratio"
    - "minimize_risk"
    - "maximize_efficiency"
    - "maximize_diversification"
  objective_weights:
    primary: 0.70
    secondary: 0.20
    tertiary: 0.10
  multi_objective_handling: "pareto"  # pareto, weighted_sum, lexicographic, epsilon_constraint
  objective_scaling: true
  objective_normalization: true

# Parameter Space Manager
parameter_space:
  enabled: true
  parameter_types:
    continuous:
      - "momentum_fast_period": [5, 50]
      - "momentum_slow_period": [20, 200]
      - "stop_loss_percent": [0.005, 0.05]
      - "take_profit_percent": [0.01, 0.10]
      - "position_size_percent": [0.01, 0.10]
      - "bb_std_dev": [1.5, 3.0]
      - "adx_threshold": [20, 40]
    integer:
      - "rsi_period": [7, 21]
      - "bb_period": [10, 30]
      - "adx_period": [10, 20]
      - "ma_fast_period": [5, 30]
      - "ma_slow_period": [20, 100]
      - "atr_period": [10, 30]
    categorical:
      - "entry_signal_type": ["momentum", "mean_reversion", "breakout", "trend_following"]
      - "exit_signal_type": ["momentum", "mean_reversion", "trailing_stop", "fixed_target"]
      - "position_sizing_method": ["fixed", "volatility_based", "kelly_based", "risk_based"]
      - "stop_loss_type": ["fixed", "volatility_based", "trailing", "dynamic"]
  parameter_dependencies: true
  parameter_interactions: true
  constraints: true
  parameter_sampling: "latin_hypercube"  # latin_hypercube, random, grid, sobol

# Optimizer Selector
optimizer_selector:
  enabled: true
  available_optimizers:
    - "genetic_algorithm"
    - "particle_swarm"
    - "differential_evolution"
    - "bayesian_optimization"
    - "gradient_descent"
    - "simulated_annealing"
    - "ant_colony"
    - "grey_wolf_optimizer"
    - "whale_optimization"
    - "firefly_algorithm"
    - "teaching_learning_based"
    - "neural_network_optimization"
  selector_criteria:
    - "problem_type"
    - "parameter_count"
    - "objective_complexity"
    - "constraint_strictness"
    - "computation_budget"
    - "required_precision"
  dynamic_selection: true
  optimizer_switching: true
  switching_condition: "stagnation"  # stagnation, improvement, time_based
  ensemble_optimization: true

# Optimization Runner
optimization_runner:
  enabled: true
  execution_mode: "parallel"  # sequential, parallel, distributed
  max_iterations: 1000
  max_time_seconds: 3600
  population_size: 100
  generations: 50
  mutation_rate: 0.10
  crossover_rate: 0.80
  selection_method: "tournament"  # tournament, roulette, rank, steady_state
  tournament_size: 5
  elitism_rate: 0.10
  checkpoint_frequency: 10
  early_stopping: true
  resume_capability: true

# Convergence Detector
convergence_detector:
  enabled: true
  convergence_metrics:
    - "objective_improvement_rate"
    - "population_diversity"
    - "parameter_stability"
    - "standard_deviation"
    - "generation_delta"
    - "fitness_convergence"
  improvement_threshold: 0.0001
  diversity_threshold: 0.05
  stability_window: 20
  min_generations: 20
  max_generations: 100
  convergence_criteria: "multiple"  # any, all, majority, custom
  convergence_action: "stop"  # stop, continue, restart, hybrid

# Performance Evaluator
performance_evaluator:
  enabled: true
  evaluation_metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "omega_ratio"
    - "sterling_ratio"
    - "burke_ratio"
    - "martin_ratio"
    - "information_ratio"
    - "treynor_ratio"
    - "capture_ratio"
    - "win_rate"
    - "profit_factor"
    - "average_return"
    - "maximum_drawdown"
    - "recovery_factor"
    - "ulcer_index"
  evaluation_method: "cross_validation"  # cross_validation, holdout, walk_forward, bootstrap
  validation_split: 0.20
  test_split: 0.10
  cross_validation_folds: 5
  confidence_interval: 0.95
  statistical_significance: true

# Constraint Handler
constraint_handler:
  enabled: true
  constraint_types:
    hard_constraints:
      - "max_drawdown_less_than_0.15"
      - "min_sharpe_ratio_greater_than_0.50"
      - "max_position_size_less_than_0.10"
      - "min_win_rate_greater_than_0.40"
      - "max_var_less_than_0.05"
    soft_constraints:
      - "max_turnover_less_than_5.0"
      - "min_profit_factor_greater_than_1.50"
      - "max_correlation_less_than_0.70"
      - "max_concentration_less_than_0.25"
  constraint_handling: "penalty"  # penalty, rejection, repair, multi_objective
  penalty_function: "adaptive"  # adaptive, fixed, dynamic
  constraint_satisfaction: true
  constraint_prioritization: true

# Pareto Manager
pareto_manager:
  enabled: true
  pareto_front_calculation: true
  dominance_detection: true
  crowding_distance: true
  reference_point_selection: true
  visualization: true
  max_solutions: 100
  solution_selection_method: "crowding_distance"  # crowding_distance, hypervolume, r2_indicator
  preference_articulation: true
  interactive_decision_making: true

# Result Analyzer
result_analyzer:
  enabled: true
  analysis_types:
    - "parameter_sensitivity"
    - "performance_attribution"
    - "scenario_analysis"
    - "robustness_analysis"
    - "stability_analysis"
    - "comparative_analysis"
    - "statistical_analysis"
  sensitivity_method: "morris"  # morris, sobol, fast, regression
  analysis_depth: "comprehensive"  # basic, intermediate, comprehensive
  automated_insights: true
  recommendation_generation: true

# Visualization Engine
visualization_engine:
  enabled: true
  chart_types:
    - "optimization_progress"
    - "parameter_heatmap"
    - "performance_dashboard"
    - "convergence_plot"
    - "pareto_front"
    - "sensitivity_analysis"
    - "parallel_coordinates"
    - "scatter_matrix"
    - "radar_chart"
    - "violin_plot"
  update_interval_seconds: 10
  dashboard_integration: true
  real_time_updates: true
  interactive_visualizations: true
  export_capability: true

# Report Generator
report_generator:
  enabled: true
  report_types:
    - "optimization_summary"
    - "parameter_analysis"
    - "performance_evaluation"
    - "convergence_report"
    - "pareto_analysis"
    - "sensitivity_analysis"
    - "recommendation_report"
    - "executive_summary"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
    - "markdown"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "strategy@example.com"
    - "management@example.com"
  report_automation: true
  report_scheduling: true

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/optimization-engine"
  api_endpoint: "/api/v1/trading/optimization-engine"
  dashboard_url: "http://localhost:3000/optimization-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "backtesting_engine"
    - "research_platform"
    - "mlflow"
    - "kubeflow"
    - "grafana"

# Storage
storage:
  enabled: true
  storage_categories:
    - "optimization_results"
    - "parameter_sets"
    - "performance_metrics"
    - "convergence_data"
    - "pareto_solutions"
    - "sensitivity_analysis"
    - "report_history"
    - "visualization_data"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"
  backup_frequency_days: 1

# Logging
logging:
  enabled: true
  log_level: "info"  # debug, info, warn, error, critical
  log_categories:
    - "optimization"
    - "evaluation"
    - "convergence"
    - "performance"
    - "analysis"
    - "reporting"
    - "errors"
    - "system"
  log_rotation: true
  max_log_size_mb: 100
  retention_days: 30
  audit_trail: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "optimization_complete"
    - "convergence_achieved"
    - "performance_threshold_met"
    - "optimization_failure"
    - "constraint_violation"
    - "stagnation_detected"
    - "improvement_found"
    - "pareto_updated"
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600
  escalation_policy: true

# Security
security:
  enabled: true
  access_control: true
  data_encryption: true
  result_integrity: true
  audit_logging: true
  secure_storage: true
  parameter_validation: true
  user_authentication: true
  role_based_access: true
