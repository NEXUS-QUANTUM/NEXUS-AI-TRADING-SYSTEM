# Swing Bot Strategy Configuration
# Core Strategy Parameters & Configuration

# General Strategy Settings
strategy:
  enabled: true
  strategy_type: "swing"  # swing, day, position, hybrid
  strategy_mode: "adaptive"  # adaptive, fixed, dynamic, hybrid
  risk_profile: "moderate"  # conservative, moderate, aggressive, dynamic
  version: "3.0.0"

# Strategy Components
components:
  enabled: true
  primary_components:
    - "trend_following"
    - "mean_reversion"
    - "momentum"
    - "breakout"
    - "counter_trend"
    - "support_resistance"
    - "volume_analysis"
    - "price_action"
  secondary_components:
    - "sentiment_analysis"
    - "market_profile"
    - "order_flow"
    - "volatility_analysis"
    - "seasonal_patterns"
    - "cyclical_analysis"
    - "intermarket_analysis"
  component_weights:
    trend_following: 0.20
    mean_reversion: 0.15
    momentum: 0.15
    breakout: 0.10
    counter_trend: 0.10
    support_resistance: 0.10
    volume_analysis: 0.10
    price_action: 0.10

# Trend Following
trend_following:
  enabled: true
  indicators:
    - "moving_average_crossover"
    - "adx"
    - "ichimoku"
    - "parabolic_sar"
    - "linear_regression"
    - "trendline_break"
  parameters:
    fast_ma_period: 20
    slow_ma_period: 50
    adx_period: 14
    adx_threshold: 25
    ichimoku_lookback: 26
    sar_step: 0.02
    sar_max: 0.20
  entry_threshold: 0.50
  exit_threshold: 0.30

# Mean Reversion
mean_reversion:
  enabled: true
  indicators:
    - "bollinger_bands"
    - "rsi"
    - "stochastic"
    - "cci"
    - "zscore"
    - "price_to_ma_ratio"
  parameters:
    bb_period: 20
    bb_std_dev: 2.0
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
    stochastic_k: 14
    stochastic_d: 3
    cci_period: 20
    zscore_threshold: 2.0
  entry_threshold: 0.60
  exit_threshold: 0.40

# Momentum
momentum_strategy:
  enabled: true
  indicators:
    - "roc"
    - "macd"
    - "momentum_oscillator"
    - "ultimate_oscillator"
    - "williams_r"
    - "force_index"
  parameters:
    roc_period: 20
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    momentum_period: 10
    ultimate_oscillator_periods: [7, 14, 28]
    williams_r_period: 14
  entry_threshold: 0.50
  exit_threshold: 0.30

# Breakout
breakout:
  enabled: true
  indicators:
    - "donchian_channels"
    - "keltner_channels"
    - "atr"
    - "volume_breakout"
    - "pivot_breakout"
    - "resistance_breakout"
  parameters:
    donchian_period: 20
    keltner_period: 20
    keltner_multiplier: 1.5
    atr_period: 14
    volume_multiplier: 1.5
    breakout_confirmation_bars: 2
    pullback_percentage: 0.618
  entry_threshold: 0.60
  exit_threshold: 0.40

# Counter Trend
counter_trend:
  enabled: true
  indicators:
    - "rsi_divergence"
    - "macd_divergence"
    - "price_pattern_reversal"
    - "exhaustion_signals"
    - "volume_spike"
    - "sentiment_extreme"
  parameters:
    divergence_lookback: 20
    exhaustion_threshold: 0.70
    sentiment_extreme: 80
    volume_spike_threshold: 2.0
    reversal_confirmation_bars: 3
    retracement_min: 0.382
    retracement_max: 0.618
  entry_threshold: 0.60
  exit_threshold: 0.40

# Support & Resistance
support_resistance_strategy:
  enabled: true
  indicators:
    - "pivot_points"
    - "fibonacci_retracement"
    - "round_numbers"
    - "volume_profile"
    - "order_book"
    - "market_profile"
  parameters:
    pivot_timeframe: "daily"
    fib_retracement_levels: [0.236, 0.382, 0.500, 0.618, 0.786]
    round_number_increment: 0.10
    volume_profile_period: 50
    s_r_strength_threshold: 0.50
  entry_threshold: 0.60
  exit_threshold: 0.40

# Strategy Selection
selection:
  enabled: true
  selection_method: "market_adaptive"  # market_adaptive, performance_based, regime_based
  strategy_rotation: true
  rotation_frequency_bars: 20
  selection_criteria:
    - "performance_score"
    - "market_conditions"
    - "risk_environment"
    - "volatility_regime"
  top_strategies: 3
  min_strategy_performance: 0.40

# Position Sizing
position_sizing:
  enabled: true
  methods:
    - "fixed_fraction"
    - "risk_based"
    - "kelly_criterion"
    - "volatility_based"
    - "dynamic"
  primary_method: "risk_based"
  risk_per_trade: 0.02
  max_position_size: 0.05
  min_position_size: 0.01
  kelly_fraction: 0.25
  volatility_adjustment: true

# Risk Management
risk_management:
  enabled: true
  stop_loss:
    types:
      - "fixed_percent"
      - "volatility_based"
      - "atr_based"
      - "support_based"
      - "trailing"
    default_percent: 0.02
    atr_multiplier: 1.5
    trailing_activation: 0.02
    trailing_distance: 0.01
  take_profit:
    types:
      - "fixed_percent"
      - "risk_reward_ratio"
      - "target_based"
      - "trailing"
    default_percent: 0.04
    risk_reward_ratio: 2.0
    target_multiplier: 1.0
    trailing_activation: 0.02
    trailing_distance: 0.01
  risk_limits:
    max_daily_loss: 0.05
    max_drawdown: 0.15
    max_position_exposure: 0.20
    max_correlation: 0.70

# Performance Metrics
performance:
  enabled: true
  metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "win_rate"
    - "profit_factor"
    - "average_return"
    - "maximum_drawdown"
    - "recovery_factor"
    - "average_hold_time"
  evaluation_period_days: 30
  rolling_window_days: 30
  benchmark_comparison: true

# Visualization
visualization:
  enabled: true
  charts:
    - "strategy_dashboard"
    - "performance_chart"
    - "signal_chart"
    - "risk_chart"
    - "position_sizing_chart"
    - "strategy_selection_chart"
  update_interval_seconds: 10
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "entry_signal"
    - "exit_signal"
    - "stop_loss_hit"
    - "take_profit_hit"
    - "risk_limit_breach"
    - "strategy_change"
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_strategy_summary"
    - "weekly_strategy_analysis"
    - "monthly_strategy_report"
    - "performance_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "risk@example.com"
    - "strategy@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "strategy_data"
    - "signal_history"
    - "trade_history"
    - "performance_metrics"
    - "risk_metrics"
    - "alert_history"
    - "strategy_selection_data"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/strategy"
  api_endpoint: "/api/v1/trading/strategy"
  dashboard_url: "http://localhost:3000/strategy"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "order_management"
    - "research_platform"
