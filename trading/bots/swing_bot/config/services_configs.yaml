# Swing Bot Services Configuration
# Trading Services & Infrastructure Parameters

# General Services Settings
services:
  enabled: true
  service_mode: "microservices"  # microservices, monolithic, hybrid
  deployment_strategy: "docker"  # docker, kubernetes, cloud
  availability_zone: "multi_zone"  # single_zone, multi_zone, multi_region
  version: "3.0.0"

# Service Components
components:
  enabled: true
  core_services:
    - "market_data_service"
    - "trading_service"
    - "execution_service"
    - "risk_service"
    - "order_service"
    - "portfolio_service"
    - "notification_service"
    - "logging_service"
    - "analytics_service"
    - "backup_service"
  support_services:
    - "data_service"
    - "cache_service"
    - "queue_service"
    - "auth_service"
    - "monitoring_service"
    - "reporting_service"
    - "scheduler_service"
    - "event_service"
    - "websocket_service"
    - "api_gateway"
  service_dependencies:
    trading_service: ["market_data_service", "order_service", "risk_service"]
    execution_service: ["order_service", "market_data_service"]
    risk_service: ["portfolio_service", "market_data_service"]
    order_service: ["execution_service", "portfolio_service"]

# Market Data Service
market_data_service:
  enabled: true
  service_type: "real_time"  # real_time, historical, hybrid
  data_sources:
    - "exchange_feeds"
    - "market_data_vendors"
    - "alternative_data"
    - "economic_data"
  update_frequency_ms: 100
  cache_ttl_seconds: 10
  data_quality_check: true
  redundancy_level: 3

# Trading Service
trading_service:
  enabled: true
  service_type: "automated"  # automated, semi_automated, manual
  trading_modes:
    - "live_trading"
    - "paper_trading"
    - "backtesting"
    - "simulation"
  order_processing: "streaming"  # streaming, batch, hybrid
  position_management: true
  risk_management: true

# Execution Service
execution_service:
  enabled: true
  service_type: "smart_routing"  # smart_routing, direct, hybrid
  execution_methods:
    - "market_orders"
    - "limit_orders"
    - "stop_orders"
    - "iceberg_orders"
    - "twap"
    - "vwap"
  latency_target_ms: 50
  fill_rate_target: 0.90
  execution_priority: "quality"

# Risk Service
risk_service:
  enabled: true
  service_type: "real_time"  # real_time, periodic, hybrid
  risk_components:
    - "market_risk"
    - "credit_risk"
    - "liquidity_risk"
    - "operational_risk"
    - "regulatory_risk"
    - "model_risk"
  risk_monitoring: true
  risk_reporting: true
  risk_limits_enforcement: true

# Order Service
order_service:
  enabled: true
  service_type: "stateful"  # stateful, stateless, hybrid
  order_processing: "async"  # async, sync, hybrid
  order_validation: true
  order_routing: true
  order_tracking: true
  order_history_retention_days: 365

# Portfolio Service
portfolio_service:
  enabled: true
  service_type: "real_time"  # real_time, batch, hybrid
  portfolio_components:
    - "position_management"
    - "allocation_management"
    - "performance_tracking"
    - "rebalancing"
    - "tax_management"
  portfolio_update_frequency_ms: 100
  portfolio_analysis: true

# Notification Service
notification_service:
  enabled: true
  service_type: "event_driven"  # event_driven, polling, hybrid
  notification_channels:
    - "email"
    - "sms"
    - "push"
    - "telegram"
    - "slack"
    - "webhook"
  notification_templates: true
  notification_priorities: true
  notification_retry: true

# Logging Service
logging_service:
  enabled: true
  service_type: "centralized"  # centralized, distributed, hybrid
  log_types:
    - "application_logs"
    - "audit_logs"
    - "access_logs"
    - "error_logs"
    - "performance_logs"
    - "trade_logs"
  log_retention_days: 30
  log_rotation: true
  log_compression: true

# Analytics Service
analytics_service:
  enabled: true
  service_type: "real_time"  # real_time, batch, hybrid
  analytics_types:
    - "performance_analytics"
    - "risk_analytics"
    - "market_analytics"
    - "trading_analytics"
    - "portfolio_analytics"
    - "behavioral_analytics"
  analytics_frequency_minutes: 5
  analytics_reporting: true

# Backup Service
backup_service:
  enabled: true
  service_type: "scheduled"  # scheduled, continuous, hybrid
  backup_types:
    - "data_backup"
    - "model_backup"
    - "config_backup"
    - "state_backup"
  backup_frequency_hours: 6
  backup_retention_days: 365
  backup_compression: true
  backup_encryption: true

# Service Health
health:
  enabled: true
  health_checks:
    - "service_status"
    - "resource_usage"
    - "response_time"
    - "error_rate"
    - "throughput"
    - "latency"
  check_frequency_seconds: 10
  health_thresholds:
    response_time_ms: 100
    error_rate_percent: 1
    throughput_min: 100
    latency_ms: 50

# Service Monitoring
monitoring:
  enabled: true
  monitoring_metrics:
    - "cpu_usage"
    - "memory_usage"
    - "network_bandwidth"
    - "disk_usage"
    - "response_time"
    - "error_rate"
    - "throughput"
    - "latency"
  monitoring_frequency_seconds: 10
  monitoring_dashboard: true
  monitoring_alerts: true

# Service Configuration
configuration:
  enabled: true
  config_sources:
    - "environment_variables"
    - "config_files"
    - "config_service"
    - "secrets_manager"
  config_reload: true
  config_reload_frequency_minutes: 5
  config_versioning: true
  config_validation: true

# Service Security
security:
  enabled: true
  security_measures:
    - "authentication"
    - "authorization"
    - "encryption"
    - "audit_trail"
    - "rate_limiting"
    - "ip_whitelisting"
    - "api_keys"
  security_protocols:
    - "https"
    - "wss"
    - "oauth2"
    - "jwt"
  security_audit: true

# Visualization
visualization:
  enabled: true
  charts:
    - "service_dashboard"
    - "health_chart"
    - "performance_chart"
    - "resource_chart"
    - "error_chart"
    - "latency_chart"
  update_interval_seconds: 10
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "service_down"
    - "high_latency"
    - "high_error_rate"
    - "resource_exhaustion"
    - "performance_degradation"
    - "security_breach"
  alert_thresholds:
    high_latency_ms: 100
    high_error_rate_percent: 5
    cpu_usage_threshold: 80
    memory_usage_threshold: 85
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "service_status_report"
    - "performance_report"
    - "resource_report"
    - "error_report"
    - "security_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "devops@example.com"
    - "trading@example.com"
    - "management@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "service_data"
    - "log_data"
    - "backup_data"
    - "config_data"
    - "state_data"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/services"
  api_endpoint: "/api/v1/services"
  dashboard_url: "http://localhost:3000/services"
  real_time_updates: true
  data_sync_frequency_seconds: 10
  external_systems:
    - "grafana"
    - "prometheus"
    - "elk_stack"
    - "kubernetes"
    - "docker"
