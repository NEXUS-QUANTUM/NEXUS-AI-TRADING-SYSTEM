# ============================================================================
#
# Description: Complete Deep Learning configuration for swing trading bot
# Framework: Deep Learning - Neural Network Trading Models
# Version: 3.0.0
#
# The Deep Learning configuration enables the bot to use advanced neural
# network architectures for trading signal generation and prediction.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
deep_learning:
  enabled: true
  version: "3.0.0"
  description: "Deep Learning for swing trading"
  
  # Model types
  types:
    - "lstm"
    - "gru"
    - "transformer"
    - "cnn"
    - "rnn"
    - "autoencoder"
    - "gan"
    - "attention"
  
  # Training modes
  modes:
    - "supervised"
    - "unsupervised"
    - "reinforcement"
    - "transfer"
  
  default_mode: "supervised"
  
  # Hardware acceleration
  acceleration:
    cpu: true
    cuda: true
    mps: true
    tpu: false

# ----------------------------------------------------------------------------
# LSTM Model
# ----------------------------------------------------------------------------
lstm_model:
  enabled: true
  description: "LSTM model configuration"
  
  # Parameters
  parameters:
    input_size: 10
    hidden_size: 64
    num_layers: 2
    output_size: 1
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    early_stopping: true
    patience: 10
  
  # Architecture
  architecture:
    - type: "lstm"
      units: 64
      return_sequences: true
      dropout: 0.2
    - type: "lstm"
      units: 32
      return_sequences: false
      dropout: 0.2
    - type: "dense"
      units: 1
      activation: "sigmoid"
  
  # Features
  features:
    - "close_price"
    - "volume"
    - "rsi"
    - "macd"
    - "volatility"
    - "momentum"
  
  # Targets
  targets:
    - "price_change"
    - "trend_direction"
  
  # Training
  training:
    validation_split: 0.2
    shuffle: true
    optimizer: "adam"
    loss: "mse"
    metrics:
      - "mae"
      - "rmse"

# ----------------------------------------------------------------------------
# GRU Model
# ----------------------------------------------------------------------------
gru_model:
  enabled: true
  description: "GRU model configuration"
  
  # Parameters
  parameters:
    input_size: 10
    hidden_size: 64
    num_layers: 2
    output_size: 1
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    early_stopping: true
    patience: 10
  
  # Architecture
  architecture:
    - type: "gru"
      units: 64
      return_sequences: true
      dropout: 0.2
    - type: "gru"
      units: 32
      return_sequences: false
      dropout: 0.2
    - type: "dense"
      units: 1
      activation: "sigmoid"
  
  # Features
  features:
    - "close_price"
    - "volume"
    - "rsi"
    - "macd"
    - "volatility"
    - "momentum"
  
  # Targets
  targets:
    - "price_change"
    - "trend_direction"
  
  # Training
  training:
    validation_split: 0.2
    shuffle: true
    optimizer: "adam"
    loss: "mse"
    metrics:
      - "mae"
      - "rmse"

# ----------------------------------------------------------------------------
# Transformer Model
# ----------------------------------------------------------------------------
transformer_model:
  enabled: true
  description: "Transformer model configuration"
  
  # Parameters
  parameters:
    d_model: 64
    nhead: 4
    num_encoder_layers: 3
    num_decoder_layers: 3
    dim_feedforward: 256
    dropout: 0.1
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    early_stopping: true
    patience: 10
  
  # Architecture
  architecture:
    - type: "multi_head_attention"
      heads: 4
      d_model: 64
      dropout: 0.1
    - type: "feed_forward"
      d_ff: 256
      dropout: 0.1
    - type: "layer_norm"
      epsilon: 1e-6
  
  # Features
  features:
    - "price_sequence"
    - "volume_sequence"
    - "indicator_sequence"
  
  # Targets
  targets:
    - "next_price"
    - "trend_prediction"
  
  # Training
  training:
    validation_split: 0.2
    shuffle: true
    optimizer: "adam"
    loss: "mse"
    metrics:
      - "mae"
      - "rmse"

# ----------------------------------------------------------------------------
# CNN Model
# ----------------------------------------------------------------------------
cnn_model:
  enabled: true
  description: "CNN model configuration"
  
  # Parameters
  parameters:
    conv_layers: 3
    filters: [32, 64, 128]
    kernel_sizes: [3, 3, 3]
    pool_sizes: [2, 2, 2]
    dense_layers: [128, 64]
    dropout: 0.3
    learning_rate: 0.001
    batch_size: 64
    epochs: 150
    early_stopping: true
    patience: 15
  
  # Architecture
  architecture:
    - type: "conv1d"
      filters: 32
      kernel_size: 3
      activation: "relu"
    - type: "max_pooling1d"
      pool_size: 2
    - type: "conv1d"
      filters: 64
      kernel_size: 3
      activation: "relu"
    - type: "max_pooling1d"
      pool_size: 2
    - type: "conv1d"
      filters: 128
      kernel_size: 3
      activation: "relu"
    - type: "max_pooling1d"
      pool_size: 2
    - type: "flatten"
    - type: "dense"
      units: 128
      activation: "relu"
    - type: "dropout"
      rate: 0.3
    - type: "dense"
      units: 64
      activation: "relu"
    - type: "dense"
      units: 1
      activation: "sigmoid"
  
  # Features
  features:
    - "price_image"
    - "volume_image"
    - "indicator_image"
  
  # Targets
  targets:
    - "pattern_classification"
    - "breakout_prediction"
  
  # Training
  training:
    validation_split: 0.2
    shuffle: true
    optimizer: "adam"
    loss: "binary_crossentropy"
    metrics:
      - "accuracy"
      - "precision"
      - "recall"

# ----------------------------------------------------------------------------
# Autoencoder Model
# ----------------------------------------------------------------------------
autoencoder_model:
  enabled: true
  description: "Autoencoder model configuration"
  
  # Parameters
  parameters:
    input_size: 20
    hidden_sizes: [64, 32, 16]
    latent_size: 8
    learning_rate: 0.001
    batch_size: 64
    epochs: 100
    early_stopping: true
    patience: 10
  
  # Architecture
  architecture:
    encoder:
      - type: "dense"
        units: 64
        activation: "relu"
      - type: "dense"
        units: 32
        activation: "relu"
      - type: "dense"
        units: 16
        activation: "relu"
      - type: "dense"
        units: 8
        activation: "linear"
    decoder:
      - type: "dense"
        units: 16
        activation: "relu"
      - type: "dense"
        units: 32
        activation: "relu"
      - type: "dense"
        units: 64
        activation: "relu"
      - type: "dense"
        units: 20
        activation: "sigmoid"
  
  # Features
  features:
    - "all_indicators"
    - "price_features"
    - "volume_features"
  
  # Targets
  targets:
    - "latent_features"
    - "reconstructed_data"
  
  # Training
  training:
    validation_split: 0.2
    shuffle: true
    optimizer: "adam"
    loss: "mse"
    metrics:
      - "mae"
      - "rmse"

# ----------------------------------------------------------------------------
# Deep Learning Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Deep learning-based trading signals"
  
  # Signal types
  types:
    dl_buy:
      description: "Deep learning buy signal"
      conditions:
        - "model_prediction_buy"
        - "confidence_high"
        - "risk_low"
        - "volume_confirmation"
      confidence: 0.85
    
    dl_sell:
      description: "Deep learning sell signal"
      conditions:
        - "model_prediction_sell"
        - "confidence_high"
        - "risk_high"
        - "volume_confirmation"
      confidence: 0.85
    
    dl_hedge:
      description: "Deep learning hedge signal"
      conditions:
        - "model_prediction_uncertain"
        - "confidence_medium"
        - "risk_medium"
        - "volume_confirmation"
      confidence: 0.7
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for deep learning trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Deep learning-based stop loss
    stop_loss:
      type: "dl_based"
      threshold: 0.02
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for deep learning trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
    - "model_accuracy"
    - "prediction_confidence"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/deep_learning.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    training: true
    debugging: false
