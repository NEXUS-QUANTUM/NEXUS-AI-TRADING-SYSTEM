# Swing Bot Perception Engine Configuration
# Core Perception Engine & Market Awareness Parameters

# General Perception Engine Settings
perception_engine:
  enabled: true
  engine_mode: "cognitive"  # cognitive, sensory, hybrid, integrated
  perception_level: "advanced"  # basic, intermediate, advanced, expert
  processing_paradigm: "parallel"  # parallel, sequential, distributed
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "sensory_module"
    - "preprocessing_module"
    - "feature_extraction_module"
    - "pattern_recognition_module"
    - "context_analysis_module"
    - "perception_fusion_module"
    - "awareness_module"
    - "interpretation_module"
    - "learning_module"
    - "memory_module"
  module_interaction: "pipeline"  # pipeline, event_driven, message_based
  parallel_execution: true
  max_workers: 8
  pipeline_buffer_size: 10000

# Sensory Module
sensory_module:
  enabled: true
  sensory_channels:
    - "price_sensor"
    - "volume_sensor"
    - "volatility_sensor"
    - "momentum_sensor"
    - "trend_sensor"
    - "sentiment_sensor"
    - "liquidity_sensor"
    - "order_flow_sensor"
    - "news_sensor"
    - "social_sensor"
    - "economic_sensor"
  channel_priorities:
    price_sensor: 1
    volume_sensor: 2
    volatility_sensor: 3
    momentum_sensor: 4
    trend_sensor: 5
    sentiment_sensor: 6
    liquidity_sensor: 7
    order_flow_sensor: 8
    news_sensor: 9
    social_sensor: 10
    economic_sensor: 11
  sensor_frequency_ms: 100
  sensor_sensitivity: "adaptive"

# Preprocessing Module
preprocessing:
  enabled: true
  preprocessing_methods:
    - "noise_reduction"
    - "signal_filtering"
    - "data_cleaning"
    - "outlier_removal"
    - "normalization"
    - "standardization"
    - "interpolation"
    - "smoothing"
    - "detrending"
    - "seasonal_adjustment"
  filter_types:
    - "low_pass"
    - "high_pass"
    - "band_pass"
    - "notch"
    - "kalman"
    - "median"
    - "moving_average"
  preprocessing_pipeline: true

# Feature Extraction Module
feature_extraction:
  enabled: true
  feature_types:
    - "price_features"
    - "volume_features"
    - "volatility_features"
    - "momentum_features"
    - "trend_features"
    - "pattern_features"
    - "sentiment_features"
    - "liquidity_features"
    - "order_flow_features"
    - "statistical_features"
  extraction_methods:
    - "manual_extraction"
    - "automatic_extraction"
    - "deep_learning_extraction"
    - "ensemble_extraction"
  max_features: 100
  feature_selection: true
  feature_importance_analysis: true

# Pattern Recognition Module
pattern_recognition:
  enabled: true
  pattern_types:
    - "price_patterns"
    - "volume_patterns"
    - "volatility_patterns"
    - "trend_patterns"
    - "momentum_patterns"
    - "sentiment_patterns"
    - "liquidity_patterns"
    - "order_flow_patterns"
    - "composite_patterns"
  detection_methods:
    - "template_matching"
    - "machine_learning"
    - "deep_learning"
    - "statistical_pattern_detection"
    - "fuzzy_matching"
    - "neural_pattern_recognition"
  pattern_min_confidence: 0.70
  pattern_min_occurrences: 3

# Context Analysis Module
context_analysis:
  enabled: true
  context_types:
    - "market_context"
    - "trend_context"
    - "volatility_context"
    - "regime_context"
    - "sentiment_context"
    - "liquidity_context"
    - "risk_context"
    - "temporal_context"
  context_factors:
    - "current_regime"
    - "market_phase"
    - "trend_strength"
    - "volatility_level"
    - "sentiment_orientation"
    - "liquidity_condition"
    - "risk_environment"
  context_confidence_threshold: 0.70

# Perception Fusion Module
perception_fusion:
  enabled: true
  fusion_methods:
    - "early_fusion"
    - "late_fusion"
    - "hybrid_fusion"
    - "attention_based_fusion"
    - "decision_level_fusion"
    - "feature_level_fusion"
    - "data_level_fusion"
  primary_method: "hybrid_fusion"
  fusion_weights:
    price: 0.20
    volume: 0.15
    volatility: 0.15
    momentum: 0.10
    trend: 0.10
    sentiment: 0.10
    liquidity: 0.10
    order_flow: 0.10
  fusion_confidence: true
  conflict_resolution: true

# Awareness Module
awareness_module:
  enabled: true
  awareness_dimensions:
    - "situational_awareness"
    - "market_awareness"
    - "risk_awareness"
    - "opportunity_awareness"
    - "threat_awareness"
    - "temporal_awareness"
    - "spatial_awareness"
    - "relational_awareness"
  awareness_levels:
    - "subconscious"
    - "conscious"
    - "focused"
    - "hyperaware"
  awareness_update_frequency_ms: 100
  awareness_scoring: true

# Interpretation Module
interpretation:
  enabled: true
  interpretation_types:
    - "meaning_extraction"
    - "significance_analysis"
    - "relevance_assessment"
    - "implication_analysis"
    - "causal_inference"
    - "predictive_interpretation"
    - "prescriptive_interpretation"
  interpretation_depth: "comprehensive"  # basic, intermediate, comprehensive
  confidence_threshold: 0.70
  uncertainty_handling: true

# Learning Module
learning_module_perception:
  enabled: true
  learning_methods:
    - "unsupervised_learning"
    - "supervised_learning"
    - "reinforcement_learning"
    - "transfer_learning"
    - "online_learning"
    - "incremental_learning"
  learning_objectives:
    - "pattern_recognition"
    - "context_understanding"
    - "perception_optimization"
    - "awareness_enhancement"
    - "interpretation_improvement"
  learning_rate: 0.001
  batch_size: 64
  epochs: 100

# Memory Module
memory_module_perception:
  enabled: true
  memory_types:
    - "sensory_memory"
    - "short_term_memory"
    - "working_memory"
    - "episodic_memory"
    - "semantic_memory"
    - "procedural_memory"
    - "perceptual_memory"
  memory_capacity:
    sensory_seconds: 10
    short_term_bars: 100
    working_capacity: 7
    episodic_days: 30
    semantic_days: 365
  memory_retrieval: "content_addressable"
  memory_consolidation: true

# Perception Quality
quality:
  enabled: true
  quality_metrics:
    - "perception_accuracy"
    - "perception_precision"
    - "perception_recall"
    - "perception_speed"
    - "perception_consistency"
    - "perception_reliability"
  quality_thresholds:
    poor: 0.40
    moderate: 0.60
    good: 0.80
    excellent: 0.95
  quality_monitoring: true
  quality_optimization: true

# Performance
performance_perception:
  enabled: true
  performance_metrics:
    - "perception_latency"
    - "perception_throughput"
    - "perception_accuracy"
    - "perception_efficiency"
    - "perception_adaptability"
  performance_targets:
    latency_ms: 50
    throughput_per_second: 100
    accuracy_min: 0.80
    efficiency_min: 0.70
  performance_monitoring: true
  performance_reporting: true

# Visualization
visualization:
  enabled: true
  charts:
    - "perception_dashboard"
    - "awareness_chart"
    - "fusion_chart"
    - "quality_chart"
    - "performance_chart"
    - "pattern_recognition"
    - "context_analysis"
  update_interval_seconds: 5
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "perception_error"
    - "awareness_breach"
    - "pattern_detected"
    - "context_change"
    - "quality_degradation"
    - "performance_drop"
    - "fusion_conflict"
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/perception-engine"
  api_endpoint: "/api/v1/trading/perception-engine"
  dashboard_url: "http://localhost:3000/perception-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 3
  external_systems:
    - "trading_engine"
    - "cognition_engine"
    - "decision_engine"
    - "memory_system"
    - "sensor_system"

# Storage
storage:
  enabled: true
  storage_categories:
    - "perception_data"
    - "awareness_data"
    - "pattern_data"
    - "context_data"
    - "fusion_results"
    - "quality_metrics"
    - "performance_metrics"
    - "alert_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Logging
logging:
  enabled: true
  log_level: "info"  # debug, info, warn, error, critical
  log_categories:
    - "sensory"
    - "preprocessing"
    - "feature_extraction"
    - "pattern_recognition"
    - "context_analysis"
    - "fusion"
    - "awareness"
    - "interpretation"
    - "quality"
    - "performance"
    - "errors"
  log_rotation: true
  max_log_size_mb: 100
  retention_days: 30
