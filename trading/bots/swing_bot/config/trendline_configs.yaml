# trendline_configs.yaml
# Configuration complète pour l'analyse des lignes de tendance dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 50
  max_data_points: 100000
  trendline_detection_version: "4.0.0"
  environment: "production"

# Types de lignes de tendance
trendline_types:
  uptrend:
    enabled: true
    description: "Uptrend Line"
    slope: "positive"
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
    angle_min: 10
    angle_max: 60
    min_confidence: 0.6
    breakout_direction: "downward"
  downtrend:
    enabled: true
    description: "Downtrend Line"
    slope: "negative"
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
    angle_min: -60
    angle_max: -10
    min_confidence: 0.6
    breakout_direction: "upward"
  horizontal:
    enabled: true
    description: "Horizontal Line"
    slope: "zero"
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
    angle_min: -5
    angle_max: 5
    min_confidence: 0.6
    breakout_direction: "both"
  channel:
    enabled: true
    description: "Channel Lines"
    slope: "parallel"
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
    angle_min: 10
    angle_max: 60
    min_confidence: 0.6
    breakout_direction: "both"
  support:
    enabled: true
    description: "Support Line"
    slope: "variable"
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
    angle_min: -60
    angle_max: 60
    min_confidence: 0.6
    breakout_direction: "downward"
  resistance:
    enabled: true
    description: "Resistance Line"
    slope: "variable"
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
    angle_min: -60
    angle_max: 60
    min_confidence: 0.6
    breakout_direction: "upward"

# Seuils de détection
thresholds:
  trendline:
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
    angle_min: -60
    angle_max: 60
    touch_tolerance: 0.01
    confirmation_bars: 3
  breakout:
    min_breakout_percent: 1.0
    max_breakout_percent: 10.0
    breakout_volume_multiplier: 1.5
    breakout_confidence: 0.7
    retest_threshold: 0.5
    false_breakout_threshold: 0.3
  touch:
    min_touch_distance: 0.001
    max_touch_distance: 0.01
    min_touch_volume: 1000
    max_touch_volume: 1000000
    touch_confidence: 0.6

# Indicateurs de lignes de tendance
indicators:
  trendline_strength:
    enabled: true
    calculation: "weighted_average"
    factors:
      - "touch_points"
      - "length"
      - "angle"
      - "volume_confirmation"
      - "breakout_momentum"
      - "touch_quality"
    factor_weights:
      touch_points: 0.25
      length: 0.20
      angle: 0.15
      volume_confirmation: 0.15
      breakout_momentum: 0.15
      touch_quality: 0.10
  trendline_probability:
    enabled: true
    period: 14
    smoothing: 3
    threshold: 0.6
  trendline_momentum:
    enabled: true
    period: 14
    smoothing: 3
    threshold: 0.3
  trendline_velocity:
    enabled: true
    period: 5
    smoothing: 0
    threshold: 0.2
  trendline_acceleration:
    enabled: true
    period: 10
    smoothing: 0
    threshold: 0.1
  trendline_confidence:
    enabled: true
    period: 14
    smoothing: 0
    threshold: 0.6

# Analyse des lignes de tendance
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_trendline_accuracy: true
    compute_trendline_probability: true
    compute_trendline_distribution: true
    compute_trendline_patterns: true
    compute_trendline_cycles: true
    compute_trendline_success_rate: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous_trendline: true
    compute_moving_average_trendline: true
    compute_exponential_trendline: true
    compute_weighted_trendline: true
    compute_trendline_velocity: true
    compute_trendline_acceleration: true
  predictive:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "xgboost"
      - "lightgbm"
    features:
      - "trendline_strength"
      - "trendline_probability"
      - "trendline_momentum"
      - "trendline_velocity"
      - "trendline_acceleration"
      - "trendline_confidence"
      - "touch_points"
      - "length"
      - "angle"
      - "volume_confirmation"
      - "breakout_momentum"
      - "touch_quality"
      - "price_change"
      - "volume"
      - "volatility"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_threshold: 0.7
    retrain_frequency_hours: 24

# Alertes et notifications
alerts:
  trendline_detected:
    enabled: true
    confidence_threshold: 0.7
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "warning"
  trendline_breakout:
    enabled: true
    confidence_threshold: 0.8
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"
  trendline_confirmed:
    enabled: true
    confidence_threshold: 0.9
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "info"
  trendline_invalid:
    enabled: true
    confidence_threshold: 0.5
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"
  trendline_touch:
    enabled: true
    confidence_threshold: 0.6
    channels:
      - "telegram"
      - "push_notification"
    severity: "info"
  trendline_retest:
    enabled: true
    confidence_threshold: 0.7
    channels:
      - "telegram"
      - "push_notification"
    severity: "info"

# Actions automatiques
auto_actions:
  trade_entry:
    enabled: true
    action_types:
      - "enter_on_breakout"
      - "enter_on_retest"
      - "enter_on_touch"
      - "enter_on_confirmation"
    require_trendline_confirmation: true
    require_confidence: 0.7
    max_position_size: 10000
    min_position_size: 100
  stop_loss:
    enabled: true
    methods:
      - "trendline_based"
      - "breakout_based"
      - "touch_based"
    trendline_multiplier: 1.0
    min_stop_percent: 0.5
    max_stop_percent: 10.0
    update_frequency_seconds: 10
  take_profit:
    enabled: true
    methods:
      - "trendline_projection"
      - "breakout_projection"
      - "channel_projection"
    projection_multiplier: 1.0
    min_profit_percent: 1.0
    max_profit_percent: 20.0
    update_frequency_seconds: 10
  position_sizing:
    enabled: true
    method: "trendline_strength_based"
    trendline_scale: 0.5
    max_position_percent: 10.0
    min_position_percent: 0.5
    scaling_function: "linear"

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"
      - "lstm"
    features:
      - "trendline_strength"
      - "trendline_probability"
      - "trendline_momentum"
      - "trendline_velocity"
      - "trendline_acceleration"
      - "trendline_confidence"
      - "touch_points"
      - "length"
      - "angle"
      - "volume_confirmation"
      - "breakout_momentum"
      - "touch_quality"
      - "rsi"
      - "macd"
      - "bollinger_width"
      - "atr"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.25
      - 0.25
      - 0.25
      - 0.25
  statistical_analysis:
    enabled: true
    calculate_trendline_accuracy: true
    calculate_trendline_probability: true
    calculate_trendline_significance: true
    calculate_trendline_correlation: true
    calculate_trendline_success_rate: true
    confidence_level: 95
    p_value_threshold: 0.05
  pattern_recognition:
    enabled: true
    patterns:
      - "uptrend"
      - "downtrend"
      - "horizontal"
      - "channel"
      - "support"
      - "resistance"
    pattern_confidence_threshold: 0.7
    pattern_accuracy_threshold: 0.8

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "trendline_strength"
      - "trendline_probability"
      - "trendline_momentum"
      - "trendline_velocity"
      - "trendline_acceleration"
      - "trendline_confidence"
      - "trendline_count"
      - "trendline_accuracy"
      - "trendline_success_rate"
      - "breakout_count"
      - "confirmed_trendlines"
      - "invalid_trendlines"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "trendline_detection"
      - "trendline_analysis"
      - "trendline_accuracy"
      - "trendline_distribution"
      - "trendline_patterns"
      - "breakout_analysis"
      - "trendline_success_rate"
      - "trendline_predictive"

# Backtesting
backtesting:
  enabled: true
  use_historical_trendlines: true
  compute_trendline_accuracy: true
  compute_breakout_effectiveness: true
  compute_pattern_accuracy: true
  compute_risk_adjusted_returns: true
  report_metrics:
    - "trendline_accuracy"
    - "breakout_effectiveness"
    - "pattern_accuracy"
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"

# Configuration de la base de données
database:
  enabled: true
  table_name: "trendline_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/trendline"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "trendline_alert"
    - url: "https://nexustradingia.com/api/webhooks/trendline-breakout"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "trendline_breakout"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "trendline_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/trendline"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/trendline/current"
    - "/api/v1/trendline/history"
    - "/api/v1/trendline/metrics"
    - "/api/v1/trendline/status"
    - "/api/v1/trendline/patterns"
    - "/api/v1/trendline/probability"
    - "/api/v1/trendline/accuracy"
    - "/api/v1/trendline/forecast"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/trendline/"
  encrypt: true
  encryption_key_id: "nexus-trendline-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/trendline"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_trendline_volume"
      - "low_trendline_volume"
      - "pattern_volume"
      - "accuracy_validation"
      - "false_positive"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "confidence_threshold > 0.0"
      - "confidence_threshold <= 1.0"
      - "trendline_types.uptrend.min_touch_points > 0"
      - "trendline_types.uptrend.max_touch_points > trendline_types.uptrend.min_touch_points"
      - "trendline_types.uptrend.min_length > 0"
      - "trendline_types.uptrend.max_length > trendline_types.uptrend.min_length"
      - "thresholds.trendline.min_touch_points > 0"
      - "thresholds.trendline.max_touch_points > threshold.trendline.min_touch_points"
      - "thresholds.trendline.min_length > 0"
      - "thresholds.trendline.max_length > threshold.trendline.min_length"
      - "indicators.trendline_strength.factor_weights.sum() == 1.0"
      - "min_data_points > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "trending"
      - "ranging"
      - "volatile"
      - "stable"
      - "bull"
      - "bear"
  regime_parameters:
    trending:
      trendline_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
    ranging:
      trendline_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
    volatile:
      trendline_multiplier: 0.7
      threshold_multiplier: 1.3
      confidence_multiplier: 0.8
    stable:
      trendline_multiplier: 1.0
      threshold_multiplier: 0.9
      confidence_multiplier: 1.2
    bull:
      trendline_multiplier: 1.1
      threshold_multiplier: 0.9
      confidence_multiplier: 1.0
    bear:
      trendline_multiplier: 0.9
      threshold_multiplier: 1.1
      confidence_multiplier: 0.9

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      trendline_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
    london:
      start: "08:00"
      end: "16:00"
      trendline_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
    newyork:
      start: "13:00"
      end: "22:00"
      trendline_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      trendline_multiplier: 1.5
      threshold_multiplier: 0.7
      confidence_multiplier: 1.2

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    trendline_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
  ETHUSDT:
    trendline_multiplier: 1.1
    threshold_multiplier: 0.9
    confidence_multiplier: 1.0
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    min_touch_points: 2
    max_touch_points: 8
    min_length: 8
    max_length: 80
  SOLUSDT:
    trendline_multiplier: 1.2
    threshold_multiplier: 0.8
    confidence_multiplier: 0.9
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    min_touch_points: 2
    max_touch_points: 8
    min_length: 8
    max_length: 80
  ADAUSDT:
    trendline_multiplier: 0.9
    threshold_multiplier: 1.1
    confidence_multiplier: 1.1
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
  XRPUSDT:
    trendline_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    confidence_threshold: 0.7
    pattern_confidence: 0.6
    min_touch_points: 2
    max_touch_points: 10
    min_length: 10
    max_length: 100
