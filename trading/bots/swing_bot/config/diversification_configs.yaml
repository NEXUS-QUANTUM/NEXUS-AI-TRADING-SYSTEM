#
# Description: Complete Diversification configuration for swing trading bot
# Framework: Portfolio Diversification - Risk & Asset Allocation
# Version: 3.0.0
#
# The Diversification configuration enables the bot to manage portfolio
# diversification across assets, sectors, and strategies to optimize
# risk-adjusted returns.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
diversification:
  enabled: true
  version: "3.0.0"
  description: "Portfolio Diversification for swing trading"
  
  # Diversification types
  types:
    - "asset"
    - "sector"
    - "strategy"
    - "timeframe"
    - "geographic"
    - "currency"
  
  # Diversification methods
  methods:
    - "equal_weight"
    - "risk_parity"
    - "maximum_diversification"
    - "minimum_correlation"
    - "efficient_frontier"

# ----------------------------------------------------------------------------
# Asset Diversification
# ----------------------------------------------------------------------------
asset_diversification:
  enabled: true
  description: "Asset diversification configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    max_asset_weight: 0.2
    min_asset_weight: 0.01
    max_assets: 15
    min_assets: 3
    diversification_threshold: 0.6
  
  # Asset metrics
  metrics:
    asset_count:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    asset_concentration:
      enabled: true
      calculation: "herfindahl"
      lookback_period: 10
    
    asset_correlation:
      enabled: true
      calculation: "average_correlation"
      lookback_period: 10
  
  # Signals
  signals:
    diversify_assets:
      description: "Diversify assets signal"
      conditions:
        - "asset_concentration_>_threshold"
        - "asset_count_<_min"
        - "correlation_high"
      action: "add_assets"
    
    concentrate_assets:
      description: "Concentrate assets signal"
      conditions:
        - "asset_concentration_<_threshold"
        - "asset_count_>_max"
        - "correlation_low"
      action: "reduce_assets"

# ----------------------------------------------------------------------------
# Sector Diversification
# ----------------------------------------------------------------------------
sector_diversification:
  enabled: true
  description: "Sector diversification configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    max_sector_weight: 0.3
    min_sector_weight: 0.05
    max_sectors: 5
    min_sectors: 2
    diversification_threshold: 0.5
  
  # Sector metrics
  metrics:
    sector_count:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    sector_concentration:
      enabled: true
      calculation: "herfindahl"
      lookback_period: 10
    
    sector_correlation:
      enabled: true
      calculation: "average_correlation"
      lookback_period: 10
  
  # Signals
  signals:
    diversify_sectors:
      description: "Diversify sectors signal"
      conditions:
        - "sector_concentration_>_threshold"
        - "sector_count_<_min"
        - "correlation_high"
      action: "add_sectors"
    
    concentrate_sectors:
      description: "Concentrate sectors signal"
      conditions:
        - "sector_concentration_<_threshold"
        - "sector_count_>_max"
        - "correlation_low"
      action: "reduce_sectors"

# ----------------------------------------------------------------------------
# Strategy Diversification
# ----------------------------------------------------------------------------
strategy_diversification:
  enabled: true
  description: "Strategy diversification configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    max_strategy_weight: 0.4
    min_strategy_weight: 0.05
    max_strategies: 4
    min_strategies: 2
    diversification_threshold: 0.5
  
  # Strategy metrics
  metrics:
    strategy_count:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    strategy_concentration:
      enabled: true
      calculation: "herfindahl"
      lookback_period: 10
    
    strategy_correlation:
      enabled: true
      calculation: "average_correlation"
      lookback_period: 10
  
  # Signals
  signals:
    diversify_strategies:
      description: "Diversify strategies signal"
      conditions:
        - "strategy_concentration_>_threshold"
        - "strategy_count_<_min"
        - "correlation_high"
      action: "add_strategies"
    
    concentrate_strategies:
      description: "Concentrate strategies signal"
      conditions:
        - "strategy_concentration_<_threshold"
        - "strategy_count_>_max"
        - "correlation_low"
      action: "reduce_strategies"

# ----------------------------------------------------------------------------
# Timeframe Diversification
# ----------------------------------------------------------------------------
timeframe_diversification:
  enabled: true
  description: "Timeframe diversification configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    max_timeframe_weight: 0.5
    min_timeframe_weight: 0.1
    max_timeframes: 3
    min_timeframes: 2
    diversification_threshold: 0.5
  
  # Timeframe metrics
  metrics:
    timeframe_count:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    timeframe_concentration:
      enabled: true
      calculation: "herfindahl"
      lookback_period: 10
    
    timeframe_correlation:
      enabled: true
      calculation: "average_correlation"
      lookback_period: 10
  
  # Signals
  signals:
    diversify_timeframes:
      description: "Diversify timeframes signal"
      conditions:
        - "timeframe_concentration_>_threshold"
        - "timeframe_count_<_min"
        - "correlation_high"
      action: "add_timeframes"
    
    concentrate_timeframes:
      description: "Concentrate timeframes signal"
      conditions:
        - "timeframe_concentration_<_threshold"
        - "timeframe_count_>_max"
        - "correlation_low"
      action: "reduce_timeframes"

# ----------------------------------------------------------------------------
# Diversification Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Diversification-based trading signals"
  
  # Signal types
  types:
    diversify_portfolio:
      description: "Diversify portfolio signal"
      conditions:
        - "diversification_needed"
        - "risk_high"
        - "correlation_high"
        - "concentration_high"
      action: "diversify"
    
    concentrate_portfolio:
      description: "Concentrate portfolio signal"
      conditions:
        - "diversification_excessive"
        - "risk_low"
        - "correlation_low"
        - "concentration_low"
      action: "concentrate"
    
    rebalance_portfolio:
      description: "Rebalance portfolio signal"
      conditions:
        - "diversification_imbalanced"
        - "allocation_deviation"
        - "performance_drift"
      action: "rebalance"
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for diversification"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Diversification-based risk
    diversification_risk:
      enabled: true
      threshold: 0.5
      adaptation: true
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for diversification"
  
  metrics:
    - "diversification_ratio"
    - "asset_count"
    - "sector_count"
    - "strategy_count"
    - "correlation"
    - "concentration"
    - "win_rate"
    - "profit_factor"
  
  targets:
    min_diversification_ratio: 0.5
    min_asset_count: 3
    min_sector_count: 2
    min_strategy_count: 2
    max_correlation: 0.7

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/diversification.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    diversification: true
    debugging: false
