# Swing Bot Intelligence Engine Configuration
# Core Intelligence & Cognitive Processing Engine Parameters

# General Intelligence Engine Settings
intelligence_engine:
  enabled: true
  engine_mode: "cognitive"  # cognitive, neural, hybrid, symbolic
  processing_paradigm: "parallel"  # parallel, sequential, distributed, hybrid
  intelligence_level: "advanced"  # basic, intermediate, advanced, expert
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "perception_module"
    - "cognition_module"
    - "memory_module"
    - "reasoning_module"
    - "decision_module"
    - "planning_module"
    - "learning_module"
    - "adaptation_module"
    - "prediction_module"
    - "optimization_module"
    - "execution_module"
  module_interaction: "pipeline"  # pipeline, event_driven, message_based, shared_memory
  module_priority: "dynamic"  # dynamic, static, priority_based
  engine_core_count: 16
  engine_memory_gb: 64

# Perception Module
perception:
  enabled: true
  perception_channels:
    - "market_data"
    - "technical_data"
    - "fundamental_data"
    - "sentiment_data"
    - "economic_data"
    - "alternative_data"
    - "order_flow_data"
    - "volume_data"
  channel_priority: "balanced"  # balanced, market_first, sentiment_first
  perception_fusion: "late_fusion"  # early_fusion, late_fusion, hybrid_fusion
  perception_threshold: 0.60
  signal_filtering: true
  noise_reduction: true
  data_normalization: true

# Cognition Module
cognition:
  enabled: true
  cognitive_functions:
    - "attention"
    - "perception"
    - "memory"
    - "reasoning"
    - "decision_making"
    - "planning"
    - "problem_solving"
    - "understanding"
    - "learning"
    - "adaptation"
    - "creativity"
  function_interaction: "collaborative"  # collaborative, hierarchical, competitive
  cognitive_load_threshold: 0.80
  attention_span_seconds: 300
  processing_speed: "real_time"  # real_time, near_real_time, batch

# Memory Module
memory_module:
  enabled: true
  memory_systems:
    - "sensory_memory": 
        capacity_seconds: 5
        decay_rate: 0.10
    - "short_term_memory":
        capacity_bars: 200
        decay_rate: 0.05
    - "working_memory":
        capacity_items: 7
        refresh_seconds: 10
    - "episodic_memory":
        capacity_events: 10000
        consolidation_frequency_hours: 6
    - "semantic_memory":
        capacity_facts: 100000
        update_frequency_hours: 12
    - "procedural_memory":
        capacity_procedures: 1000
        reinforcement_frequency_bars: 100
  memory_retrieval_strategy: "content_addressable"  # content_addressable, associative, temporal
  memory_consolidation: true
  memory_capacity_monitoring: true
  memory_optimization: true

# Reasoning Module
reasoning:
  enabled: true
  reasoning_methods:
    - "deductive_reasoning"
    - "inductive_reasoning"
    - "abductive_reasoning"
    - "analogical_reasoning"
    - "causal_reasoning"
    - "probabilistic_reasoning"
    - "fuzzy_reasoning"
    - "case_based_reasoning"
    - "rule_based_reasoning"
    - "model_based_reasoning"
    - "neural_reasoning"
  reasoning_strategy: "multi_method"  # single_method, multi_method, adaptive_method
  reasoning_depth: "hierarchical"  # single_level, multi_level, hierarchical
  inference_engine: "hybrid"  # rule_based, probabilistic, neural, hybrid
  uncertainty_handling: true
  conflict_resolution: true

# Decision Module
decision:
  enabled: true
  decision_framework: "multi_criteria"  # multi_criteria, probabilistic, heuristic, rational
  decision_criteria:
    - "expected_return"
    - "risk_adjusted_return"
    - "maximum_drawdown"
    - "liquidity_risk"
    - "market_impact"
    - "execution_quality"
    - "compliance_constraints"
    - "regulatory_constraints"
    - "capital_requirements"
    - "time_constraints"
  decision_weights:
    expected_return: 0.20
    risk_adjusted_return: 0.20
    maximum_drawdown: 0.15
    liquidity_risk: 0.10
    market_impact: 0.10
    execution_quality: 0.10
    compliance_constraints: 0.05
    regulatory_constraints: 0.05
    capital_requirements: 0.03
    time_constraints: 0.02
  decision_confidence_threshold: 0.75
  decision_timeout_seconds: 5
  risk_tolerance: "moderate"  # conservative, moderate, aggressive
  multi_criteria_analysis: true

# Planning Module
planning:
  enabled: true
  planning_horizon_bars: 200
  planning_strategy: "hierarchical"  # hierarchical, forward, backward, opportunistic
  planning_components:
    - "goal_identification"
    - "strategy_formulation"
    - "action_sequencing"
    - "resource_allocation"
    - "timeline_creation"
    - "contingency_planning"
    - "plan_execution"
    - "plan_monitoring"
    - "plan_revision"
  planning_depth: "multi_level"  # single_level, multi_level, hierarchical
  contingency_plans: true
  plan_revision_frequency_bars: 5

# Learning Module
learning_module:
  enabled: true
  learning_methods:
    - "supervised_learning"
    - "unsupervised_learning"
    - "reinforcement_learning"
    - "transfer_learning"
    - "meta_learning"
    - "multi_task_learning"
    - "federated_learning"
    - "active_learning"
    - "curriculum_learning"
    - "self_supervised_learning"
  learning_paradigm: "hybrid"  # supervised, unsupervised, reinforcement, hybrid
  learning_rate: 0.001
  batch_size: 64
  epochs: 100
  validation_split: 0.20
  early_stopping_patience: 10
  model_selection: "ensemble"  # single, ensemble, stacking, voting
  online_learning: true
  incremental_learning: true

# Adaptation Module
adaptation:
  enabled: true
  adaptation_mechanisms:
    - "parameter_adaptation"
    - "structure_adaptation"
    - "strategy_adaptation"
    - "model_adaptation"
    - "regime_adaptation"
    - "environment_adaptation"
    - "behavioral_adaptation"
    - "cognitive_adaptation"
  adaptation_speed: "adaptive"  # slow, moderate, fast, adaptive
  adaptation_threshold: 0.50
  adaptation_frequency_minutes: 5
  robustness_mechanisms:
    - "noise_injection"
    - "dropout"
    - "ensemble_methods"
    - "regularization"
    - "data_augmentation"
  concept_drift_detection: true
  concept_drift_threshold: 0.15

# Prediction Module
prediction:
  enabled: true
  prediction_horizons:
    - "ultra_short": "1m"
    - "short_term": "5m"
    - "medium_term": "1h"
    - "long_term": "24h"
    - "ultra_long": "7d"
  prediction_models:
    - "time_series_forecasting"
    - "probabilistic_forecasting"
    - "ensemble_forecasting"
    - "deep_learning_forecasting"
    - "statistical_forecasting"
    - "machine_learning_forecasting"
    - "hybrid_forecasting"
  prediction_confidence_level: 0.95
  prediction_uncertainty: true
  prediction_calibration: true
  prediction_interpretability: true
  prediction_aggregation: "weighted"

# Optimization Module
optimization:
  enabled: true
  optimization_objectives:
    - "maximize_return"
    - "minimize_risk"
    - "maximize_sharpe"
    - "minimize_drawdown"
    - "maximize_diversification"
    - "minimize_impact"
    - "maximize_execution_quality"
  optimization_algorithm: "multi_objective"  # single_objective, multi_objective, pareto
  population_size: 100
  generations: 50
  mutation_rate: 0.10
  crossover_rate: 0.80
  elite_ratio: 0.10
  convergence_threshold: 0.001
  parallel_evaluation: true

# Execution Module
execution_module:
  enabled: true
  execution_modes:
    - "automatic"
    - "semi_automatic"
    - "manual"
    - "hybrid"
  execution_priority: "quality"  # speed, quality, cost, balanced
  execution_strategies:
    - "market_orders"
    - "limit_orders"
    - "iceberg_orders"
    - "twap"
    - "vwap"
    - "smart_order_routing"
  order_slicing: true
  order_routing: "smart"  # smart, venue_specific, manual
  execution_monitoring: true
  execution_optimization: true

# Engine Performance
performance:
  enabled: true
  performance_metrics:
    - "processing_speed"
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "latency"
    - "throughput"
    - "resource_utilization"
    - "error_rate"
  performance_targets:
    processing_speed_ms: 100
    accuracy_min: 0.80
    latency_max_ms: 50
    throughput_min: 1000
    error_rate_max: 0.01
  performance_monitoring: true
  performance_optimization: true

# Engine Monitoring
monitoring:
  enabled: true
  monitoring_frequency_seconds: 10
  monitoring_metrics:
    - "module_status"
    - "engine_health"
    - "resource_usage"
    - "performance_metrics"
    - "error_rates"
    - "processing_times"
    - "memory_usage"
    - "cpu_usage"
  alert_thresholds:
    cpu_usage: 80
    memory_usage: 85
    error_rate: 0.05
    processing_time_ms: 200
  dashboard_integration: true
  logging_enabled: true

# Engine Logging
logging:
  enabled: true
  log_level: "info"  # debug, info, warn, error, critical
  log_categories:
    - "perception"
    - "cognition"
    - "memory"
    - "reasoning"
    - "decision"
    - "planning"
    - "learning"
    - "adaptation"
    - "prediction"
    - "optimization"
    - "execution"
    - "errors"
    - "performance"
  log_rotation: true
  max_log_size_mb: 100
  retention_days: 30
  audit_trail: true

# Engine Storage
storage:
  enabled: true
  storage_categories:
    - "knowledge_base"
    - "memory_data"
    - "model_data"
    - "performance_data"
    - "decision_history"
    - "execution_history"
    - "learning_data"
  storage_types:
    - "timescaledb"
    - "vector_database"
    - "graph_database"
    - "object_storage"
  retention_days: 365
  compression: "zstd"
  backup_frequency_days: 1
  archival_policy: "auto"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/intelligence_engine"
  api_endpoint: "/api/v1/trading/intelligence-engine"
  dashboard_url: "http://localhost:3000/intelligence-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 10
  external_systems:
    - "mlflow"
    - "wandb"
    - "grafana"
    - "prometheus"
    - "elasticsearch"
    - "kafka"
    - "neo4j"

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "engine_failure"
    - "module_failure"
    - "performance_degradation"
    - "resource_exhaustion"
    - "error_rate_spike"
    - "decision_timeout"
    - "learning_failure"
    - "adaptation_failure"
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600
  escalation_policy: true
