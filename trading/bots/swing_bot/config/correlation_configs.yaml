#
# Description: Complete Correlation configuration for swing trading bot
# Framework: Correlation Analysis - Asset & Market Relationships
# Version: 3.0.0
#
# The Correlation configuration enables the bot to analyze and trade
# based on correlations between different assets, sectors, and markets.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
correlation:
  enabled: true
  version: "3.0.0"
  description: "Correlation Analysis for swing trading"
  
  # Correlation types
  types:
    - "pearson"
    - "spearman"
    - "kendall"
    - "partial"
    - "distance"
    - "dynamic"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "1h"
  
  # Correlation thresholds
  thresholds:
    strong_positive: 0.7
    moderate_positive: 0.3
    weak: 0.1
    moderate_negative: -0.3
    strong_negative: -0.7

# ----------------------------------------------------------------------------
# Asset Correlation
# ----------------------------------------------------------------------------
asset_correlation:
  enabled: true
  description: "Asset correlation configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_data_points: 20
    correlation_threshold: 0.5
    confidence_threshold: 0.7
  
  # Asset pairs
  pairs:
    - asset1: "BTCUSDT"
      asset2: "ETHUSDT"
    - asset1: "SOLUSDT"
      asset2: "ADAUSDT"
    - asset1: "DOTUSDT"
      asset2: "LINKUSDT"
    - asset1: "AVAXUSDT"
      asset2: "MATICUSDT"
  
  # Correlation matrix
  matrix:
    enabled: true
    assets:
      - "BTCUSDT"
      - "ETHUSDT"
      - "SOLUSDT"
      - "ADAUSDT"
      - "DOTUSDT"
      - "LINKUSDT"
      - "AVAXUSDT"
      - "MATICUSDT"
  
  # Signals
  signals:
    high_correlation:
      description: "High asset correlation"
      conditions:
        - "correlation_>_0.7"
        - "both_moving_same_direction"
      action: "trade_together"
    
    low_correlation:
      description: "Low asset correlation"
      conditions:
        - "correlation_<_0.3"
        - "independent_movement"
      action: "trade_independently"
    
    correlation_break:
      description: "Correlation break"
      conditions:
        - "correlation_change_>_0.3"
        - "divergence_detected"
      action: "arbitrage"

# ----------------------------------------------------------------------------
# Sector Correlation
# ----------------------------------------------------------------------------
sector_correlation:
  enabled: true
  description: "Sector correlation configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_data_points: 20
    correlation_threshold: 0.4
    confidence_threshold: 0.7
  
  # Sectors
  sectors:
    - "crypto"
    - "defi"
    - "layer1"
    - "stable"
    - "meme"
  
  # Correlation matrix
  matrix:
    enabled: true
    sectors:
      - "crypto"
      - "defi"
      - "layer1"
      - "stable"
  
  # Signals
  signals:
    sector_correlation_high:
      description: "High sector correlation"
      conditions:
        - "sector_correlation_>_0.6"
        - "sector_movement_aligned"
      action: "sector_trade"
    
    sector_correlation_low:
      description: "Low sector correlation"
      conditions:
        - "sector_correlation_<_0.2"
        - "sector_divergence"
      action: "hedge"

# ----------------------------------------------------------------------------
# Market Correlation
# ----------------------------------------------------------------------------
market_correlation:
  enabled: true
  description: "Market correlation configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_data_points: 20
    correlation_threshold: 0.3
    confidence_threshold: 0.7
  
  # Markets
  markets:
    - "crypto"
    - "stocks"
    - "forex"
    - "commodities"
  
  # Correlation matrix
  matrix:
    enabled: true
    markets:
      - "crypto"
      - "stocks"
      - "forex"
  
  # Signals
  signals:
    market_correlation_high:
      description: "High market correlation"
      conditions:
        - "market_correlation_>_0.5"
        - "global_movement_aligned"
      action: "global_trade"
    
    market_correlation_low:
      description: "Low market correlation"
      conditions:
        - "market_correlation_<_0.2"
        - "market_divergence"
      action: "opportunistic_trade"

# ----------------------------------------------------------------------------
# Dynamic Correlation
# ----------------------------------------------------------------------------
dynamic_correlation:
  enabled: true
  description: "Dynamic correlation configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    window_period: 20
    correlation_threshold: 0.5
    confidence_threshold: 0.7
  
  # Calculation methods
  methods:
    - "rolling"
    - "ewma"
    - "kernel"
    - "regime_switching"
  
  # Detection
  detection:
    method: "rolling"
    min_data_points: 20
    max_data_points: 100
  
  # Signals
  signals:
    correlation_increase:
      description: "Increasing correlation"
      conditions:
        - "correlation_trend_up"
        - "correlation_>_threshold"
      confidence: 0.7
    
    correlation_decrease:
      description: "Decreasing correlation"
      conditions:
        - "correlation_trend_down"
        - "correlation_<_threshold"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Correlation Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Correlation-based trading signals"
  
  # Signal types
  types:
    correlation_buy:
      description: "Correlation buy signal"
      conditions:
        - "correlation_break_detected"
        - "correlation_expected_to_rise"
        - "volume_confirmation"
      confidence: 0.75
    
    correlation_sell:
      description: "Correlation sell signal"
      conditions:
        - "correlation_break_detected"
        - "correlation_expected_to_fall"
        - "volume_confirmation"
      confidence: 0.75
    
    correlation_hedge:
      description: "Correlation hedge signal"
      conditions:
        - "correlation_uncertain"
        - "correlation_expected_to_change"
        - "volume_confirmation"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "volume"
      - "momentum"
      - "price_action"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for correlation trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Correlation-based stop loss
    stop_loss:
      type: "correlation_based"
      threshold: 0.3
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for correlation trading"
  
  metrics:
    - "correlation_accuracy"
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_correlation_accuracy: 0.6
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/correlation_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    correlation: true
    debugging: false
