#
# Description: Complete CPI (Consumer Price Index) configuration for swing trading bot
# Framework: CPI Analysis - Inflation & Economic Impact Trading
# Version: 3.0.0
#
# The CPI configuration enables the bot to analyze and trade based on
# Consumer Price Index data, inflation expectations, and economic impact.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
cpi:
  enabled: true
  version: "3.0.0"
  description: "CPI Analysis for swing trading"
  
  # CPI types
  types:
    - "headline"
    - "core"
    - "producer"
    - "consumer"
    - "inflation_expectations"
  
  # Timeframes
  timeframes:
    - "1m"
    - "3m"
    - "6m"
    - "1y"
    - "2y"
  
  default_timeframe: "1m"
  
  # Data sources
  data_sources:
    - "bls"
    - "eurostat"
    - "ons"
    - "trading_economics"

# ----------------------------------------------------------------------------
# Headline CPI
# ----------------------------------------------------------------------------
headline_cpi:
  enabled: true
  description: "Headline CPI configuration"
  
  # Parameters
  parameters:
    lookback_period: 12  # months
    threshold: 0.02
    confidence_threshold: 0.7
  
  # Metrics
  metrics:
    monthly_change:
      enabled: true
      calculation: "percentage_change"
      lookback_period: 1
    
    annual_change:
      enabled: true
      calculation: "percentage_change"
      lookback_period: 12
    
    cpi_trend:
      enabled: true
      calculation: "moving_average"
      lookback_period: 6
  
  # Signals
  signals:
    cpi_rising:
      description: "CPI rising signal"
      conditions:
        - "cpi_annual_>_2%"
        - "cpi_monthly_>_0.2%"
        - "trend_increasing"
      confidence: 0.7
    
    cpi_falling:
      description: "CPI falling signal"
      conditions:
        - "cpi_annual_<_2%"
        - "cpi_monthly_<_0.1%"
        - "trend_decreasing"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Core CPI
# ----------------------------------------------------------------------------
core_cpi:
  enabled: true
  description: "Core CPI configuration"
  
  # Parameters
  parameters:
    lookback_period: 12  # months
    threshold: 0.02
    confidence_threshold: 0.7
  
  # Metrics
  metrics:
    monthly_change:
      enabled: true
      calculation: "percentage_change"
      lookback_period: 1
    
    annual_change:
      enabled: true
      calculation: "percentage_change"
      lookback_period: 12
    
    core_cpi_trend:
      enabled: true
      calculation: "moving_average"
      lookback_period: 6
  
  # Signals
  signals:
    core_cpi_rising:
      description: "Core CPI rising signal"
      conditions:
        - "core_cpi_annual_>_2%"
        - "core_cpi_monthly_>_0.2%"
        - "trend_increasing"
      confidence: 0.7
    
    core_cpi_falling:
      description: "Core CPI falling signal"
      conditions:
        - "core_cpi_annual_<_2%"
        - "core_cpi_monthly_<_0.1%"
        - "trend_decreasing"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Producer Price Index
# ----------------------------------------------------------------------------
producer_cpi:
  enabled: true
  description: "Producer Price Index configuration"
  
  # Parameters
  parameters:
    lookback_period: 12  # months
    threshold: 0.02
    confidence_threshold: 0.7
  
  # Metrics
  metrics:
    monthly_change:
      enabled: true
      calculation: "percentage_change"
      lookback_period: 1
    
    annual_change:
      enabled: true
      calculation: "percentage_change"
      lookback_period: 12
    
    ppi_trend:
      enabled: true
      calculation: "moving_average"
      lookback_period: 6
  
  # Signals
  signals:
    ppi_rising:
      description: "PPI rising signal"
      conditions:
        - "ppi_annual_>_2%"
        - "ppi_monthly_>_0.2%"
        - "trend_increasing"
      confidence: 0.7
    
    ppi_falling:
      description: "PPI falling signal"
      conditions:
        - "ppi_annual_<_2%"
        - "ppi_monthly_<_0.1%"
        - "trend_decreasing"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Inflation Expectations
# ----------------------------------------------------------------------------
inflation_expectations:
  enabled: true
  description: "Inflation expectations configuration"
  
  # Parameters
  parameters:
    lookback_period: 12  # months
    threshold: 0.02
    confidence_threshold: 0.7
  
  # Metrics
  metrics:
    breakeven_inflation:
      enabled: true
      calculation: "market_implied"
      lookback_period: 12
    
    survey_expectations:
      enabled: true
      calculation: "survey_mean"
      lookback_period: 12
    
    expectation_trend:
      enabled: true
      calculation: "moving_average"
      lookback_period: 6
  
  # Signals
  signals:
    inflation_expectations_rising:
      description: "Inflation expectations rising"
      conditions:
        - "breakeven_inflation_>_2%"
        - "survey_expectations_>_2%"
        - "trend_increasing"
      confidence: 0.7
    
    inflation_expectations_falling:
      description: "Inflation expectations falling"
      conditions:
        - "breakeven_inflation_<_2%"
        - "survey_expectations_<_2%"
        - "trend_decreasing"
      confidence: 0.7

# ----------------------------------------------------------------------------
# CPI Impact
# ----------------------------------------------------------------------------
cpi_impact:
  enabled: true
  description: "CPI impact configuration"
  
  # Parameters
  parameters:
    lookback_period: 12  # months
    threshold: 0.02
    confidence_threshold: 0.7
  
  # Impact metrics
  metrics:
    market_reaction:
      enabled: true
      calculation: "price_change"
      lookback_period: 1
    
    volatility_impact:
      enabled: true
      calculation: "volatility_change"
      lookback_period: 1
    
    sector_impact:
      enabled: true
      calculation: "sector_performance"
      lookback_period: 1
  
  # Signals
  signals:
    cpi_market_reaction:
      description: "CPI market reaction signal"
      conditions:
        - "cpi_data_released"
        - "market_reaction_significant"
        - "volume_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# CPI Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "CPI-based trading signals"
  
  # Signal types
  types:
    cpi_buy:
      description: "CPI buy signal"
      conditions:
        - "cpi_below_expectations"
        - "inflation_expectations_falling"
        - "market_reaction_positive"
        - "volume_confirmation"
      confidence: 0.7
    
    cpi_sell:
      description: "CPI sell signal"
      conditions:
        - "cpi_above_expectations"
        - "inflation_expectations_rising"
        - "market_reaction_negative"
        - "volume_confirmation"
      confidence: 0.7
    
    cpi_hedge:
      description: "CPI hedge signal"
      conditions:
        - "cpi_uncertain"
        - "inflation_expectations_uncertain"
        - "market_reaction_mixed"
        - "volume_confirmation"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for CPI trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # CPI-based stop loss
    stop_loss:
      type: "cpi_based"
      threshold: 0.02
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for CPI trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/cpi_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    cpi: true
    debugging: false
