# Swing Bot Reporting Engine Configuration
# Core Reporting Engine & Report Generation Parameters

# General Reporting Engine Settings
reporting_engine:
  enabled: true
  engine_mode: "automated"  # automated, scheduled, on_demand, hybrid
  report_paradigm: "multi_format"  # multi_format, single_format, adaptive
  engine_level: "advanced"  # basic, intermediate, advanced, expert
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "data_collector"
    - "data_processor"
    - "report_generator"
    - "report_formatter"
    - "report_distributor"
    - "template_engine"
    - "visualization_engine"
    - "performance_tracker"
    - "quality_checker"
    - "archive_manager"
  module_interaction: "pipeline"  # pipeline, event_driven, message_based
  parallel_execution: true
  max_workers: 8
  pipeline_buffer_size: 10000

# Data Collector
data_collector:
  enabled: true
  data_sources:
    - "trading_data"
    - "execution_data"
    - "risk_data"
    - "portfolio_data"
    - "market_data"
    - "performance_data"
    - "compliance_data"
    - "operational_data"
  collection_frequency: "real_time"  # real_time, scheduled, batch
  data_quality_check: true
  data_validation: true
  data_enrichment: true

# Data Processor
data_processor:
  enabled: true
  processing_steps:
    - "data_cleaning"
    - "data_aggregation"
    - "data_calculation"
    - "data_normalization"
    - "data_transformation"
    - "data_summarization"
    - "data_analysis"
  aggregation_levels:
    - "tick"
    - "minute"
    - "hourly"
    - "daily"
    - "weekly"
    - "monthly"
    - "quarterly"
    - "annual"
  calculation_methods: "accurate"

# Report Generator
report_generator:
  enabled: true
  report_types:
    - "trading_report"
    - "execution_report"
    - "risk_report"
    - "performance_report"
    - "portfolio_report"
    - "compliance_report"
    - "market_report"
    - "operational_report"
    - "summary_report"
    - "detailed_report"
  generation_frequency:
    real_time: true
    hourly: true
    daily: true
    weekly: true
    monthly: true
    quarterly: true
    annual: true
  parallel_generation: true

# Report Formatter
report_formatter:
  enabled: true
  formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
    - "markdown"
    - "xml"
    - "text"
    - "dashboard"
  primary_formats: ["pdf", "html", "excel"]
  formatting_options:
    - "page_layout"
    - "fonts"
    - "colors"
    - "tables"
    - "charts"
    - "headers"
    - "footers"
    - "watermarks"
  customization: true

# Report Distributor
report_distributor:
  enabled: true
  distribution_methods:
    - "email"
    - "api"
    - "webhook"
    - "sftp"
    - "ftp"
    - "cloud_storage"
    - "dashboard"
  distribution_channels:
    - "trading_team"
    - "risk_team"
    - "management"
    - "compliance"
    - "regulatory"
    - "clients"
  distribution_schedule:
    real_time: true
    hourly: true
    daily: true
    weekly: true
    monthly: true
    on_demand: true
  compression: true
  encryption: true

# Template Engine
template_engine:
  enabled: true
  template_types:
    - "standard_templates"
    - "custom_templates"
    - "branded_templates"
    - "regulatory_templates"
  template_language: "jinja2"
  template_variables:
    - "date"
    - "time"
    - "company_name"
    - "report_type"
    - "data_summary"
    - "charts"
    - "tables"
  template_customization: true
  template_versioning: true

# Visualization Engine
visualization_engine:
  enabled: true
  chart_types:
    - "line_charts"
    - "bar_charts"
    - "pie_charts"
    - "candlestick_charts"
    - "heatmaps"
    - "scatter_plots"
    - "histograms"
    - "gantt_charts"
    - "radar_charts"
    - "waterfall_charts"
  visualization_libraries:
    - "matplotlib"
    - "seaborn"
    - "plotly"
    - "highcharts"
    - "d3"
  interactive_visualizations: true
  dashboard_integration: true

# Performance Tracker
performance_tracker:
  enabled: true
  tracking_metrics:
    - "report_generation_time"
    - "report_accuracy"
    - "data_completeness"
    - "distribution_success_rate"
    - "report_quality"
    - "user_satisfaction"
  tracking_frequency: "daily"
  alert_thresholds:
    generation_time_ms: 5000
    accuracy_min: 0.95
    completeness_min: 0.98
    success_rate_min: 0.99

# Quality Checker
quality_checker:
  enabled: true
  quality_checks:
    - "data_accuracy"
    - "data_completeness"
    - "data_consistency"
    - "format_correctness"
    - "visualization_quality"
    - "content_relevance"
  check_frequency: "on_generation"
  quality_thresholds:
    accuracy: 0.98
    completeness: 0.99
    consistency: 0.95
  quality_reporting: true

# Archive Manager
archive_manager:
  enabled: true
  archive_methods:
    - "database"
    - "filesystem"
    - "cloud_storage"
    - "s3"
    - "azure_blob"
    - "gcs"
  retention_period:
    daily: 30
    weekly: 90
    monthly: 365
    quarterly: 730
    annual: 3650
  compression: "zstd"
  encryption: true
  indexing: true

# Report Types
report_types_config:
  enabled: true
  trading_report:
    enabled: true
    frequency: "daily"
    format: ["pdf", "html"]
    recipients: ["trading_team", "management"]
    sections:
      - "executive_summary"
      - "performance_metrics"
      - "trade_summary"
      - "risk_metrics"
      - "market_analysis"
      - "recommendations"
  execution_report:
    enabled: true
    frequency: "daily"
    format: ["pdf", "excel"]
    recipients: ["trading_team", "execution_team"]
    sections:
      - "execution_summary"
      - "slippage_analysis"
      - "market_impact"
      - "fill_rates"
      - "venue_analysis"
  risk_report:
    enabled: true
    frequency: "daily"
    format: ["pdf", "html"]
    recipients: ["risk_team", "management", "compliance"]
    sections:
      - "risk_summary"
      - "var_analysis"
      - "drawdown_analysis"
      - "concentration_analysis"
      - "stress_testing"
  performance_report:
    enabled: true
    frequency: "weekly"
    format: ["pdf", "excel", "html"]
    recipients: ["trading_team", "management"]
    sections:
      - "performance_summary"
      - "returns_analysis"
      - "risk_adjusted_metrics"
      - "benchmark_comparison"
      - "attribution_analysis"
  portfolio_report:
    enabled: true
    frequency: "weekly"
    format: ["pdf", "excel"]
    recipients: ["portfolio_team", "management", "clients"]
    sections:
      - "portfolio_summary"
      - "allocation_analysis"
      - "position_analysis"
      - "performance_metrics"
      - "risk_metrics"
  compliance_report:
    enabled: true
    frequency: "monthly"
    format: ["pdf"]
    recipients: ["compliance_team", "management", "regulatory"]
    sections:
      - "compliance_summary"
      - "regulatory_metrics"
      - "limit_analysis"
      - "audit_trail"
      - "reporting_requirements"

# Custom Reports
custom_reports:
  enabled: true
  custom_fields:
    - "user_defined_metrics"
    - "custom_calculations"
    - "user_filters"
    - "user_sorting"
  report_builder: true
  drag_and_drop: true
  template_save: true

# Visualization
visualization:
  enabled: true
  charts:
    - "report_dashboard"
    - "performance_chart"
    - "risk_chart"
    - "execution_chart"
    - "portfolio_chart"
    - "compliance_chart"
  update_interval_seconds: 30
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "report_generation_failure"
    - "distribution_failure"
    - "quality_breach"
    - "performance_degradation"
    - "data_incompleteness"
    - "archiving_failure"
  alert_thresholds:
    generation_failure: 1
    quality_breach: 0.90
    performance_degradation: 30
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600

# Storage
storage:
  enabled: true
  storage_categories:
    - "report_data"
    - "generated_reports"
    - "templates"
    - "archives"
    - "quality_data"
    - "performance_data"
    - "distribution_logs"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/reporting-engine"
  api_endpoint: "/api/v1/reporting/engine"
  dashboard_url: "http://localhost:3000/reporting-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "compliance_system"
    - "dashboard_platform"
    - "storage_system"
