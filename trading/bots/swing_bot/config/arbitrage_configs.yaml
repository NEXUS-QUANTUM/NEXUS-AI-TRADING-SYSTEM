# ============================================================================
#
# Description: Complete Arbitrage configuration for swing trading bot
# Framework: Arbitrage Trading - Multi-Exchange & Cross-Asset Arbitrage
# Version: 3.0.0
#
# The Arbitrage configuration enables the bot to identify and execute
# arbitrage opportunities across multiple exchanges and assets.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
arbitrage:
  enabled: true
  version: "3.0.0"
  description: "Arbitrage Trading for swing trading"
  
  # Arbitrage types
  types:
    - "cross_exchange"
    - "triangular"
    - "statistical"
    - "futures_spot"
    - "options_arbitrage"
    - "cross_chain"
    - "dex_cex"
  
  # Exchanges
  exchanges:
    - "binance"
    - "bybit"
    - "okx"
    - "kraken"
    - "coinbase"
    - "gate"
    - "huobi"
    - "kucoin"
    - "bitfinex"
    - "deribit"
  
  # Assets
  assets:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "ADAUSDT"
    - "DOTUSDT"
    - "AVAXUSDT"
    - "MATICUSDT"
    - "LINKUSDT"

# ----------------------------------------------------------------------------
# Cross-Exchange Arbitrage
# ----------------------------------------------------------------------------
cross_exchange:
  enabled: true
  description: "Cross-exchange arbitrage configuration"
  
  # Parameters
  parameters:
    min_profit_percent: 0.1
    max_profit_percent: 5.0
    min_trade_size: 100
    max_trade_size: 10000
    max_exposure: 100000
    max_positions: 10
    
    # Timing parameters
    max_latency: 1000  # milliseconds
    min_profit_time: 5  # seconds
    max_hold_time: 60  # seconds
    
    # Risk parameters
    max_slippage: 0.001
    max_price_deviation: 0.005
    min_liquidity: 10000
  
  # Exchange pairs
  pairs:
    - exchange1: "binance"
      exchange2: "bybit"
      assets:
        - "BTCUSDT"
        - "ETHUSDT"
        - "SOLUSDT"
    
    - exchange1: "binance"
      exchange2: "kraken"
      assets:
        - "BTCUSDT"
        - "ETHUSDT"
    
    - exchange1: "bybit"
      exchange2: "okx"
      assets:
        - "SOLUSDT"
        - "ADAUSDT"
  
  # Detection
  detection:
    enabled: true
    scan_interval: 1  # seconds
    max_opportunities: 100
    min_price_change: 0.0001
    price_check_interval: 0.5  # seconds

# ----------------------------------------------------------------------------
# Triangular Arbitrage
# ----------------------------------------------------------------------------
triangular:
  enabled: true
  description: "Triangular arbitrage configuration"
  
  # Parameters
  parameters:
    min_profit_percent: 0.05
    max_profit_percent: 2.0
    min_trade_size: 100
    max_trade_size: 5000
    max_exposure: 50000
    max_positions: 5
    
    # Timing parameters
    max_latency: 500  # milliseconds
    min_profit_time: 3  # seconds
    max_hold_time: 30  # seconds
    
    # Risk parameters
    max_slippage: 0.001
    max_price_deviation: 0.003
    min_liquidity: 5000
  
  # Currency pairs
  currency_pairs:
    - pairs:
        - "BTCUSDT"
        - "ETHUSDT"
        - "BTCETH"
      exchange: "binance"
    
    - pairs:
        - "SOLUSDT"
        - "ADAUSDT"
        - "SOLADA"
      exchange: "bybit"
    
    - pairs:
        - "AVAXUSDT"
        - "MATICUSDT"
        - "AVAXMATIC"
      exchange: "okx"
  
  # Detection
  detection:
    enabled: true
    scan_interval: 1  # seconds
    max_opportunities: 50
    min_price_change: 0.0001
    price_check_interval: 0.5  # seconds

# ----------------------------------------------------------------------------
# Statistical Arbitrage
# ----------------------------------------------------------------------------
statistical:
  enabled: true
  description: "Statistical arbitrage configuration"
  
  # Parameters
  parameters:
    min_profit_percent: 0.2
    max_profit_percent: 3.0
    min_trade_size: 1000
    max_trade_size: 50000
    max_exposure: 100000
    max_positions: 20
    
    # Statistical parameters
    lookback_period: 50
    entry_zscore: 2.0
    exit_zscore: 0.5
    correlation_threshold: 0.7
    cointegration_test: true
    p_value_threshold: 0.05
  
  # Asset pairs
  asset_pairs:
    - asset1: "BTCUSDT"
      asset2: "ETHUSDT"
      exchange: "binance"
      hedge_ratio: 0.5
    
    - asset1: "SOLUSDT"
      asset2: "ADAUSDT"
      exchange: "bybit"
      hedge_ratio: 0.6
    
    - asset1: "DOTUSDT"
      asset2: "LINKUSDT"
      exchange: "kraken"
      hedge_ratio: 0.55
  
  # Detection
  detection:
    enabled: true
    scan_interval: 5  # seconds
    max_opportunities: 50
    min_price_change: 0.0001
    price_check_interval: 1  # seconds

# ----------------------------------------------------------------------------
# Futures-Spot Arbitrage
# ----------------------------------------------------------------------------
futures_spot:
  enabled: true
  description: "Futures-spot arbitrage configuration"
  
  # Parameters
  parameters:
    min_profit_percent: 0.15
    max_profit_percent: 4.0
    min_trade_size: 1000
    max_trade_size: 50000
    max_exposure: 100000
    max_positions: 10
    
    # Timing parameters
    max_hold_time: 3600  # seconds
    min_profit_time: 60  # seconds
    funding_rate_interval: 480  # minutes
    
    # Risk parameters
    max_slippage: 0.001
    max_price_deviation: 0.005
    min_liquidity: 10000
  
  # Assets
  assets:
    - asset: "BTCUSDT"
      exchange: "binance"
      futures_expiry: "quarterly"
    
    - asset: "ETHUSDT"
      exchange: "bybit"
      futures_expiry: "quarterly"
    
    - asset: "SOLUSDT"
      exchange: "okx"
      futures_expiry: "quarterly"
  
  # Detection
  detection:
    enabled: true
    scan_interval: 10  # seconds
    max_opportunities: 50
    min_price_change: 0.0001
    price_check_interval: 5  # seconds

# ----------------------------------------------------------------------------
# Cross-Chain Arbitrage
# ----------------------------------------------------------------------------
cross_chain:
  enabled: true
  description: "Cross-chain arbitrage configuration"
  
  # Parameters
  parameters:
    min_profit_percent: 0.5
    max_profit_percent: 10.0
    min_trade_size: 1000
    max_trade_size: 50000
    max_exposure: 100000
    max_positions: 5
    
    # Timing parameters
    max_hold_time: 600  # seconds
    min_profit_time: 30  # seconds
    bridge_timeout: 300  # seconds
    
    # Risk parameters
    max_slippage: 0.005
    max_price_deviation: 0.02
    min_liquidity: 10000
  
  # Chains
  chains:
    - chain1: "ethereum"
      chain2: "binance"
      assets:
        - "BTC"
        - "ETH"
        - "USDC"
    
    - chain1: "solana"
      chain2: "ethereum"
      assets:
        - "SOL"
        - "USDC"
    
    - chain1: "polygon"
      chain2: "ethereum"
      assets:
        - "MATIC"
        - "USDC"
  
  # Detection
  detection:
    enabled: true
    scan_interval: 10  # seconds
    max_opportunities: 20
    min_price_change: 0.001
    price_check_interval: 5  # seconds

# ----------------------------------------------------------------------------
# DEX-CEX Arbitrage
# ----------------------------------------------------------------------------
dex_cex:
  enabled: true
  description: "DEX-CEX arbitrage configuration"
  
  # Parameters
  parameters:
    min_profit_percent: 0.3
    max_profit_percent: 8.0
    min_trade_size: 500
    max_trade_size: 30000
    max_exposure: 50000
    max_positions: 5
    
    # Timing parameters
    max_hold_time: 300  # seconds
    min_profit_time: 20  # seconds
    swap_timeout: 60  # seconds
    
    # Risk parameters
    max_slippage: 0.005
    max_price_deviation: 0.01
    min_liquidity: 5000
  
  # DEXs
  dexes:
    - "uniswap"
    - "pancakeswap"
    - "sushiswap"
    - "curve"
    - "balancer"
  
  # CEXs
  cexes:
    - "binance"
    - "bybit"
    - "kraken"
  
  # Assets
  assets:
    - asset: "BTC"
      networks:
        - "ethereum"
        - "binance"
    
    - asset: "ETH"
      networks:
        - "ethereum"
        - "binance"
    
    - asset: "USDC"
      networks:
        - "ethereum"
        - "binance"
        - "polygon"
        - "solana"
  
  # Detection
  detection:
    enabled: true
    scan_interval: 5  # seconds
    max_opportunities: 30
    min_price_change: 0.001
    price_check_interval: 2  # seconds

# ----------------------------------------------------------------------------
# Execution Parameters
# ----------------------------------------------------------------------------
execution:
  enabled: true
  description: "Execution parameters for arbitrage"
  
  # Order types
  order_types:
    - "market"
    - "limit"
    - "stop_limit"
    - "iceberg"
  
  # Execution rules
  rules:
    parallel_execution:
      enabled: true
      max_parallel: 5
      timeout: 10  # seconds
    
    order_splitting:
      enabled: true
      min_order_size: 100
      max_order_size: 1000
    
    retry:
      enabled: true
      max_retries: 3
      retry_delay: 1  # seconds

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for arbitrage"
  
  # Risk parameters
  parameters:
    max_daily_loss: 1000
    max_position_loss: 100
    max_drawdown: 0.05
    max_correlation: 0.7
    
    # Stop loss
    stop_loss:
      enabled: true
      type: "fixed"
      percentage: 0.5
      max_loss: 50
    
    # Take profit
    take_profit:
      enabled: true
      type: "fixed"
      percentage: 2.0
      min_profit: 10

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for arbitrage"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
    - "arbitrage_opportunities"
    - "execution_time"
  
  targets:
    min_win_rate: 0.7
    min_profit_factor: 1.5
    min_sharpe_ratio: 1.0
    max_max_drawdown: 0.05

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/arbitrage_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    opportunities: true
    executions: true
    errors: true
    performance: true
    debugging: false
