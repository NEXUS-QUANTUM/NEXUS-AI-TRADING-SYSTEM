# Swing Bot Optimization Configuration
# Performance Optimization & Strategy Tuning Parameters

# General Optimization Settings
optimization:
  enabled: true
  optimization_mode: "adaptive"  # adaptive, scheduled, manual, continuous
  objective_function: "maximize_sharpe"  # maximize_sharpe, minimize_drawdown, maximize_win_rate, maximize_profit
  optimization_engine: "multi_objective"  # single_objective, multi_objective, pareto
  version: "3.0.0"

# Optimization Objectives
objectives:
  enabled: true
  primary_objectives:
    - "maximize_sharpe_ratio"
    - "maximize_total_return"
    - "minimize_maximum_drawdown"
    - "maximize_win_rate"
    - "maximize_profit_factor"
    - "minimize_volatility"
    - "maximize_calmar_ratio"
    - "maximize_sortino_ratio"
  secondary_objectives:
    - "minimize_turnover"
    - "maximize_consistency"
    - "minimize_risk"
    - "maximize_diversification"
    - "maximize_efficiency"
  objective_weights:
    primary: 0.80
    secondary: 0.20
  multi_objective_balance: "pareto"  # pareto, weighted_sum, lexicographic

# Optimization Algorithms
algorithms:
  enabled: true
  available_algorithms:
    - "genetic_algorithm"
    - "particle_swarm"
    - "differential_evolution"
    - "bayesian_optimization"
    - "gradient_descent"
    - "simulated_annealing"
    - "ant_colony"
    - "grey_wolf_optimizer"
    - "whale_optimization"
    - "firefly_algorithm"
    - "teaching_learning_based"
    - "neural_network_optimization"
  primary_algorithm: "genetic_algorithm"
  secondary_algorithm: "particle_swarm"
  algorithm_switching: true
  algorithm_switching_condition: "stagnation"

# Genetic Algorithm
genetic:
  enabled: true
  population_size: 100
  generations: 50
  mutation_rate: 0.10
  crossover_rate: 0.80
  selection_method: "tournament"  # tournament, roulette, rank, steady_state
  tournament_size: 5
  elitism_rate: 0.10
  crossover_method: "uniform"  # uniform, single_point, two_point, arithmetic
  mutation_method: "gaussian"  # gaussian, uniform, adaptive
  convergence_threshold: 0.001
  stagnation_limit: 10
  early_stopping: true
  parallel_evaluation: true

# Particle Swarm Optimization
pso:
  enabled: true
  swarm_size: 50
  iterations: 100
  cognitive_parameter: 1.50
  social_parameter: 1.50
  inertia_weight: 0.70
  inertia_weight_damping: 0.99
  velocity_clamp: true
  max_velocity: 0.50
  convergence_threshold: 0.001
  stagnation_limit: 20
  topology: "global"  # global, local, ring, star
  neighborhood_size: 3

# Bayesian Optimization
bayesian:
  enabled: true
  acquisition_function: "ei"  # ei, ucb, pi, pof
  exploration_exploitation_tradeoff: 0.10
  gaussian_process: true
  gp_kernel: "matern"  # matern, rbf, rational_quadratic
  n_initial_points: 10
  n_iterations: 100
  convergence_threshold: 0.001
  early_stopping: true
  parallel_execution: true

# Parameter Space
parameter_space:
  enabled: true
  strategy_parameters:
    - name: "momentum_fast_period"
      type: "integer"
      range: [5, 50]
      step: 1
      distribution: "uniform"
    - name: "momentum_slow_period"
      type: "integer"
      range: [20, 200]
      step: 1
      distribution: "uniform"
    - name: "stop_loss_percent"
      type: "float"
      range: [0.005, 0.05]
      step: 0.001
      distribution: "uniform"
    - name: "take_profit_percent"
      type: "float"
      range: [0.01, 0.10]
      step: 0.001
      distribution: "uniform"
    - name: "position_size_percent"
      type: "float"
      range: [0.01, 0.10]
      step: 0.005
      distribution: "uniform"
    - name: "rsi_period"
      type: "integer"
      range: [7, 21]
      step: 1
      distribution: "uniform"
    - name: "bb_period"
      type: "integer"
      range: [10, 30]
      step: 1
      distribution: "uniform"
    - name: "bb_std_dev"
      type: "float"
      range: [1.5, 3.0]
      step: 0.1
      distribution: "uniform"
    - name: "adx_period"
      type: "integer"
      range: [10, 20]
      step: 1
      distribution: "uniform"
    - name: "adx_threshold"
      type: "integer"
      range: [20, 40]
      step: 1
      distribution: "uniform"
  parameter_interactions: true
  constraints: true
  dependency_structure: true

# Constraints
constraints:
  enabled: true
  hard_constraints:
    - "max_drawdown_less_than_0.15"
    - "min_sharpe_ratio_greater_than_0.50"
    - "max_position_size_less_than_0.10"
    - "min_win_rate_greater_than_0.40"
  soft_constraints:
    - "max_turnover_less_than_5.0"
    - "min_profit_factor_greater_than_1.50"
    - "max_correlation_less_than_0.70"
  penalty_functions: true
  constraint_hierarchy: true

# Walk-Forward Optimization
walk_forward:
  enabled: true
  window_size_bars: 1000
  step_size_bars: 100
  validation_size_bars: 200
  optimization_periods: 10
  out_of_sample_testing: true
  rolling_window: true
  anchoring: "in_sample"  # in_sample, expanding_window, rolling_window
  performance_evaluation: "average"  # average, best, weighted

# Genetic Programming
genetic_programming:
  enabled: true
  population_size: 100
  generations: 50
  tree_depth_min: 2
  tree_depth_max: 8
  crossover_probability: 0.80
  mutation_probability: 0.10
  reproduction_probability: 0.10
  tournament_size: 5
  functions:
    - "add"
    - "subtract"
    - "multiply"
    - "divide"
    - "sin"
    - "cos"
    - "exp"
    - "log"
    - "sqrt"
    - "power"
  terminals:
    - "price"
    - "volume"
    - "rsi"
    - "macd"
    - "bb_upper"
    - "bb_lower"
    - "atr"
    - "adx"
  fitness_measure: "sharpe_ratio"

# Performance Evaluation
performance_evaluation:
  enabled: true
  evaluation_metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "omega_ratio"
    - "sterling_ratio"
    - "burke_ratio"
    - "martin_ratio"
    - "information_ratio"
    - "treynor_ratio"
    - "capture_ratio"
  evaluation_period_days: 30
  rollover_period_days: 10
  confidence_interval: 0.95
  statistical_significance: true
  robustness_analysis: true

# Backtesting Integration
backtesting:
  enabled: true
  backtest_engine: "custom"  # custom, vectorized, event_driven
  data_frequency: "minute"  # tick, second, minute, hour, day
  data_quality_checks: true
  transaction_costs: true
  slippage_model: true
  execution_delay_ms: 100
  fill_model: "probabilistic"  # probabilistic, immediate, delayed
  benchmark_comparison: true

# Parallel Computing
parallel:
  enabled: true
  max_workers: 8
  parallelization_method: "multiprocessing"  # multiprocessing, threading, distributed
  task_distribution: "load_balanced"  # load_balanced, sequential, round_robin
  resource_allocation: "dynamic"  # dynamic, fixed, priority_based
  memory_sharing: true
  fault_tolerance: true
  checkpoint_frequency: 10

# Convergence Detection
convergence:
  enabled: true
  convergence_metrics:
    - "objective_improvement"
    - "population_diversity"
    - "parameter_stability"
    - "standard_deviation"
  improvement_threshold: 0.001
  diversity_threshold: 0.05
  stability_window: 10
  min_generations: 20
  max_generations: 100
  convergence_action: "stop"  # stop, continue, restart

# Visualization
visualization:
  enabled: true
  charts:
    - "optimization_progress"
    - "parameter_heatmap"
    - "performance_dashboard"
    - "convergence_plot"
    - "pareto_front"
    - "backtest_results"
  update_interval_seconds: 10
  dashboard_integration: true
  real_time_updates: true

# Reporting
reporting:
  enabled: true
  report_types:
    - "optimization_summary"
    - "parameter_analysis"
    - "performance_evaluation"
    - "convergence_report"
    - "pareto_analysis"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "strategy@example.com"
  report_automation: true

# Storage
storage:
  enabled: true
  storage_categories:
    - "optimization_results"
    - "parameter_sets"
    - "performance_metrics"
    - "backtest_results"
    - "convergence_data"
    - "pareto_solutions"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/optimization"
  api_endpoint: "/api/v1/trading/optimization"
  dashboard_url: "http://localhost:3000/optimization"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "backtesting_engine"
    - "research_platform"
    - "mlflow"

# Logging
logging:
  enabled: true
  log_level: "info"
  log_categories:
    - "optimization"
    - "evaluation"
    - "convergence"
    - "performance"
    - "errors"
  log_rotation: true
  max_log_size_mb: 100
  retention_days: 30

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "optimization_complete"
    - "convergence_achieved"
    - "performance_threshold_met"
    - "optimization_failure"
    - "constraint_violation"
    - "stagnation_detected"
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 600
