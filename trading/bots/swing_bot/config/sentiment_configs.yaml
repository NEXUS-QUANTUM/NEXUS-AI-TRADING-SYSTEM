# Swing Bot Sentiment Analysis Configuration
# Market Sentiment Analysis & Trading Parameters

# General Sentiment Settings
sentiment:
  enabled: true
  analysis_mode: "comprehensive"  # comprehensive, basic, advanced, real-time
  sentiment_type: "market"  # market, sector, asset, economic, hybrid
  data_sources:
    - "news"
    - "social_media"
    - "market_data"
    - "economic_data"
    - "alternative_data"
  version: "3.0.0"

# Sentiment Components
components:
  enabled: true
  primary_components:
    - "news_sentiment"
    - "social_sentiment"
    - "market_sentiment"
    - "economic_sentiment"
    - "investor_sentiment"
    - "institutional_sentiment"
  secondary_components:
    - "technical_sentiment"
    - "fundamental_sentiment"
    - "retail_sentiment"
    - "smart_money_sentiment"
    - "arbitrage_sentiment"
  component_weights:
    news_sentiment: 0.20
    social_sentiment: 0.15
    market_sentiment: 0.15
    economic_sentiment: 0.15
    investor_sentiment: 0.15
    institutional_sentiment: 0.10
    technical_sentiment: 0.05
    fundamental_sentiment: 0.05

# News Sentiment
news_sentiment:
  enabled: true
  news_sources:
    - "bloomberg"
    - "reuters"
    - "wsj"
    - "ft"
    - "cnbc"
    - "yahoo_finance"
    - "seeking_alpha"
    - "motley_fool"
  sentiment_models:
    - "finbert"
    - "bloomberg_bert"
    - "custom_news_model"
    - "ensemble_news_model"
  update_frequency_minutes: 5
  confidence_threshold: 0.70
  news_importance_weighting: true

# Social Sentiment
social_sentiment:
  enabled: true
  social_platforms:
    - "twitter"
    - "reddit"
    - "stocktwits"
    - "telegram"
    - "discord"
    - "youtube"
    - "linkedin"
  sentiment_models:
    - "custom_social_model"
    - "bert_social_model"
    - "lstm_social_model"
    - "ensemble_social_model"
  update_frequency_minutes: 5
  confidence_threshold: 0.70
  influencer_weighting: true

# Market Sentiment
market_sentiment:
  enabled: true
  sentiment_indicators:
    - "fear_greed_index"
    - "put_call_ratio"
    - "vix_index"
    - "vix_curve"
    - "margin_debt"
    - "short_interest"
    - "market_breadth"
    - "advance_decline_line"
  sentiment_thresholds:
    extreme_fear: 20
    fear: 40
    neutral: 50
    greed: 60
    extreme_greed: 80
  update_frequency_minutes: 15

# Economic Sentiment
economic_sentiment:
  enabled: true
  economic_indicators:
    - "consumer_confidence"
    - "business_confidence"
    - "pmi_sentiment"
    - "economic_surprise_index"
    - "inflation_sentiment"
    - "employment_sentiment"
  sentiment_sources:
    - "survey_data"
    - "economic_reports"
    - "central_bank_communications"
    - "analyst_forecasts"
  update_frequency_hours: 6

# Investor Sentiment
investor_sentiment:
  enabled: true
  investor_indicators:
    - "institutional_sentiment"
    - "retail_sentiment"
    - "smart_money_sentiment"
    - "contrarian_sentiment"
    - "momentum_sentiment"
    - "value_sentiment"
    - "growth_sentiment"
    - "defensive_sentiment"
  sentiment_measurement: "survey_based"  # survey_based, behavior_based, hybrid
  update_frequency_hours: 24

# Institutional Sentiment
institutional_sentiment:
  enabled: true
  institutional_indicators:
    - "hedge_fund_sentiment"
    - "mutual_fund_sentiment"
    - "pension_fund_sentiment"
    - "sovereign_fund_sentiment"
    - "insider_sentiment"
  detection_methods:
    - "position_analysis"
    - "flow_analysis"
    - "trade_analysis"
    - "filings_analysis"
  update_frequency_days: 1

# Sentiment Aggregation
aggregation:
  enabled: true
  aggregation_methods:
    - "weighted_average"
    - "voting"
    - "consensus"
    - "majority"
  primary_method: "weighted_average"
  aggregation_weights:
    news_sentiment: 0.20
    social_sentiment: 0.15
    market_sentiment: 0.15
    economic_sentiment: 0.15
    investor_sentiment: 0.15
    institutional_sentiment: 0.10
    technical_sentiment: 0.05
    fundamental_sentiment: 0.05
  confidence_threshold: 0.70

# Sentiment Indicators
indicators:
  enabled: true
  primary_indicators:
    - "overall_sentiment_score"
    - "sector_sentiment_score"
    - "asset_sentiment_score"
    - "market_sentiment_score"
    - "economic_sentiment_score"
  secondary_indicators:
    - "sentiment_velocity"
    - "sentiment_acceleration"
    - "sentiment_divergence"
    - "sentiment_consensus"
    - "sentiment_volatility"
  indicator_weights:
    overall_sentiment_score: 0.30
    sector_sentiment_score: 0.20
    asset_sentiment_score: 0.15
    market_sentiment_score: 0.15
    economic_sentiment_score: 0.10
    sentiment_velocity: 0.10

# Sentiment Signals
signals:
  enabled: true
  signal_types:
    - "sentiment_bullish"
    - "sentiment_bearish"
    - "sentiment_shift"
    - "sentiment_extreme"
    - "sentiment_divergence"
    - "sentiment_reversal"
  signal_strength_calculation: "weighted_average"
  min_signal_strength: 0.60
  signal_confidence_threshold: 0.70

# Trading Strategies
strategies:
  enabled: true
  sentiment_strategies:
    - "sentiment_following"
    - "sentiment_contrarian"
    - "sentiment_shift_trading"
    - "sentiment_extreme_trading"
    - "sentiment_divergence_trading"
  strategy_selection: "context_based"
  strategy_confidence_threshold: 0.70

# Risk Management
risk_management:
  enabled: true
  risk_limits:
    sentiment_risk: 0.20
    shift_risk: 0.15
    extreme_risk: 0.10
  position_sizing: "sentiment_based"
  stop_loss_adjustment: true
  take_profit_adjustment: true

# Visualization
visualization:
  enabled: true
  charts:
    - "sentiment_dashboard"
    - "sentiment_trend_chart"
    - "sector_sentiment_chart"
    - "indicator_dashboard"
    - "signal_chart"
    - "divergence_chart"
    - "correlation_chart"
  update_interval_seconds: 30
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "sentiment_extreme"
    - "sentiment_shift"
    - "sentiment_divergence"
    - "sentiment_signal"
    - "indicator_extreme"
    - "consensus_break"
  alert_thresholds:
    sentiment_extreme: 0.80
    sentiment_shift: 0.30
    signal_confidence: 0.70
    indicator_extreme: 0.90
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_sentiment_summary"
    - "weekly_sentiment_analysis"
    - "monthly_sentiment_report"
    - "sector_sentiment_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "risk@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "sentiment_data"
    - "indicator_data"
    - "signal_history"
    - "trade_history"
    - "performance_metrics"
    - "alert_history"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/sentiment"
  api_endpoint: "/api/v1/trading/sentiment"
  dashboard_url: "http://localhost:3000/sentiment"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "strategy_engine"
    - "news_platform"
    - "social_media_platform"
