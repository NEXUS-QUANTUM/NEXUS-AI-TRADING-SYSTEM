# Swing Bot Continuous Improvement Configuration
# Self-Learning & Performance Enhancement Parameters

# General Improvement Settings
improvement:
  enabled: true
  mode: "adaptive"  # adaptive, scheduled, continuous
  learning_rate: 0.01
  improvement_cycle_hours: 24
  performance_threshold: 0.75
  version: "3.0.0"

# Performance Analysis
performance_analysis:
  evaluation_metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "win_rate"
    - "profit_factor"
    - "average_return"
    - "max_drawdown"
    - "recovery_factor"
    - "ulcer_index"
    - "omega_ratio"
    - "information_ratio"
    - "treynor_ratio"
  lookback_period_days: 90
  rolling_window_days: 30
  benchmarking: true
  peer_comparison: true
  historical_performance_analysis: true

# Self-Assessment
self_assessment:
  enabled: true
  assessment_frequency_hours: 6
  assessment_dimensions:
    - "strategy_performance"
    - "risk_management"
    - "execution_quality"
    - "market_adaptation"
    - "decision_making"
    - "resource_utilization"
    - "system_health"
  scoring_method: "weighted_average"
  minimum_acceptable_score: 0.60
  critical_failure_threshold: 0.40
  assessment_automation: true

# Strategy Improvement
strategy_improvement:
  enabled: true
  improvement_methods:
    - "parameter_optimization"
    - "strategy_selection"
    - "weight_adjustment"
    - "regime_adaptation"
    - "ensemble_rebalancing"
    - "feature_engineering"
  optimization_frequency_hours: 12
  parameter_search_method: "bayesian"
  max_iterations: 100
  convergence_threshold: 0.001
  validation_split: 0.20
  walk_forward_validation: true

# Parameter Optimization
parameter_optimization:
  enabled: true
  optimization_algorithm: "genetic"
  population_size: 50
  generations: 30
  mutation_rate: 0.10
  crossover_rate: 0.80
  elitism_rate: 0.10
  tournament_size: 5
  fitness_function: "sharpe_ratio"
  parameter_bounds: true
  parallel_evaluation: true
  early_stopping: true

# Machine Learning Enhancement
ml_enhancement:
  enabled: true
  models:
    - "random_forest"
    - "xgboost"
    - "lightgbm"
    - "neural_network"
    - "gradient_boosting"
    - "deep_learning"
  ensemble_method: "stacking"
  retrain_frequency_days: 7
  online_learning: true
  incremental_training: true
  feature_selection: true
  hyperparameter_optimization: true
  cross_validation_folds: 5
  early_stopping_patience: 10
  model_versioning: true
  model_rollback: true

# Regime Adaptation
regime_adaptation:
  enabled: true
  detection_methods:
    - "volatility_regime"
    - "trend_regime"
    - "correlation_regime"
    - "liquidity_regime"
    - "momentum_regime"
  adaptation_threshold: 0.60
  lookback_window_bars: 50
  regime_switching_cooldown_bars: 10
  adaptation_strategies:
    - "parameter_adjustment"
    - "strategy_rotation"
    - "weight_reallocation"
    - "risk_adjustment"
  confidence_required: 0.70

# Evolutionary Improvement
evolutionary:
  enabled: true
  population_size: 100
  generations: 50
  mutation_rate: 0.15
  crossover_rate: 0.75
  selection_method: "tournament"
  fitness_metrics:
    - "sharpe_ratio"
    - "maximum_drawdown"
    - "win_rate"
    - "profit_factor"
  elite_ratio: 0.10
  diversity_maintenance: true
  age_based_selection: true
  parallel_evolution: true
  checkpoint_frequency_generations: 10

# Reinforcement Learning
reinforcement_learning:
  enabled: true
  algorithm: "ppo"  # ppo, dqn, sac, td3, a2c
  learning_rate: 0.001
  discount_factor: 0.99
  exploration_rate: 0.10
  batch_size: 64
  replay_buffer_size: 10000
  target_update_frequency: 100
  gradient_clip: 0.50
  network_architecture:
    - 256
    - 256
    - 128
  episode_length_bars: 100
  training_episodes: 1000
  reward_function: "sharpe_ratio"
  continuous_learning: true

# Knowledge Base
knowledge_base:
  enabled: true
  storage_method: "vector_database"
  knowledge_types:
    - "successful_trades"
    - "failed_trades"
    - "market_patterns"
    - "regime_transitions"
    - "strategy_performance"
  retention_period_days: 365
  similarity_threshold: 0.75
  retrieval_limit: 10
  learning_from_history: true
  pattern_recognition: true
  memory_consolidation: true
  episodic_memory: true
  semantic_memory: true

# Feedback Loops
feedback_loops:
  enabled: true
  feedback_sources:
    - "trade_outcomes"
    - "market_reactions"
    - "performance_metrics"
    - "risk_events"
    - "execution_quality"
  feedback_delay_bars: 10
  feedback_weight: 0.50
  positive_reinforcement: true
  negative_reinforcement: true
  adaptation_speed: 0.10

# Performance Tracking
performance_tracking:
  enabled: true
  tracking_frequency_seconds: 60
  metrics_storage: "timescaledb"
  retention_days: 365
  compression: true
  aggregation_levels:
    - "tick"
    - "minute"
    - "hourly"
    - "daily"
    - "weekly"
    - "monthly"
  dashboard_integration: true
  real_time_monitoring: true
  anomaly_detection: true

# Quality Assurance
qa:
  enabled: true
  validation_frequency_hours: 24
  tests:
    - "strategy_validation"
    - "risk_validation"
    - "execution_validation"
    - "data_quality"
    - "model_accuracy"
  minimum_validation_score: 0.80
  failure_action: "rollback"
  test_data_percentage: 20
  backtesting_validation: true
  simulation_validation: true
  stress_testing: true

# A/B Testing
ab_testing:
  enabled: true
  test_duration_days: 30
  confidence_level: 0.95
  metrics:
    - "sharpe_ratio"
    - "return_on_investment"
    - "win_rate"
    - "max_drawdown"
  allocation:
    control: 50
    test: 50
  significance_test: "t_test"
  multiple_comparison_correction: true
  early_stopping_enabled: true
  minimum_trades_required: 50

# Version Control
version_control:
  enabled: true
  versioning_method: "semantic"
  change_tracking: true
  rollback_support: true
  version_comparison: true
  performance_per_version: true
  version_storage_days: 365
  change_log: true
  deployment_history: true
  feature_flags: true

# Continuous Deployment
continuous_deployment:
  enabled: true
  deployment_strategy: "canary"
  canary_percentage: 10
  deployment_frequency: "manual"
  health_check: true
  rollback_threshold: 0.90
  automated_deployment: false
  environment:
    - "development"
    - "staging"
    - "production"
  approval_required: true

# Monitoring & Alerting
monitoring_alerts:
  enabled: true
  alert_conditions:
    - "performance_degradation"
    - "model_drift"
    - "strategy_failure"
    - "risk_breach"
    - "data_quality_issue"
  alert_thresholds:
    performance_degradation: 0.10
    model_drift: 0.15
    strategy_failure_count: 5
    risk_breach_count: 3
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "sms"
  alert_cooldown_seconds: 600

# Resource Optimization
resource_optimization:
  enabled: true
  optimization_targets:
    - "cpu_usage"
    - "memory_usage"
    - "network_bandwidth"
    - "database_connections"
  resource_monitoring: true
  auto_scaling: true
  optimization_frequency_hours: 6
  threshold_high: 80
  threshold_low: 30
  scaling_step: 20

# Reporting
reporting_improvement:
  enabled: true
  report_types:
    - "daily_performance"
    - "weekly_improvement"
    - "monthly_analysis"
    - "quarterly_review"
    - "annual_summary"
  report_automation: true
  report_delivery: true
  report_recipients:
    - "trading@example.com"
    - "risk@example.com"
    - "management@example.com"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"

# Data Collection
data_collection:
  enabled: true
  collection_frequency_seconds: 60
  data_types:
    - "trade_data"
    - "market_data"
    - "performance_data"
    - "risk_data"
    - "system_data"
  retention_days: 365
  storage_format: "parquet"
  compression: "zstd"
  data_quality_check: true
  anomaly_detection: true
  data_validation: true

# Integration
integration_improvement:
  enabled: true
  webhook_endpoint: "http://localhost:8080/improvement"
  api_endpoint: "/api/v1/trading/improvement"
  dashboard_url: "http://localhost:3000/improvement"
  real_time_updates: true
  external_systems:
    - "mlflow"
    - "wandb"
    - "grafana"
    - "prometheus"
