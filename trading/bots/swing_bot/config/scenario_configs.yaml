# Swing Bot Scenario Analysis Configuration
# Scenario Planning & Analysis Parameters

# General Scenario Settings
scenario:
  enabled: true
  analysis_mode: "comprehensive"  # comprehensive, basic, advanced, real-time
  scenario_type: "market_scenario"  # market_scenario, strategy_scenario, risk_scenario
  generation_method: "multi_factor"  # multi_factor, probabilistic, historical, hybrid
  version: "3.0.0"

# Scenario Types
scenario_types:
  enabled: true
  primary_scenarios:
    - "bull_case"
    - "base_case"
    - "bear_case"
    - "worst_case"
    - "best_case"
    - "black_swan"
  secondary_scenarios:
    - "volatility_spike"
    - "liquidity_crisis"
    - "correlation_breakdown"
    - "regime_change"
    - "geopolitical_event"
    - "regulatory_change"
    - "technology_disruption"
  scenario_priorities:
    bull_case: 1
    base_case: 2
    bear_case: 3
    worst_case: 4
    best_case: 5
    black_swan: 6

# Scenario Parameters
parameters:
  enabled: true
  time_horizons:
    short_term_days: 7
    medium_term_days: 30
    long_term_days: 90
    strategic_term_days: 365
  market_parameters:
    volatility_shift: 0.20
    correlation_shift: 0.30
    liquidity_shift: 0.20
    beta_shift: 0.30
  economic_parameters:
    gdp_change: 0.02
    inflation_change: 0.01
    rate_change: 0.005
  probability_weights: true

# Bull Case
bull_case:
  enabled: true
  market_conditions:
    volatility: 0.15
    correlation: 0.50
    liquidity: 0.80
  economic_conditions:
    gdp_growth: 0.03
    inflation: 0.02
    unemployment: 0.04
  market_returns:
    equities: 0.20
    fixed_income: 0.05
    commodities: 0.10
    currencies: 0.05
    crypto: 0.40
  probability: 0.25
  confidence_interval: 0.70

# Base Case
base_case:
  enabled: true
  market_conditions:
    volatility: 0.20
    correlation: 0.60
    liquidity: 0.60
  economic_conditions:
    gdp_growth: 0.02
    inflation: 0.025
    unemployment: 0.05
  market_returns:
    equities: 0.08
    fixed_income: 0.03
    commodities: 0.02
    currencies: 0.01
    crypto: 0.15
  probability: 0.50
  confidence_interval: 0.80

# Bear Case
bear_case:
  enabled: true
  market_conditions:
    volatility: 0.30
    correlation: 0.70
    liquidity: 0.40
  economic_conditions:
    gdp_growth: 0.01
    inflation: 0.03
    unemployment: 0.06
  market_returns:
    equities: -0.10
    fixed_income: 0.02
    commodities: -0.05
    currencies: -0.02
    crypto: -0.20
  probability: 0.20
  confidence_interval: 0.70

# Worst Case
worst_case:
  enabled: true
  market_conditions:
    volatility: 0.50
    correlation: 0.80
    liquidity: 0.20
  economic_conditions:
    gdp_growth: -0.05
    inflation: 0.05
    unemployment: 0.10
  market_returns:
    equities: -0.30
    fixed_income: -0.02
    commodities: -0.15
    currencies: -0.05
    crypto: -0.50
  probability: 0.05
  confidence_interval: 0.60

# Best Case
best_case:
  enabled: true
  market_conditions:
    volatility: 0.10
    correlation: 0.40
    liquidity: 0.90
  economic_conditions:
    gdp_growth: 0.05
    inflation: 0.01
    unemployment: 0.03
  market_returns:
    equities: 0.30
    fixed_income: 0.08
    commodities: 0.15
    currencies: 0.08
    crypto: 0.60
  probability: 0.05
  confidence_interval: 0.60

# Black Swan
black_swan:
  enabled: true
  event_types:
    - "financial_crisis"
    - "geopolitical_shock"
    - "natural_disaster"
    - "pandemic"
    - "technology_failure"
    - "regulatory_surprise"
  market_conditions:
    volatility: 0.80
    correlation: 0.90
    liquidity: 0.10
  economic_conditions:
    gdp_growth: -0.10
    inflation: 0.10
    unemployment: 0.15
  market_returns:
    equities: -0.50
    fixed_income: -0.05
    commodities: -0.25
    currencies: -0.10
    crypto: -0.80
  probability: 0.02
  confidence_interval: 0.50

# Scenario Generation
generation:
  enabled: true
  generation_methods:
    - "historical_analysis"
    - "probabilistic_forecasting"
    - "monte_carlo_simulation"
    - "machine_learning"
    - "expert_judgment"
  primary_method: "monte_carlo_simulation"
  iterations: 10000
  confidence_level: 0.95
  parallel_execution: true

# Scenario Analysis
analysis:
  enabled: true
  analysis_components:
    - "market_impact"
    - "portfolio_impact"
    - "strategy_impact"
    - "risk_impact"
    - "liquidity_impact"
    - "operational_impact"
  analysis_depth: "comprehensive"
  statistical_significance: true
  sensitivity_analysis: true

# Scenario Scoring
scoring:
  enabled: true
  score_components:
    - "probability": 0.20
    - "impact_magnitude": 0.25
    - "impact_velocity": 0.15
    - "recovery_time": 0.15
    - "correlation_impact": 0.10
    - "liquidity_impact": 0.10
    - "operational_impact": 0.05
  score_thresholds:
    low_impact: 0.30
    medium_impact: 0.50
    high_impact: 0.70
    extreme_impact: 0.90

# Scenario Response
response:
  enabled: true
  response_strategies:
    - "hedging"
    - "diversification"
    - "position_reduction"
    - "cash_increase"
    - "stop_loss_activation"
    - "risk_limits_adjustment"
    - "strategy_change"
    - "pause_trading"
    - "emergency_procedure"
  response_automation: true
  response_timeout_seconds: 300

# Visualization
visualization:
  enabled: true
  charts:
    - "scenario_dashboard"
    - "scenario_comparison_chart"
    - "probability_distribution"
    - "impact_analysis"
    - "sensitivity_chart"
    - "response_planning"
  update_interval_seconds: 60
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "scenario_triggered"
    - "probability_change"
    - "impact_level_change"
    - "threshold_breach"
    - "response_needed"
    - "convergence_detected"
  alert_thresholds:
    probability_change: 0.10
    impact_level_change: 0.20
    confidence_drop: 0.10
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600

# Reporting
reporting:
  enabled: true
  report_types:
    - "scenario_summary"
    - "scenario_analysis_report"
    - "impact_assessment"
    - "response_plan_report"
    - "probability_analysis"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "risk@example.com"
    - "trading@example.com"
    - "management@example.com"
    - "strategy@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "scenario_data"
    - "probability_data"
    - "impact_data"
    - "response_data"
    - "analysis_results"
    - "alert_history"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/scenario"
  api_endpoint: "/api/v1/risk/scenario"
  dashboard_url: "http://localhost:3000/scenario"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  external_systems:
    - "risk_management"
    - "trading_engine"
    - "strategy_engine"
    - "research_platform"
