# Swing Bot Risk Engine Configuration
# Core Risk Engine & Risk Management Parameters

# General Risk Engine Settings
risk_engine:
  enabled: true
  engine_mode: "autonomous"  # autonomous, supervised, hybrid, manual
  risk_paradigm: "multi_factor"  # multi_factor, integrated, modular, adaptive
  engine_level: "advanced"  # basic, intermediate, advanced, expert
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "market_risk_module"
    - "credit_risk_module"
    - "liquidity_risk_module"
    - "operational_risk_module"
    - "regulatory_risk_module"
    - "model_risk_module"
    - "concentration_risk_module"
    - "systemic_risk_module"
    - "stress_testing_module"
    - "reporting_module"
  module_interaction: "pipeline"  # pipeline, event_driven, message_based
  parallel_execution: true
  max_workers: 8
  pipeline_buffer_size: 10000

# Market Risk Module
market_risk:
  enabled: true
  risk_metrics:
    - "value_at_risk"
    - "expected_shortfall"
    - "maximum_drawdown"
    - "volatility"
    - "beta"
    - "correlation"
    - "tail_risk"
    - "jump_risk"
  var_methods:
    - "historical"
    - "parametric"
    - "monte_carlo"
    - "hybrid"
  primary_var_method: "historical"
  confidence_levels: [0.90, 0.95, 0.99]
  time_horizons_days: [1, 5, 10, 30]
  var_calculation: true
  expected_shortfall: true

# Credit Risk Module
credit_risk:
  enabled: true
  credit_metrics:
    - "counterparty_risk"
    - "default_probability"
    - "credit_spread"
    - "credit_rating"
    - "concentration_risk"
    - "settlement_risk"
  assessment_methods:
    - "rating_based"
    - "market_based"
    - "model_based"
    - "hybrid"
  primary_method: "hybrid"
  counterparty_limits: true
  exposure_monitoring: true

# Liquidity Risk Module
liquidity_risk:
  enabled: true
  liquidity_metrics:
    - "bid_ask_spread"
    - "market_depth"
    - "volume_velocity"
    - "liquidity_ratio"
    - "funding_liquidity"
    - "asset_liability_mismatch"
  assessment_methods:
    - "market_based"
    - "balance_sheet_based"
    - "hybrid"
  primary_method: "market_based"
  liquidity_thresholds: true
  liquidity_monitoring: true

# Operational Risk Module
operational_risk:
  enabled: true
  operational_metrics:
    - "system_failure_risk"
    - "human_error_risk"
    - "process_risk"
    - "technology_risk"
    - "cybersecurity_risk"
    - "fraud_risk"
    - "compliance_risk"
  assessment_methods:
    - "scenario_analysis"
    - "historical_analysis"
    - "expert_judgment"
    - "model_based"
  primary_method: "scenario_analysis"
  operational_limits: true
  incident_monitoring: true

# Regulatory Risk Module
regulatory_risk:
  enabled: true
  regulatory_metrics:
    - "compliance_risk"
    - "reporting_risk"
    - "legal_risk"
    - "tax_risk"
    - "reputation_risk"
  assessment_methods:
    - "regulatory_mapping"
    - "compliance_checks"
    - "scenario_analysis"
  primary_method: "compliance_checks"
  regulatory_monitoring: true
  compliance_reporting: true

# Model Risk Module
model_risk:
  enabled: true
  model_metrics:
    - "model_accuracy"
    - "model_stability"
    - "model_robustness"
    - "model_transparency"
    - "model_validation"
  assessment_methods:
    - "backtesting"
    - "stress_testing"
    - "sensitivity_analysis"
    - "independent_validation"
  primary_method: "backtesting"
  model_validation: true
  model_monitoring: true

# Concentration Risk Module
concentration_risk:
  enabled: true
  concentration_metrics:
    - "asset_concentration"
    - "sector_concentration"
    - "region_concentration"
    - "counterparty_concentration"
    - "issuer_concentration"
  assessment_methods:
    - "herfindahl_index"
    - "gini_coefficient"
    - "concentration_ratio"
    - "effective_number_of_bets"
  primary_method: "herfindahl_index"
  concentration_limits: true
  diversification_monitoring: true

# Systemic Risk Module
systemic_risk:
  enabled: true
  systemic_metrics:
    - "interconnectedness"
    - "common_exposure"
    - "contagion_risk"
    - "market_impact"
    - "procyclicality"
  assessment_methods:
    - "network_analysis"
    - "correlation_analysis"
    - "stress_testing"
    - "scenario_analysis"
  primary_method: "network_analysis"
  systemic_monitoring: true
  contagion_analysis: true

# Stress Testing Module
stress_testing:
  enabled: true
  stress_scenarios:
    - "market_crash"
    - "volatility_spike"
    - "liquidity_crisis"
    - "correlation_breakdown"
    - "regime_change"
    - "counterparty_default"
    - "operational_failure"
  scenario_generation:
    - "historical_scenarios"
    - "probabilistic_scenarios"
    - "reverse_scenarios"
    - "custom_scenarios"
  primary_method: "historical_scenarios"
  stress_test_frequency_days: 1
  scenario_impact_analysis: true

# Risk Aggregation
aggregation:
  enabled: true
  aggregation_methods:
    - "simple_sum"
    - "correlation_weighted"
    - "copula_based"
    - "monte_carlo"
    - "hybrid"
  primary_method: "correlation_weighted"
  diversification_benefit: true
  hedging_benefit: true
  netting_benefit: true

# Risk Limits
limits:
  enabled: true
  hard_limits:
    - "max_var"
    - "max_expected_shortfall"
    - "max_drawdown"
    - "max_volatility"
    - "max_concentration"
    - "max_exposure"
    - "max_position_size"
  soft_limits:
    - "warning_var"
    - "warning_drawdown"
    - "warning_concentration"
    - "warning_exposure"
  limit_hierarchy:
    - "portfolio_limits"
    - "strategy_limits"
    - "position_limits"
    - "asset_limits"
  limit_breach_action: "alert"  # alert, reduce, stop, escalate

# Risk Monitoring
monitoring:
  enabled: true
  monitoring_frequency_seconds: 5
  real_time_monitoring: true
  batch_monitoring: true
  continuous_monitoring: true
  metrics:
    - "current_risk"
    - "risk_trends"
    - "risk_limits_status"
    - "risk_exceptions"
    - "risk_breaches"
    - "risk_forecast"
  dashboard_integration: true
  real_time_updates: true

# Visualization
visualization:
  enabled: true
  charts:
    - "risk_dashboard"
    - "var_chart"
    - "drawdown_chart"
    - "concentration_chart"
    - "stress_test_chart"
    - "limits_status_chart"
    - "trend_chart"
    - "heatmap"
  update_interval_seconds: 10
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "var_breach"
    - "drawdown_breach"
    - "concentration_breach"
    - "exposure_breach"
    - "stress_test_breach"
    - "correlation_breach"
    - "liquidity_breach"
    - "model_breach"
  alert_thresholds:
    var_breach: 0.80
    drawdown_breach: 0.80
    concentration_breach: 0.80
    exposure_breach: 0.80
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 300
  escalation_policy: true

# Reporting
reporting:
  enabled: true
  report_types:
    - "daily_risk_report"
    - "weekly_risk_analysis"
    - "monthly_risk_report"
    - "quarterly_risk_review"
    - "stress_test_report"
    - "model_validation_report"
    - "regulatory_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "risk@example.com"
    - "trading@example.com"
    - "compliance@example.com"
    - "management@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "risk_data"
    - "var_data"
    - "drawdown_data"
    - "concentration_data"
    - "stress_test_data"
    - "limits_data"
    - "breach_history"
    - "alert_history"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/risk-engine"
  api_endpoint: "/api/v1/risk/engine"
  dashboard_url: "http://localhost:3000/risk-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "portfolio_management"
    - "compliance_system"
    - "regulatory_reporting"
