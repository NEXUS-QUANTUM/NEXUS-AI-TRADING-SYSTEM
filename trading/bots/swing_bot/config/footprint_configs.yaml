# footprint_configs.yaml
# Configuration complète pour l'analyse d'empreinte (footprint) dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 50
  max_data_points: 100000
  footprint_version: "4.0.0"
  environment: "production"

# Types d'empreinte
footprint_types:
  volume_footprint:
    enabled: true
    description: "Volume Footprint Analysis"
    price_levels: 20
    min_volume: 100
    max_volume: 1000000
    imbalance_threshold: 0.3
    update_frequency_seconds: 5
  delta_footprint:
    enabled: true
    description: "Delta Footprint Analysis"
    price_levels: 20
    delta_threshold: 0.2
    cumulative_delta: true
    update_frequency_seconds: 5
  bid_ask_footprint:
    enabled: true
    description: "Bid-Ask Footprint Analysis"
    price_levels: 20
    bid_ask_ratio: true
    imbalance_threshold: 0.3
    update_frequency_seconds: 5
  volume_profile:
    enabled: true
    description: "Volume Profile Analysis"
    price_levels: 30
    poc_calculation: true
    value_area: true
    update_frequency_seconds: 5
  order_flow:
    enabled: true
    description: "Order Flow Footprint Analysis"
    price_levels: 20
    aggressive_orders: true
    passive_orders: true
    update_frequency_seconds: 5
  cumulative_delta:
    enabled: true
    description: "Cumulative Delta Analysis"
    price_levels: 20
    cumulative_delta_threshold: 0.3
    update_frequency_seconds: 5

# Seuils d'empreinte
thresholds:
  volume:
    low: 1000
    medium: 5000
    high: 10000
    extreme: 50000
  delta:
    low: 0.1
    medium: 0.3
    high: 0.5
    extreme: 0.7
  imbalance:
    low: 0.1
    medium: 0.3
    high: 0.5
    extreme: 0.7
  price_levels:
    min: 5
    max: 50
    default: 20
  confidence:
    min: 0.5
    default: 0.7
    max: 1.0

# Indicateurs d'empreinte
indicators:
  footprint_strength:
    enabled: true
    calculation: "weighted_average"
    factors:
      - "volume_imbalance"
      - "delta_momentum"
      - "bid_ask_ratio"
      - "poc_strength"
      - "cumulative_delta"
    factor_weights:
      volume_imbalance: 0.25
      delta_momentum: 0.20
      bid_ask_ratio: 0.20
      poc_strength: 0.20
      cumulative_delta: 0.15
  footprint_probability:
    enabled: true
    period: 14
    smoothing: 3
    threshold: 0.5
  footprint_momentum:
    enabled: true
    period: 14
    smoothing: 3
    threshold: 0.3
  footprint_velocity:
    enabled: true
    period: 5
    smoothing: 0
    threshold: 0.2
  footprint_acceleration:
    enabled: true
    period: 10
    smoothing: 0
    threshold: 0.1
  footprint_confidence:
    enabled: true
    period: 14
    smoothing: 0
    threshold: 0.6

# Analyse d'empreinte
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_footprint_accuracy: true
    compute_footprint_probability: true
    compute_footprint_distribution: true
    compute_footprint_patterns: true
    compute_footprint_cycles: true
    compute_footprint_success_rate: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous_footprint: true
    compute_moving_average_footprint: true
    compute_exponential_footprint: true
    compute_weighted_footprint: true
    compute_footprint_velocity: true
    compute_footprint_acceleration: true
  predictive:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "xgboost"
      - "lightgbm"
    features:
      - "footprint_strength"
      - "footprint_probability"
      - "footprint_momentum"
      - "footprint_velocity"
      - "footprint_acceleration"
      - "footprint_confidence"
      - "volume_imbalance"
      - "delta_momentum"
      - "bid_ask_ratio"
      - "poc_strength"
      - "cumulative_delta"
      - "price_change"
      - "volume"
      - "volatility"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_threshold: 0.7
    retrain_frequency_hours: 24

# Alertes et notifications
alerts:
  footprint_detected:
    enabled: true
    confidence_threshold: 0.7
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "warning"
  footprint_imbalance:
    enabled: true
    threshold: 0.5
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"
  footprint_confirmed:
    enabled: true
    confidence_threshold: 0.9
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "info"
  footprint_invalid:
    enabled: true
    confidence_threshold: 0.5
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"
  footprint_poc_break:
    enabled: true
    confidence_threshold: 0.7
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"

# Actions automatiques
auto_actions:
  trade_entry:
    enabled: true
    action_types:
      - "enter_on_imbalance"
      - "enter_on_poc_break"
      - "enter_on_delta_cross"
      - "enter_on_volume_cluster"
      - "enter_on_confirmation"
    require_footprint_confirmation: true
    require_confidence: 0.7
    max_position_size: 10000
    min_position_size: 100
  stop_loss:
    enabled: true
    methods:
      - "footprint_based"
      - "poc_based"
      - "volume_node_based"
    footprint_multiplier: 1.0
    min_stop_percent: 0.5
    max_stop_percent: 10.0
    update_frequency_seconds: 10
  take_profit:
    enabled: true
    methods:
      - "footprint_projection"
      - "poc_projection"
      - "volume_node_projection"
    projection_multiplier: 1.0
    min_profit_percent: 1.0
    max_profit_percent: 20.0
    update_frequency_seconds: 10
  position_sizing:
    enabled: true
    method: "footprint_strength_based"
    footprint_scale: 0.5
    max_position_percent: 10.0
    min_position_percent: 0.5
    scaling_function: "linear"

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"
      - "lstm"
    features:
      - "footprint_strength"
      - "footprint_probability"
      - "footprint_momentum"
      - "footprint_velocity"
      - "footprint_acceleration"
      - "footprint_confidence"
      - "volume_imbalance"
      - "delta_momentum"
      - "bid_ask_ratio"
      - "poc_strength"
      - "cumulative_delta"
      - "rsi"
      - "macd"
      - "bollinger_width"
      - "atr"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.25
      - 0.25
      - 0.25
      - 0.25
  statistical_analysis:
    enabled: true
    calculate_footprint_accuracy: true
    calculate_footprint_probability: true
    calculate_footprint_significance: true
    calculate_footprint_correlation: true
    calculate_footprint_success_rate: true
    confidence_level: 95
    p_value_threshold: 0.05
  order_flow_analysis:
    enabled: true
    flow_types:
      - "aggressive_buying"
      - "aggressive_selling"
      - "passive_buying"
      - "passive_selling"
      - "spoofing"
      - "layering"
    flow_analysis_depth: 10
    flow_confirmation_threshold: 0.7

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "footprint_strength"
      - "footprint_probability"
      - "footprint_momentum"
      - "footprint_velocity"
      - "footprint_acceleration"
      - "footprint_confidence"
      - "volume_imbalance"
      - "delta_momentum"
      - "bid_ask_ratio"
      - "poc_strength"
      - "cumulative_delta"
      - "footprint_count"
      - "footprint_accuracy"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "footprint_analysis"
      - "volume_imbalance"
      - "delta_momentum"
      - "bid_ask_ratio"
      - "poc_strength"
      - "cumulative_delta"
      - "order_flow_analysis"
      - "footprint_predictive"

# Backtesting
backtesting:
  enabled: true
  use_historical_footprint: true
  compute_footprint_accuracy: true
  compute_imbalance_effectiveness: true
  compute_poc_effectiveness: true
  compute_risk_adjusted_returns: true
  report_metrics:
    - "footprint_accuracy"
    - "imbalance_effectiveness"
    - "poc_effectiveness"
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"

# Configuration de la base de données
database:
  enabled: true
  table_name: "footprint_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/footprint"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "footprint_alert"
    - url: "https://nexustradingia.com/api/webhooks/footprint-imbalance"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "footprint_imbalance"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "footprint_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/footprint"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/footprint/current"
    - "/api/v1/footprint/history"
    - "/api/v1/footprint/metrics"
    - "/api/v1/footprint/status"
    - "/api/v1/footprint/indicators"
    - "/api/v1/footprint/probability"
    - "/api/v1/footprint/accuracy"
    - "/api/v1/footprint/forecast"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/footprint/"
  encrypt: true
  encryption_key_id: "nexus-footprint-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/footprint"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_footprint_volume"
      - "low_footprint_volume"
      - "imbalance_scenario"
      - "poc_break_scenario"
      - "order_flow_anomaly"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "confidence_threshold > 0.0"
      - "confidence_threshold <= 1.0"
      - "footprint_types.volume_footprint.price_levels > 0"
      - "footprint_types.volume_footprint.min_volume >= 0"
      - "footprint_types.volume_footprint.max_volume > footprint_types.volume_footprint.min_volume"
      - "thresholds.price_levels.min >= 0"
      - "thresholds.price_levels.max > threshold.price_levels.min"
      - "thresholds.confidence.min >= 0.0"
      - "thresholds.confidence.min <= 1.0"
      - "indicators.footprint_strength.factor_weights.sum() == 1.0"
      - "min_data_points > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "trending"
      - "ranging"
      - "volatile"
      - "stable"
      - "bull"
      - "bear"
  regime_parameters:
    trending:
      footprint_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
      volume_multiplier: 1.2
    ranging:
      footprint_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
      volume_multiplier: 0.8
    volatile:
      footprint_multiplier: 0.7
      threshold_multiplier: 1.3
      confidence_multiplier: 0.8
      volume_multiplier: 0.7
    stable:
      footprint_multiplier: 1.0
      threshold_multiplier: 0.9
      confidence_multiplier: 1.2
      volume_multiplier: 1.0
    bull:
      footprint_multiplier: 1.1
      threshold_multiplier: 0.9
      confidence_multiplier: 1.0
      volume_multiplier: 1.1
    bear:
      footprint_multiplier: 0.9
      threshold_multiplier: 1.1
      confidence_multiplier: 0.9
      volume_multiplier: 0.9

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      footprint_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
      volume_multiplier: 0.8
    london:
      start: "08:00"
      end: "16:00"
      footprint_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
      volume_multiplier: 1.2
    newyork:
      start: "13:00"
      end: "22:00"
      footprint_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
      volume_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      footprint_multiplier: 1.5
      threshold_multiplier: 0.7
      confidence_multiplier: 1.2
      volume_multiplier: 1.5

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    footprint_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    volume_multiplier: 1.0
    confidence_threshold: 0.7
    price_levels: 20
    min_volume: 100
  ETHUSDT:
    footprint_multiplier: 1.1
    threshold_multiplier: 0.9
    confidence_multiplier: 1.0
    volume_multiplier: 1.1
    confidence_threshold: 0.7
    price_levels: 20
    min_volume: 80
  SOLUSDT:
    footprint_multiplier: 1.2
    threshold_multiplier: 0.8
    confidence_multiplier: 0.9
    volume_multiplier: 1.2
    confidence_threshold: 0.7
    price_levels: 20
    min_volume: 60
  ADAUSDT:
    footprint_multiplier: 0.9
    threshold_multiplier: 1.1
    confidence_multiplier: 1.1
    volume_multiplier: 0.9
    confidence_threshold: 0.7
    price_levels: 20
    min_volume: 40
  XRPUSDT:
    footprint_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    volume_multiplier: 1.0
    confidence_threshold: 0.7
    price_levels: 20
    min_volume: 40
