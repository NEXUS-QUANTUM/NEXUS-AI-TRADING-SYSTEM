# volatility_configs.yaml
# Configuration complète pour la gestion de la volatilité dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "adaptive"
  volatility_type: "realized"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 100
  max_data_points: 100000

# Types de volatilité
volatility_types:
  realized:
    enabled: true
    calculation_method: "standard_deviation"
    periods:
      - 5
      - 10
      - 20
      - 50
      - 100
      - 200
    annualization_factor: 252
    smoothing: 0
  historical:
    enabled: true
    calculation_method: "historical"
    periods:
      - 5
      - 10
      - 20
      - 50
      - 100
      - 200
    annualization_factor: 252
    smoothing: 3
  implied:
    enabled: true
    calculation_method: "black_scholes"
    sources:
      - "options_chain"
      - "derivatives"
      - "futures"
    smoothing: 0
  parkinson:
    enabled: true
    calculation_method: "parkinson"
    periods:
      - 5
      - 10
      - 20
      - 50
    annualization_factor: 252
    smoothing: 0
  garman_klass:
    enabled: true
    calculation_method: "garman_klass"
    periods:
      - 5
      - 10
      - 20
      - 50
    annualization_factor: 252
    smoothing: 0
  rogers_satchell:
    enabled: true
    calculation_method: "rogers_satchell"
    periods:
      - 5
      - 10
      - 20
      - 50
    annualization_factor: 252
    smoothing: 0
  yang_zhang:
    enabled: true
    calculation_method: "yang_zhang"
    periods:
      - 5
      - 10
      - 20
      - 50
    annualization_factor: 252
    smoothing: 0
  exponential:
    enabled: true
    calculation_method: "ewma"
    periods:
      - 5
      - 10
      - 20
      - 50
    lambda: 0.94
    annualization_factor: 252
    smoothing: 0
  conditional:
    enabled: true
    model_type: "garch"
    periods:
      - 5
      - 10
      - 20
      - 50
    p: 1
    q: 1
    annualization_factor: 252
    update_frequency_seconds: 60

# Seuils de volatilité
thresholds:
  low:
    percent: 10.0
    action: "monitor"
    description: "Low volatility environment"
  medium:
    percent: 20.0
    action: "alert"
    description: "Medium volatility environment"
  high:
    percent: 40.0
    action: "take_action"
    description: "High volatility environment"
  extreme:
    percent: 70.0
    action: "emergency"
    description: "Extreme volatility environment"
  critical:
    percent: 100.0
    action: "stop_trading"
    description: "Critical volatility environment"

# Indicateurs de volatilité
indicators:
  average_true_range:
    enabled: true
    period: 14
    smoothing: 0
    multiplier: 1.0
  true_range:
    enabled: true
    period: 14
    smoothing: 0
    multiplier: 1.0
  bollinger_bands:
    enabled: true
    period: 20
    std_dev: 2.0
    smoothing: 0
    band_type: "both"
  keltner_channels:
    enabled: true
    period: 20
    multiplier: 1.5
    atr_period: 14
    smoothing: 0
  donchian_channels:
    enabled: true
    period: 20
    smoothing: 0
  volatility_ratio:
    enabled: true
    period: 14
    smoothing: 3
  volatility_index:
    enabled: true
    period: 14
    smoothing: 3
    vix_style: true
  relative_volatility:
    enabled: true
    period: 14
    smoothing: 3
  volatility_oscillator:
    enabled: true
    period: 14
    smoothing: 3
  chandelier_exit:
    enabled: true
    period: 22
    multiplier: 3.0
    smoothing: 0
  standard_deviation:
    enabled: true
    period: 20
    smoothing: 0

# Analyse de volatilité
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_mean: true
    compute_median: true
    compute_std: true
    compute_percentiles: true
    percentile_values:
      - 5
      - 10
      - 25
      - 50
      - 75
      - 90
      - 95
      - 99
    compute_skewness: true
    compute_kurtosis: true
    compute_jump_risk: true
    compute_tail_risk: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous: true
    compute_moving_average: true
    compute_exponential_average: true
    compute_range_based: true
    compute_jump_detection: true
    compute_regime_detection: true
  predictive:
    enabled: true
    model_type: "garch"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
      - 50
    confidence_interval: 95
    simulation_runs: 10000
    confidence_threshold: 0.7
  pattern_recognition:
    enabled: true
    patterns:
      - "volatility_squeeze"
      - "volatility_expansion"
      - "volatility_breakout"
      - "volatility_compression"
      - "volatility_spike"
      - "volatility_dry_up"
      - "volatility_cluster"
      - "volatility_regime_change"
    min_confidence: 0.6

# Alertes et notifications
alerts:
  volatility_spike:
    enabled: true
    multiplier: 2.0
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "warning"
  volatility_squeeze:
    enabled: true
    multiplier: 0.5
    channels:
      - "email"
      - "telegram"
    severity: "info"
  volatility_breakout:
    enabled: true
    threshold: 1.5
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"
  volatility_regime_change:
    enabled: true
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "warning"
  volatility_cluster:
    enabled: true
    channels:
      - "telegram"
      - "push_notification"
    severity: "info"

# Actions automatiques
auto_actions:
  trade_execution:
    enabled: true
    action_types:
      - "enter_long"
      - "enter_short"
      - "exit_long"
      - "exit_short"
      - "increase_position"
      - "decrease_position"
    require_volatility_signal: true
    require_confidence: 0.6
    max_position_size: 10000
    min_position_size: 100
    volatility_multiplier: 1.5
  position_sizing:
    enabled: true
    method: "volatility_based"
    volatility_scale: 0.01
    max_position_percent: 10.0
    min_position_percent: 0.5
    scaling_function: "inverse_square_root"
    kelly_fraction: 0.25
  stop_loss_adjustment:
    enabled: true
    volatility_based_stop: true
    atr_multiplier: 2.0
    volatility_multiplier: 1.5
    min_stop_percent: 0.5
    max_stop_percent: 10.0
    update_frequency_seconds: 10
  take_profit_adjustment:
    enabled: true
    volatility_based_profit: true
    risk_reward_ratio: 2.0
    volatility_multiplier: 2.0
    min_profit_percent: 1.0
    max_profit_percent: 20.0
    update_frequency_seconds: 10

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"
      - "lstm"
      - "gru"
    features:
      - "volatility_sma_5"
      - "volatility_sma_10"
      - "volatility_sma_20"
      - "volatility_sma_50"
      - "volatility_sma_200"
      - "volatility_ema_5"
      - "volatility_ema_10"
      - "volatility_ema_20"
      - "atr"
      - "bollinger_width"
      - "keltner_width"
      - "donchian_width"
      - "volatility_ratio"
      - "volatility_oscillator"
      - "price"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.20
      - 0.20
      - 0.20
      - 0.20
      - 0.20
  risk_management:
    enabled: true
    var_calculation:
      enabled: true
      confidence_level: 99
      time_horizon_days: 1
      method: "historical"
    expected_shortfall:
      enabled: true
      confidence_level: 97.5
      time_horizon_days: 1
      method: "historical"
    tail_risk:
      enabled: true
      calculate_tail_risk: true
      tail_quantile: 0.01
      extreme_value_theory: true
    stress_testing:
      enabled: true
      scenarios:
        - name: "volatility_spike_2008"
          factor: 3.0
        - name: "volatility_spike_2020"
          factor: 2.5
        - name: "volatility_spike_2022"
          factor: 2.0
        - name: "flash_crash"
          factor: 4.0
        - name: "black_swan"
          factor: 5.0

# Volatility regimes
regimes:
  low_volatility:
    threshold: 15.0
    description: "Low volatility environment"
    risk_multiplier: 0.8
    position_multiplier: 1.2
    stop_loss_multiplier: 1.0
  normal_volatility:
    threshold: 30.0
    description: "Normal volatility environment"
    risk_multiplier: 1.0
    position_multiplier: 1.0
    stop_loss_multiplier: 1.0
  high_volatility:
    threshold: 50.0
    description: "High volatility environment"
    risk_multiplier: 1.5
    position_multiplier: 0.7
    stop_loss_multiplier: 1.5
  extreme_volatility:
    threshold: 80.0
    description: "Extreme volatility environment"
    risk_multiplier: 2.0
    position_multiplier: 0.4
    stop_loss_multiplier: 2.0
  critical_volatility:
    threshold: 120.0
    description: "Critical volatility environment"
    risk_multiplier: 3.0
    position_multiplier: 0.2
    stop_loss_multiplier: 3.0

# Volatility forecasting
forecasting:
  models:
    garch:
      enabled: true
      p: 1
      q: 1
      distribution: "normal"
    egarch:
      enabled: true
      p: 1
      q: 1
      distribution: "student_t"
    gjr_garch:
      enabled: true
      p: 1
      q: 1
      distribution: "skew_student"
    stochastic_volatility:
      enabled: true
      model_type: "sv"
      iterations: 1000
      burn_in: 500
    implied_volatility:
      enabled: true
      sources:
        - "options"
        - "futures"
        - "derivatives"
      smoothing: 3
  horizon:
    short_term:
      periods: 5
      confidence_interval: 90
    medium_term:
      periods: 20
      confidence_interval: 95
    long_term:
      periods: 50
      confidence_interval: 99

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "current_volatility"
      - "volatility_sma_5"
      - "volatility_sma_10"
      - "volatility_sma_20"
      - "volatility_sma_50"
      - "volatility_sma_200"
      - "atr_14"
      - "bollinger_width"
      - "keltner_width"
      - "donchian_width"
      - "volatility_ratio"
      - "volatility_oscillator"
      - "volatility_regime"
      - "volatility_spike_multiplier"
      - "var_99"
      - "expected_shortfall"
      - "tail_risk"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "volatility_chart"
      - "volatility_regimes"
      - "volatility_indicators"
      - "volatility_forecast"
      - "volatility_distribution"
      - "var_chart"
      - "expected_shortfall"
      - "tail_risk_chart"
      - "volatility_spikes"
      - "volatility_patterns"

# Backtesting
backtesting:
  enabled: true
  use_historical_volatility: true
  compute_volatility_distribution: true
  compute_pattern_accuracy: true
  compute_signal_accuracy: true
  compute_strategy_performance: true
  compute_volatility_forecast_accuracy: true
  compute_risk_metrics: true
  report_metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_win_loss"
    - "volatility_accuracy"
    - "pattern_accuracy"
    - "forecast_accuracy"
    - "risk_adjusted_return"

# Distribution des métriques
metrics_distribution:
  enabled: true
  distribution:
    - metric: "volatility"
      bins: 100
      update_frequency: "realtime"
    - metric: "volatility_sma_20"
      bins: 50
      update_frequency: "realtime"
    - metric: "atr_14"
      bins: 50
      update_frequency: "realtime"
    - metric: "volatility_ratio"
      bins: 30
      update_frequency: "realtime"
  percentiles:
    - 1
    - 5
    - 10
    - 25
    - 50
    - 75
    - 90
    - 95
    - 99

# Configuration de la base de données
database:
  enabled: true
  table_name: "volatility_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
      - "7d"
      - "30d"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/volatility"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "volatility_alert"
    - url: "https://nexustradingia.com/api/webhooks/volatility_regime"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "volatility_regime_change"
    - url: "https://nexustradingia.com/api/webhooks/volatility_forecast"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "volatility_forecast"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "volatility_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/volatility"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/volatility/current"
    - "/api/v1/volatility/history"
    - "/api/v1/volatility/metrics"
    - "/api/v1/volatility/status"
    - "/api/v1/volatility/indicators"
    - "/api/v1/volatility/regime"
    - "/api/v1/volatility/forecast"
    - "/api/v1/volatility/risk"
    - "/api/v1/volatility/stress"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/volatility/"
  encrypt: true
  encryption_key_id: "nexus-volatility-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/volatility"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"
  order_book:
    enabled: true
    sync_frequency_ms: 50
    depth_levels: 10
  options_chain:
    enabled: true
    sync_frequency_seconds: 60
    data_endpoint: "ws://options-chain:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_volatility"
      - "low_volatility"
      - "volatility_spike"
      - "volatility_dry_up"
      - "flash_crash"
      - "black_swan"
      - "regime_change"
      - "volatility_cluster"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "thresholds.low.percent < thresholds.medium.percent"
      - "thresholds.medium.percent < thresholds.high.percent"
      - "thresholds.high.percent < thresholds.extreme.percent"
      - "thresholds.extreme.percent < thresholds.critical.percent"
      - "regimes.low_volatility.threshold < regimes.normal_volatility.threshold"
      - "regimes.normal_volatility.threshold < regimes.high_volatility.threshold"
      - "regimes.high_volatility.threshold < regimes.extreme_volatility.threshold"
      - "regimes.extreme_volatility.threshold < regimes.critical_volatility.threshold"
      - "min_data_points > 0"
      - "confidence_threshold > 0.0"
      - "confidence_threshold <= 1.0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "bull"
      - "bear"
      - "sideways"
      - "volatile"
      - "low_volatility"
      - "high_volatility"
      - "crisis"
      - "recovery"
  regime_parameters:
    bull:
      volatility_multiplier: 0.8
      threshold_multiplier: 0.7
      risk_multiplier: 0.8
    bear:
      volatility_multiplier: 1.5
      threshold_multiplier: 1.3
      risk_multiplier: 1.5
    sideways:
      volatility_multiplier: 1.0
      threshold_multiplier: 1.0
      risk_multiplier: 1.0
    volatile:
      volatility_multiplier: 2.0
      threshold_multiplier: 1.5
      risk_multiplier: 2.0
    low_volatility:
      volatility_multiplier: 0.5
      threshold_multiplier: 0.8
      risk_multiplier: 0.6
    high_volatility:
      volatility_multiplier: 1.8
      threshold_multiplier: 1.4
      risk_multiplier: 1.8
    crisis:
      volatility_multiplier: 3.0
      threshold_multiplier: 2.0
      risk_multiplier: 3.0
    recovery:
      volatility_multiplier: 1.2
      threshold_multiplier: 1.1
      risk_multiplier: 1.2

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      volatility_multiplier: 0.8
      threshold_multiplier: 1.2
      risk_multiplier: 0.8
    london:
      start: "08:00"
      end: "16:00"
      volatility_multiplier: 1.2
      threshold_multiplier: 0.8
      risk_multiplier: 1.2
    newyork:
      start: "13:00"
      end: "22:00"
      volatility_multiplier: 1.0
      threshold_multiplier: 1.0
      risk_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      volatility_multiplier: 1.5
      threshold_multiplier: 0.7
      risk_multiplier: 1.5
  day_of_week:
    monday:
      volatility_multiplier: 0.9
      threshold_multiplier: 1.1
    tuesday:
      volatility_multiplier: 1.1
      threshold_multiplier: 0.9
    wednesday:
      volatility_multiplier: 1.0
      threshold_multiplier: 1.0
    thursday:
      volatility_multiplier: 1.1
      threshold_multiplier: 0.9
    friday:
      volatility_multiplier: 0.9
      threshold_multiplier: 1.1
    saturday:
      volatility_multiplier: 0.5
      threshold_multiplier: 2.0
    sunday:
      volatility_multiplier: 0.6
      threshold_multiplier: 1.8

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    volatility_multiplier: 1.0
    threshold_multiplier: 1.0
    risk_multiplier: 1.0
    atr_period: 14
    bollinger_period: 20
    min_volatility: 0.01
    max_volatility: 0.50
  ETHUSDT:
    volatility_multiplier: 1.1
    threshold_multiplier: 0.9
    risk_multiplier: 1.1
    atr_period: 14
    bollinger_period: 20
    min_volatility: 0.01
    max_volatility: 0.55
  SOLUSDT:
    volatility_multiplier: 1.2
    threshold_multiplier: 0.8
    risk_multiplier: 1.2
    atr_period: 14
    bollinger_period: 20
    min_volatility: 0.02
    max_volatility: 0.60
  ADAUSDT:
    volatility_multiplier: 0.9
    threshold_multiplier: 1.1
    risk_multiplier: 0.9
    atr_period: 14
    bollinger_period: 20
    min_volatility: 0.01
    max_volatility: 0.40
  XRPUSDT:
    volatility_multiplier: 1.0
    threshold_multiplier: 1.0
    risk_multiplier: 1.0
    atr_period: 14
    bollinger_period: 20
    min_volatility: 0.01
    max_volatility: 0.45
