# news_configs.yaml
# Configuration complète pour l'analyse de l'actualité dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 30
  lookback_days: 30
  history_length_days: 365
  min_data_points: 10
  max_data_points: 1000
  news_version: "4.0.0"
  environment: "production"

# Sources d'actualités
news_sources:
  financial_news:
    enabled: true
    sources:
      - "bloomberg"
      - "reuters"
      - "cnbc"
      - "ft"
      - "wsj"
      - "yahoo_finance"
      - "seeking_alpha"
    priority: "high"
    update_frequency_seconds: 60
  crypto_news:
    enabled: true
    sources:
      - "coindesk"
      - "cointelegraph"
      - "the_block"
      - "crypto_slate"
      - "decrypt"
      - "coin_gecko"
    priority: "high"
    update_frequency_seconds: 60
  general_news:
    enabled: true
    sources:
      - "bbc"
      - "cnn"
      - "the_guardian"
      - "ap_news"
      - "reuters"
    priority: "medium"
    update_frequency_seconds: 120
  social_news:
    enabled: true
    sources:
      - "twitter"
      - "reddit"
      - "telegram"
      - "discord"
      - "youtube"
    priority: "medium"
    update_frequency_seconds: 30
  regulatory_news:
    enabled: true
    sources:
      - "sec"
      - "cfpb"
      - "federal_reserve"
      - "ecb"
      - "boj"
      - "bank_of_england"
    priority: "high"
    update_frequency_seconds: 300

# Catégories d'actualités
news_categories:
  market:
    enabled: true
    categories:
      - "market_analysis"
      - "price_forecast"
      - "volatility_alert"
      - "technical_analysis"
    impact_level: "medium"
  economic:
    enabled: true
    categories:
      - "gdp"
      - "inflation"
      - "employment"
      - "interest_rates"
      - "trade"
      - "consumer_confidence"
    impact_level: "high"
  regulatory:
    enabled: true
    categories:
      - "regulation"
      - "legal_action"
      - "government_policy"
      - "taxation"
      - "compliance"
    impact_level: "high"
  company:
    enabled: true
    categories:
      - "earnings"
      - "partnership"
      - "acquisition"
      - "new_product"
      - "management_change"
      - "bankruptcy"
    impact_level: "medium"
  crypto:
    enabled: true
    categories:
      - "protocol_update"
      - "fork"
      - "security_breach"
      - "institutional_adoption"
      - "regulation"
      - "mining"
    impact_level: "high"
  geopolitical:
    enabled: true
    categories:
      - "conflict"
      - "trade_war"
      - "sanctions"
      - "political_crisis"
      - "international_relations"
    impact_level: "high"

# Seuils d'impact
impact_thresholds:
  high:
    score: 0.8
    volatility_multiplier: 2.0
    position_multiplier: 0.3
    stop_loss_multiplier: 1.5
    take_profit_multiplier: 2.0
    description: "High impact news"
  medium:
    score: 0.5
    volatility_multiplier: 1.5
    position_multiplier: 0.6
    stop_loss_multiplier: 1.2
    take_profit_multiplier: 1.5
    description: "Medium impact news"
  low:
    score: 0.2
    volatility_multiplier: 1.0
    position_multiplier: 1.0
    stop_loss_multiplier: 1.0
    take_profit_multiplier: 1.0
    description: "Low impact news"
  minimal:
    score: 0.05
    volatility_multiplier: 0.8
    position_multiplier: 1.2
    stop_loss_multiplier: 0.8
    take_profit_multiplier: 0.8
    description: "Minimal impact news"

# Mots-clés de sentiment
sentiment_keywords:
  positive:
    - "growth"
    - "profit"
    - "success"
    - "gain"
    - "improve"
    - "increase"
    - "positive"
    - "bullish"
    - "upgrade"
    - "outperform"
    - "strong"
    - "record"
    - "breakthrough"
    - "adoption"
    - "partnership"
    - "acquisition"
    - "expansion"
    - "innovation"
    - "leadership"
    - "momentum"
  negative:
    - "crash"
    - "loss"
    - "decline"
    - "drop"
    - "fall"
    - "negative"
    - "bearish"
    - "downgrade"
    - "underperform"
    - "weak"
    - "crisis"
    - "bankruptcy"
    - "scam"
    - "fraud"
    - "hack"
    - "breach"
    - "regulation"
    - "ban"
    - "tax"
    - "lawsuit"
  neutral:
    - "announce"
    - "report"
    - "update"
    - "release"
    - "comment"
    - "state"
    - "expect"
    - "plan"
    - "meet"
    - "hold"
    - "review"
    - "consider"
    - "evaluate"
    - "discuss"
    - "propose"

# Indicateurs de sentiment
indicators:
  news_sentiment:
    enabled: true
    calculation: "weighted_average"
    factors:
      - "positive_keywords"
      - "negative_keywords"
      - "neutral_keywords"
      - "source_credibility"
      - "impact_score"
    factor_weights:
      positive_keywords: 0.25
      negative_keywords: 0.25
      neutral_keywords: 0.20
      source_credibility: 0.15
      impact_score: 0.15
  news_volume:
    enabled: true
    period: 14
    smoothing: 3
    threshold: 0.5
  news_momentum:
    enabled: true
    period: 14
    smoothing: 3
    threshold: 0.3
  news_velocity:
    enabled: true
    period: 5
    smoothing: 0
    threshold: 0.2
  news_acceleration:
    enabled: true
    period: 10
    smoothing: 0
    threshold: 0.1
  news_confidence:
    enabled: true
    period: 14
    smoothing: 0
    threshold: 0.6

# Analyse d'actualités
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_news_accuracy: true
    compute_news_probability: true
    compute_news_distribution: true
    compute_news_patterns: true
    compute_news_cycles: true
    compute_news_correlation: true
  real_time:
    enabled: true
    update_frequency_seconds: 5
    compute_instantaneous_sentiment: true
    compute_moving_average_sentiment: true
    compute_exponential_sentiment: true
    compute_weighted_sentiment: true
    compute_news_velocity: true
    compute_news_acceleration: true
  predictive:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "xgboost"
      - "lightgbm"
    features:
      - "news_sentiment"
      - "news_volume"
      - "news_momentum"
      - "news_velocity"
      - "news_acceleration"
      - "news_confidence"
      - "category"
      - "source"
      - "impact_score"
      - "price_change"
      - "volume"
      - "time_of_day"
      - "day_of_week"
      - "market_condition"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_threshold: 0.7
    retrain_frequency_hours: 24

# Alertes et notifications
alerts:
  news_breaking:
    enabled: true
    impact_threshold: 0.7
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "critical"
  news_sentiment_change:
    enabled: true
    threshold: 0.2
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "warning"
  news_high_impact:
    enabled: true
    threshold: 0.8
    channels:
      - "telegram"
      - "push_notification"
    severity: "critical"
  news_volume_spike:
    enabled: true
    threshold: 3.0
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"

# Actions automatiques
auto_actions:
  position_adjustment:
    enabled: true
    action_types:
      - "adjust_position_size"
      - "modify_stop_loss"
      - "change_take_profit"
      - "reduce_exposure"
    adjustment_factor: 0.5
    max_adjustment_percent: 50.0
  risk_management:
    enabled: true
    action_types:
      - "reduce_exposure"
      - "increase_hedge"
      - "pause_trading"
      - "reset_parameters"
    risk_multiplier: 1.5
    pause_duration_minutes: 30
  sentiment_response:
    enabled: true
    action_types:
      - "respond_to_positive"
      - "respond_to_negative"
      - "wait_for_confirmation"
      - "validate_sentiment"
    sentiment_threshold: 0.6
    response_factor: 0.5

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 5
    metrics_to_collect:
      - "news_sentiment"
      - "news_volume"
      - "news_momentum"
      - "news_velocity"
      - "news_acceleration"
      - "news_confidence"
      - "news_count"
      - "positive_news"
      - "negative_news"
      - "neutral_news"
      - "impact_score"
  dashboard:
    enabled: true
    update_interval_seconds: 5
    charts:
      - "news_sentiment"
      - "news_volume"
      - "news_distribution"
      - "impact_analysis"
      - "sentiment_trend"
      - "category_analysis"
      - "source_analysis"

# Backtesting
backtesting:
  enabled: true
  use_historical_news: true
  compute_news_accuracy: true
  compute_sentiment_effectiveness: true
  compute_impact_accuracy: true
  compute_risk_adjusted_returns: true
  report_metrics:
    - "news_accuracy"
    - "sentiment_effectiveness"
    - "impact_accuracy"
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"

# Configuration de la base de données
database:
  enabled: true
  table_name: "news_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/news"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "news_alert"
    - url: "https://nexustradingia.com/api/webhooks/news-sentiment"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "news_sentiment"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "news_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/news"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/news/current"
    - "/api/v1/news/history"
    - "/api/v1/news/metrics"
    - "/api/v1/news/status"
    - "/api/v1/news/sources"
    - "/api/v1/news/sentiment"
    - "/api/v1/news/impact"
    - "/api/v1/news/forecast"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/news/"
  encrypt: true
  encryption_key_id: "nexus-news-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 5
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/news"
  market_data:
    enabled: true
    sync_frequency_seconds: 5
    data_endpoint: "ws://market-data:8080/ws"
  sentiment_analyzer:
    enabled: true
    sync_frequency_seconds: 30
    data_endpoint: "http://sentiment-analyzer:8000/api/v1/sentiment"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_news_volume"
      - "low_news_volume"
      - "sentiment_spike"
      - "news_campaign"
      - "impact_validation"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "confidence_threshold > 0.0"
      - "confidence_threshold <= 1.0"
      - "news_sources.financial_news.sources.length > 0"
      - "news_categories.market.categories.length > 0"
      - "impact_thresholds.high.score > impact_thresholds.medium.score"
      - "impact_thresholds.medium.score > impact_thresholds.low.score"
      - "impact_thresholds.low.score > impact_thresholds.minimal.score"
      - "sentiment_keywords.positive.length > 0"
      - "sentiment_keywords.negative.length > 0"
      - "sentiment_keywords.neutral.length > 0"
      - "indicators.news_sentiment.factor_weights.sum() == 1.0"
      - "min_data_points > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  volatility_adjustment: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "bull"
      - "bear"
      - "sideways"
      - "volatile"
      - "stable"
      - "transitional"
  regime_parameters:
    bull:
      news_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
      sentiment_multiplier: 1.1
    bear:
      news_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
      sentiment_multiplier: 0.9
    sideways:
      news_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
      sentiment_multiplier: 1.0
    volatile:
      news_multiplier: 0.7
      threshold_multiplier: 1.3
      confidence_multiplier: 0.8
      sentiment_multiplier: 0.8
    stable:
      news_multiplier: 1.0
      threshold_multiplier: 0.9
      confidence_multiplier: 1.2
      sentiment_multiplier: 1.0
    transitional:
      news_multiplier: 1.3
      threshold_multiplier: 1.1
      confidence_multiplier: 1.1
      sentiment_multiplier: 1.2

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      news_multiplier: 0.8
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
      sentiment_multiplier: 0.8
    london:
      start: "08:00"
      end: "16:00"
      news_multiplier: 1.2
      threshold_multiplier: 0.8
      confidence_multiplier: 1.1
      sentiment_multiplier: 1.2
    newyork:
      start: "13:00"
      end: "22:00"
      news_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
      sentiment_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      news_multiplier: 1.5
      threshold_multiplier: 0.7
      confidence_multiplier: 1.2
      sentiment_multiplier: 1.5

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    news_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    sentiment_multiplier: 1.0
    confidence_threshold: 0.7
    crypto_sensitivity: 1.0
  ETHUSDT:
    news_multiplier: 1.1
    threshold_multiplier: 0.9
    confidence_multiplier: 1.0
    sentiment_multiplier: 1.1
    confidence_threshold: 0.7
    crypto_sensitivity: 1.0
  SOLUSDT:
    news_multiplier: 1.2
    threshold_multiplier: 0.8
    confidence_multiplier: 0.9
    sentiment_multiplier: 1.2
    confidence_threshold: 0.7
    crypto_sensitivity: 1.2
  ADAUSDT:
    news_multiplier: 0.9
    threshold_multiplier: 1.1
    confidence_multiplier: 1.1
    sentiment_multiplier: 0.9
    confidence_threshold: 0.7
    crypto_sensitivity: 0.8
  XRPUSDT:
    news_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    sentiment_multiplier: 1.0
    confidence_threshold: 0.7
    crypto_sensitivity: 1.0
