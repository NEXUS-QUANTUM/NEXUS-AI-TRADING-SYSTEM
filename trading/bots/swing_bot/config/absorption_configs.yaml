# ============================================================================
#
# Description: Complete Absorption configuration for swing trading bot
# Framework: Market Absorption Analysis - Volume & Price Dynamics
# Version: 3.0.0
#
# Absorption analysis identifies periods where large institutional orders
# are being absorbed by the market, providing key entry and exit signals
# for swing trading strategies.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
absorption:
  enabled: true
  version: "3.0.0"
  description: "Market Absorption Analysis for swing trading"
  
  # Timeframes for absorption analysis
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "15m"
  
  # Data sources
  data_sources:
    - "order_book"
    - "trades"
    - "volume_profile"
    - "market_depth"

# ----------------------------------------------------------------------------
# Absorption Detection Parameters
# ----------------------------------------------------------------------------
absorption_detection:
  enabled: true
  description: "Parameters for detecting absorption events"
  
  # General absorption parameters
  general:
    min_volume_spike: 2.0
    min_price_range: 0.005
    max_price_range: 0.05
    min_duration_bars: 3
    max_duration_bars: 20
    volume_window: 20
    price_window: 50
  
  # Absorption types
  types:
    buyer_absorption:
      description: "Buyer absorption - strong buying pressure"
      parameters:
        volume_threshold: 2.5
        price_effect_threshold: 0.01
        spread_threshold: 0.001
        confidence_threshold: 0.7
    
    seller_absorption:
      description: "Seller absorption - strong selling pressure"
      parameters:
        volume_threshold: 2.5
        price_effect_threshold: 0.01
        spread_threshold: 0.001
        confidence_threshold: 0.7
    
    balanced_absorption:
      description: "Balanced absorption - equilibrium"
      parameters:
        volume_threshold: 2.0
        price_effect_threshold: 0.005
        spread_threshold: 0.001
        confidence_threshold: 0.6
    
    breakout_absorption:
      description: "Breakout absorption - key level breach"
      parameters:
        volume_threshold: 3.0
        price_effect_threshold: 0.015
        spread_threshold: 0.002
        confidence_threshold: 0.8

# ----------------------------------------------------------------------------
# Volume Profile Analysis
# ----------------------------------------------------------------------------
volume_profile:
  enabled: true
  description: "Volume Profile analysis for absorption"
  
  parameters:
    # General volume profile settings
    settings:
      value_area_volume: 0.7
      poc_lookback: 50
      profile_periods: 100
      volume_bins: 50
    
    # Point of Control (POC)
    poc:
      enabled: true
      description: "Point of Control identification"
      min_volume: 1000
      relative_strength_threshold: 1.5
    
    # Value Area
    value_area:
      enabled: true
      description: "Value Area calculation"
      value_area_volume: 0.7
      upper_threshold: 0.85
      lower_threshold: 0.15
    
    # Volume gaps
    volume_gaps:
      enabled: true
      min_gap_size: 0.005
      volume_threshold: 1.5
      gap_confirmation: true

# ----------------------------------------------------------------------------
# Order Flow Analysis
# ----------------------------------------------------------------------------
order_flow:
  enabled: true
  description: "Order Flow analysis for absorption detection"
  
  parameters:
    # Order flow imbalances
    imbalances:
      enabled: true
      imbalance_threshold: 2.0
      lookback_bars: 10
      min_volume: 1000
    
    # Cumulative delta
    cumulative_delta:
      enabled: true
      lookback_bars: 50
      divergence_threshold: 0.3
      confirmation_threshold: 0.7
    
    # Order book dynamics
    order_book:
      enabled: true
      depth_levels: 20
      spread_threshold: 0.001
      liquidity_threshold: 1000
    
    # Tape reading
    tape_reading:
      enabled: true
      min_trade_size: 100
      max_trade_size: 10000
      aggression_threshold: 0.8

# ----------------------------------------------------------------------------
# Absorption Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Absorption-based trading signals"
  
  # Signal types
  types:
    # Accumulation signals
    accumulation:
      - signal: "buyer_accumulation"
        description: "Buyer accumulation detected"
        conditions:
          - "buyer_absorption_detected"
          - "volume_spike_confirmed"
          - "price_support_hold"
        confidence: 0.75
        action: "buy"
      
      - signal: "breakout_setup"
        description: "Breakout setup from absorption"
        conditions:
          - "breakout_absorption_detected"
          - "resistance_breach"
          - "volume_confirmation"
        confidence: 0.8
        action: "buy"
      
      - signal: "support_test"
        description: "Support test with absorption"
        conditions:
          - "balanced_absorption_detected"
          - "support_hold"
          - "volume_decrease"
        confidence: 0.7
        action: "buy"
    
    # Distribution signals
    distribution:
      - signal: "seller_accumulation"
        description: "Seller accumulation detected"
        conditions:
          - "seller_absorption_detected"
          - "volume_spike_confirmed"
          - "price_resistance_hold"
        confidence: 0.75
        action: "sell"
      
      - signal: "breakdown_setup"
        description: "Breakdown setup from absorption"
        conditions:
          - "breakout_absorption_detected"
          - "support_breach"
          - "volume_confirmation"
        confidence: 0.8
        action: "sell"
      
      - signal: "resistance_test"
        description: "Resistance test with absorption"
        conditions:
          - "balanced_absorption_detected"
          - "resistance_hold"
          - "volume_decrease"
        confidence: 0.7
        action: "sell"
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "volume_profile"
      - "order_flow"
      - "cumulative_delta"
      - "price_action"
  
  # Signal strength
  strength:
    high:
      conditions:
        - "volume_spike_>_3x"
        - "price_effect_>_0.02"
        - "multiple_confirmations"
      multiplier: 1.2
    
    medium:
      conditions:
        - "volume_spike_>_2x"
        - "price_effect_>_0.01"
        - "single_confirmation"
      multiplier: 1.0
    
    low:
      conditions:
        - "volume_spike_>_1.5x"
        - "price_effect_>_0.005"
        - "no_confirmation"
      multiplier: 0.8

# ----------------------------------------------------------------------------
# Absorption Zones
# ----------------------------------------------------------------------------
absorption_zones:
  enabled: true
  description: "Absorption zone identification and management"
  
  # Zone types
  types:
    demand_zone:
      description: "Demand/Support zone"
      parameters:
        min_touches: 2
        volume_threshold: 1.5
        zone_width: 0.01
        strength_criteria:
          - "volume_increase"
          - "price_reversal"
          - "absorption_detected"
    
    supply_zone:
      description: "Supply/Resistance zone"
      parameters:
        min_touches: 2
        volume_threshold: 1.5
        zone_width: 0.01
        strength_criteria:
          - "volume_increase"
          - "price_rejection"
          - "absorption_detected"
  
  # Zone strength
  strength:
    high:
      conditions:
        - "zone_touches_>_3"
        - "volume_>_2x_average"
        - "absorption_confirmed"
      multiplier: 1.3
    
    medium:
      conditions:
        - "zone_touches_>_2"
        - "volume_>_1.5x_average"
        - "absorption_likely"
      multiplier: 1.0
    
    low:
      conditions:
        - "zone_touches_>_1"
        - "volume_>_1x_average"
        - "absorption_possible"
      multiplier: 0.7

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for absorption strategy"
  
  # Position sizing
  position_sizing:
    base_risk: 0.02
    max_position: 0.1
    min_position: 0.001
    
    sizing_rules:
      - rule: "confidence_based"
        description: "Size based on signal confidence"
        multipliers:
          high: 1.0
          medium: 0.75
          low: 0.5
      
      - rule: "zone_strength_based"
        description: "Size based on absorption zone strength"
        multipliers:
          high: 1.2
          medium: 1.0
          low: 0.8
  
  # Stop Loss
  stop_loss:
    type: "atr_based"
    atr_multiplier: 1.5
    min_distance: 0.005
    max_distance: 0.02
    
    stop_loss_placement:
      demand_zone: "below_zone"
      supply_zone: "above_zone"
      breakout: "below_breakout"
  
  # Take Profit
  take_profit:
    type: "risk_reward"
    risk_reward_ratio: 2.5
    min_target: 0.01
    max_target: 0.05
    
    take_profit_targets:
      - level: "next_zone"
        percentage: 0.5
      - level: "target_zone"
        percentage: 0.75
      - level: "full_target"
        percentage: 1.0

# ----------------------------------------------------------------------------
# Alert Configuration
# ----------------------------------------------------------------------------
alerts:
  enabled: true
  description: "Alerts for absorption events"
  
  alert_types:
    - "absorption_detected"
    - "signal_generated"
    - "zone_formed"
    - "breakout_breakdown"
    - "stop_loss_triggered"
    - "take_profit_triggered"
  
  alert_priority:
    high:
      - "signal_high_confidence"
      - "breakout_confirmed"
      - "stop_loss_trigger"
    
    medium:
      - "absorption_detected"
      - "signal_medium_confidence"
      - "zone_formed"
    
    low:
      - "signal_low_confidence"
      - "zone_test"
      - "volume_spike"

# ----------------------------------------------------------------------------
# Backtesting Configuration
# ----------------------------------------------------------------------------
backtesting:
  enabled: true
  description: "Backtesting configuration for absorption strategy"
  
  parameters:
    start_date: "2024-01-01"
    end_date: "2024-12-31"
    initial_capital: 10000
    commission: 0.001
    slippage: 0.001
    
  test_scenarios:
    - scenario: "bullish_market"
      parameters:
        market_condition: "uptrend"
        volatility: "medium"
    
    - scenario: "bearish_market"
      parameters:
        market_condition: "downtrend"
        volatility: "medium"
    
    - scenario: "sideways_market"
      parameters:
        market_condition: "range_bound"
        volatility: "low"

# ----------------------------------------------------------------------------
# Performance Metrics
# ----------------------------------------------------------------------------
performance_metrics:
  enabled: true
  description: "Performance metrics for absorption strategy"
  
  metrics:
    - "win_rate"
    - "avg_win_loss_ratio"
    - "profit_factor"
    - "max_drawdown"
    - "sharpe_ratio"
    - "calmar_ratio"
    - "sortino_ratio"
    - "expectancy"
  
  targets:
    min_win_rate: 0.45
    min_avg_win_loss_ratio: 1.5
    max_max_drawdown: 0.15
    min_sharpe_ratio: 0.5

# ----------------------------------------------------------------------------
# Visualization Configuration
# ----------------------------------------------------------------------------
visualization:
  enabled: true
  description: "Visualization configuration for absorption analysis"
  
  chart_types:
    - "candlestick"
    - "volume_profile"
    - "cumulative_delta"
    - "order_flow"
  
  indicators:
    - "absorption_zones"
    - "volume_spikes"
    - "signal_markers"
    - "support_resistance"
  
  colors:
    buyer_absorption: "#00b894"
    seller_absorption: "#ff6b6b"
    balanced_absorption: "#fdcb6e"
    demand_zone: "#74b9ff"
    supply_zone: "#ff7675"

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/absorption_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    debugging: false
