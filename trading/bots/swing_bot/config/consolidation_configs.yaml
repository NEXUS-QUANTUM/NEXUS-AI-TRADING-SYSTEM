# ============================================================================
#
# Description: Complete Consolidation configuration for swing trading bot
# Framework: Consolidation Analysis - Price & Volume Consolidation Patterns
# Version: 3.0.0
#
# The Consolidation configuration enables the bot to identify and trade
# consolidation patterns including flags, pennants, triangles, and ranges.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
consolidation:
  enabled: true
  version: "3.0.0"
  description: "Consolidation Analysis for swing trading"
  
  # Consolidation types
  types:
    - "flag"
    - "pennant"
    - "triangle"
    - "rectangle"
    - "wedge"
    - "coil"
    - "channel"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "1h"

# ----------------------------------------------------------------------------
# Flag Pattern
# ----------------------------------------------------------------------------
flag:
  enabled: true
  description: "Flag pattern configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_flag_duration: 5  # bars
    max_flag_duration: 20  # bars
    min_penant_duration: 5  # bars
    max_penant_duration: 20  # bars
    volume_threshold: 0.5
    confidence_threshold: 0.7
  
  # Pattern detection
  detection:
    flagpole_min_length: 5
    flagpole_max_length: 15
    flag_width: 0.02
    flag_slope: 0.1
  
  # Signals
  signals:
    bullish_flag:
      description: "Bullish flag pattern"
      conditions:
        - "flag_detected"
        - "volume_decreasing"
        - "breakout_up"
      confidence: 0.75
    
    bearish_flag:
      description: "Bearish flag pattern"
      conditions:
        - "flag_detected"
        - "volume_decreasing"
        - "breakout_down"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Pennant Pattern
# ----------------------------------------------------------------------------
pennant:
  enabled: true
  description: "Pennant pattern configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_pennant_duration: 5  # bars
    max_pennant_duration: 20  # bars
    volume_threshold: 0.5
    confidence_threshold: 0.7
  
  # Pattern detection
  detection:
    pole_min_length: 5
    pole_max_length: 15
    pennant_width: 0.02
    pennant_slope: 0.2
  
  # Signals
  signals:
    bullish_pennant:
      description: "Bullish pennant pattern"
      conditions:
        - "pennant_detected"
        - "volume_decreasing"
        - "breakout_up"
      confidence: 0.75
    
    bearish_pennant:
      description: "Bearish pennant pattern"
      conditions:
        - "pennant_detected"
        - "volume_decreasing"
        - "breakout_down"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Triangle Pattern
# ----------------------------------------------------------------------------
triangle:
  enabled: true
  description: "Triangle pattern configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_triangle_duration: 10  # bars
    max_triangle_duration: 30  # bars
    volume_threshold: 0.5
    confidence_threshold: 0.7
  
  # Triangle types
  types:
    - "ascending"
    - "descending"
    - "symmetrical"
  
  # Pattern detection
  detection:
    min_touches: 2
    max_touches: 5
    triangle_width: 0.02
    triangle_slope: 0.1
  
  # Signals
  signals:
    ascending_triangle:
      description: "Ascending triangle breakout"
      conditions:
        - "ascending_triangle_detected"
        - "volume_confirmation"
        - "breakout_up"
      confidence: 0.8
    
    descending_triangle:
      description: "Descending triangle breakout"
      conditions:
        - "descending_triangle_detected"
        - "volume_confirmation"
        - "breakout_down"
      confidence: 0.8
    
    symmetrical_triangle:
      description: "Symmetrical triangle breakout"
      conditions:
        - "symmetrical_triangle_detected"
        - "volume_confirmation"
        - "breakout_detected"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Rectangle Pattern
# ----------------------------------------------------------------------------
rectangle:
  enabled: true
  description: "Rectangle pattern configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_rectangle_duration: 10  # bars
    max_rectangle_duration: 30  # bars
    volume_threshold: 0.5
    confidence_threshold: 0.7
  
  # Pattern detection
  detection:
    min_touches: 2
    max_touches: 5
    rectangle_width: 0.02
    rectangle_height: 0.03
  
  # Signals
  signals:
    rectangle_breakout:
      description: "Rectangle breakout"
      conditions:
        - "rectangle_detected"
        - "volume_confirmation"
        - "breakout_detected"
      confidence: 0.75
    
    rectangle_breakdown:
      description: "Rectangle breakdown"
      conditions:
        - "rectangle_detected"
        - "volume_confirmation"
        - "breakdown_detected"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Wedge Pattern
# ----------------------------------------------------------------------------
wedge:
  enabled: true
  description: "Wedge pattern configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_wedge_duration: 10  # bars
    max_wedge_duration: 30  # bars
    volume_threshold: 0.5
    confidence_threshold: 0.7
  
  # Wedge types
  types:
    - "rising"
    - "falling"
  
  # Pattern detection
  detection:
    min_touches: 2
    max_touches: 5
    wedge_width: 0.02
    wedge_slope: 0.1
  
  # Signals
  signals:
    rising_wedge:
      description: "Rising wedge breakdown"
      conditions:
        - "rising_wedge_detected"
        - "volume_confirmation"
        - "breakdown_detected"
      confidence: 0.75
    
    falling_wedge:
      description: "Falling wedge breakout"
      conditions:
        - "falling_wedge_detected"
        - "volume_confirmation"
        - "breakout_detected"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Consolidation Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Consolidation-based trading signals"
  
  # Signal types
  types:
    consolidation_breakout:
      description: "Consolidation breakout signal"
      conditions:
        - "consolidation_detected"
        - "volume_confirmation"
        - "momentum_increasing"
      confidence: 0.8
    
    consolidation_breakdown:
      description: "Consolidation breakdown signal"
      conditions:
        - "consolidation_detected"
        - "volume_confirmation"
        - "momentum_decreasing"
      confidence: 0.8
    
    consolidation_false:
      description: "Consolidation false breakout"
      conditions:
        - "false_breakout_detected"
        - "volume_decreasing"
        - "price_returning"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "volume"
      - "momentum"
      - "price_action"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for consolidation trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Consolidation-based stop loss
    stop_loss:
      type: "consolidation_based"
      distance: 0.01
      atr_multiplier: 1.5
      min: 0.005
      max: 0.02
    
    # Consolidation-based take profit
    take_profit:
      type: "consolidation_based"
      multiplier: 2.5
      min: 0.01
      max: 0.05

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for consolidation trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/consolidation_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    patterns: true
    debugging: false
