# Swing Bot Intelligence Configuration
# Advanced Intelligence & Cognitive Processing Parameters

# General Intelligence Settings
intelligence:
  enabled: true
  intelligence_level: "advanced"  # basic, intermediate, advanced, expert
  cognitive_architecture: "hybrid"  # hybrid, symbolic, connectionist, probabilistic
  learning_paradigm: "meta_learning"  # meta_learning, transfer_learning, multi_task_learning
  version: "3.0.0"

# Cognitive Engine
cognitive_engine:
  enabled: true
  cognitive_functions:
    - "perception"
    - "attention"
    - "memory"
    - "reasoning"
    - "decision_making"
    - "planning"
    - "learning"
    - "adaptation"
    - "prediction"
    - "optimization"
  function_priority: "balanced"  # balanced, perception_first, decision_first, learning_first
  processing_mode: "parallel"  # parallel, sequential, pipeline
  cognitive_load_limit: 0.80

# Perception Engine
perception:
  enabled: true
  perception_modalities:
    - "market_data"
    - "news_sentiment"
    - "social_sentiment"
    - "technical_indicators"
    - "fundamental_data"
    - "economic_data"
    - "order_flow"
    - "volume_profile"
  perception_fusion: "early_fusion"  # early_fusion, late_fusion, hybrid_fusion
  perception_threshold: 0.60
  attention_mechanism: true
  sensory_gating: true

# Attention Mechanism
attention:
  enabled: true
  attention_type: "multi_head"  # multi_head, single_head, self_attention, cross_attention
  attention_heads: 8
  attention_dimension: 256
  attention_dropout: 0.10
  key_dimension: 64
  value_dimension: 64
  attention_mechanisms:
    - "spatial_attention"
    - "temporal_attention"
    - "feature_attention"
    - "channel_attention"
  attention_weights_visualization: true
  attention_threshold: 0.50

# Memory Systems
memory:
  enabled: true
  memory_types:
    - "sensory_memory"
    - "short_term_memory"
    - "working_memory"
    - "long_term_memory"
    - "episodic_memory"
    - "semantic_memory"
    - "procedural_memory"
    - "declarative_memory"
    - "implicit_memory"
    - "explicit_memory"
  memory_capacity:
    sensory_memory_seconds: 5
    short_term_memory_bars: 100
    working_memory_capacity: 7
    long_term_memory_days: 365
  memory_retrieval: "content_addressable"
  memory_consolidation_frequency_hours: 6
  memory_cleanup_frequency_hours: 24

# Reasoning Engine
reasoning:
  enabled: true
  reasoning_methods:
    - "deductive_reasoning"
    - "inductive_reasoning"
    - "abductive_reasoning"
    - "analogical_reasoning"
    - "causal_reasoning"
    - "probabilistic_reasoning"
    - "fuzzy_reasoning"
    - "case_based_reasoning"
    - "rule_based_reasoning"
    - "model_based_reasoning"
  reasoning_depth: "multi_level"  # single_level, multi_level, hierarchical
  reasoning_strategy: "forward_chaining"  # forward_chaining, backward_chaining, hybrid
  inference_engine: "bayesian"  # bayesian, fuzzy, rule_based, neural
  uncertainty_handling: true
  conflict_resolution: true

# Decision Making
decision_making:
  enabled: true
  decision_framework: "multi_criteria"  # multi_criteria, probabilistic, heuristic, rational
  decision_criteria:
    - "expected_return"
    - "risk_adjusted_return"
    - "drawdown_risk"
    - "liquidity_risk"
    - "market_impact"
    - "execution_quality"
    - "compliance_constraints"
    - "regulatory_constraints"
    - "capital_requirements"
  decision_weights:
    expected_return: 0.25
    risk_adjusted_return: 0.25
    drawdown_risk: 0.15
    liquidity_risk: 0.10
    market_impact: 0.10
    execution_quality: 0.10
    compliance_constraints: 0.05
  decision_confidence_threshold: 0.70
  decision_timeout_seconds: 10
  multi_criteria_decision_analysis: true

# Planning Engine
planning:
  enabled: true
  planning_horizon_bars: 100
  planning_strategy: "hierarchical"  # hierarchical, forward, backward, opportunistic
  planning_components:
    - "goal_identification"
    - "strategy_formulation"
    - "action_sequencing"
    - "resource_allocation"
    - "contingency_planning"
    - "plan_execution"
    - "plan_monitoring"
    - "plan_revision"
  plan_optimization: true
  contingency_plans: true
  plan_revision_frequency_bars: 10

# Learning Systems
learning:
  enabled: true
  learning_methods:
    - "supervised_learning"
    - "unsupervised_learning"
    - "reinforcement_learning"
    - "transfer_learning"
    - "meta_learning"
    - "multi_task_learning"
    - "federated_learning"
    - "active_learning"
    - "curriculum_learning"
    - "few_shot_learning"
  learning_rate: 0.001
  batch_size: 64
  epochs: 100
  validation_split: 0.20
  early_stopping_patience: 10
  learning_scheduling: true
  learning_monitoring: true

# Meta-Learning
meta_learning:
  enabled: true
  meta_learning_method: "maml"  # maml, reptile, meta_sgd, meta_critic
  meta_tasks: 10
  meta_batch_size: 4
  meta_learning_rate: 0.01
  inner_learning_rate: 0.01
  inner_steps: 5
  meta_optimizer: "adam"
  rapid_adaptation: true
  few_shot_learning: true

# Transfer Learning
transfer_learning:
  enabled: true
  transfer_methods:
    - "fine_tuning"
    - "feature_extraction"
    - "domain_adaptation"
    - "task_adaptation"
    - "parameter_sharing"
    - "knowledge_distillation"
  source_domains:
    - "equity_markets"
    - "forex_markets"
    - "commodity_markets"
    - "crypto_markets"
    - "fixed_income"
  target_domain: "multi_asset"
  transfer_strategy: "adaptive"  # adaptive, fixed, selective
  knowledge_preservation: true

# Adaptability
adaptability:
  enabled: true
  adaptation_mechanisms:
    - "parameter_adaptation"
    - "structure_adaptation"
    - "strategy_adaptation"
    - "model_adaptation"
    - "regime_adaptation"
    - "environment_adaptation"
  adaptation_speed: 0.10
  adaptation_threshold: 0.50
  adaptation_frequency_minutes: 15
  robustness_mechanisms:
    - "noise_injection"
    - "dropout"
    - "ensemble_methods"
    - "regularization"
  concept_drift_detection: true
  concept_drift_threshold: 0.15

# Prediction Engine
prediction:
  enabled: true
  prediction_horizons:
    - "short_term": "1h"
    - "medium_term": "24h"
    - "long_term": "7d"
  prediction_models:
    - "time_series_forecasting"
    - "probabilistic_forecasting"
    - "ensemble_forecasting"
    - "deep_learning_forecasting"
    - "statistical_forecasting"
    - "machine_learning_forecasting"
  prediction_confidence_level: 0.95
  prediction_uncertainty: true
  prediction_calibration: true
  prediction_interpretability: true

# Pattern Recognition
pattern_recognition:
  enabled: true
  pattern_types:
    - "chart_patterns"
    - "technical_patterns"
    - "price_patterns"
    - "volume_patterns"
    - "volatility_patterns"
    - "seasonal_patterns"
    - "cyclic_patterns"
    - "trend_patterns"
    - "reversal_patterns"
    - "continuation_patterns"
  pattern_detection_methods:
    - "template_matching"
    - "machine_learning"
    - "deep_learning"
    - "genetic_algorithm"
    - "fuzzy_logic"
  pattern_lookback_bars: 100
  pattern_confidence_threshold: 0.70
  pattern_min_count: 5

# Anomaly Detection
anomaly_detection:
  enabled: true
  anomaly_types:
    - "price_anomaly"
    - "volume_anomaly"
    - "volatility_anomaly"
    - "correlation_anomaly"
    - "flow_anomaly"
    - "sentiment_anomaly"
    - "execution_anomaly"
    - "risk_anomaly"
  detection_methods:
    - "statistical_methods"
    - "machine_learning"
    - "deep_learning"
    - "isolation_forest"
    - "autoencoders"
    - "one_class_svm"
  anomaly_threshold: 3.0
  detection_window_bars: 50
  false_positive_reduction: true
  adaptive_threshold: true

# Causality Analysis
causality:
  enabled: true
  causal_methods:
    - "granger_causality"
    - "structural_equation_modeling"
    - "directed_acyclic_graphs"
    - "intervention_analysis"
    - "counterfactual_analysis"
  causal_discovery: true
  causal_inference: true
  causal_graph_visualization: true
  causal_confounders_identification: true
  causal_validation: true

# Knowledge Graph
knowledge_graph:
  enabled: true
  graph_types:
    - "market_knowledge"
    - "strategy_knowledge"
    - "risk_knowledge"
    - "execution_knowledge"
    - "historical_knowledge"
  graph_storage: "neo4j"  # neo4j, amazon_neptune, graphdb
  entity_types:
    - "asset"
    - "strategy"
    - "pattern"
    - "event"
    - "factor"
    - "regime"
    - "risk"
    - "signal"
  relationship_types:
    - "influences"
    - "correlates"
    - "predicts"
    - "causes"
    - "precedes"
    - "associated_with"
    - "part_of"
    - "type_of"
  graph_update_frequency_hours: 24
  reasoning_on_graph: true

# Natural Language Processing
nlp:
  enabled: true
  nlp_capabilities:
    - "sentiment_analysis"
    - "entity_recognition"
    - "relationship_extraction"
    - "topic_modeling"
    - "summarization"
    - "question_answering"
    - "text_classification"
    - "news_analysis"
  sentiment_sources:
    - "financial_news"
    - "social_media"
    - "earning_calls"
    - "regulatory_filings"
    - "analyst_reports"
    - "company_communications"
  sentiment_models:
    - "finbert"
    - "bloomberg_bert"
    - "custom_sentiment_model"
  sentiment_update_frequency_minutes: 15
  entity_extraction: true

# Neural Architecture
neural_architecture:
  enabled: true
  architectures:
    - "transformer"
    - "lstm"
    - "gru"
    - "cnn"
    - "attention"
    - "memory_networks"
    - "graph_neural_networks"
    - "capsule_networks"
  transformer_config:
    num_layers: 6
    num_heads: 8
    d_model: 512
    d_ff: 2048
    dropout: 0.10
  lstm_config:
    num_layers: 3
    hidden_size: 256
    bidirectional: true
  training_config:
    optimizer: "adamw"
    learning_rate: 0.0001
    weight_decay: 0.01
    warmup_steps: 1000

# Explainable AI
xai:
  enabled: true
  explainability_methods:
    - "lime"
    - "shap"
    - "integrated_gradients"
    - "grad_cam"
    - "attention_visualization"
    - "decision_trees"
    - "rule_extraction"
  explanation_levels:
    - "global"
    - "local"
    - "counterfactual"
  explanation_depth: "detailed"  # basic, detailed, comprehensive
  explanation_visualization: true
  explanation_storage: true

# Ethics & Trust
ethics:
  enabled: true
  ethical_principles:
    - "fairness"
    - "transparency"
    - "accountability"
    - "robustness"
    - "privacy"
    - "inclusivity"
  bias_detection: true
  fairness_metrics: true
  trust_scoring: true
  trust_threshold: 0.80
  ethics_monitoring: true

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/intelligence"
  api_endpoint: "/api/v1/trading/intelligence"
  dashboard_url: "http://localhost:3000/intelligence"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  ml_platforms:
    - "tensorflow"
    - "pytorch"
    - "sklearn"
    - "mlflow"
  visualization: true
