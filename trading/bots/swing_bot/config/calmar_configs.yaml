#
# Description: Complete Calmar Ratio configuration for swing trading bot
# Framework: Calmar Ratio - Risk-Adjusted Return Optimization
# Version: 3.0.0
#
# The Calmar Ratio configuration enables the bot to optimize trading
# strategies based on the risk-adjusted return metric, balancing
# returns against maximum drawdown.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
calmar:
  enabled: true
  version: "3.0.0"
  description: "Calmar Ratio Optimization for swing trading"
  
  # Calmar types
  types:
    - "standard"
    - "modified"
    - "rolling"
    - "adaptive"
    - "target"
  
  default_type: "standard"
  
  # Calculation periods
  periods:
    - 1  # month
    - 3  # months
    - 6  # months
    - 12  # months
    - 36  # months
  
  default_period: 12

# ----------------------------------------------------------------------------
# Standard Calmar
# ----------------------------------------------------------------------------
standard_calmar:
  enabled: true
  description: "Standard Calmar Ratio configuration"
  
  # Parameters
  parameters:
    lookback_period: 12  # months
    annualization_factor: 12
    min_periods: 6
    max_drawdown_calculation: "peak_to_trough"
    return_calculation: "compound"
  
  # Metrics
  metrics:
    annualized_return:
      enabled: true
      calculation: "compound"
      lookback_period: 12
    
    max_drawdown:
      enabled: true
      calculation: "peak_to_trough"
      lookback_period: 12
    
    calmar_ratio:
      enabled: true
      calculation: "return_drawdown"
  
  # Thresholds
  thresholds:
    excellent: 3.0
    good: 2.0
    average: 1.0
    poor: 0.5
    very_poor: 0.0

# ----------------------------------------------------------------------------
# Modified Calmar
# ----------------------------------------------------------------------------
modified_calmar:
  enabled: true
  description: "Modified Calmar Ratio configuration"
  
  # Parameters
  parameters:
    lookback_period: 12  # months
    annualization_factor: 12
    min_periods: 6
    drawdown_calculation: "modified"
    return_calculation: "excess"
    risk_free_rate: 0.02
  
  # Modifications
  modifications:
    excess_return: true
    conditional_drawdown: true
    risk_adjusted: true
    volatility_adjusted: true
  
  # Metrics
  metrics:
    excess_return:
      enabled: true
      calculation: "return_risk_free"
      lookback_period: 12
    
    conditional_drawdown:
      enabled: true
      calculation: "cvar_drawdown"
      confidence_level: 0.95
    
    modified_calmar:
      enabled: true
      calculation: "excess_return_cdrawdown"
  
  # Thresholds
  thresholds:
    excellent: 2.5
    good: 1.5
    average: 0.8
    poor: 0.3
    very_poor: 0.0

# ----------------------------------------------------------------------------
# Rolling Calmar
# ----------------------------------------------------------------------------
rolling_calmar:
  enabled: true
  description: "Rolling Calmar Ratio configuration"
  
  # Parameters
  parameters:
    window_period: 12  # months
    rolling_step: 1  # month
    min_windows: 3
    annualization_factor: 12
    drawdown_calculation: "peak_to_trough"
  
  # Metrics
  metrics:
    rolling_return:
      enabled: true
      calculation: "compound"
      window_period: 12
    
    rolling_drawdown:
      enabled: true
      calculation: "peak_to_trough"
      window_period: 12
    
    rolling_calmar:
      enabled: true
      calculation: "return_drawdown"
  
  # Statistics
  statistics:
    current: true
    average: true
    median: true
    standard_deviation: true
    percentile: true
    
    percentiles:
      - 25
      - 50
      - 75
      - 90
      - 95

# ----------------------------------------------------------------------------
# Adaptive Calmar
# ----------------------------------------------------------------------------
adaptive_calmar:
  enabled: true
  description: "Adaptive Calmar Ratio configuration"
  
  # Parameters
  parameters:
    lookback_period: 12  # months
    adaptation_interval: 3  # months
    min_periods: 6
    annualization_factor: 12
    target_calmar: 2.0
    tolerance: 0.2
  
  # Adaptation rules
  rules:
    increase_risk:
      conditions:
        - "calmar_>_target_*_1.2"
        - "drawdown_below_threshold"
      action: "increase_position_by_10%"
    
    decrease_risk:
      conditions:
        - "calmar_<_target_*_0.8"
        - "drawdown_above_threshold"
      action: "decrease_position_by_10%"
    
    maintain_risk:
      conditions:
        - "calmar_within_tolerance"
        - "drawdown_within_threshold"
      action: "maintain_position"

# ----------------------------------------------------------------------------
# Target Calmar
# ----------------------------------------------------------------------------
target_calmar:
  enabled: true
  description: "Target Calmar Ratio configuration"
  
  # Parameters
  parameters:
    target_calmar: 2.0
    min_periods: 6
    max_periods: 36
    annualization_factor: 12
    drawdown_calculation: "peak_to_trough"
  
  # Optimization
  optimization:
    method: "target_risk"
    optimization_interval: 3  # months
    constraints:
      max_drawdown: 0.15
      max_position: 0.1
      min_position: 0.001
  
  # Targets
  targets:
    optimal_calmar: 2.0
    acceptable_calmar: 1.5
    minimum_calmar: 1.0

# ----------------------------------------------------------------------------
# Calmar Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Calmar-based trading signals"
  
  # Signal types
  types:
    calmar_buy:
      description: "Calmar buy signal"
      conditions:
        - "calmar_>_threshold"
        - "return_positive"
        - "drawdown_decreasing"
      confidence: 0.7
    
    calmar_sell:
      description: "Calmar sell signal"
      conditions:
        - "calmar_<_threshold"
        - "return_negative"
        - "drawdown_increasing"
      confidence: 0.7
    
    calmar_hedge:
      description: "Calmar hedge signal"
      conditions:
        - "calmar_declining"
        - "drawdown_increasing"
        - "return_uncertain"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for Calmar optimization"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Calmar-based risk
    calmar_risk:
      enabled: true
      target_calmar: 2.0
      adaptation: true
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for Calmar optimization"
  
  metrics:
    - "calmar_ratio"
    - "annualized_return"
    - "max_drawdown"
    - "sharpe_ratio"
    - "win_rate"
    - "profit_factor"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_calmar_ratio: 1.0
    max_max_drawdown: 0.1
    min_sharpe_ratio: 0.5

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/calmar_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    calmar: true
    debugging: false
