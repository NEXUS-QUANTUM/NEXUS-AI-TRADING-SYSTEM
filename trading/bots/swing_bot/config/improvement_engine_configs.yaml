# Swing Bot Improvement Engine Configuration
# Self-Improvement & Adaptive Learning Engine Parameters

# General Improvement Engine Settings
improvement_engine:
  enabled: true
  mode: "autonomous"  # autonomous, supervised, hybrid
  learning_paradigm: "reinforcement_learning"  # reinforcement_learning, supervised, unsupervised, hybrid
  improvement_cycle_minutes: 60
  version: "3.0.0"

# Engine Architecture
architecture:
  component_type: "modular"
  modules:
    - "performance_analyzer"
    - "strategy_optimizer"
    - "parameter_tuner"
    - "model_trainer"
    - "regime_adaptor"
    - "risk_adjuster"
    - "execution_improver"
    - "knowledge_extractor"
    - "feedback_processor"
  module_interaction: "pipeline"
  parallel_execution: true
  max_workers: 8

# Performance Analysis Engine
performance_analyzer:
  enabled: true
  analysis_frequency_minutes: 5
  metrics:
    - "sharpe_ratio"
    - "sortino_ratio"
    - "calmar_ratio"
    - "win_rate"
    - "profit_factor"
    - "average_return"
    - "max_drawdown"
    - "recovery_factor"
    - "ulcer_index"
    - "omega_ratio"
    - "information_ratio"
    - "treynor_ratio"
    - "capture_ratio"
    - "stability_score"
    - "risk_adjusted_return"
  lookback_window_bars: 100
  rolling_window_bars: 20
  benchmark_comparison: true
  percentile_ranking: true
  zscore_detection: true
  trend_analysis: true

# Strategy Optimization Engine
strategy_optimizer:
  enabled: true
  optimization_type: "multi_objective"
  objectives:
    - maximize: "sharpe_ratio"
    - minimize: "max_drawdown"
    - maximize: "win_rate"
    - maximize: "profit_factor"
  optimization_algorithm: "nsga_ii"  # nsga_ii, spea2, moea_d, pso
  population_size: 100
  generations: 50
  mutation_rate: 0.10
  crossover_rate: 0.80
  tournament_size: 5
  convergence_threshold: 0.001
  parallel_evaluation: true
  checkpoint_frequency: 10

# Parameter Tuning Engine
parameter_tuner:
  enabled: true
  tuning_method: "bayesian"  # bayesian, grid, random, genetic, hyperband
  parameter_space:
    - name: "momentum_fast_period"
      type: "integer"
      range: [5, 50]
      step: 1
    - name: "momentum_slow_period"
      type: "integer"
      range: [20, 200]
      step: 1
    - name: "stop_loss_percent"
      type: "float"
      range: [0.005, 0.05]
      step: 0.001
    - name: "take_profit_percent"
      type: "float"
      range: [0.01, 0.10]
      step: 0.001
    - name: "position_size_percent"
      type: "float"
      range: [0.01, 0.10]
      step: 0.005
    - name: "rsi_period"
      type: "integer"
      range: [7, 21]
      step: 1
    - name: "bb_period"
      type: "integer"
      range: [10, 30]
      step: 1
    - name: "bb_std_dev"
      type: "float"
      range: [1.5, 3.0]
      step: 0.1
  iterations: 100
  validation_split: 0.20
  early_stopping: true
  convergence_threshold: 0.001
  parallel_evaluation: true

# Model Training Engine
model_trainer:
  enabled: true
  model_types:
    - "random_forest"
    - "xgboost"
    - "lightgbm"
    - "catboost"
    - "neural_network"
    - "lstm"
    - "transformer"
    - "gradient_boosting"
  ensemble_method: "stacking"
  training_paradigm: "online"  # online, batch, incremental
  retrain_frequency_hours: 6
  validation_split: 0.20
  test_split: 0.10
  cross_validation_folds: 5
  hyperparameter_optimization: true
  early_stopping_patience: 10
  model_versioning: true
  model_rollback: true
  feature_importance_analysis: true
  model_explainability: true

# Regime Adaptation Engine
regime_adaptor:
  enabled: true
  detection_methods:
    - "volatility_regime"
    - "trend_regime"
    - "correlation_regime"
    - "liquidity_regime"
    - "momentum_regime"
    - "volume_regime"
    - "sentiment_regime"
  lookback_window_bars: 50
  adaptation_threshold: 0.60
  regime_switching_cooldown_bars: 10
  adaptation_actions:
    - "parameter_adjustment"
    - "strategy_rotation"
    - "weight_reallocation"
    - "risk_adjustment"
    - "execution_style_change"
  confidence_required: 0.75
  regime_memory_days: 30
  regime_transition_analysis: true

# Risk Adjustment Engine
risk_adjuster:
  enabled: true
  risk_metrics:
    - "value_at_risk"
    - "expected_shortfall"
    - "maximum_drawdown"
    - "volatility"
    - "beta"
    - "correlation"
    - "tail_risk"
  risk_targets:
    max_drawdown: 0.10
    max_var: 0.05
    max_volatility: 0.25
    max_correlation: 0.70
  adjustment_mechanisms:
    - "position_sizing"
    - "stop_loss_adjustment"
    - "take_profit_adjustment"
    - "strategy_weighting"
    - "diversification"
  dynamic_adjustment: true
  adjustment_frequency_minutes: 15
  risk_rebalancing: true

# Execution Improvement Engine
execution_improver:
  enabled: true
  execution_metrics:
    - "slippage"
    - "market_impact"
    - "execution_speed"
    - "fill_rate"
    - "price_improvement"
  improvement_methods:
    - "order_slicing"
    - "timing_optimization"
    - "venue_selection"
    - "liquidity_provision"
    - "iceberg_optimization"
  improvement_frequency_minutes: 30
  backtesting_validation: true
  benchmarking: true
  cost_reduction_target_percent: 10

# Knowledge Extraction Engine
knowledge_extractor:
  enabled: true
  extraction_methods:
    - "pattern_recognition"
    - "association_rule_mining"
    - "causal_inference"
    - "anomaly_detection"
    - "clustering"
  knowledge_types:
    - "market_patterns"
    - "strategy_performance"
    - "risk_factors"
    - "execution_patterns"
    - "regime_transitions"
  storage_method: "vector_database"
  retention_days: 365
  similarity_threshold: 0.75
  pattern_mining_frequency_hours: 12
  causal_discovery: true

# Feedback Processing Engine
feedback_processor:
  enabled: true
  feedback_sources:
    - "trade_outcomes"
    - "market_reactions"
    - "performance_metrics"
    - "risk_events"
    - "execution_quality"
    - "user_feedback"
  feedback_delay_bars: 10
  feedback_weight: 0.50
  reinforcement_learning: true
  reward_shaping: true
  penalty_function: true
  positive_reinforcement: true
  negative_reinforcement: true
  adaptation_speed: 0.10
  feedback_memory_size: 1000

# Self-Learning Pipeline
learning_pipeline:
  enabled: true
  pipeline_stages:
    - "data_collection"
    - "data_preprocessing"
    - "feature_engineering"
    - "model_training"
    - "strategy_optimization"
    - "risk_adjustment"
    - "deployment"
    - "monitoring"
  pipeline_frequency_seconds: 60
  batch_size: 1000
  parallel_processing: true
  error_handling: "retry"
  max_retries: 3
  logging_enabled: true

# Continuous Improvement Cycle
improvement_cycle:
  enabled: true
  cycle_duration_hours: 6
  cycle_stages:
    - "performance_assessment"
    - "strategy_evaluation"
    - "parameter_optimization"
    - "model_retraining"
    - "regime_detection"
    - "risk_rebalancing"
    - "execution_improvement"
    - "knowledge_extraction"
    - "deployment"
    - "validation"
  cycle_automation: true
  approval_required: false
  rollback_on_failure: true

# Performance Monitoring
performance_monitoring:
  enabled: true
  monitoring_frequency_seconds: 30
  metrics_aggregation: "real_time"
  anomaly_detection: true
  anomaly_threshold: 3.0
  drift_detection: true
  drift_threshold: 0.15
  dashboard_integration: true
  visualization: true
  alerting_enabled: true

# Quality Assurance
quality_assurance:
  enabled: true
  validation_frequency_hours: 12
  test_types:
    - "unit_tests"
    - "integration_tests"
    - "strategy_validation"
    - "performance_validation"
    - "risk_validation"
  minimum_validation_score: 0.80
  failure_action: "rollback"
  test_data_percentage: 20
  backtesting_validation: true
  simulation_validation: true

# Model Registry
model_registry:
  enabled: true
  registry_type: "mlflow"
  models_tracked:
    - "prediction_models"
    - "classification_models"
    - "regression_models"
    - "ensemble_models"
    - "deep_learning_models"
  version_control: true
  model_metrics_tracking: true
  model_comparison: true
  model_deployment_tracking: true
  registry_storage_days: 365

# Experiment Tracking
experiment_tracking:
  enabled: true
  tracking_tool: "mlflow"  # mlflow, wandb, comet
  experiments:
    - "strategy_optimization"
    - "parameter_tuning"
    - "model_training"
    - "regime_adaptation"
  experiment_tags: true
  hyperparameter_tracking: true
  metric_tracking: true
  artifact_tracking: true
  experiment_visualization: true
  experiment_comparison: true

# Data Storage
data_storage:
  enabled: true
  storage_types:
    - "timescaledb"
    - "minio"
    - "s3"
    - "hdfs"
  data_categories:
    - "performance_data"
    - "market_data"
    - "model_data"
    - "strategy_data"
    - "execution_data"
  retention_days: 365
  compression: "zstd"
  backup_frequency_days: 1
  archival_policy: "auto"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/improvement_engine"
  api_endpoint: "/api/v1/trading/improvement-engine"
  dashboard_url: "http://localhost:3000/improvement-engine"
  external_systems:
    - "mlflow"
    - "wandb"
    - "grafana"
    - "prometheus"
    - "elasticsearch"
    - "kafka"
  real_time_updates: true
  data_sync_frequency_seconds: 30

# Logging & Auditing
logging:
  enabled: true
  log_level: "info"
  log_categories:
    - "performance"
    - "optimization"
    - "training"
    - "adaptation"
    - "risk"
    - "execution"
    - "errors"
    - "audit"
  log_rotation: true
  max_log_size_mb: 100
  retention_days: 30
  audit_trail: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "performance_degradation"
    - "optimization_failure"
    - "model_drift"
    - "risk_breach"
    - "system_error"
    - "validation_failure"
  alert_thresholds:
    performance_degradation: 0.10
    optimization_failure_count: 3
    model_drift: 0.15
    risk_breach_count: 2
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600
  escalation_policy: true
