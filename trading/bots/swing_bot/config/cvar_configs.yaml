# ============================================================================
#
# Description: Complete CVaR (Conditional Value at Risk) configuration for swing trading bot
# Framework: CVaR Analysis - Tail Risk & Expected Shortfall Management
# Version: 3.0.0
#
# The CVaR configuration enables the bot to analyze and manage tail risk
# using Conditional Value at Risk (Expected Shortfall) metrics.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
cvar:
  enabled: true
  version: "3.0.0"
  description: "CVaR Analysis for swing trading"
  
  # CVaR types
  types:
    - "normal"
    - "historical"
    - "monte_carlo"
    - "parametric"
    - "non_parametric"
  
  # Confidence levels
  confidence_levels:
    - 0.90
    - 0.95
    - 0.99
  
  default_confidence: 0.95
  
  # Time horizons
  horizons:
    - 1  # day
    - 5  # days
    - 10  # days
    - 20  # days
  
  default_horizon: 1

# ----------------------------------------------------------------------------
# Normal CVaR
# ----------------------------------------------------------------------------
normal_cvar:
  enabled: true
  description: "Normal CVaR configuration"
  
  # Parameters
  parameters:
    lookback_period: 100
    confidence_level: 0.95
    horizon: 1
    annualization_factor: 252
    risk_free_rate: 0.02
  
  # Calculation methods
  methods:
    - "parametric"
    - "analytical"
  
  default_method: "parametric"
  
  # Metrics
  metrics:
    cvar_95:
      enabled: true
      calculation: "parametric"
      confidence_level: 0.95
    
    cvar_99:
      enabled: true
      calculation: "parametric"
      confidence_level: 0.99
    
    cvar_ratio:
      enabled: true
      calculation: "cvar_return_ratio"
  
  # Signals
  signals:
    cvar_increasing:
      description: "CVaR increasing signal"
      conditions:
        - "cvar_95_>_threshold"
        - "cvar_99_>_threshold"
        - "tail_risk_increasing"
      action: "reduce_position"
    
    cvar_decreasing:
      description: "CVaR decreasing signal"
      conditions:
        - "cvar_95_<_threshold"
        - "cvar_99_<_threshold"
        - "tail_risk_decreasing"
      action: "increase_position"

# ----------------------------------------------------------------------------
# Historical CVaR
# ----------------------------------------------------------------------------
historical_cvar:
  enabled: true
  description: "Historical CVaR configuration"
  
  # Parameters
  parameters:
    lookback_period: 100
    confidence_level: 0.95
    horizon: 1
    min_data_points: 50
    max_data_points: 500
  
  # Calculation methods
  methods:
    - "order_statistics"
    - "kernel_estimation"
  
  default_method: "order_statistics"
  
  # Metrics
  metrics:
    historical_cvar_95:
      enabled: true
      calculation: "order_statistics"
      confidence_level: 0.95
    
    historical_cvar_99:
      enabled: true
      calculation: "order_statistics"
      confidence_level: 0.99
    
    historical_cvar_ratio:
      enabled: true
      calculation: "cvar_return_ratio"
  
  # Signals
  signals:
    historical_cvar_increasing:
      description: "Historical CVaR increasing"
      conditions:
        - "historical_cvar_95_>_threshold"
        - "historical_cvar_99_>_threshold"
      action: "reduce_position"
    
    historical_cvar_decreasing:
      description: "Historical CVaR decreasing"
      conditions:
        - "historical_cvar_95_<_threshold"
        - "historical_cvar_99_<_threshold"
      action: "increase_position"

# ----------------------------------------------------------------------------
# Monte Carlo CVaR
# ----------------------------------------------------------------------------
monte_carlo_cvar:
  enabled: true
  description: "Monte Carlo CVaR configuration"
  
  # Parameters
  parameters:
    lookback_period: 100
    confidence_level: 0.95
    horizon: 1
    simulations: 10000
    min_simulations: 1000
    max_simulations: 50000
  
  # Calculation methods
  methods:
    - "full_simulation"
    - "variance_reduction"
  
  default_method: "full_simulation"
  
  # Metrics
  metrics:
    mc_cvar_95:
      enabled: true
      calculation: "full_simulation"
      confidence_level: 0.95
    
    mc_cvar_99:
      enabled: true
      calculation: "full_simulation"
      confidence_level: 0.99
    
    mc_cvar_ratio:
      enabled: true
      calculation: "cvar_return_ratio"
  
  # Signals
  signals:
    mc_cvar_increasing:
      description: "Monte Carlo CVaR increasing"
      conditions:
        - "mc_cvar_95_>_threshold"
        - "mc_cvar_99_>_threshold"
      action: "reduce_position"
    
    mc_cvar_decreasing:
      description: "Monte Carlo CVaR decreasing"
      conditions:
        - "mc_cvar_95_<_threshold"
        - "mc_cvar_99_<_threshold"
      action: "increase_position"

# ----------------------------------------------------------------------------
# CVaR Optimization
# ----------------------------------------------------------------------------
cvar_optimization:
  enabled: true
  description: "CVaR optimization configuration"
  
  # Parameters
  parameters:
    lookback_period: 100
    confidence_level: 0.95
    horizon: 1
    target_cvar: 0.02
    risk_free_rate: 0.02
  
  # Optimization methods
  methods:
    - "mean_cvar"
    - "min_cvar"
    - "max_return_cvar"
  
  default_method: "mean_cvar"
  
  # Constraints
  constraints:
    max_position: 0.05
    min_position: 0.001
    max_cvar: 0.02
    min_return: 0.01
  
  # Signals
  signals:
    cvar_optimization_needed:
      description: "CVaR optimization needed"
      conditions:
        - "current_cvar_>_target_cvar"
        - "return_<_min_return"
      action: "rebalance_portfolio"

# ----------------------------------------------------------------------------
# CVaR Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "CVaR-based trading signals"
  
  # Signal types
  types:
    cvar_reduce:
      description: "CVaR reduce signal"
      conditions:
        - "cvar_>_threshold"
        - "tail_risk_increasing"
        - "drawdown_>_threshold"
      action: "reduce_position"
    
    cvar_increase:
      description: "CVaR increase signal"
      conditions:
        - "cvar_<_threshold"
        - "tail_risk_decreasing"
        - "drawdown_<_threshold"
      action: "increase_position"
    
    cvar_hedge:
      description: "CVaR hedge signal"
      conditions:
        - "cvar_uncertain"
        - "tail_risk_uncertain"
        - "drawdown_uncertain"
      action: "hedge_position"
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for CVaR trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # CVaR-based stop loss
    stop_loss:
      type: "cvar_based"
      threshold: 0.02
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for CVaR trading"
  
  metrics:
    - "cvar_95"
    - "cvar_99"
    - "cvar_ratio"
    - "tail_risk"
    - "expected_shortfall"
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
  
  targets:
    max_cvar_95: 0.02
    max_cvar_99: 0.05
    min_cvar_ratio: 1.5
    max_tail_risk: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/cvar_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    cvar: true
    debugging: false
