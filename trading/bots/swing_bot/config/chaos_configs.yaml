#
# Description: Complete Chaos configuration for swing trading bot
# Framework: Chaos Theory - Market Complexity & Nonlinear Dynamics
# Version: 3.0.0
#
# The Chaos configuration enables the bot to analyze and trade markets
# using chaos theory principles, including fractals, nonlinear dynamics,
# and complexity analysis.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
chaos:
  enabled: true
  version: "3.0.0"
  description: "Chaos Theory Analysis for swing trading"
  
  # Chaos methods
  methods:
    - "fractal_analysis"
    - "lyapunov_exponent"
    - "hurst_exponent"
    - "entropy_analysis"
    - "phase_space"
    - "attractor_reconstruction"
    - "correlation_dimension"
  
  # Timeframes
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "4h"
    - "1d"
  
  default_timeframe: "1h"

# ----------------------------------------------------------------------------
# Fractal Analysis
# ----------------------------------------------------------------------------
fractal_analysis:
  enabled: true
  description: "Fractal Analysis configuration"
  
  # Parameters
  parameters:
    lookback_period: 100
    fractal_dimension: 1.5
    min_fractal_size: 5
    max_fractal_size: 20
    confidence_threshold: 0.7
  
  # Fractal types
  types:
    - "bullish_fractal"
    - "bearish_fractal"
    - "neutral_fractal"
  
  # Detection
  detection:
    method: "price_pattern"
    min_fractal_bars: 5
    max_fractal_bars: 10
    fractal_tolerance: 0.001
  
  # Signals
  signals:
    bullish_fractal:
      description: "Bullish fractal signal"
      conditions:
        - "bullish_fractal_detected"
        - "volume_confirmation"
        - "momentum_increasing"
      confidence: 0.7
    
    bearish_fractal:
      description: "Bearish fractal signal"
      conditions:
        - "bearish_fractal_detected"
        - "volume_confirmation"
        - "momentum_decreasing"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Lyapunov Exponent
# ----------------------------------------------------------------------------
lyapunov_exponent:
  enabled: true
  description: "Lyapunov Exponent configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    embedding_dimension: 5
    time_delay: 1
    min_exponent: -0.5
    max_exponent: 0.5
    confidence_threshold: 0.7
  
  # Detection
  detection:
    method: "wolf_algorithm"
    embedding_dimension: 5
    time_delay: 1
    min_data_points: 100
  
  # Signals
  signals:
    positive_lyapunov:
      description: "Positive Lyapunov signal"
      conditions:
        - "lyapunov_>_0"
        - "chaotic_behavior"
        - "volume_confirmation"
      confidence: 0.7
    
    negative_lyapunov:
      description: "Negative Lyapunov signal"
      conditions:
        - "lyapunov_<_0"
        - "stable_behavior"
        - "volume_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Hurst Exponent
# ----------------------------------------------------------------------------
hurst_exponent:
  enabled: true
  description: "Hurst Exponent configuration"
  
  # Parameters
  parameters:
    lookback_period: 100
    min_exponent: 0.1
    max_exponent: 0.9
    confidence_threshold: 0.7
    calculation_method: "rescaled_range"
  
  # Detection
  detection:
    method: "r_s_analysis"
    min_data_points: 50
    max_lags: 20
  
  # Signals
  signals:
    trending_market:
      description: "Trending market signal"
      conditions:
        - "hurst_>_0.5"
        - "trend_behavior"
        - "volume_confirmation"
      confidence: 0.75
    
    mean_reverting:
      description: "Mean reverting signal"
      conditions:
        - "hurst_<_0.5"
        - "reversal_behavior"
        - "volume_confirmation"
      confidence: 0.75
    
    random_walk:
      description: "Random walk signal"
      conditions:
        - "hurst_=_0.5"
        - "random_behavior"
        - "volume_confirmation"
      confidence: 0.6

# ----------------------------------------------------------------------------
# Entropy Analysis
# ----------------------------------------------------------------------------
entropy_analysis:
  enabled: true
  description: "Entropy Analysis configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    min_entropy: 0.1
    max_entropy: 1.0
    confidence_threshold: 0.7
    calculation_method: "shannon_entropy"
  
  # Detection
  detection:
    method: "shannon_entropy"
    min_data_points: 50
    bin_size: 10
  
  # Signals
  signals:
    high_entropy:
      description: "High entropy signal"
      conditions:
        - "entropy_>_0.7"
        - "uncertain_behavior"
        - "volume_confirmation"
      confidence: 0.7
    
    low_entropy:
      description: "Low entropy signal"
      conditions:
        - "entropy_<_0.3"
        - "deterministic_behavior"
        - "volume_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Phase Space Analysis
# ----------------------------------------------------------------------------
phase_space:
  enabled: true
  description: "Phase Space Analysis configuration"
  
  # Parameters
  parameters:
    embedding_dimension: 5
    time_delay: 1
    lookback_period: 50
    confidence_threshold: 0.7
  
  # Detection
  detection:
    method: "taken_embedding"
    min_data_points: 100
    max_embedding: 10
  
  # Signals
  signals:
    phase_transition:
      description: "Phase transition signal"
      conditions:
        - "phase_change_detected"
        - "volume_confirmation"
        - "momentum_change"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Attractor Reconstruction
# ----------------------------------------------------------------------------
attractor_reconstruction:
  enabled: true
  description: "Attractor Reconstruction configuration"
  
  # Parameters
  parameters:
    embedding_dimension: 5
    time_delay: 1
    lookback_period: 100
    confidence_threshold: 0.7
  
  # Detection
  detection:
    method: "taken_embedding"
    min_data_points: 100
    max_embedding: 10
  
  # Signals
  signals:
    attractor_change:
      description: "Attractor change signal"
      conditions:
        - "attractor_change_detected"
        - "volume_confirmation"
        - "momentum_change"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Chaos Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Chaos-based trading signals"
  
  # Signal types
  types:
    chaos_buy:
      description: "Chaos buy signal"
      conditions:
        - "bullish_fractal"
        - "hurst_>_0.5"
        - "entropy_<0.3"
        - "lyapunov_>_0"
      confidence: 0.75
    
    chaos_sell:
      description: "Chaos sell signal"
      conditions:
        - "bearish_fractal"
        - "hurst_<_0.5"
        - "entropy_>0.7"
        - "lyapunov_<_0"
      confidence: 0.75
    
    chaos_hedge:
      description: "Chaos hedge signal"
      conditions:
        - "random_walk"
        - "high_entropy"
        - "unstable_behavior"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for chaos trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Chaos-based stop loss
    stop_loss:
      type: "chaos_based"
      threshold: 0.5
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for chaos trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/chaos_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    chaos_metrics: true
    debugging: false
