# Swing Bot Session Analysis Configuration
# Trading Session Analysis & Performance Parameters

# General Session Analysis Settings
session_analysis:
  enabled: true
  analysis_mode: "comprehensive"  # comprehensive, basic, advanced, real-time
  session_types:
    - "asia_session"
    - "europe_session"
    - "us_session"
    - "global_session"
  analysis_frequency: "continuous"  # continuous, session_end, daily
  version: "3.0.0"

# Analysis Components
components:
  enabled: true
  primary_components:
    - "session_performance"
    - "session_volatility"
    - "session_liquidity"
    - "session_activity"
    - "session_flow"
    - "session_sentiment"
  secondary_components:
    - "session_patterns"
    - "session_regimes"
    - "session_correlation"
    - "session_rotation"
    - "session_breakdown"
  component_weights:
    session_performance: 0.20
    session_volatility: 0.15
    session_liquidity: 0.15
    session_activity: 0.15
    session_flow: 0.15
    session_sentiment: 0.10
    session_patterns: 0.10

# Session Performance
performance_analysis:
  enabled: true
  performance_metrics:
    - "session_return"
    - "session_volatility"
    - "session_sharpe"
    - "session_win_rate"
    - "session_profit_factor"
    - "session_average_return"
    - "session_max_drawdown"
    - "session_recovery_time"
  evaluation_period_days: 30
  rolling_window_days: 30
  benchmark_comparison: true

# Session Volatility
volatility_analysis:
  enabled: true
  volatility_metrics:
    - "session_range"
    - "session_atr"
    - "session_volatility"
    - "session_volatility_skew"
    - "session_volatility_clustering"
    - "session_gap_risk"
  lookback_period_bars: 20
  atr_period: 14
  volatility_thresholds:
    low: 0.10
    moderate: 0.20
    high: 0.30
    extreme: 0.50

# Session Liquidity
liquidity_analysis:
  enabled: true
  liquidity_metrics:
    - "session_volume"
    - "session_depth"
    - "session_spread"
    - "session_turnover"
    - "session_liquidity_score"
    - "session_flow_velocity"
  lookback_period_days: 30
  liquidity_thresholds:
    low: 0.30
    moderate: 0.50
    high: 0.70
    very_high: 0.90

# Session Activity
activity_analysis:
  enabled: true
  activity_metrics:
    - "session_trade_count"
    - "session_order_count"
    - "session_quote_count"
    - "session_cancel_rate"
    - "session_fill_rate"
    - "session_execution_speed"
  lookback_period_bars: 20
  activity_thresholds:
    low: 0.30
    moderate: 0.50
    high: 0.70
    very_high: 0.90

# Session Flow
flow_analysis:
  enabled: true
  flow_metrics:
    - "session_net_flow"
    - "session_buy_sell_ratio"
    - "session_institutional_flow"
    - "session_retail_flow"
    - "session_smart_money_flow"
    - "session_arbitrage_flow"
  lookback_period_bars: 20
  flow_thresholds:
    bearish: -0.30
    neutral: 0.30
    bullish: 0.30
    strong_bullish: 0.60

# Session Sentiment
sentiment_analysis:
  enabled: true
  sentiment_metrics:
    - "session_fear_greed"
    - "session_put_call_ratio"
    - "session_vix"
    - "session_sentiment_score"
    - "session_news_sentiment"
    - "session_social_sentiment"
  lookback_period_days: 10
  sentiment_thresholds:
    extreme_fear: 20
    fear: 40
    neutral: 50
    greed: 60
    extreme_greed: 80

# Session Patterns
pattern_analysis:
  enabled: true
  pattern_types:
    - "session_breakout"
    - "session_reversal"
    - "session_continuation"
    - "session_consolidation"
    - "session_range_expansion"
    - "session_range_contraction"
  pattern_detection_confidence: 0.70
  pattern_confirmation_bars: 3
  pattern_lookback_bars: 20

# Session Regimes
regime_analysis:
  enabled: true
  regime_types:
    - "high_volatility"
    - "low_volatility"
    - "trending"
    - "ranging"
    - "bullish"
    - "bearish"
    - "consolidation"
  regime_detection_methods:
    - "volatility_regime"
    - "trend_regime"
    - "market_regime"
  regime_confidence_threshold: 0.70

# Session Correlation
correlation_analysis:
  enabled: true
  correlation_metrics:
    - "session_asset_correlation"
    - "session_sector_correlation"
    - "session_region_correlation"
    - "session_factor_correlation"
  lookback_period_days: 30
  rolling_window_days: 10
  correlation_threshold: 0.70

# Session Rotation
rotation_analysis:
  enabled: true
  rotation_metrics:
    - "session_rotation_score"
    - "session_leader_follower"
    - "session_rotation_velocity"
    - "session_rotation_patterns"
  lookback_period_days: 30
  rotation_threshold: 0.30

# Session Scoring
scoring:
  enabled: true
  score_components:
    - "performance_score": 0.20
    - "volatility_score": 0.15
    - "liquidity_score": 0.15
    - "activity_score": 0.15
    - "flow_score": 0.15
    - "sentiment_score": 0.10
    - "pattern_score": 0.10
  score_thresholds:
    excellent: 0.80
    good: 0.60
    fair: 0.40
    poor: 0.20

# Visualization
visualization:
  enabled: true
  charts:
    - "session_dashboard"
    - "performance_chart"
    - "volatility_chart"
    - "liquidity_chart"
    - "activity_chart"
    - "flow_chart"
    - "sentiment_chart"
    - "scoring_chart"
  update_interval_seconds: 30
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "session_change"
    - "session_performance_change"
    - "volatility_spike"
    - "liquidity_drop"
    - "flow_reversal"
    - "sentiment_extreme"
    - "pattern_detected"
    - "regime_change"
    - "rotation_signal"
    - "scoring_change"
  alert_thresholds:
    performance_change: 0.10
    volatility_spike: 0.30
    liquidity_drop: 0.20
    flow_reversal: 0.30
    sentiment_extreme: 80
    scoring_change: 0.20
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "daily_session_summary"
    - "weekly_session_analysis"
    - "monthly_session_report"
    - "session_performance_report"
    - "session_comparison_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "strategy@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "session_data"
    - "performance_data"
    - "volatility_data"
    - "liquidity_data"
    - "activity_data"
    - "flow_data"
    - "sentiment_data"
    - "pattern_data"
    - "regime_data"
    - "correlation_data"
    - "rotation_data"
    - "scoring_data"
    - "alert_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/session-analysis"
  api_endpoint: "/api/v1/trading/session-analysis"
  dashboard_url: "http://localhost:3000/session-analysis"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "strategy_engine"
    - "research_platform"
