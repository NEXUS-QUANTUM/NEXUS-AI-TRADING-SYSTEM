# Swing Bot Prediction Engine Configuration
# Core Prediction Engine & Forecasting Parameters

# General Prediction Engine Settings
prediction_engine:
  enabled: true
  engine_mode: "hybrid"  # hybrid, ml_based, statistical, ensemble
  prediction_paradigm: "multi_horizon"  # multi_horizon, single_horizon, probabilistic
  engine_level: "advanced"  # basic, intermediate, advanced, expert
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "data_preprocessor"
    - "feature_engineer"
    - "model_selector"
    - "prediction_trainer"
    - "prediction_executor"
    - "prediction_validator"
    - "prediction_aggregator"
    - "confidence_estimator"
    - "performance_monitor"
    - "explanation_module"
  module_interaction: "pipeline"  # pipeline, event_driven, message_based
  parallel_execution: true
  max_workers: 8
  pipeline_buffer_size: 10000

# Data Preprocessor
data_preprocessor:
  enabled: true
  preprocessing_steps:
    - "data_cleaning"
    - "outlier_removal"
    - "missing_value_handling"
    - "normalization"
    - "standardization"
    - "detrending"
    - "seasonal_adjustment"
    - "resampling"
    - "lag_creation"
  outlier_detection_method: "zscore"  # zscore, iqr, isolation_forest
  missing_value_method: "interpolation"  # interpolation, forward_fill, mean, model_based
  normalization_method: "minmax"  # minmax, standard, robust

# Feature Engineer
feature_engineer:
  enabled: true
  feature_types:
    - "price_features"
    - "volume_features"
    - "volatility_features"
    - "momentum_features"
    - "trend_features"
    - "seasonal_features"
    - "technical_indicator_features"
    - "sentiment_features"
    - "macro_features"
    - "alternative_features"
  feature_selection_method: "mutual_information"  # mutual_information, chi2, rfe, l1, tree_based
  max_features: 50
  min_feature_importance: 0.01
  feature_creation: true
  feature_interactions: true

# Model Selector
model_selector:
  enabled: true
  model_types:
    - "linear_models"
    - "tree_based_models"
    - "ensemble_models"
    - "neural_networks"
    - "deep_learning_models"
    - "time_series_models"
    - "probabilistic_models"
  selection_criteria:
    - "accuracy"
    - "generalization"
    - "computational_efficiency"
    - "robustness"
    - "interpretability"
  selection_weights:
    accuracy: 0.30
    generalization: 0.25
    computational_efficiency: 0.20
    robustness: 0.15
    interpretability: 0.10
  top_models: 3

# Prediction Trainer
prediction_trainer:
  enabled: true
  training_methods:
    - "supervised_learning"
    - "unsupervised_learning"
    - "reinforcement_learning"
    - "time_series_forecasting"
  training_paradigm: "online"  # online, batch, incremental
  validation_split: 0.20
  test_split: 0.10
  cross_validation_folds: 5
  early_stopping_patience: 10
  hyperparameter_optimization: true

# Prediction Executor
prediction_executor:
  enabled: true
  prediction_types:
    - "price_prediction"
    - "trend_prediction"
    - "volatility_prediction"
    - "volume_prediction"
    - "signal_prediction"
    - "risk_prediction"
    - "performance_prediction"
  prediction_horizons:
    - "ultra_short": "1m"
    - "short_term": "5m"
    - "medium_term": "1h"
    - "long_term": "24h"
    - "ultra_long": "7d"
  prediction_mode: "continuous"  # continuous, scheduled, triggered
  batch_size: 1000

# Prediction Validator
prediction_validator:
  enabled: true
  validation_metrics:
    - "mae"
    - "mse"
    - "rmse"
    - "mape"
    - "mase"
    - "r2_score"
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "sharpe_ratio"
    - "hit_rate"
  validation_method: "backtesting"  # backtesting, walk_forward, cross_validation
  validation_split: 0.20
  confidence_interval: 0.95

# Prediction Aggregator
prediction_aggregator:
  enabled: true
  aggregation_methods:
    - "weighted_average"
    - "voting"
    - "stacking"
    - "blending"
    - "median"
    - "trimmed_mean"
  primary_method: "weighted_average"
  weights:
    linear_models: 0.10
    tree_based_models: 0.15
    ensemble_models: 0.20
    neural_networks: 0.15
    deep_learning_models: 0.15
    time_series_models: 0.15
    probabilistic_models: 0.10
  dynamic_weighting: true

# Confidence Estimator
confidence_estimator:
  enabled: true
  confidence_methods:
    - "prediction_interval"
    - "bootstrap"
    - "monte_carlo"
    - "conformal_prediction"
    - "bayesian_credible_interval"
  primary_method: "prediction_interval"
  confidence_level: 0.95
  uncertainty_estimation: true
  prediction_range: true

# Performance Monitor
performance_monitor:
  enabled: true
  monitoring_frequency_seconds: 60
  metrics:
    - "prediction_accuracy"
    - "prediction_speed"
    - "model_performance"
    - "drift_detection"
    - "error_rate"
    - "confidence_accuracy"
  alert_thresholds:
    accuracy_drop: 0.10
    error_rate: 0.05
    drift_detected: 0.15

# Explanation Module
explanation_module:
  enabled: true
  explanation_methods:
    - "shap"
    - "lime"
    - "feature_importance"
    - "partial_dependence"
    - "individual_conditional_expectation"
    - "counterfactual_explanations"
  primary_method: "shap"
  explanation_depth: "comprehensive"  # basic, intermediate, comprehensive
  explanation_visualization: true

# Visualization
visualization:
  enabled: true
  charts:
    - "prediction_dashboard"
    - "prediction_chart"
    - "confidence_interval_chart"
    - "performance_chart"
    - "feature_importance_chart"
    - "error_analysis_chart"
    - "explanation_chart"
  update_interval_seconds: 30
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "prediction_error"
    - "accuracy_drop"
    - "drift_detected"
    - "confidence_drop"
    - "model_failure"
    - "signal_generation"
  alert_thresholds:
    error_threshold: 0.10
    accuracy_drop: 0.15
    confidence_drop: 0.10
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 600

# Reporting
reporting:
  enabled: true
  report_types:
    - "prediction_summary"
    - "performance_report"
    - "accuracy_report"
    - "drift_report"
    - "confidence_analysis"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "risk@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "prediction_data"
    - "model_data"
    - "performance_data"
    - "feature_data"
    - "confidence_data"
    - "explanation_data"
    - "alert_history"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/prediction-engine"
  api_endpoint: "/api/v1/trading/prediction-engine"
  dashboard_url: "http://localhost:3000/prediction-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "strategy_engine"
    - "research_platform"
