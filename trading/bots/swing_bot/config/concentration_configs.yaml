#
# Description: Complete Concentration configuration for swing trading bot
# Framework: Portfolio Concentration - Risk & Diversification Management
# Version: 3.0.0
#
# The Concentration configuration enables the bot to manage portfolio
# concentration risk, ensuring proper diversification and risk control.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
concentration:
  enabled: true
  version: "3.0.0"
  description: "Portfolio Concentration Management for swing trading"
  
  # Concentration types
  types:
    - "asset"
    - "sector"
    - "strategy"
    - "correlation"
    - "risk"
    - "return"
  
  # Concentration metrics
  metrics:
    - "herfindahl_index"
    - "concentration_ratio"
    - "gini_coefficient"
    - "theil_index"
    - "entropy"
    - "hhi"

# ----------------------------------------------------------------------------
# Asset Concentration
# ----------------------------------------------------------------------------
asset_concentration:
  enabled: true
  description: "Asset concentration configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    max_asset_weight: 0.2
    min_asset_weight: 0.01
    max_assets: 20
    min_assets: 3
    concentration_threshold: 0.5
  
  # Metrics
  metrics:
    herfindahl:
      enabled: true
      calculation: "sum_of_squares"
      threshold: 0.5
    
    concentration_ratio:
      enabled: true
      calculation: "top_n_ratio"
      top_n: 3
      threshold: 0.6
    
    gini:
      enabled: true
      calculation: "gini_coefficient"
      threshold: 0.5
  
  # Signals
  signals:
    high_concentration:
      description: "High asset concentration"
      conditions:
        - "herfindahl_>_0.5"
        - "concentration_ratio_>_0.6"
        - "gini_>_0.5"
      action: "rebalance"
    
    low_concentration:
      description: "Low asset concentration"
      conditions:
        - "herfindahl_<_0.2"
        - "concentration_ratio_<_0.3"
        - "gini_<_0.3"
      action: "allow"

# ----------------------------------------------------------------------------
# Sector Concentration
# ----------------------------------------------------------------------------
sector_concentration:
  enabled: true
  description: "Sector concentration configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    max_sector_weight: 0.3
    min_sector_weight: 0.05
    max_sectors: 5
    min_sectors: 2
    concentration_threshold: 0.4
  
  # Sectors
  sectors:
    - "crypto"
    - "defi"
    - "layer1"
    - "stable"
    - "meme"
  
  # Metrics
  metrics:
    sector_herfindahl:
      enabled: true
      calculation: "sum_of_squares"
      threshold: 0.4
    
    sector_concentration_ratio:
      enabled: true
      calculation: "top_n_ratio"
      top_n: 2
      threshold: 0.5
  
  # Signals
  signals:
    high_sector_concentration:
      description: "High sector concentration"
      conditions:
        - "sector_herfindahl_>_0.4"
        - "sector_ratio_>_0.5"
      action: "rebalance"
    
    low_sector_concentration:
      description: "Low sector concentration"
      conditions:
        - "sector_herfindahl_<_0.2"
        - "sector_ratio_<_0.3"
      action: "allow"

# ----------------------------------------------------------------------------
# Strategy Concentration
# ----------------------------------------------------------------------------
strategy_concentration:
  enabled: true
  description: "Strategy concentration configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    max_strategy_weight: 0.4
    min_strategy_weight: 0.05
    max_strategies: 4
    min_strategies: 2
    concentration_threshold: 0.5
  
  # Strategies
  strategies:
    - "trend_following"
    - "mean_reversion"
    - "breakout"
    - "momentum"
    - "volatility"
  
  # Metrics
  metrics:
    strategy_herfindahl:
      enabled: true
      calculation: "sum_of_squares"
      threshold: 0.5
    
    strategy_concentration_ratio:
      enabled: true
      calculation: "top_n_ratio"
      top_n: 2
      threshold: 0.6
  
  # Signals
  signals:
    high_strategy_concentration:
      description: "High strategy concentration"
      conditions:
        - "strategy_herfindahl_>_0.5"
        - "strategy_ratio_>_0.6"
      action: "rebalance"
    
    low_strategy_concentration:
      description: "Low strategy concentration"
      conditions:
        - "strategy_herfindahl_<_0.2"
        - "strategy_ratio_<_0.3"
      action: "allow"

# ----------------------------------------------------------------------------
# Correlation Concentration
# ----------------------------------------------------------------------------
correlation_concentration:
  enabled: true
  description: "Correlation concentration configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    max_correlation: 0.7
    min_correlation: 0.1
    correlation_threshold: 0.5
  
  # Correlation types
  types:
    - "pearson"
    - "spearman"
    - "kendall"
  
  # Metrics
  metrics:
    average_correlation:
      enabled: true
      calculation: "mean"
      threshold: 0.5
    
    max_correlation:
      enabled: true
      calculation: "maximum"
      threshold: 0.7
  
  # Signals
  signals:
    high_correlation:
      description: "High correlation concentration"
      conditions:
        - "avg_correlation_>_0.5"
        - "max_correlation_>_0.7"
      action: "diversify"
    
    low_correlation:
      description: "Low correlation concentration"
      conditions:
        - "avg_correlation_<_0.3"
        - "max_correlation_<_0.5"
      action: "allow"

# ----------------------------------------------------------------------------
# Risk Concentration
# ----------------------------------------------------------------------------
risk_concentration:
  enabled: true
  description: "Risk concentration configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    max_risk_weight: 0.3
    min_risk_weight: 0.01
    concentration_threshold: 0.4
  
  # Risk metrics
  metrics:
    var_concentration:
      enabled: true
      calculation: "var_weight"
      threshold: 0.4
    
    cvar_concentration:
      enabled: true
      calculation: "cvar_weight"
      threshold: 0.4
  
  # Signals
  signals:
    high_risk_concentration:
      description: "High risk concentration"
      conditions:
        - "var_concentration_>_0.4"
        - "cvar_concentration_>_0.4"
      action: "rebalance"
    
    low_risk_concentration:
      description: "Low risk concentration"
      conditions:
        - "var_concentration_<_0.2"
        - "cvar_concentration_<_0.2"
      action: "allow"

# ----------------------------------------------------------------------------
# Concentration Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "Concentration-based trading signals"
  
  # Signal types
  types:
    rebalance_required:
      description: "Rebalance required"
      conditions:
        - "high_concentration_detected"
        - "correlation_high"
        - "risk_concentrated"
      action: "rebalance"
    
    diversification_needed:
      description: "Diversification needed"
      conditions:
        - "low_diversification"
        - "high_correlation"
        - "high_concentration"
      action: "diversify"
    
    concentration_ok:
      description: "Concentration acceptable"
      conditions:
        - "low_concentration"
        - "low_correlation"
        - "low_risk_concentration"
      action: "allow"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for concentration"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # Concentration-based risk
    concentration_risk:
      enabled: true
      threshold: 0.5
      adaptation: true
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for concentration"
  
  metrics:
    - "herfindahl_index"
    - "concentration_ratio"
    - "correlation"
    - "diversification_ratio"
    - "risk_concentration"
    - "win_rate"
    - "profit_factor"
  
  targets:
    max_herfindahl: 0.5
    max_concentration_ratio: 0.6
    max_correlation: 0.7
    min_diversification_ratio: 0.5

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/concentration_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    concentration: true
    debugging: false
