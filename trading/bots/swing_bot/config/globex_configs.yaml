# globex_configs.yaml
# Configuration complète pour Globex Trading dans Swing Bot
# Version: 4.0.0 - Production Ready

# Paramètres généraux
general:
  enabled: true
  mode: "comprehensive"
  calculate_in_real_time: true
  update_frequency_seconds: 1
  lookback_periods:
    - 5
    - 10
    - 20
    - 50
    - 100
    - 200
    - 500
  history_length_days: 365
  min_data_points: 50
  max_data_points: 100000
  globex_version: "4.0.0"
  environment: "production"

# Types de sessions Globex
globex_types:
  globex_24h:
    enabled: true
    description: "24/7 Globex Trading"
    trading_hours: 24
    trading_days: 7
    session_start: "00:00"
    session_end: "23:59"
    update_frequency_seconds: 60
  globex_equity:
    enabled: true
    description: "Equity Globex Trading"
    trading_hours: 16
    trading_days: 5
    session_start: "09:30"
    session_end: "16:00"
    timezone: "America/New_York"
    update_frequency_seconds: 60
  globex_futures:
    enabled: true
    description: "Futures Globex Trading"
    trading_hours: 23
    trading_days: 5
    session_start: "17:00"
    session_end: "16:00"
    timezone: "America/Chicago"
    update_frequency_seconds: 60
  globex_crypto:
    enabled: true
    description: "Crypto Globex Trading"
    trading_hours: 24
    trading_days: 7
    session_start: "00:00"
    session_end: "23:59"
    timezone: "UTC"
    update_frequency_seconds: 60
  globex_forex:
    enabled: true
    description: "Forex Globex Trading"
    trading_hours: 24
    trading_days: 5
    session_start: "00:00"
    session_end: "23:59"
    timezone: "UTC"
    update_frequency_seconds: 60

# Paramètres de trading Globex
globex_parameters:
  sessions:
    pre_market:
      enabled: true
      start: "08:00"
      end: "09:30"
      multiplier: 0.7
      description: "Pre-market session"
    regular:
      enabled: true
      start: "09:30"
      end: "16:00"
      multiplier: 1.0
      description: "Regular trading session"
    post_market:
      enabled: true
      start: "16:00"
      end: "20:00"
      multiplier: 0.8
      description: "Post-market session"
    overnight:
      enabled: true
      start: "20:00"
      end: "08:00"
      multiplier: 0.6
      description: "Overnight session"
  holidays:
    enabled: true
    holiday_multiplier: 0.5
    pre_holiday_multiplier: 0.7
    post_holiday_multiplier: 0.8
    include_global_holidays: true

# Seuils Globex
thresholds:
  volume:
    low: 100000
    medium: 500000
    high: 1000000
    extreme: 5000000
  liquidity:
    low: 0.1
    medium: 0.3
    high: 0.5
    extreme: 0.7
  spread:
    tight: 0.0001
    normal: 0.0005
    wide: 0.001
    extreme: 0.005
  volatility:
    low: 0.1
    medium: 0.3
    high: 0.5
    extreme: 1.0
  confidence:
    min: 0.5
    default: 0.7
    max: 1.0

# Indicateurs Globex
indicators:
  globex_volume:
    enabled: true
    calculation: "session_volume"
    period: 14
    smoothing: 3
    threshold: 0.5
  globex_liquidity:
    enabled: true
    calculation: "liquidity_ratio"
    period: 14
    smoothing: 3
    threshold: 0.3
  globex_spread:
    enabled: true
    calculation: "bid_ask_spread"
    period: 14
    smoothing: 3
    threshold: 0.001
  globex_volatility:
    enabled: true
    calculation: "session_volatility"
    period: 14
    smoothing: 3
    threshold: 0.3
  globex_strength:
    enabled: true
    calculation: "weighted_average"
    factors:
      - "volume"
      - "liquidity"
      - "spread"
      - "volatility"
    factor_weights:
      volume: 0.25
      liquidity: 0.25
      spread: 0.25
      volatility: 0.25
  globex_confidence:
    enabled: true
    period: 14
    smoothing: 0
    threshold: 0.6

# Analyse Globex
analysis:
  historical:
    enabled: true
    lookback_years: 5
    compute_globex_accuracy: true
    compute_globex_patterns: true
    compute_globex_cycles: true
    compute_globex_correlation: true
    compute_globex_seasonality: true
  real_time:
    enabled: true
    update_frequency_ms: 100
    compute_instantaneous_globex: true
    compute_moving_average_globex: true
    compute_exponential_globex: true
    compute_weighted_globex: true
    compute_globex_velocity: true
    compute_globex_acceleration: true
  predictive:
    enabled: true
    model_type: "ensemble"
    models:
      - "lstm"
      - "gru"
      - "xgboost"
      - "lightgbm"
    features:
      - "globex_volume"
      - "globex_liquidity"
      - "globex_spread"
      - "globex_volatility"
      - "globex_strength"
      - "globex_confidence"
      - "time_of_day"
      - "day_of_week"
      - "session_type"
      - "holiday_status"
      - "market_condition"
    forecast_horizons:
      - 1
      - 5
      - 10
      - 20
    confidence_threshold: 0.7
    retrain_frequency_hours: 24

# Alertes et notifications
alerts:
  globex_session_start:
    enabled: true
    channels:
      - "email"
      - "telegram"
      - "slack"
      - "push_notification"
    severity: "info"
  globex_session_end:
    enabled: true
    channels:
      - "telegram"
      - "push_notification"
    severity: "info"
  globex_volume_spike:
    enabled: true
    threshold: 2.0
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "warning"
  globex_liquidity_change:
    enabled: true
    threshold: 0.2
    channels:
      - "telegram"
      - "push_notification"
    severity: "warning"
  globex_spread_widening:
    enabled: true
    threshold: 0.002
    channels:
      - "email"
      - "telegram"
      - "slack"
    severity: "critical"

# Actions automatiques
auto_actions:
  position_adjustment:
    enabled: true
    action_types:
      - "adjust_position_size"
      - "modify_entry_time"
      - "change_exit_time"
      - "adjust_stop_loss"
    adjustment_factor: 0.5
    max_adjustment_percent: 50.0
  strategy_adjustment:
    enabled: true
    action_types:
      - "change_strategy"
      - "adjust_parameters"
      - "modify_timeframe"
      - "update_indicators"
    adjustment_factor: 0.5
    max_adjustment_percent: 30.0
  risk_management:
    enabled: true
    action_types:
      - "reduce_exposure"
      - "increase_hedge"
      - "pause_trading"
      - "reset_parameters"
    risk_multiplier: 1.5
    pause_duration_minutes: 30

# Paramètres avancés
advanced:
  machine_learning:
    enabled: true
    model_type: "ensemble"
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"
      - "lstm"
    features:
      - "globex_volume"
      - "globex_liquidity"
      - "globex_spread"
      - "globex_volatility"
      - "globex_strength"
      - "globex_confidence"
      - "time_of_day"
      - "day_of_week"
      - "session_type"
      - "holiday_status"
      - "market_condition"
      - "volume"
      - "price_change"
      - "volatility"
    training_frequency_hours: 6
    retrain_threshold: 0.9
    validation_split: 0.2
    random_seed: 42
    ensemble_weights:
      - 0.25
      - 0.25
      - 0.25
      - 0.25
  statistical_analysis:
    enabled: true
    calculate_globex_accuracy: true
    calculate_globex_probability: true
    calculate_globex_significance: true
    calculate_globex_correlation: true
    calculate_globex_patterns: true
    confidence_level: 95
    p_value_threshold: 0.05

# Monitoring et journalisation
monitoring:
  logging:
    enabled: true
    level: "debug"
    format: "json"
    include_context: true
    include_timestamp: true
    include_metadata: true
  metrics:
    enabled: true
    collect_every_seconds: 1
    metrics_to_collect:
      - "globex_volume"
      - "globex_liquidity"
      - "globex_spread"
      - "globex_volatility"
      - "globex_strength"
      - "globex_confidence"
      - "session_volume"
      - "session_liquidity"
      - "session_spread"
      - "session_volatility"
  dashboard:
    enabled: true
    update_interval_seconds: 1
    charts:
      - "globex_analysis"
      - "session_volume"
      - "session_liquidity"
      - "session_spread"
      - "session_volatility"
      - "globex_strength"
      - "globex_confidence"
      - "historical_analysis"

# Backtesting
backtesting:
  enabled: true
  use_historical_globex: true
  compute_globex_accuracy: true
  compute_strategy_performance: true
  compute_risk_adjusted_returns: true
  compute_session_effectiveness: true
  report_metrics:
    - "globex_accuracy"
    - "session_effectiveness"
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"

# Configuration de la base de données
database:
  enabled: true
  table_name: "globex_metrics"
  retention_days: 365
  aggregation:
    enabled: true
    intervals:
      - "1s"
      - "5s"
      - "15s"
      - "30s"
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "24h"
  compression: true
  backup:
    enabled: true
    frequency: "daily"
    retention_days: 30

# Webhooks
webhooks:
  enabled: true
  endpoints:
    - url: "https://nexustradingia.com/api/webhooks/globex"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "globex_alert"
    - url: "https://nexustradingia.com/api/webhooks/globex-session"
      method: "POST"
      headers:
        Content-Type: "application/json"
      payload_template: "globex_session"
  retry:
    enabled: true
    max_attempts: 5
    backoff_seconds: 30

# Logging avancé
advanced_logging:
  enabled: true
  levels:
    - "info"
    - "warning"
    - "error"
    - "critical"
    - "debug"
  output: "globex_logs"
  rotation:
    enabled: true
    max_size_mb: 100
    max_files: 10
  remote_logging:
    enabled: true
    endpoints:
      - "https://nexustradingia.com/logs/globex"
  include_trace: true
  include_stack_trace: true
  include_context: true

# Threading et performances
performance:
  thread_pool_size: 8
  queue_size: 10000
  batch_size: 1000
  async_processing: true
  cache_size: 10000
  cache_ttl_seconds: 30
  database_pool_size: 10
  database_pool_max_overflow: 20
  use_multiprocessing: true
  max_workers: 8
  use_cython: true
  use_numba: true
  use_gpu: false
  gpu_device: 0

# API de gestion
management_api:
  enabled: true
  endpoints:
    - "/api/v1/globex/current"
    - "/api/v1/globex/history"
    - "/api/v1/globex/metrics"
    - "/api/v1/globex/status"
    - "/api/v1/globex/sessions"
    - "/api/v1/globex/indicators"
    - "/api/v1/globex/analysis"
    - "/api/v1/globex/forecast"
  authentication_required: true
  rate_limit: 100
  rate_limit_interval_seconds: 60
  version: "v1.0.0"

# Export des données
data_export:
  enabled: true
  formats:
    - "csv"
    - "json"
    - "parquet"
    - "avro"
    - "feather"
  schedule: "realtime"
  batch_size: 1000
  retention_days: 30
  compression: "gzip"
  destination: "s3://nexus-data/globex/"
  encrypt: true
  encryption_key_id: "nexus-globex-key"
  partition_by:
    - "symbol"
    - "year"
    - "month"
    - "day"

# Intégration avec d'autres modules
integrations:
  risk_engine:
    enabled: true
    sync_frequency_seconds: 1
    share_metrics: true
  execution_engine:
    enabled: true
    share_signals: true
    require_confirmation: true
  portfolio_manager:
    enabled: true
    share_positions: true
    share_allocation: true
  ai_engine:
    enabled: true
    use_ai_predictions: true
    confidence_threshold: 0.7
    model_endpoint: "http://ai-engine:8000/predict/globex"
  market_data:
    enabled: true
    sync_frequency_ms: 100
    data_endpoint: "ws://market-data:8080/ws"

# Tests et validation
testing:
  unit_tests:
    enabled: true
    coverage_threshold: 90
  integration_tests:
    enabled: true
  stress_tests:
    enabled: true
    scenarios:
      - "high_globex_volume"
      - "low_globex_volume"
      - "session_transition"
      - "holiday_sessions"
      - "volatility_spike"
  validation:
    enabled: true
    validate_on_startup: true
    validate_on_config_change: true
    validation_rules:
      - "confidence_threshold > 0.0"
      - "confidence_threshold <= 1.0"
      - "globex_types.globex_24h.trading_hours > 0"
      - "globex_types.globex_equity.trading_hours > 0"
      - "globex_types.globex_futures.trading_hours > 0"
      - "globex_parameters.sessions.pre_market.start < globex_parameters.sessions.pre_market.end"
      - "globex_parameters.sessions.regular.start < globex_parameters.sessions.regular.end"
      - "globex_parameters.sessions.post_market.start < globex_parameters.sessions.post_market.end"
      - "globex_parameters.sessions.overnight.start < globex_parameters.sessions.overnight.end"
      - "thresholds.volume.low < thresholds.volume.medium"
      - "thresholds.volume.medium < thresholds.volume.high"
      - "thresholds.volume.high < thresholds.volume.extreme"
      - "thresholds.liquidity.low < thresholds.liquidity.medium"
      - "thresholds.liquidity.medium < thresholds.liquidity.high"
      - "thresholds.liquidity.high < thresholds.liquidity.extreme"
      - "thresholds.spread.tight < thresholds.spread.normal"
      - "thresholds.spread.normal < thresholds.spread.wide"
      - "thresholds.spread.wide < thresholds.spread.extreme"
      - "min_data_points > 0"

# Market conditions adaptation
market_adaptation:
  enabled: true
  regime_detection:
    enabled: true
    lookback_periods:
      - 20
      - 50
      - 200
    regimes:
      - "pre_market"
      - "regular"
      - "post_market"
      - "overnight"
      - "holiday"
      - "weekend"
  regime_parameters:
    pre_market:
      globex_multiplier: 0.7
      threshold_multiplier: 1.2
      confidence_multiplier: 0.9
      volume_multiplier: 0.6
    regular:
      globex_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
      volume_multiplier: 1.0
    post_market:
      globex_multiplier: 0.8
      threshold_multiplier: 1.1
      confidence_multiplier: 0.9
      volume_multiplier: 0.7
    overnight:
      globex_multiplier: 0.6
      threshold_multiplier: 1.3
      confidence_multiplier: 0.8
      volume_multiplier: 0.5
    holiday:
      globex_multiplier: 0.5
      threshold_multiplier: 1.5
      confidence_multiplier: 0.7
      volume_multiplier: 0.4
    weekend:
      globex_multiplier: 0.4
      threshold_multiplier: 1.5
      confidence_multiplier: 0.6
      volume_multiplier: 0.3

# Time-based configurations
time_based:
  enabled: true
  sessions:
    asia:
      start: "00:00"
      end: "08:00"
      globex_multiplier: 0.6
      threshold_multiplier: 1.3
      confidence_multiplier: 0.8
      volume_multiplier: 0.5
    london:
      start: "08:00"
      end: "16:00"
      globex_multiplier: 1.1
      threshold_multiplier: 0.9
      confidence_multiplier: 1.1
      volume_multiplier: 1.1
    newyork:
      start: "13:00"
      end: "22:00"
      globex_multiplier: 1.0
      threshold_multiplier: 1.0
      confidence_multiplier: 1.0
      volume_multiplier: 1.0
    overlap:
      start: "13:00"
      end: "16:00"
      globex_multiplier: 1.3
      threshold_multiplier: 0.8
      confidence_multiplier: 1.2
      volume_multiplier: 1.3

# Symbol-specific configurations
symbol_configs:
  BTCUSDT:
    globex_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    volume_multiplier: 1.0
    confidence_threshold: 0.7
    session_type: "globex_24h"
  ETHUSDT:
    globex_multiplier: 1.1
    threshold_multiplier: 0.9
    confidence_multiplier: 1.0
    volume_multiplier: 1.1
    confidence_threshold: 0.7
    session_type: "globex_24h"
  SOLUSDT:
    globex_multiplier: 1.2
    threshold_multiplier: 0.8
    confidence_multiplier: 0.9
    volume_multiplier: 1.2
    confidence_threshold: 0.7
    session_type: "globex_24h"
  ADAUSDT:
    globex_multiplier: 0.9
    threshold_multiplier: 1.1
    confidence_multiplier: 1.1
    volume_multiplier: 0.9
    confidence_threshold: 0.7
    session_type: "globex_24h"
  XRPUSDT:
    globex_multiplier: 1.0
    threshold_multiplier: 1.0
    confidence_multiplier: 1.0
    volume_multiplier: 1.0
    confidence_threshold: 0.7
    session_type: "globex_24h"
