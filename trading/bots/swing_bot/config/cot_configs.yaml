# Copyright © 2026 NEXUS QUANTUM LTD - All Rights Reserved
# ============================================================================
#
# Description: Complete Commitment of Traders (COT) configuration for swing trading bot
# Framework: COT Analysis - Institutional Positioning & Market Sentiment
# Version: 3.0.0
#
# The COT configuration enables the bot to analyze Commitment of Traders
# reports to understand institutional positioning and market sentiment.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
cot:
  enabled: true
  version: "3.0.0"
  description: "COT Analysis for swing trading"
  
  # COT types
  types:
    - "commercial"
    - "non_commercial"
    - "retail"
    - "spread"
    - "combined"
  
  # Timeframes
  timeframes:
    - "1w"
    - "2w"
    - "1m"
    - "3m"
    - "6m"
    - "1y"
  
  default_timeframe: "1w"
  
  # Data sources
  data_sources:
    - "cftc"
    - "ice"
    - "cme"
    - "eurex"

# ----------------------------------------------------------------------------
# Commercial Positions
# ----------------------------------------------------------------------------
commercial_positions:
  enabled: true
  description: "Commercial positions configuration"
  
  # Parameters
  parameters:
    lookback_period: 10
    min_position: 1000
    max_position: 1000000
    position_threshold: 0.3
    confidence_threshold: 0.7
  
  # Position metrics
  metrics:
    long_positions:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    short_positions:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    net_positions:
      enabled: true
      calculation: "difference"
      lookback_period: 10
    
    position_ratio:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
  
  # Signals
  signals:
    commercial_bullish:
      description: "Commercial bullish signal"
      conditions:
        - "net_long_increasing"
        - "long_position_>_short_position"
        - "volume_confirmation"
      confidence: 0.75
    
    commercial_bearish:
      description: "Commercial bearish signal"
      conditions:
        - "net_short_increasing"
        - "short_position_>_long_position"
        - "volume_confirmation"
      confidence: 0.75

# ----------------------------------------------------------------------------
# Non-Commercial Positions
# ----------------------------------------------------------------------------
non_commercial_positions:
  enabled: true
  description: "Non-Commercial positions configuration"
  
  # Parameters
  parameters:
    lookback_period: 10
    min_position: 1000
    max_position: 1000000
    position_threshold: 0.3
    confidence_threshold: 0.7
  
  # Position metrics
  metrics:
    long_positions:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    short_positions:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    net_positions:
      enabled: true
      calculation: "difference"
      lookback_period: 10
    
    position_ratio:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
  
  # Signals
  signals:
    non_commercial_bullish:
      description: "Non-commercial bullish signal"
      conditions:
        - "net_long_increasing"
        - "long_position_>_short_position"
        - "volume_confirmation"
      confidence: 0.7
    
    non_commercial_bearish:
      description: "Non-commercial bearish signal"
      conditions:
        - "net_short_increasing"
        - "short_position_>_long_position"
        - "volume_confirmation"
      confidence: 0.7

# ----------------------------------------------------------------------------
# Retail Positions
# ----------------------------------------------------------------------------
retail_positions:
  enabled: true
  description: "Retail positions configuration"
  
  # Parameters
  parameters:
    lookback_period: 10
    min_position: 100
    max_position: 100000
    position_threshold: 0.3
    confidence_threshold: 0.7
  
  # Position metrics
  metrics:
    long_positions:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    short_positions:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    net_positions:
      enabled: true
      calculation: "difference"
      lookback_period: 10
    
    position_ratio:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
  
  # Signals
  signals:
    retail_bullish:
      description: "Retail bullish signal"
      conditions:
        - "net_long_increasing"
        - "long_position_>_short_position"
        - "volume_confirmation"
      confidence: 0.6
    
    retail_bearish:
      description: "Retail bearish signal"
      conditions:
        - "net_short_increasing"
        - "short_position_>_long_position"
        - "volume_confirmation"
      confidence: 0.6

# ----------------------------------------------------------------------------
# Spread Positions
# ----------------------------------------------------------------------------
spread_positions:
  enabled: true
  description: "Spread positions configuration"
  
  # Parameters
  parameters:
    lookback_period: 10
    min_position: 1000
    max_position: 1000000
    position_threshold: 0.3
    confidence_threshold: 0.7
  
  # Position metrics
  metrics:
    spread_positions:
      enabled: true
      calculation: "count"
      lookback_period: 10
    
    spread_ratio:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
  
  # Signals
  signals:
    spread_increasing:
      description: "Spread positions increasing"
      conditions:
        - "spread_positions_increasing"
        - "spread_ratio_>_threshold"
        - "volume_confirmation"
      confidence: 0.65

# ----------------------------------------------------------------------------
# Combined Analysis
# ----------------------------------------------------------------------------
combined_analysis:
  enabled: true
  description: "Combined COT analysis configuration"
  
  # Parameters
  parameters:
    lookback_period: 10
    min_position: 1000
    max_position: 1000000
    position_threshold: 0.3
    confidence_threshold: 0.7
  
  # Combined metrics
  metrics:
    commercial_vs_non_commercial:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
    
    retail_vs_commercial:
      enabled: true
      calculation: "ratio"
      lookback_period: 10
    
    total_net_position:
      enabled: true
      calculation: "sum"
      lookback_period: 10
  
  # Signals
  signals:
    combined_bullish:
      description: "Combined bullish signal"
      conditions:
        - "commercial_bullish"
        - "non_commercial_bullish"
        - "total_net_positive"
        - "volume_confirmation"
      confidence: 0.8
    
    combined_bearish:
      description: "Combined bearish signal"
      conditions:
        - "commercial_bearish"
        - "non_commercial_bearish"
        - "total_net_negative"
        - "volume_confirmation"
      confidence: 0.8

# ----------------------------------------------------------------------------
# COT Signals
# ----------------------------------------------------------------------------
signals:
  enabled: true
  description: "COT-based trading signals"
  
  # Signal types
  types:
    cot_buy:
      description: "COT buy signal"
      conditions:
        - "commercial_bullish"
        - "non_commercial_bullish"
        - "total_net_positive"
        - "volume_confirmation"
      confidence: 0.8
    
    cot_sell:
      description: "COT sell signal"
      conditions:
        - "commercial_bearish"
        - "non_commercial_bearish"
        - "total_net_negative"
        - "volume_confirmation"
      confidence: 0.8
    
    cot_hedge:
      description: "COT hedge signal"
      conditions:
        - "mixed_signals"
        - "uncertain_direction"
        - "volume_confirmation"
      confidence: 0.6
  
  # Signal confirmation
  confirmation:
    required_confirmations: 2
    confirmation_sources:
      - "price_action"
      - "volume"
      - "technical_indicators"

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for COT trading"
  
  # Risk parameters
  parameters:
    max_position: 0.05
    max_daily_loss: 0.02
    max_drawdown: 0.1
    risk_per_trade: 0.01
    
    # COT-based stop loss
    stop_loss:
      type: "cot_based"
      threshold: 0.3
      update_interval: 10  # bars

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for COT trading"
  
  metrics:
    - "win_rate"
    - "profit_factor"
    - "sharpe_ratio"
    - "max_drawdown"
    - "average_trade"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_win_rate: 0.5
    min_profit_factor: 1.5
    min_sharpe_ratio: 0.6
    max_max_drawdown: 0.1

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/cot_bot.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    signals: true
    trades: true
    errors: true
    performance: true
    cot: true
    debugging: false
