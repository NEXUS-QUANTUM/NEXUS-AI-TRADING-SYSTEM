# Swing Bot Reasoning Configuration
# Reasoning Engine & Decision Logic Parameters

# General Reasoning Settings
reasoning:
  enabled: true
  reasoning_mode: "hybrid"  # hybrid, rule_based, probabilistic, neural
  reasoning_paradigm: "multi_method"  # multi_method, single_method, adaptive
  logic_type: "fuzzy"  # fuzzy, binary, probabilistic, hybrid
  version: "3.0.0"

# Reasoning Components
components:
  enabled: true
  primary_components:
    - "deductive_reasoning"
    - "inductive_reasoning"
    - "abductive_reasoning"
    - "analogical_reasoning"
    - "causal_reasoning"
    - "probabilistic_reasoning"
  secondary_components:
    - "fuzzy_reasoning"
    - "case_based_reasoning"
    - "rule_based_reasoning"
    - "model_based_reasoning"
    - "qualitative_reasoning"
    - "quantitative_reasoning"
  component_weights:
    deductive_reasoning: 0.20
    inductive_reasoning: 0.15
    abductive_reasoning: 0.15
    analogical_reasoning: 0.10
    causal_reasoning: 0.10
    probabilistic_reasoning: 0.10
    fuzzy_reasoning: 0.10
    case_based_reasoning: 0.10

# Deductive Reasoning
deductive:
  enabled: true
  logic_type: "first_order"  # first_order, propositional, modal
  inference_engine: "forward_chaining"  # forward_chaining, backward_chaining, hybrid
  rule_base: true
  fact_base: true
  conflict_resolution: true
  truth_maintenance: true

# Inductive Reasoning
inductive:
  enabled: true
  induction_methods:
    - "generalization"
    - "pattern_recognition"
    - "statistical_inference"
    - "machine_learning"
  primary_method: "statistical_inference"
  confidence_level: 0.95
  sample_size_min: 30
  generalization_degree: 0.70

# Abductive Reasoning
abductive:
  enabled: true
  abduction_methods:
    - "explanation_generation"
    - "hypothesis_formation"
    - "best_explanation"
    - "candidate_selection"
  primary_method: "best_explanation"
  explanation_quality: true
  hypothesis_plausibility: true
  simplicity_preference: true

# Analogical Reasoning
analogical:
  enabled: true
  analogy_types:
    - "structural_analogy"
    - "functional_analogy"
    - "relational_analogy"
    - "temporal_analogy"
  primary_type: "structural_analogy"
  similarity_measure: "cosine"  # cosine, euclidean, manhattan, custom
  analogy_threshold: 0.70
  source_domain: "historical_markets"
  target_domain: "current_market"

# Causal Reasoning
causal:
  enabled: true
  causal_methods:
    - "granger_causality"
    - "structural_equation_modeling"
    - "directed_acyclic_graphs"
    - "intervention_analysis"
    - "counterfactual_analysis"
  primary_method: "granger_causality"
  causal_discovery: true
  causal_inference: true
  confounder_control: true
  causal_graph_visualization: true

# Probabilistic Reasoning
probabilistic:
  enabled: true
  probabilistic_methods:
    - "bayesian_network"
    - "markov_chain"
    - "hidden_markov_model"
    - "monte_carlo"
    - "belief_propagation"
  primary_method: "bayesian_network"
  probability_threshold: 0.70
  confidence_interval: 0.95
  belief_update: true
  uncertainty_handling: true

# Fuzzy Reasoning
fuzzy:
  enabled: true
  fuzzy_methods:
    - "mamdani"
    - "sugeno"
    - "tsukamoto"
    - "fuzzy_rules"
  primary_method: "mamdani"
  membership_functions:
    - "triangular"
    - "trapezoidal"
    - "gaussian"
    - "sigmoidal"
  defuzzification_method: "centroid"
  fuzzy_inference: true

# Case-Based Reasoning
case_based:
  enabled: true
  case_retrieval: "knn"  # knn, similarity, distance
  case_adaptation: "parametric"  # parametric, structural, reuse
  case_retention: true
  case_revision: true
  similarity_measure: "euclidean"
  k_value: 5
  case_base_size: 1000

# Rule-Based Reasoning
rule_based:
  enabled: true
  rule_types:
    - "production_rules"
    - "if_then_rules"
    - "decision_rules"
    - "constraint_rules"
  rule_engine: "forward_chaining"  # forward_chaining, backward_chaining, hybrid
  rule_priority: true
  conflict_resolution: true
  rule_explanation: true

# Model-Based Reasoning
model_based:
  enabled: true
  model_types:
    - "qualitative_models"
    - "quantitative_models"
    - "simulation_models"
    - "predictive_models"
  primary_type: "quantitative_models"
  model_validation: true
  model_fidelity: 0.85
  simulation_mode: "continuous"  # continuous, discrete, hybrid

# Decision Making
decision_making:
  enabled: true
  decision_framework: "multi_criteria"  # multi_criteria, probabilistic, heuristic
  decision_criteria:
    - "expected_return": 0.25
    - "risk_adjusted_return": 0.25
    - "drawdown_risk": 0.15
    - "liquidity_risk": 0.10
    - "market_impact": 0.10
    - "execution_quality": 0.10
    - "compliance_constraints": 0.05
  decision_confidence_threshold: 0.70
  decision_timeout_seconds: 5

# Reasoning Strength
strength:
  enabled: true
  strength_metrics:
    - "logic_strength"
    - "evidence_strength"
    - "confidence_level"
    - "support_strength"
    - "consistency_strength"
  strength_calculation: "weighted_average"
  min_strength_required: 0.60

# Visualization
visualization:
  enabled: true
  charts:
    - "reasoning_dashboard"
    - "decision_tree"
    - "causal_graph"
    - "bayesian_network"
    - "fuzzy_membership"
    - "case_based_retrieval"
    - "rule_chain"
  update_interval_seconds: 10
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "reasoning_conflict"
    - "decision_uncertainty"
    - "logic_breach"
    - "inference_error"
    - "confidence_drop"
  alert_thresholds:
    confidence_drop: 0.20
    uncertainty_threshold: 0.30
    logic_breach: 0.50
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
  alert_cooldown_seconds: 300

# Reporting
reporting:
  enabled: true
  report_types:
    - "reasoning_summary"
    - "decision_report"
    - "causal_analysis"
    - "confidence_report"
    - "logic_validation"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "trading@example.com"
    - "research@example.com"
    - "risk@example.com"

# Storage
storage:
  enabled: true
  storage_categories:
    - "reasoning_data"
    - "decision_history"
    - "causal_data"
    - "confidence_data"
    - "rule_base"
    - "case_base"
    - "alert_history"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/reasoning"
  api_endpoint: "/api/v1/trading/reasoning"
  dashboard_url: "http://localhost:3000/reasoning"
  real_time_updates: true
  data_sync_frequency_seconds: 5
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "decision_engine"
    - "research_platform"
