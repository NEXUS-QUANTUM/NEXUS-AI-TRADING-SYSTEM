#
# Description: Complete Asset Allocation configuration for swing trading bot
# Framework: Strategic Asset Allocation - Portfolio Construction
# Version: 3.0.0
#
# The Asset Allocation configuration defines how the bot distributes capital
# across different assets, sectors, and strategies to optimize returns.
# ============================================================================

# ----------------------------------------------------------------------------
# General Configuration
# ----------------------------------------------------------------------------
asset_allocation:
  enabled: true
  version: "3.0.0"
  description: "Asset Allocation for swing trading"
  
  # Allocation methods
  methods:
    - "risk_parity"
    - "equal_weight"
    - "market_cap"
    - "momentum"
    - "volatility_weighted"
    - "efficient_frontier"
    - "adaptive"
    - "rule_based"
  
  default_method: "adaptive"
  
  # Rebalancing
  rebalancing:
    frequency: "daily"
    threshold: 0.05
    min_rebalance_size: 100
    max_rebalance_size: 10000
    
    # Rebalancing modes
    modes:
      - "periodic"
      - "threshold"
      - "opportunistic"
  
  default_mode: "periodic"

# ----------------------------------------------------------------------------
# Risk Parity Allocation
# ----------------------------------------------------------------------------
risk_parity:
  enabled: true
  description: "Risk parity allocation configuration"
  
  # Parameters
  parameters:
    risk_target: 0.1
    max_leverage: 1.5
    min_weight: 0.01
    max_weight: 0.4
    lookback_period: 50
    covariance_method: "ewma"
    decay_factor: 0.94
  
  # Asset classes
  asset_classes:
    crypto:
      weight_min: 0.05
      weight_max: 0.3
      assets:
        - "BTCUSDT"
        - "ETHUSDT"
        - "SOLUSDT"
    
    stable:
      weight_min: 0.1
      weight_max: 0.5
      assets:
        - "USDT"
        - "USDC"
        - "DAI"
    
    defi:
      weight_min: 0.0
      weight_max: 0.2
      assets:
        - "UNI"
        - "AAVE"
        - "MKR"
    
    layer1:
      weight_min: 0.05
      weight_max: 0.3
      assets:
        - "ADA"
        - "DOT"
        - "AVAX"
        - "MATIC"
  
  # Constraints
  constraints:
    max_volatility: 0.3
    max_drawdown: 0.15
    min_sharpe: 0.5
    max_correlation: 0.7

# ----------------------------------------------------------------------------
# Equal Weight Allocation
# ----------------------------------------------------------------------------
equal_weight:
  enabled: true
  description: "Equal weight allocation configuration"
  
  # Parameters
  parameters:
    max_positions: 20
    min_position_size: 0.01
    max_position_size: 0.1
    rebalance_threshold: 0.02
    lookback_period: 10
  
  # Asset universe
  universe:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "ADAUSDT"
    - "DOTUSDT"
    - "AVAXUSDT"
    - "MATICUSDT"
    - "LINKUSDT"
    - "UNIUSDT"
    - "AAVEUSDT"
  
  # Filters
  filters:
    min_volume: 1000000
    min_market_cap: 100000000
    min_age_days: 30
    max_volatility: 0.5

# ----------------------------------------------------------------------------
# Market Cap Weighted Allocation
# ----------------------------------------------------------------------------
market_cap:
  enabled: true
  description: "Market cap weighted allocation configuration"
  
  # Parameters
  parameters:
    max_positions: 15
    min_position_size: 0.005
    max_position_size: 0.3
    rebalance_threshold: 0.03
    lookback_period: 5
  
  # Asset universe
  universe:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "ADAUSDT"
    - "DOTUSDT"
    - "AVAXUSDT"
    - "MATICUSDT"
    - "LINKUSDT"
    - "UNIUSDT"
  
  # Market cap sources
  sources:
    - "coinmarketcap"
    - "coingecko"
    - "messari"
  
  # Constraints
  constraints:
    max_top_asset_weight: 0.3
    min_low_asset_weight: 0.01
    max_sector_concentration: 0.4

# ----------------------------------------------------------------------------
# Momentum Allocation
# ----------------------------------------------------------------------------
momentum_allocation:
  enabled: true
  description: "Momentum allocation configuration"
  
  # Parameters
  parameters:
    lookback_periods:
      - 30
      - 60
      - 90
    momentum_method: "weighted"
    max_positions: 10
    min_position_size: 0.01
    max_position_size: 0.3
    rebalance_threshold: 0.02
  
  # Asset universe
  universe:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "ADAUSDT"
    - "DOTUSDT"
    - "AVAXUSDT"
    - "MATICUSDT"
    - "LINKUSDT"
  
  # Momentum indicators
  indicators:
    - "price_momentum"
    - "volume_momentum"
    - "relative_strength"
    - "sharpe_ratio"
  
  # Constraints
  constraints:
    max_volatility: 0.4
    max_drawdown: 0.2
    min_sharpe: 0.3

# ----------------------------------------------------------------------------
# Efficient Frontier Allocation
# ----------------------------------------------------------------------------
efficient_frontier:
  enabled: true
  description: "Efficient frontier allocation configuration"
  
  # Parameters
  parameters:
    risk_free_rate: 0.02
    max_volatility: 0.3
    max_drawdown: 0.15
    min_return: 0.05
    lookback_period: 50
    optimization_method: "quadratic"
  
  # Asset classes
  asset_classes:
    crypto:
      weight_min: 0.05
      weight_max: 0.3
      assets:
        - "BTCUSDT"
        - "ETHUSDT"
    
    defi:
      weight_min: 0.0
      weight_max: 0.2
      assets:
        - "UNIUSDT"
        - "AAVEUSDT"
    
    stable:
      weight_min: 0.1
      weight_max: 0.5
      assets:
        - "USDT"
        - "USDC"
  
  # Constraints
  constraints:
    max_volatility: 0.3
    max_drawdown: 0.15
    min_sharpe: 0.5
    max_correlation: 0.7

# ----------------------------------------------------------------------------
# Adaptive Allocation
# ----------------------------------------------------------------------------
adaptive:
  enabled: true
  description: "Adaptive allocation configuration"
  
  # Parameters
  parameters:
    lookback_period: 50
    adaptation_interval: 10
    min_position_size: 0.01
    max_position_size: 0.3
    volatility_target: 0.2
    momentum_weight: 0.3
    risk_weight: 0.4
    diversification_weight: 0.3
  
  # Adaptation methods
  methods:
    - "volatility_adjusted"
    - "momentum_adjusted"
    - "regime_based"
    - "performance_based"
  
  # Asset universe
  universe:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "ADAUSDT"
    - "DOTUSDT"
    - "AVAXUSDT"
    - "MATICUSDT"
    - "LINKUSDT"
  
  # Adaptation rules
  rules:
    increase_risk:
      conditions:
        - "sharpe_ratio_>_1"
        - "volatility_<_0.2"
        - "momentum_positive"
      action: "increase_position_by_10%"
    
    decrease_risk:
      conditions:
        - "sharpe_ratio_<_0.5"
        - "volatility_>_0.3"
        - "momentum_negative"
      action: "decrease_position_by_10%"
    
    rebalance:
      conditions:
        - "deviation_>_5%"
        - "market_regime_change"
      action: "rebalance_portfolio"

# ----------------------------------------------------------------------------
# Execution Parameters
# ----------------------------------------------------------------------------
execution:
  enabled: true
  description: "Execution parameters for asset allocation"
  
  # Order types
  order_types:
    - "market"
    - "limit"
    - "twap"
    - "vwap"
  
  # Execution rules
  rules:
    parallel_execution:
      enabled: true
      max_parallel: 3
      timeout: 30  # seconds
    
    order_splitting:
      enabled: true
      min_order_size: 100
      max_order_size: 1000
    
    slippage_control:
      enabled: true
      max_slippage: 0.001
      min_volume: 10000

# ----------------------------------------------------------------------------
# Risk Management
# ----------------------------------------------------------------------------
risk_management:
  enabled: true
  description: "Risk management for asset allocation"
  
  # Risk parameters
  parameters:
    max_total_risk: 0.15
    max_position_risk: 0.02
    max_sector_risk: 0.3
    max_asset_risk: 0.1
    
    # Stop loss
    stop_loss:
      enabled: true
      type: "portfolio"
      threshold: 0.05
    
    # Take profit
    take_profit:
      enabled: true
      type: "portfolio"
      threshold: 0.15

# ----------------------------------------------------------------------------
# Performance Monitoring
# ----------------------------------------------------------------------------
performance_monitoring:
  enabled: true
  description: "Performance monitoring for asset allocation"
  
  metrics:
    - "total_return"
    - "sharpe_ratio"
    - "max_drawdown"
    - "volatility"
    - "win_rate"
    - "profit_factor"
    - "consecutive_wins"
    - "consecutive_losses"
  
  targets:
    min_sharpe_ratio: 0.5
    max_max_drawdown: 0.15
    min_win_rate: 0.45

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  enabled: true
  level: "INFO"
  file: "logs/asset_allocation.log"
  rotation: "daily"
  retention: 30  # days
  
  log_categories:
    allocations: true
    rebalances: true
    trades: true
    errors: true
    performance: true
    debugging: false
