# Swing Bot Planning Engine Configuration
# Core Planning Engine & Strategic Decision Parameters

# General Planning Engine Settings
planning_engine:
  enabled: true
  engine_mode: "autonomous"  # autonomous, supervised, hybrid, collaborative
  planning_paradigm: "hierarchical"  # hierarchical, distributed, federated, hybrid
  engine_level: "advanced"  # basic, intermediate, advanced, expert
  version: "3.0.0"

# Engine Architecture
architecture:
  engine_type: "modular"  # modular, monolithic, distributed, microservices
  modules:
    - "goal_module"
    - "strategy_module"
    - "resource_module"
    - "risk_module"
    - "execution_module"
    - "contingency_module"
    - "monitoring_module"
    - "adjustment_module"
    - "optimization_module"
    - "learning_module"
  module_interaction: "pipeline"  # pipeline, event_driven, message_based
  parallel_execution: true
  max_workers: 8
  pipeline_buffer_size: 10000

# Goal Module
goal_module:
  enabled: true
  goal_types:
    - "financial_goals"
    - "performance_goals"
    - "risk_goals"
    - "growth_goals"
    - "efficiency_goals"
    - "learning_goals"
    - "adaptation_goals"
  goal_hierarchies:
    - "strategic"
    - "tactical"
    - "operational"
  goal_priorities:
    financial: 1
    performance: 2
    risk: 3
    growth: 4
    efficiency: 5
    learning: 6
    adaptation: 7
  goal_tracking: true
  goal_evaluation: true

# Strategy Module
strategy_module:
  enabled: true
  strategy_types:
    - "quantitative"
    - "fundamental"
    - "technical"
    - "hybrid"
    - "adaptive"
    - "machine_learning"
  strategy_development:
    methods:
      - "research_based"
      - "data_driven"
      - "model_based"
      - "experience_based"
      - "ensemble"
    evaluation_metrics:
      - "sharpe_ratio"
      - "win_rate"
      - "profit_factor"
      - "max_drawdown"
      - "calmar_ratio"
  strategy_selection:
    method: "performance_based"
    selection_criteria:
      - "performance_score"
      - "consistency"
      - "robustness"
      - "adaptability"
    top_strategies: 3

# Resource Module
resource_module:
  enabled: true
  resource_types:
    - "capital"
    - "risk_budget"
    - "time"
    - "attention"
    - "tools"
    - "data"
    - "compute"
  allocation_methods:
    - "strategic"
    - "tactical"
    - "dynamic"
    - "optimization_based"
    - "risk_parity"
  allocation_parameters:
    capital_per_strategy: 0.20
    max_capital_use: 0.80
    risk_per_strategy: 0.02
    max_risk_exposure: 0.10
    time_allocation: 0.10
  resource_optimization: true

# Risk Module
risk_module:
  enabled: true
  risk_types:
    - "market_risk"
    - "liquidity_risk"
    - "operational_risk"
    - "regulatory_risk"
    - "credit_risk"
    - "systemic_risk"
    - "model_risk"
  risk_parameters:
    var_limit: 0.05
    expected_shortfall: 0.07
    max_drawdown: 0.10
    max_correlation: 0.70
    risk_budget: 0.10
    max_exposure: 0.80
  risk_mitigation:
    - "diversification"
    - "hedging"
    - "position_sizing"
    - "stop_loss"
    - "limits"
    - "monitoring"
  risk_monitoring: true

# Execution Module
execution_module:
  enabled: true
  execution_types:
    - "immediate"
    - "scheduled"
    - "conditional"
    - "adaptive"
    - "algorithmic"
  execution_parameters:
    timing_strategy: "market_adaptive"
    order_types: ["limit", "market", "stop"]
    execution_priority: "quality"  # speed, quality, cost, balanced
    max_slippage: 0.01
    min_execution_quality: 0.80
  execution_monitoring: true
  execution_optimization: true

# Contingency Module
contingency_module:
  enabled: true
  contingency_types:
    - "market_contingency"
    - "operational_contingency"
    - "risk_contingency"
    - "system_contingency"
    - "compliance_contingency"
    - "model_contingency"
  contingency_plans:
    - "emergency_stop"
    - "position_reduction"
    - "hedge_activation"
    - "system_switch"
    - "manual_intervention"
    - "model_fallback"
  activation_triggers:
    - "drawdown_threshold"
    - "var_breach"
    - "system_failure"
    - "regulatory_change"
    - "model_error"
    - "market_shock"
  contingency_testing: true

# Monitoring Module
monitoring_module:
  enabled: true
  monitoring_metrics:
    - "strategy_performance"
    - "execution_performance"
    - "risk_performance"
    - "resource_performance"
    - "goal_progress"
    - "plan_adherence"
    - "system_health"
  monitoring_frequency:
    real_time: true
    hourly: true
    daily: true
    weekly: true
    monthly: true
  monitoring_actions:
    - "report_generation"
    - "alert_triggering"
    - "plan_adjustment"
    - "strategy_review"
    - "risk_assessment"

# Adjustment Module
adjustment_module:
  enabled: true
  adjustment_types:
    - "strategic_adjustment"
    - "tactical_adjustment"
    - "operational_adjustment"
    - "resource_adjustment"
    - "risk_adjustment"
    - "execution_adjustment"
  adjustment_triggers:
    - "performance_deviation"
    - "market_regime_change"
    - "risk_regime_change"
    - "goal_update"
    - "new_information"
    - "system_change"
  adjustment_frequency:
    continuous: true
    triggered: true
    scheduled: true
  adjustment_optimization: true

# Optimization Module
optimization_module:
  enabled: true
  optimization_objectives:
    - "maximize_performance"
    - "minimize_risk"
    - "maximize_efficiency"
    - "maximize_adaptability"
    - "maximize_robustness"
  optimization_methods:
    - "genetic_algorithm"
    - "particle_swarm"
    - "bayesian_optimization"
    - "gradient_descent"
    - "simulated_annealing"
  optimization_parameters:
    population_size: 100
    generations: 50
    mutation_rate: 0.10
    crossover_rate: 0.80
    convergence_threshold: 0.001
  optimization_frequency_hours: 6

# Learning Module
learning_module:
  enabled: true
  learning_methods:
    - "supervised_learning"
    - "unsupervised_learning"
    - "reinforcement_learning"
    - "transfer_learning"
    - "meta_learning"
  learning_objectives:
    - "plan_improvement"
    - "strategy_optimization"
    - "risk_understanding"
    - "market_adaptation"
    - "decision_enhancement"
  learning_parameters:
    learning_rate: 0.001
    batch_size: 64
    epochs: 100
    validation_split: 0.20
  learning_frequency_hours: 6

# Performance Evaluation
performance_evaluation:
  enabled: true
  evaluation_metrics:
    - "plan_effectiveness"
    - "strategy_performance"
    - "execution_quality"
    - "risk_efficiency"
    - "resource_utilization"
    - "goal_achievement"
    - "adaptability_score"
    - "robustness_score"
  evaluation_frequency_hours: 1
  evaluation_depth: "comprehensive"  # basic, intermediate, comprehensive
  benchmarking: true

# Visualization
visualization:
  enabled: true
  charts:
    - "planning_dashboard"
    - "goal_tracking_chart"
    - "resource_allocation_chart"
    - "risk_planning_chart"
    - "execution_timeline"
    - "performance_vs_plan"
    - "contingency_status"
    - "adjustment_tracking"
  update_interval_seconds: 60
  dashboard_integration: true
  real_time_updates: true

# Alerting
alerting:
  enabled: true
  alert_conditions:
    - "goal_deviation"
    - "plan_deviation"
    - "risk_threshold_breach"
    - "contingency_trigger"
    - "performance_deviation"
    - "resource_depletion"
    - "system_failure"
    - "adjustment_required"
  alert_thresholds:
    goal_deviation: 0.10
    risk_threshold: 0.80
    performance_drop: 0.20
    resource_depletion: 0.80
  alert_channels:
    - "email"
    - "telegram"
    - "slack"
    - "pagerduty"
  alert_cooldown_seconds: 600
  escalation_policy: true

# Reporting
reporting:
  enabled: true
  report_types:
    - "real_time_alerts"
    - "daily_plan_summary"
    - "weekly_plan_review"
    - "monthly_plan_report"
    - "quarterly_strategic_review"
    - "annual_planning_report"
    - "performance_report"
  report_formats:
    - "pdf"
    - "html"
    - "json"
    - "csv"
    - "excel"
  report_recipients:
    - "management@example.com"
    - "trading@example.com"
    - "risk@example.com"
    - "strategy@example.com"
  report_automation: true

# Storage
storage:
  enabled: true
  storage_categories:
    - "plan_data"
    - "goal_data"
    - "strategy_data"
    - "resource_data"
    - "risk_data"
    - "execution_data"
    - "contingency_data"
    - "monitoring_data"
    - "adjustment_data"
    - "optimization_data"
    - "learning_data"
    - "performance_data"
    - "report_history"
  retention_days: 365
  compression: "zstd"
  storage_format: "parquet"

# Integration
integration:
  enabled: true
  webhook_endpoint: "http://localhost:8080/planning-engine"
  api_endpoint: "/api/v1/trading/planning-engine"
  dashboard_url: "http://localhost:3000/planning-engine"
  real_time_updates: true
  data_sync_frequency_seconds: 30
  external_systems:
    - "trading_engine"
    - "risk_management"
    - "execution_engine"
    - "resource_management"
    - "learning_engine"
    - "optimization_engine"

# Logging
logging:
  enabled: true
  log_level: "info"  # debug, info, warn, error, critical
  log_categories:
    - "planning"
    - "goals"
    - "strategies"
    - "resources"
    - "risk"
    - "execution"
    - "contingency"
    - "monitoring"
    - "adjustment"
    - "optimization"
    - "learning"
    - "performance"
    - "errors"
  log_rotation: true
  max_log_size_mb: 100
  retention_days: 30
  audit_trail: true

# Security
security:
  enabled: true
  access_control: true
  data_encryption: true
  plan_integrity: true
  audit_logging: true
  secure_storage: true
  user_authentication: true
  role_based_access: true
  compliance_checks: true
