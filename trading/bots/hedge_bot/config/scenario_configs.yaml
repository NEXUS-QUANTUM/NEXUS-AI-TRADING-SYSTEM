# ============================================================
# SCENARIO GENERAL SETTINGS
# ============================================================
scenario:
  # General Scenario Settings
  general:
    enabled: true
    scenario_analysis: true
    scenario_testing: true
    scenario_monitoring: true
    scenario_reporting: true
    update_frequency: "daily"
    confidence_level: 0.95
    max_scenarios: 20
    auto_scenario_generation: true
    
  # Scenario Types
  types:
    market_scenarios:
      enabled: true
      description: "Market-based scenarios"
      
    stress_scenarios:
      enabled: true
      description: "Stress testing scenarios"
      
    historical_scenarios:
      enabled: true
      description: "Historical event scenarios"
      
    custom_scenarios:
      enabled: true
      description: "User-defined scenarios"
      
    probabilistic_scenarios:
      enabled: true
      description: "Probability-based scenarios"

# ============================================================
# MARKET SCENARIOS
# ============================================================
market_scenarios:
  # Bull Market Scenario
  bull_market:
    enabled: true
    description: "Bull market conditions"
    probability: 0.30
    market_move: 0.15  # 15% up
    volatility_multiplier: 0.7
    correlation_multiplier: 0.8
    liquidity_multiplier: 1.2
    expected_return: 0.15
    expected_risk: 0.10
    
  # Bear Market Scenario
  bear_market:
    enabled: true
    description: "Bear market conditions"
    probability: 0.20
    market_move: -0.15  # 15% down
    volatility_multiplier: 1.5
    correlation_multiplier: 1.3
    liquidity_multiplier: 0.7
    expected_return: -0.15
    expected_risk: 0.20
    
  # Sideways Market Scenario
  sideways_market:
    enabled: true
    description: "Sideways market conditions"
    probability: 0.30
    market_move: 0.02  # 2% up
    volatility_multiplier: 0.5
    correlation_multiplier: 0.6
    liquidity_multiplier: 1.0
    expected_return: 0.02
    expected_risk: 0.05
    
  # High Volatility Scenario
  high_volatility:
    enabled: true
    description: "High volatility market conditions"
    probability: 0.15
    market_move: 0.05  # 5% up
    volatility_multiplier: 2.0
    correlation_multiplier: 1.2
    liquidity_multiplier: 0.8
    expected_return: 0.05
    expected_risk: 0.30
    
  # Low Volatility Scenario
  low_volatility:
    enabled: true
    description: "Low volatility market conditions"
    probability: 0.05
    market_move: 0.01  # 1% up
    volatility_multiplier: 0.3
    correlation_multiplier: 0.4
    liquidity_multiplier: 1.1
    expected_return: 0.01
    expected_risk: 0.03

# ============================================================
# STRESS SCENARIOS
# ============================================================
stress_scenarios:
  # Market Crash Scenario
  market_crash:
    enabled: true
    description: "Global market crash"
    probability: 0.05
    market_move: -0.25  # 25% down
    volatility_multiplier: 3.0
    correlation_multiplier: 1.5
    liquidity_multiplier: 0.3
    expected_return: -0.25
    expected_risk: 0.40
    recovery_time: 90  # days
    
  # Flash Crash Scenario
  flash_crash:
    enabled: true
    description: "Flash crash event"
    probability: 0.08
    market_move: -0.15  # 15% down
    volatility_multiplier: 4.0
    correlation_multiplier: 2.0
    liquidity_multiplier: 0.2
    expected_return: -0.15
    expected_risk: 0.35
    recovery_time: 30  # days
    
  # Black Swan Scenario
  black_swan:
    enabled: true
    description: "Black swan event"
    probability: 0.02
    market_move: -0.40  # 40% down
    volatility_multiplier: 5.0
    correlation_multiplier: 2.5
    liquidity_multiplier: 0.1
    expected_return: -0.40
    expected_risk: 0.60
    recovery_time: 180  # days
    
  # VIX Shock Scenario
  vix_shock:
    enabled: true
    description: "VIX shock event"
    probability: 0.10
    vix_move: 15.0  # VIX points
    volatility_multiplier: 2.0
    correlation_multiplier: 1.2
    liquidity_multiplier: 0.5
    expected_return: -0.10
    expected_risk: 0.25
    recovery_time: 45  # days
    
  # Liquidity Crisis Scenario
  liquidity_crisis:
    enabled: true
    description: "Liquidity crisis"
    probability: 0.06
    market_move: -0.20  # 20% down
    volatility_multiplier: 3.5
    correlation_multiplier: 1.8
    liquidity_multiplier: 0.15
    expected_return: -0.20
    expected_risk: 0.30
    recovery_time: 60  # days

# ============================================================
# HISTORICAL SCENARIOS
# ============================================================
historical_scenarios:
  # 2008 Financial Crisis
  crisis_2008:
    enabled: true
    description: "2008 Global Financial Crisis"
    date: "2008-09-15"
    market_move: -0.35  # 35% down
    volatility_multiplier: 4.0
    correlation_multiplier: 1.8
    liquidity_multiplier: 0.2
    duration_days: 180
    recovery_days: 365
    
  # 2020 COVID Crash
  covid_2020:
    enabled: true
    description: "2020 COVID-19 Market Crash"
    date: "2020-03-12"
    market_move: -0.30  # 30% down
    volatility_multiplier: 3.5
    correlation_multiplier: 1.6
    liquidity_multiplier: 0.3
    duration_days: 90
    recovery_days: 180
    
  # 2022 Inflation Shock
  inflation_2022:
    enabled: true
    description: "2022 Inflation Shock"
    date: "2022-06-13"
    market_move: -0.20  # 20% down
    volatility_multiplier: 2.0
    correlation_multiplier: 1.2
    liquidity_multiplier: 0.4
    duration_days: 120
    recovery_days: 240
    
  # 2011 European Debt Crisis
  euro_crisis_2011:
    enabled: true
    description: "2011 European Debt Crisis"
    date: "2011-08-08"
    market_move: -0.25  # 25% down
    volatility_multiplier: 2.5
    correlation_multiplier: 1.4
    liquidity_multiplier: 0.3
    duration_days: 150
    recovery_days: 300

# ============================================================
# ASSET-SPECIFIC SCENARIOS
# ============================================================
asset_scenarios:
  # Cryptocurrency Scenarios
  cryptocurrency:
    crypto_winter:
      enabled: true
      description: "Cryptocurrency winter"
      market_move: -0.40
      volatility_multiplier: 4.0
      correlation_multiplier: 2.0
      liquidity_multiplier: 0.2
      duration_days: 365
      
    crypto_bull:
      enabled: true
      description: "Cryptocurrency bull run"
      market_move: 0.50
      volatility_multiplier: 1.5
      correlation_multiplier: 1.2
      liquidity_multiplier: 1.5
      duration_days: 180
      
    regulatory_crackdown:
      enabled: true
      description: "Regulatory crackdown"
      market_move: -0.30
      volatility_multiplier: 3.0
      correlation_multiplier: 1.8
      liquidity_multiplier: 0.3
      duration_days: 90
      
  # Forex Scenarios
  forex:
    dollar_weakness:
      enabled: true
      description: "USD weakness scenario"
      dxy_move: -0.10
      volatility_multiplier: 1.2
      correlation_multiplier: 0.8
      duration_days: 60
      
    dollar_strength:
      enabled: true
      description: "USD strength scenario"
      dxy_move: 0.10
      volatility_multiplier: 1.2
      correlation_multiplier: 0.8
      duration_days: 60
      
  # Equity Scenarios
  equity:
    tech_bubble:
      enabled: true
      description: "Technology sector bubble"
      sector: "technology"
      market_move: -0.30
      volatility_multiplier: 2.5
      correlation_multiplier: 1.5
      duration_days: 120
      
    oil_crisis:
      enabled: true
      description: "Oil price crisis"
      sector: "energy"
      market_move: -0.20
      volatility_multiplier: 2.0
      correlation_multiplier: 1.3
      duration_days: 90

# ============================================================
# SCENARIO MONITORING
# ============================================================
scenario_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "daily"
    alert_threshold: 0.75  # 75% of scenario impact
    critical_threshold: 0.90  # 90% of scenario impact
    reporting_frequency: "daily"
    
  # Alert Conditions
  alerts:
    scenario_triggered:
      enabled: true
      level: "warning"
      message: "Scenario triggered: {scenario}"
      
    scenario_impact:
      enabled: true
      level: "warning"
      threshold: 0.80
      message: "Scenario impact: {impact}%"
      
    scenario_deviation:
      enabled: true
      level: "warning"
      threshold: 0.10
      message: "Scenario deviation: {deviation}%"
      
  # Monitoring Metrics
  metrics:
    - "scenario_probability"
    - "scenario_impact"
    - "scenario_deviation"
    - "scenario_trigger_count"
    - "scenario_accuracy"

# ============================================================
# SCENARIO REPORTING
# ============================================================
scenario_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "daily"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    include_recommendations: true
    
  # Report Sections
  sections:
    scenario_summary:
      enabled: true
      include_active_scenarios: true
      include_probabilities: true
      include_impacts: true
      
    stress_testing:
      enabled: true
      include_stress_scenarios: true
      include_impacts: true
      include_recovery: true
      
    historical_analysis:
      enabled: true
      include_historical_scenarios: true
      include_comparisons: true
      
    recommendations:
      enabled: true
      include_risk_mitigation: true
      include_hedging_strategies: true
      include_position_adjustments: true

# ============================================================
# SCENARIO DASHBOARD
# ============================================================
scenario_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 60
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    scenario_summary:
      enabled: true
      position: 1
      size: "large"
      
    scenario_chart:
      enabled: true
      position: 2
      size: "large"
      
    stress_testing:
      enabled: true
      position: 3
      size: "medium"
      
    historical_analysis:
      enabled: true
      position: 4
      size: "medium"
      
    alert_status:
      enabled: true
      position: 5
      size: "small"

# ============================================================
# SCENARIO INTEGRATION
# ============================================================
scenario_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "api"  # api, webhook, websocket, file
    
  # External Systems
  systems:
    risk_system:
      enabled: true
      endpoint: "/api/risk/scenario"
      update_frequency: "daily"
      
    analytics_system:
      enabled: true
      endpoint: "/api/analytics/scenario"
      update_frequency: "daily"
      
    monitoring_system:
      enabled: true
      endpoint: "/api/monitoring/scenario"
      update_frequency: "realtime"

# ============================================================
# SCENARIO EXAMPLES
# ============================================================
scenario_examples:
  # Example 1: Scenario Analysis
  scenario_analysis_example:
    description: "Scenario Analysis Example"
    portfolio_value: 100000
    scenarios:
      - name: "Bull Market"
        probability: 0.30
        impact: 0.15
        expected_value: 115000
      - name: "Bear Market"
        probability: 0.20
        impact: -0.15
        expected_value: 85000
      - name: "Sideways"
        probability: 0.30
        impact: 0.02
        expected_value: 102000
      - name: "Crash"
        probability: 0.05
        impact: -0.25
        expected_value: 75000
    weighted_average: 103000
    expected_shortfall: 87500
    
  # Example 2: Stress Testing
  stress_testing_example:
    description: "Stress Testing Example"
    portfolio_value: 100000
    stress_scenarios:
      - name: "Market Crash"
        impact: -0.25
        stressed_value: 75000
      - name: "Flash Crash"
        impact: -0.15
        stressed_value: 85000
      - name: "Black Swan"
        impact: -0.40
        stressed_value: 60000
    worst_case: 60000
    capital_required: 40000

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    scenario:
      general:
        enabled: true
        scenario_analysis: true
        scenario_testing: false
        update_frequency: "hourly"
        
    scenario_monitoring:
      alerts:
        scenario_triggered:
          enabled: false
        scenario_impact:
          enabled: false
          
  # Staging Environment
  staging:
    scenario:
      general:
        enabled: true
        scenario_analysis: true
        scenario_testing: true
        update_frequency: "daily"
        
    scenario_monitoring:
      alerts:
        scenario_triggered:
          enabled: true
        scenario_impact:
          enabled: true
        scenario_deviation:
          enabled: true
          
  # Production Environment
  production:
    scenario:
      general:
        enabled: true
        scenario_analysis: true
        scenario_testing: true
        scenario_monitoring: true
        scenario_reporting: true
        update_frequency: "daily"
        confidence_level: 0.95
        
    scenario_monitoring:
      alerts:
        scenario_triggered:
          enabled: true
          level: "warning"
        scenario_impact:
          enabled: true
          level: "warning"
        scenario_deviation:
          enabled: true
          level: "warning"
          
  # Demo Environment
  demo:
    scenario:
      general:
        enabled: true
        scenario_analysis: true
        scenario_testing: false
        update_frequency: "hourly"
        
    scenario_monitoring:
      alerts:
        scenario_triggered:
          enabled: false
        scenario_impact:
          enabled: true

# ============================================================
# END OF CONFIGURATION
# ============================================================
