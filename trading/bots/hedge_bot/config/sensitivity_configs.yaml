# ============================================================
# SENSITIVITY GENERAL SETTINGS
# ============================================================
sensitivity:
  # General Sensitivity Settings
  general:
    enabled: true
    sensitivity_analysis: true
    sensitivity_testing: true
    sensitivity_monitoring: true
    sensitivity_reporting: true
    update_frequency: "daily"
    confidence_level: 0.95
    min_sensitivity_threshold: 0.01  # 1% minimum
    max_sensitivity_threshold: 0.50  # 50% maximum
    default_sensitivity: 0.05  # 5% default
    
  # Sensitivity Types
  types:
    price_sensitivity:
      enabled: true
      description: "Price movement sensitivity"
      
    volatility_sensitivity:
      enabled: true
      description: "Volatility sensitivity"
      
    correlation_sensitivity:
      enabled: true
      description: "Correlation sensitivity"
      
    parameter_sensitivity:
      enabled: true
      description: "Parameter sensitivity"
      
    model_sensitivity:
      enabled: true
      description: "Model sensitivity"

# ============================================================
# PRICE SENSITIVITY
# ============================================================
price_sensitivity:
  # Price Sensitivity Settings
  settings:
    enabled: true
    price_change_intervals:
      - 0.01  # 1%
      - 0.02  # 2%
      - 0.05  # 5%
      - 0.10  # 10%
      - 0.15  # 15%
      - 0.20  # 20%
    calculation_method: "delta"  # delta, gamma, vega
    lookback_period: 252  # days
    min_data_points: 60
    
  # Asset-Specific Sensitivity
  assets:
    BTC:
      price_sensitivity: 0.15  # 15% sensitivity
      delta: 0.85
      gamma: 0.03
      
    ETH:
      price_sensitivity: 0.18
      delta: 0.82
      gamma: 0.035
      
    SOL:
      price_sensitivity: 0.25
      delta: 0.75
      gamma: 0.04
      
    ADA:
      price_sensitivity: 0.25
      delta: 0.75
      gamma: 0.04
      
    DOT:
      price_sensitivity: 0.22
      delta: 0.78
      gamma: 0.038
      
    AVAX:
      price_sensitivity: 0.28
      delta: 0.72
      gamma: 0.045
      
    EURUSD:
      price_sensitivity: 0.05
      delta: 0.95
      gamma: 0.01
      
    GBPUSD:
      price_sensitivity: 0.06
      delta: 0.94
      gamma: 0.012
      
    SPY:
      price_sensitivity: 0.08
      delta: 0.92
      gamma: 0.015
      
    GOLD:
      price_sensitivity: 0.06
      delta: 0.94
      gamma: 0.01

# ============================================================
# VOLATILITY SENSITIVITY
# ============================================================
volatility_sensitivity:
  # Volatility Sensitivity Settings
  settings:
    enabled: true
    volatility_change_intervals:
      - 0.05  # 5%
      - 0.10  # 10%
      - 0.20  # 20%
      - 0.30  # 30%
      - 0.50  # 50%
    calculation_method: "vega"  # vega, vanna, vomma
    lookback_period: 252
    min_data_points: 60
    
  # Asset-Specific Volatility Sensitivity
  assets:
    BTC:
      vega: 0.20
      vanna: 0.05
      vomma: 0.02
      
    ETH:
      vega: 0.22
      vanna: 0.055
      vomma: 0.022
      
    SOL:
      vega: 0.30
      vanna: 0.08
      vomma: 0.03
      
    ADA:
      vega: 0.30
      vanna: 0.08
      vomma: 0.03
      
    DOT:
      vega: 0.28
      vanna: 0.07
      vomma: 0.028
      
    AVAX:
      vega: 0.35
      vanna: 0.09
      vomma: 0.035
      
    EURUSD:
      vega: 0.08
      vanna: 0.02
      vomma: 0.008
      
    SPY:
      vega: 0.12
      vanna: 0.03
      vomma: 0.012
      
    GOLD:
      vega: 0.10
      vanna: 0.025
      vomma: 0.01

# ============================================================
# CORRELATION SENSITIVITY
# ============================================================
correlation_sensitivity:
  # Correlation Sensitivity Settings
  settings:
    enabled: true
    correlation_change_intervals:
      - 0.10  # 10%
      - 0.20  # 20%
      - 0.30  # 30%
      - 0.50  # 50%
    calculation_method: "rho"  # rho, vega, delta
    lookback_period: 252
    min_data_points: 60
    
  # Asset-Specific Correlation Sensitivity
  assets:
    BTC_ETH:
      correlation_sensitivity: 0.15
      rho: 0.75
      
    BTC_SOL:
      correlation_sensitivity: 0.20
      rho: 0.65
      
    BTC_ADA:
      correlation_sensitivity: 0.22
      rho: 0.60
      
    ETH_SOL:
      correlation_sensitivity: 0.18
      rho: 0.70
      
    ETH_ADA:
      correlation_sensitivity: 0.20
      rho: 0.65
      
    SOL_ADA:
      correlation_sensitivity: 0.25
      rho: 0.75
      
    BTC_SPY:
      correlation_sensitivity: 0.30
      rho: 0.25
      
    BTC_GOLD:
      correlation_sensitivity: 0.35
      rho: 0.15

# ============================================================
# PARAMETER SENSITIVITY
# ============================================================
parameter_sensitivity:
  # Parameter Sensitivity Settings
  settings:
    enabled: true
    parameter_change_intervals:
      - 0.05  # 5%
      - 0.10  # 10%
      - 0.20  # 20%
      - 0.30  # 30%
    calculation_method: "parametric"
    lookback_period: 252
    
  # Trading Parameters
  parameters:
    hedge_ratio:
      sensitivity: 0.15
      min_value: 0.20
      max_value: 0.80
      
    stop_loss:
      sensitivity: 0.20
      min_value: 0.02
      max_value: 0.10
      
    take_profit:
      sensitivity: 0.18
      min_value: 0.03
      max_value: 0.20
      
    position_size:
      sensitivity: 0.25
      min_value: 100
      max_value: 10000
      
    leverage:
      sensitivity: 0.30
      min_value: 1.0
      max_value: 3.0

# ============================================================
# SENSITIVITY MONITORING
# ============================================================
sensitivity_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "daily"
    alert_threshold: 0.75  # 75% of limit
    critical_threshold: 0.90  # 90% of limit
    reporting_frequency: "daily"
    
  # Alert Conditions
  alerts:
    price_sensitivity_alert:
      enabled: true
      level: "warning"
      threshold: 0.20
      message: "Price sensitivity high: {sensitivity}"
      
    volatility_sensitivity_alert:
      enabled: true
      level: "warning"
      threshold: 0.30
      message: "Volatility sensitivity high: {sensitivity}"
      
    correlation_sensitivity_alert:
      enabled: true
      level: "warning"
      threshold: 0.30
      message: "Correlation sensitivity high: {sensitivity}"
      
    parameter_sensitivity_alert:
      enabled: true
      level: "warning"
      threshold: 0.25
      message: "Parameter sensitivity high: {parameter}"
      
  # Monitoring Metrics
  metrics:
    - "price_sensitivity"
    - "volatility_sensitivity"
    - "correlation_sensitivity"
    - "parameter_sensitivity"
    - "sensitivity_deviation"
    - "sensitivity_utilization"

# ============================================================
# SENSITIVITY REPORTING
# ============================================================
sensitivity_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "daily"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    include_recommendations: true
    
  # Report Sections
  sections:
    sensitivity_summary:
      enabled: true
      include_price_sensitivity: true
      include_volatility_sensitivity: true
      include_correlation_sensitivity: true
      
    asset_sensitivity:
      enabled: true
      include_by_asset: true
      include_by_asset_class: true
      
    parameter_sensitivity:
      enabled: true
      include_trading_parameters: true
      include_risk_parameters: true
      
    recommendations:
      enabled: true
      include_hedging_suggestions: true
      include_parameter_adjustments: true

# ============================================================
# SENSITIVITY DASHBOARD
# ============================================================
sensitivity_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 60
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    sensitivity_summary:
      enabled: true
      position: 1
      size: "large"
      
    sensitivity_chart:
      enabled: true
      position: 2
      size: "large"
      
    asset_sensitivity:
      enabled: true
      position: 3
      size: "medium"
      
    parameter_sensitivity:
      enabled: true
      position: 4
      size: "medium"
      
    alert_status:
      enabled: true
      position: 5
      size: "small"

# ============================================================
# SENSITIVITY INTEGRATION
# ============================================================
sensitivity_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "api"  # api, webhook, websocket, file
    
  # External Systems
  systems:
    risk_system:
      enabled: true
      endpoint: "/api/risk/sensitivity"
      update_frequency: "daily"
      
    analytics_system:
      enabled: true
      endpoint: "/api/analytics/sensitivity"
      update_frequency: "daily"
      
    trading_system:
      enabled: true
      endpoint: "/api/trading/sensitivity"
      update_frequency: "realtime"

# ============================================================
# SENSITIVITY EXAMPLES
# ============================================================
sensitivity_examples:
  # Example 1: Price Sensitivity
  price_sensitivity_example:
    description: "Price Sensitivity Example"
    asset: "BTC"
    current_price: 50000
    price_sensitivity: 0.15
    price_change: 0.05  # 5%
    expected_change: 0.0075  # 0.75%
    new_price: 50375  # 50000 * (1 + 0.0075)
    
  # Example 2: Volatility Sensitivity
  volatility_sensitivity_example:
    description: "Volatility Sensitivity Example"
    asset: "BTC"
    current_volatility: 0.20
    vega: 0.20
    volatility_change: 0.10  # 10%
    expected_change: 0.02  # 2%
    new_volatility: 0.22  # 0.20 * (1 + 0.02)
    
  # Example 3: Correlation Sensitivity
  correlation_sensitivity_example:
    description: "Correlation Sensitivity Example"
    assets: ["BTC", "ETH"]
    current_correlation: 0.75
    correlation_sensitivity: 0.15
    correlation_change: 0.10  # 10%
    expected_change: 0.015  # 1.5%
    new_correlation: 0.761  # 0.75 * (1 + 0.015)

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    sensitivity:
      general:
        enabled: true
        sensitivity_analysis: true
        sensitivity_testing: false
        update_frequency: "hourly"
        
    sensitivity_monitoring:
      alerts:
        price_sensitivity_alert:
          enabled: false
        volatility_sensitivity_alert:
          enabled: false
          
  # Staging Environment
  staging:
    sensitivity:
      general:
        enabled: true
        sensitivity_analysis: true
        sensitivity_testing: true
        update_frequency: "daily"
        
    sensitivity_monitoring:
      alerts:
        price_sensitivity_alert:
          enabled: true
        volatility_sensitivity_alert:
          enabled: true
        correlation_sensitivity_alert:
          enabled: true
          
  # Production Environment
  production:
    sensitivity:
      general:
        enabled: true
        sensitivity_analysis: true
        sensitivity_testing: true
        sensitivity_monitoring: true
        sensitivity_reporting: true
        update_frequency: "daily"
        
    sensitivity_monitoring:
      alerts:
        price_sensitivity_alert:
          enabled: true
          level: "warning"
        volatility_sensitivity_alert:
          enabled: true
          level: "warning"
        correlation_sensitivity_alert:
          enabled: true
          level: "warning"
        parameter_sensitivity_alert:
          enabled: true
          level: "warning"
          
  # Demo Environment
  demo:
    sensitivity:
      general:
        enabled: true
        sensitivity_analysis: true
        sensitivity_testing: false
        update_frequency: "hourly"
        
    sensitivity_monitoring:
      alerts:
        price_sensitivity_alert:
          enabled: false
        volatility_sensitivity_alert:
          enabled: true

# ============================================================
# END OF CONFIGURATION
# ============================================================
