# ============================================================
# CONCENTRATION GENERAL SETTINGS
# ============================================================
concentration:
  # General Concentration Settings
  general:
    enabled: true
    monitoring_frequency: "realtime"  # realtime, hourly, daily
    alert_threshold: 0.75  # 75% of limit
    critical_threshold: 0.90  # 90% of limit
    auto_rebalancing: true
    rebalancing_threshold: 0.85  # 85% of limit
    diversification_target: 0.40  # Target diversification score
    min_diversification_score: 0.30
    
  # Concentration Metrics
  metrics:
    - "herfindahl_hirschman_index"
    - "gini_coefficient"
    - "concentration_ratio"
    - "diversification_score"
    - "effective_number_bets"
    - "entropy_index"
    - "correlation_weighted_concentration"

# ============================================================
