    max_asset_class: 0.40  # 40% of portfolio
    max_sector: 0.35  # 35% of portfolio
    max_industry: 0.25  # 25% of portfolio
    max_geographic: 0.50  # 50% of portfolio
    
  # Asset-Specific Limits
  assets:
    BTC:
      max_concentration: 0.15
      max_position: 0.10
      min_position: 0.01
      
    ETH:
      max_concentration: 0.12
      max_position: 0.08
      min_position: 0.01
      
    SOL:
      max_concentration: 0.08
      max_position: 0.05
      min_position: 0.005
      
    ADA:
      max_concentration: 0.06
      max_position: 0.04
      min_position: 0.005
      
    DOT:
      max_concentration: 0.06
      max_position: 0.04
      min_position: 0.005
      
    AVAX:
      max_concentration: 0.06
      max_position: 0.04
      min_position: 0.005
      
    XRP:
      max_concentration: 0.05
      max_position: 0.03
      min_position: 0.005
      
    LINK:
      max_concentration: 0.05
      max_position: 0.03
      min_position: 0.005
      
    UNI:
      max_concentration: 0.04
      max_position: 0.02
      min_position: 0.005
      
    AAVE:
      max_concentration: 0.04
      max_position: 0.02
      min_position: 0.005
      
    EURUSD:
      max_concentration: 0.10
      max_position: 0.05
      min_position: 0.005
      
    GBPUSD:
      max_concentration: 0.08
      max_position: 0.04
      min_position: 0.005
      
    USDJPY:
      max_concentration: 0.08
      max_position: 0.04
      min_position: 0.005
      
    AAPL:
      max_concentration: 0.08
      max_position: 0.04
      min_position: 0.005
      
    MSFT:
      max_concentration: 0.08
      max_position: 0.04
      min_position: 0.005
      
    GOOGL:
      max_concentration: 0.07
      max_position: 0.035
      min_position: 0.005
      
    AMZN:
      max_concentration: 0.07
      max_position: 0.035
      min_position: 0.005
      
    TSLA:
      max_concentration: 0.06
      max_position: 0.03
      min_position: 0.005
      
    GOLD:
      max_concentration: 0.10
      max_position: 0.05
      min_position: 0.005
      
    SILVER:
      max_concentration: 0.06
      max_position: 0.03
      min_position: 0.005
      
    OIL:
      max_concentration: 0.06
      max_position: 0.03
      min_position: 0.005

