# ============================================================
# VOLATILITY GENERAL SETTINGS
# ============================================================
volatility:
  # General Volatility Settings
  general:
    enabled: true
    calculation_method: "historical"  # historical, implied, realized, ewma, garch
    volatility_type: "annualized"  # annualized, daily, weekly, monthly
    lookback_period: 30  # days
    min_data_points: 20
    update_frequency: "realtime"  # realtime, hourly, daily
    use_volatility_forecast: true
    use_volatility_surface: true
    use_volatility_regimes: true
    use_volatility_skew: true
    
  # Volatility Types
  types:
    historical_volatility:
      enabled: true
      description: "Historical volatility calculation"
      calculation: "standard_deviation"
      
    implied_volatility:
      enabled: true
      description: "Implied volatility from options"
      calculation: "black_scholes"
      
    realized_volatility:
      enabled: true
      description: "Realized volatility calculation"
      calculation: "parkinson"  # parkinson, garman_klass, rogers_satchell
      
    ewma_volatility:
      enabled: true
      description: "EWMA volatility"
      lambda: 0.94
      
    garch_volatility:
      enabled: true
      description: "GARCH volatility"
      model: "garch"  # garch, egarch, igarch
      order: [1, 1]

# ============================================================
# VOLATILITY CALCULATION METHODS
# ============================================================
volatility_methods:
  # Historical Volatility
  historical:
    enabled: true
    calculation: "standard_deviation"  # standard_deviation, mean_absolute_deviation, range
    use_log_returns: true
    remove_outliers: true
    outlier_threshold: 3.0  # standard deviations
    annualization_factor: 252
    
  # Implied Volatility
  implied:
    enabled: true
    model: "black_scholes"  # black_scholes, binomial, monte_carlo
    use_iv_rank: true
    use_iv_percentile: true
    iv_rank_lookback: 252
    iv_rank_percentiles: [10, 25, 50, 75, 90]
    
  # Realized Volatility
  realized:
    enabled: true
    calculation: "parkinson"  # parkinson, garman_klass, rogers_satchell, yang_zhang
    use_high_low: true
    use_open_close: true
    use_overnight: false
    
  # EWMA Volatility
  ewma:
    enabled: true
    lambda: 0.94
    initial_volatility: 0.20
    min_periods: 10
    
  # GARCH Volatility
  garch:
    enabled: true
    model: "garch"  # garch, egarch, igarch, gjr
    order: [1, 1]  # p, q
    distribution: "normal"  # normal, t, ged
    max_iterations: 1000
    tolerance: 1e-6

# ============================================================
# VOLATILITY REGIMES
# ============================================================
volatility_regimes:
  # Regime Definitions
  regimes:
    extremely_low:
      threshold: 0.05
      description: "Extremely Low Volatility"
      color: "#00FF00"
      risk_multiplier: 0.5
      
    very_low:
      threshold: 0.08
      description: "Very Low Volatility"
      color: "#33CC33"
      risk_multiplier: 0.7
      
    low:
      threshold: 0.12
      description: "Low Volatility"
      color: "#66CC66"
      risk_multiplier: 0.8
      
    normal:
      threshold: 0.20
      description: "Normal Volatility"
      color: "#FFCC00"
      risk_multiplier: 1.0
      
    high:
      threshold: 0.30
      description: "High Volatility"
      color: "#FF6600"
      risk_multiplier: 1.3
      
    very_high:
      threshold: 0.40
      description: "Very High Volatility"
      color: "#FF3300"
      risk_multiplier: 1.6
      
    extremely_high:
      threshold: 0.50
      description: "Extremely High Volatility"
      color: "#FF0000"
      risk_multiplier: 2.0
      
  # Regime Detection
  detection:
    method: "threshold"  # threshold, clustering, hmm
    lookback_period: 60
    min_duration: 5
    use_volatility_of_volatility: true
    
  # Regime Transitions
  transitions:
    enabled: true
    transition_probability: 0.05
    smooth_transitions: true
    transition_window: 5

# ============================================================
# VOLATILITY FORECASTING
# ============================================================
volatility_forecasting:
  # Forecasting Settings
  settings:
    enabled: true
    forecast_horizon: 10  # days
    confidence_interval: 0.95
    forecast_method: "ensemble"  # ensemble, garch, ewma, historical
    
  # Forecast Methods
  methods:
    historical_forecast:
      enabled: true
      lookback: 30
      weighting: "equal"  # equal, exponential, volatility_weighted
      
    ewma_forecast:
      enabled: true
      lambda: 0.94
      min_periods: 20
      
    garch_forecast:
      enabled: true
      model: "garch"
      order: [1, 1]
      forecast_horizon: 10
      
    model_ensemble:
      enabled: true
      models:
        - "historical"
        - "ewma"
        - "garch"
      weighting: "dynamic"  # dynamic, equal, performance_based
      performance_lookback: 30
      
  # Forecast Accuracy
  accuracy:
    enabled: true
    tracking: true
    metrics:
      - "mae"  # Mean Absolute Error
      - "mse"  # Mean Squared Error
      - "rmse"  # Root Mean Squared Error
      - "mape"  # Mean Absolute Percentage Error

# ============================================================
# VOLATILITY LIMITS
# ============================================================
volatility_limits:
  # General Volatility Limits
  general:
    max_volatility: 0.50  # 50%
    min_volatility: 0.02  # 2%
    volatility_change_threshold: 0.10  # 10% change
    volatility_spike_threshold: 0.20  # 20% spike
    
  # Volatility Limits by Asset Class
  asset_class:
    cryptocurrency:
      max_volatility: 0.60
      min_volatility: 0.05
      volatility_change_threshold: 0.15
      
    forex:
      max_volatility: 0.15
      min_volatility: 0.01
      volatility_change_threshold: 0.05
      
    equity:
      max_volatility: 0.30
      min_volatility: 0.02
      volatility_change_threshold: 0.08
      
    commodity:
      max_volatility: 0.40
      min_volatility: 0.03
      volatility_change_threshold: 0.10
      
  # Volatility Alert Thresholds
  alerts:
    volatility_change: 0.10  # 10% change
    volatility_spike: 0.20  # 20% spike
    volatility_regime_change: 0.05  # 5% regime change

# ============================================================
# VOLATILITY MONITORING
# ============================================================
volatility_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "realtime"
    alert_threshold: 0.75  # 75% of limit
    critical_threshold: 0.90  # 90% of limit
    reporting_frequency: "daily"
    
  # Alert Conditions
  alerts:
    volatility_spike_alert:
      enabled: true
      level: "warning"
      threshold: 0.20
      message: "Volatility spike detected: {volatility}%"
      
    volatility_regime_change:
      enabled: true
      level: "info"
      message: "Volatility regime changed: {old} -> {new}"
      
    volatility_forecast_alert:
      enabled: true
      level: "warning"
      threshold: 0.10
      message: "Volatility forecast deviation: {deviation}%"
      
    volatility_limit_breach:
      enabled: true
      level: "critical"
      message: "Volatility limit breached: {volatility}%"
      
  # Monitoring Metrics
  metrics:
    - "current_volatility"
    - "historical_volatility"
    - "implied_volatility"
    - "realized_volatility"
    - "volatility_regime"
    - "volatility_forecast"
    - "volatility_skew"
    - "volatility_of_volatility"

# ============================================================
# VOLATILITY REPORTING
# ============================================================
volatility_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "daily"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    include_recommendations: true
    
  # Report Sections
  sections:
    volatility_summary:
      enabled: true
      include_current_volatility: true
      include_historical_volatility: true
      include_implied_volatility: true
      include_volatility_regime: true
      
    volatility_breakdown:
      enabled: true
      include_by_asset: true
      include_by_asset_class: true
      include_by_strategy: true
      
    volatility_forecast:
      enabled: true
      include_forecast_values: true
      include_confidence_intervals: true
      include_accuracy_metrics: true
      
    volatility_risk:
      enabled: true
      include_volatility_risk: true
      include_vega_risk: true
      include_volatility_spike_risk: true
      
    recommendations:
      enabled: true
      include_hedging_suggestions: true
      include_position_adjustments: true
      include_risk_management: true

# ============================================================
# VOLATILITY DASHBOARD
# ============================================================
volatility_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 5
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    volatility_summary:
      enabled: true
      position: 1
      size: "large"
      
    volatility_chart:
      enabled: true
      position: 2
      size: "large"
      
    volatility_regime:
      enabled: true
      position: 3
      size: "medium"
      
    volatility_forecast:
      enabled: true
      position: 4
      size: "medium"
      
    volatility_surface:
      enabled: true
      position: 5
      size: "large"
      
    volatility_skew:
      enabled: true
      position: 6
      size: "medium"
      
    alert_status:
      enabled: true
      position: 7
      size: "small"

# ============================================================
# VOLATILITY INTEGRATION
# ============================================================
volatility_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "api"  # api, webhook, websocket, file
    
  # External Systems
  systems:
    risk_system:
      enabled: true
      endpoint: "/api/risk/volatility"
      update_frequency: "realtime"
      
    trading_system:
      enabled: true
      endpoint: "/api/trading/volatility"
      update_frequency: "realtime"
      
    portfolio_system:
      enabled: true
      endpoint: "/api/portfolio/volatility"
      update_frequency: "realtime"
      
    analytics_system:
      enabled: true
      endpoint: "/api/analytics/volatility"
      update_frequency: "daily"

# ============================================================
# VOLATILITY SCENARIOS
# ============================================================
volatility_scenarios:
  # Scenario 1: Low Volatility
  low_volatility:
    description: "Low volatility environment"
    volatility: 0.10
    regime: "low"
    risk_multiplier: 0.7
    hedge_effectiveness: 0.5
    position_sizing: "normal"
    
  # Scenario 2: Normal Volatility
  normal_volatility:
    description: "Normal volatility environment"
    volatility: 0.20
    regime: "normal"
    risk_multiplier: 1.0
    hedge_effectiveness: 0.7
    position_sizing: "normal"
    
  # Scenario 3: High Volatility
  high_volatility:
    description: "High volatility environment"
    volatility: 0.35
    regime: "high"
    risk_multiplier: 1.5
    hedge_effectiveness: 0.9
    position_sizing: "reduced"
    
  # Scenario 4: Extreme Volatility
  extreme_volatility:
    description: "Extreme volatility environment"
    volatility: 0.50
    regime: "extremely_high"
    risk_multiplier: 2.0
    hedge_effectiveness: 0.95
    position_sizing: "minimal"

# ============================================================
# VOLATILITY EXAMPLES
# ============================================================
volatility_examples:
  # Example 1: Historical Volatility Calculation
  historical_volatility_example:
    description: "Historical Volatility Calculation"
    returns: [0.01, -0.02, 0.015, -0.01, 0.02, -0.015, 0.01, -0.005]
    mean_return: 0.000625
    std_dev: 0.0144
    annualized_volatility: 0.229  # 22.9%
    
  # Example 2: Implied Volatility Calculation
  implied_volatility_example:
    description: "Implied Volatility Calculation"
    option_price: 3.50
    underlying_price: 100
    strike_price: 100
    time_to_expiry: 30  # days
    risk_free_rate: 0.04
    implied_volatility: 0.22  # 22%
    
  # Example 3: Volatility Regime Detection
  volatility_regime_example:
    description: "Volatility Regime Detection"
    current_volatility: 0.25
    previous_volatility: 0.18
    regime_change: 0.07  # 7% increase
    new_regime: "high"
    risk_multiplier: 1.3

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    volatility:
      general:
        enabled: true
        calculation_method: "historical"
        lookback_period: 30
        update_frequency: "hourly"
        
    volatility_monitoring:
      alerts:
        volatility_spike_alert:
          enabled: false
        volatility_regime_change:
          enabled: false
        volatility_forecast_alert:
          enabled: false
          
  # Staging Environment
  staging:
    volatility:
      general:
        enabled: true
        calculation_method: "historical"
        lookback_period: 30
        update_frequency: "realtime"
        
    volatility_monitoring:
      alerts:
        volatility_spike_alert:
          enabled: true
        volatility_regime_change:
          enabled: true
        volatility_forecast_alert:
          enabled: true
          
  # Production Environment
  production:
    volatility:
      general:
        enabled: true
        calculation_method: "historical"
        lookback_period: 30
        update_frequency: "realtime"
        use_volatility_forecast: true
        use_volatility_surface: true
        use_volatility_regimes: true
        use_volatility_skew: true
        
    volatility_monitoring:
      alerts:
        volatility_spike_alert:
          enabled: true
          level: "warning"
        volatility_regime_change:
          enabled: true
          level: "info"
        volatility_forecast_alert:
          enabled: true
          level: "warning"
        volatility_limit_breach:
          enabled: true
          level: "critical"
          
  # Demo Environment
  demo:
    volatility:
      general:
        enabled: true
        calculation_method: "historical"
        lookback_period: 30
        update_frequency: "hourly"
        
    volatility_monitoring:
      alerts:
        volatility_spike_alert:
          enabled: true
        volatility_regime_change:
          enabled: false
        volatility_forecast_alert:
          enabled: false

# ============================================================
# END OF CONFIGURATION
# ============================================================
