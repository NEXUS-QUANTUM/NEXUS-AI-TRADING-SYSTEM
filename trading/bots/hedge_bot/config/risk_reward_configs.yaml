# ============================================================
# RISK/REWARD ADJUSTMENTS
# ============================================================
risk_reward_adjustments:
  # Market Regime Adjustments
  market_regime:
    bull_market:
      ratio_multiplier: 1.2
      description: "Higher risk/reward in bull markets"
      
    bear_market:
      ratio_multiplier: 0.8
      description: "Lower risk/reward in bear markets"
      
    sideways_market:
      ratio_multiplier: 1.0
      description: "Neutral risk/reward in sideways markets"
      
    high_volatility:
      ratio_multiplier: 1.3
      description: "Higher risk/reward in high volatility"
      
    low_volatility:
      ratio_multiplier: 0.8
      description: "Lower risk/reward in low volatility"
      
  # Strategy Adjustments
  strategy:
    trend_following:
      ratio_multiplier: 1.2
      target_ratio: 2.5
      
    mean_reversion:
      ratio_multiplier: 0.8
      target_ratio: 1.5
      
    scalping:
      ratio_multiplier: 0.5
      target_ratio: 1.0
      
    swing_trading:
      ratio_multiplier: 1.0
      target_ratio: 2.0
      
  # Risk Profile Adjustments
  risk_profile:
    conservative:
      ratio_multiplier: 0.7
      target_ratio: 1.5
      
    moderate:
      ratio_multiplier: 1.0
      target_ratio: 2.0
      
    aggressive:
      ratio_multiplier: 1.3
      target_ratio: 2.5

# ============================================================
# RISK/REWARD MONITORING
# ============================================================
risk_reward_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "realtime"
    alert_threshold: 0.75  # 75% of target
    critical_threshold: 0.60  # 60% of target
    reporting_frequency: "daily"
    
  # Alert Conditions
  alerts:
    ratio_below_min:
      enabled: true
      level: "warning"
      threshold: 1.5
      message: "Risk/reward ratio below minimum: {ratio}"
      
    ratio_approaching_min:
      enabled: true
      level: "info"
      threshold: 1.8
      message: "Risk/reward ratio approaching minimum: {ratio}"
      
    ratio_above_max:
      enabled: true
      level: "warning"
      threshold: 4.0
      message: "Risk/reward ratio above maximum: {ratio}"
      
    ratio_adjustment:
      enabled: true
      level: "info"
      message: "Risk/reward ratio adjusted: {old} -> {new}"
      
  # Monitoring Metrics
  metrics:
    - "current_ratio"
    - "min_ratio"
    - "target_ratio"
    - "max_ratio"
    - "ratio_deviation"
    - "ratio_utilization"
    - "adjustments_count"

# ============================================================
# RISK/REWARD REPORTING
# ============================================================
risk_reward_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "daily"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    include_recommendations: true
    
  # Report Sections
  sections:
    ratio_summary:
      enabled: true
      include_current_ratios: true
      include_target_ratios: true
      include_deviation: true
      
    asset_ratios:
      enabled: true
      include_by_asset_class: true
      include_by_asset: true
      include_comparison: true
      
    adjustment_analysis:
      enabled: true
      include_adjustment_count: true
      include_adjustment_reasons: true
      include_adjustment_impact: true
      
    recommendations:
      enabled: true
      include_ratio_optimization: true
      include_risk_management: true
      include_reward_optimization: true

# ============================================================
# RISK/REWARD DASHBOARD
# ============================================================
risk_reward_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 5
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    ratio_summary:
      enabled: true
      position: 1
      size: "large"
      
    ratio_chart:
      enabled: true
      position: 2
      size: "large"
      
    asset_ratios:
      enabled: true
      position: 3
      size: "medium"
      
    adjustment_analysis:
      enabled: true
      position: 4
      size: "medium"
      
    alert_status:
      enabled: true
      position: 5
      size: "small"

# ============================================================
# RISK/REWARD SCENARIOS
# ============================================================
risk_reward_scenarios:
  # Scenario 1: Conservative
  conservative:
    description: "Conservative risk/reward"
    ratio: 1.5
    risk: 0.02  # 2%
    reward: 0.03  # 3%
    win_rate_required: 0.40
    
  # Scenario 2: Moderate
  moderate:
    description: "Moderate risk/reward"
    ratio: 2.0
    risk: 0.02  # 2%
    reward: 0.04  # 4%
    win_rate_required: 0.33
    
  # Scenario 3: Aggressive
  aggressive:
    description: "Aggressive risk/reward"
    ratio: 3.0
    risk: 0.02  # 2%
    reward: 0.06  # 6%
    win_rate_required: 0.25
    
  # Scenario 4: Extreme
  extreme:
    description: "Extreme risk/reward"
    ratio: 4.0
    risk: 0.02  # 2%
    reward: 0.08  # 8%
    win_rate_required: 0.20

# ============================================================
# RISK/REWARD EXAMPLES
# ============================================================
risk_reward_examples:
  # Example 1: Ratio Calculation
  ratio_calculation:
    description: "Risk/Reward Ratio Calculation"
    entry_price: 100
    stop_loss: 97  # 3% risk
    take_profit: 106  # 6% reward
    risk: 3
    reward: 6
    ratio: 2.0  # 6/3 = 2.0
    
  # Example 2: Win Rate Required
  win_rate_required:
    description: "Win Rate Required for Ratio"
    ratio: 2.0
    win_rate_required: 0.333  # 33.3%
    loss_rate: 0.667
    expected_value: 0  # Breakeven
    
    # Calculation: EV = (win_rate * reward) - (loss_rate * risk)
    # 0 = (0.333 * 2) - (0.667 * 1)
    # 0 = 0.666 - 0.667 ≈ 0
    
  # Example 3: Expected Value
  expected_value:
    description: "Expected Value Calculation"
    win_rate: 0.50
    reward: 2.0
    loss_rate: 0.50
    risk: 1.0
    expected_value: 0.50  # (0.5 * 2) - (0.5 * 1) = 0.5
    expected_return: 50%  # Positive expectancy

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    risk_reward:
      general:
        enabled: true
        min_risk_reward_ratio: 1.0
        target_risk_reward_ratio: 1.5
        update_frequency: "hourly"
        
    risk_reward_monitoring:
      alerts:
        ratio_below_min:
          enabled: false
        ratio_approaching_min:
          enabled: false
          
  # Staging Environment
  staging:
    risk_reward:
      general:
        enabled: true
        min_risk_reward_ratio: 1.5
        target_risk_reward_ratio: 2.0
        update_frequency: "realtime"
        
    risk_reward_monitoring:
      alerts:
        ratio_below_min:
          enabled: true
        ratio_approaching_min:
          enabled: true
        ratio_above_max:
          enabled: true
          
  # Production Environment
  production:
    risk_reward:
      general:
        enabled: true
        min_risk_reward_ratio: 1.5
        target_risk_reward_ratio: 2.0
        max_risk_reward_ratio: 4.0
        calculation_method: "dynamic"
        use_volatility_adjustment: true
        use_market_regime_adjustment: true
        use_asset_specific_ratios: true
        
    risk_reward_monitoring:
      alerts:
        ratio_below_min:
          enabled: true
          level: "warning"
        ratio_approaching_min:
          enabled: true
          level: "info"
        ratio_above_max:
          enabled: true
          level: "warning"
        ratio_adjustment:
          enabled: true
          level: "info"
          
  # Demo Environment
  demo:
    risk_reward:
      general:
        enabled: true
        min_risk_reward_ratio: 1.5
        target_risk_reward_ratio: 2.0
        update_frequency: "hourly"
        
    risk_reward_monitoring:
      alerts:
        ratio_below_min:
          enabled: true
        ratio_approaching_min:
          enabled: false

# ============================================================
# END OF CONFIGURATION
# ============================================================
