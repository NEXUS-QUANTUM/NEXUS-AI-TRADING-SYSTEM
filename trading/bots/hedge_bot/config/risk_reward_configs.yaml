# ============================================================
# RISK/REWARD GENERAL SETTINGS
# ============================================================
risk_reward:
  # General Risk/Reward Settings
  general:
    enabled: true
    min_risk_reward_ratio: 1.5  # Minimum acceptable ratio
    target_risk_reward_ratio: 2.0  # Target ratio
    max_risk_reward_ratio: 4.0  # Maximum ratio
    default_risk_reward_ratio: 2.0  # Default fallback
    calculation_method: "dynamic"  # dynamic, fixed, adaptive
    use_volatility_adjustment: true
    use_market_regime_adjustment: true
    use_asset_specific_ratios: true
    update_frequency: "realtime"
    
  # Ratio Types
  types:
    fixed_ratio:
      enabled: true
      description: "Fixed risk/reward ratio"
      ratio: 2.0
      
    dynamic_ratio:
      enabled: true
      description: "Dynamic ratio based on market conditions"
      min_ratio: 1.5
      max_ratio: 4.0
      
    adaptive_ratio:
      enabled: true
      description: "Adaptive ratio learning from historical performance"
      learning_rate: 0.1
      
    asset_specific_ratio:
      enabled: true
      description: "Asset-specific risk/reward ratios"
      
    volatility_adjusted_ratio:
      enabled: true
      description: "Volatility-adjusted risk/reward ratio"
      volatility_multiplier: 0.5

# ============================================================
