# ============================================================
# TAX GENERAL SETTINGS
# ============================================================
tax:
  # General Tax Settings
  general:
    enabled: false  # Tax calculation disabled by default
    tax_calculation: "automatic"  # automatic, manual
    tax_jurisdiction: "none"  # none, us, uk, eu, singapore, offshore
    tax_year_start: "2026-01-01"
    tax_year_end: "2026-12-31"
    use_tax_lot_accounting: true
    tax_reporting: false
    tax_withholding: false
    tax_optimization: false
    
  # Tax Types
  types:
    capital_gains_tax:
      enabled: false
      rate: 0.20
      description: "Tax on capital gains"
      
    short_term_capital_gains:
      enabled: false
      rate: 0.30
      description: "Tax on short-term capital gains (< 1 year)"
      
    long_term_capital_gains:
      enabled: false
      rate: 0.15
      description: "Tax on long-term capital gains (> 1 year)"
      
    dividend_tax:
      enabled: false
      rate: 0.15
      description: "Tax on dividends"
      
    withholding_tax:
      enabled: false
      rate: 0.30
      description: "Withholding tax"
      
    transaction_tax:
      enabled: false
      rate: 0.001
      description: "Transaction tax"

# ============================================================
# TAX JURISDICTIONS
# ============================================================
tax_jurisdictions:
  # United States
  us:
    name: "United States"
    currency: "USD"
    capital_gains_rate: 0.20
    short_term_rate: 0.30
    long_term_rate: 0.15
    dividend_rate: 0.15
    withholding_rate: 0.30
    tax_year: "calendar"
    reporting_frequency: "annual"
    reporting_deadline: "2027-04-15"
    tax_forms:
      - "Form 1099"
      - "Form 8949"
      - "Schedule D"
    
  # United Kingdom
  uk:
    name: "United Kingdom"
    currency: "GBP"
    capital_gains_rate: 0.20
    short_term_rate: 0.20
    long_term_rate: 0.10
    dividend_rate: 0.10
    withholding_rate: 0.20
    tax_year: "april_april"
    reporting_frequency: "annual"
    reporting_deadline: "2027-01-31"
    tax_forms:
      - "Self Assessment"
      - "Capital Gains Tax Summary"
    
  # European Union
  eu:
    name: "European Union"
    currency: "EUR"
    capital_gains_rate: 0.25
    short_term_rate: 0.30
    long_term_rate: 0.15
    dividend_rate: 0.15
    withholding_rate: 0.25
    tax_year: "calendar"
    reporting_frequency: "annual"
    reporting_deadline: "2027-05-31"
    
  # Singapore
  singapore:
    name: "Singapore"
    currency: "SGD"
    capital_gains_rate: 0.00
    short_term_rate: 0.00
    long_term_rate: 0.00
    dividend_rate: 0.00
    withholding_rate: 0.15
    tax_year: "calendar"
    reporting_frequency: "annual"
    reporting_deadline: "2027-04-15"
    
  # Offshore
  offshore:
    name: "Offshore"
    currency: "USD"
    capital_gains_rate: 0.00
    short_term_rate: 0.00
    long_term_rate: 0.00
    dividend_rate: 0.00
    withholding_rate: 0.00
    tax_year: "calendar"
    reporting_frequency: "none"
    reporting_deadline: "none"

# ============================================================
# TAX CALCULATION METHODS
# ============================================================
tax_calculation:
  # Calculation Settings
  settings:
    enabled: false
    calculation_method: "fifo"  # fifo, lifo, average_cost, specific_identification
    include_commissions: true
    include_fees: true
    include_slippage: true
    include_financing_costs: true
    include_operational_costs: false
    
  # Methods
  methods:
    fifo:
      enabled: true
      description: "First In, First Out method"
      calculation: "oldest_trades_first"
      
    lifo:
      enabled: true
      description: "Last In, First Out method"
      calculation: "newest_trades_first"
      
    average_cost:
      enabled: true
      description: "Average cost method"
      calculation: "weighted_average_cost"
      
    specific_identification:
      enabled: true
      description: "Specific identification method"
      calculation: "manual_selection"
      
  # Tax Loss Harvesting
  tax_loss_harvesting:
    enabled: false
    strategy: "systematic"  # systematic, opportunistic, manual
    lookback_period: 30  # days
    wash_sale_avoidance: true
    wash_sale_period: 30  # days

# ============================================================
# TAX REPORTING
# ============================================================
tax_reporting:
  # Report Settings
  settings:
    enabled: false
    report_frequency: "annual"
    report_format: "json"  # json, csv, pdf, excel
    include_analytics: true
    include_visualizations: true
    include_recommendations: true
    
  # Report Types
  types:
    capital_gains_report:
      enabled: true
      include_short_term: true
      include_long_term: true
      include_unrealized: true
      include_realized: true
      
    dividend_report:
      enabled: true
      include_dividends_received: true
      include_withholding_tax: true
      
    transaction_report:
      enabled: true
      include_all_transactions: true
      include_cost_basis: true
      include_proceeds: true
      include_gain_loss: true
      
    tax_summary_report:
      enabled: true
      include_total_tax_liability: true
      include_payments_made: true
      include_credits: true
      include_balance_due: true
      
  # Report Distribution
  distribution:
    enabled: false
    recipients:
      - "tax@nexusquantum.com"
      - "accounting@nexusquantum.com"
    format: "pdf"
    auto_send: false

# ============================================================
# TAX OPTIMIZATION
# ============================================================
tax_optimization:
  # Optimization Settings
  settings:
    enabled: false
    optimization_method: "systematic"  # systematic, opportunistic, adaptive
    optimization_priority: "tax_efficiency"  # tax_efficiency, return_maximization, balanced
    wash_sale_avoidance: true
    wash_sale_period: 30  # days
    min_hold_period: 30  # days
    max_hold_period: 365  # days
    
  # Optimization Strategies
  strategies:
    harvest_losses:
      enabled: false
      description: "Harvest losses to offset gains"
      loss_threshold: 0.05  # 5% loss
      target_loss: 0.10  # 10% target
      
    defer_gains:
      enabled: false
      description: "Defer gains to future tax years"
      gain_threshold: 0.10  # 10% gain
      max_defer_period: 365  # days
      
    maximize_holding:
      enabled: false
      description: "Maximize holding period for long-term rates"
      target_holding: 365  # days
      long_term_threshold: 365  # days
      
  # Optimization Metrics
  metrics:
    - "tax_efficiency"
    - "after_tax_return"
    - "tax_savings"
    - "wash_sale_avoided"
    - "loss_harvested"

# ============================================================
# TAX MONITORING
# ============================================================
tax_monitoring:
  # Monitoring Settings
  settings:
    enabled: false
    monitoring_frequency: "monthly"
    alert_threshold: 0.75  # 75% of tax liability
    critical_threshold: 0.90  # 90% of tax liability
    reporting_frequency: "monthly"
    
  # Alert Conditions
  alerts:
    tax_liability_alert:
      enabled: false
      level: "warning"
      threshold: 0.80
      message: "Tax liability approaching: {liability}%"
      
    tax_deadline_alert:
      enabled: false
      level: "warning"
      threshold: 30  # days
      message: "Tax deadline approaching in {days} days"
      
    wash_sale_alert:
      enabled: false
      level: "warning"
      message: "Wash sale detected for {asset}"
      
    tax_optimization_alert:
      enabled: false
      level: "info"
      message: "Tax optimization opportunity available"
      
  # Monitoring Metrics
  metrics:
    - "tax_liability"
    - "tax_payments"
    - "tax_credits"
    - "tax_balance"
    - "tax_efficiency"
    - "after_tax_return"

# ============================================================
# TAX DASHBOARD
# ============================================================
tax_dashboard:
  # Dashboard Settings
  settings:
    enabled: false
    refresh_interval: 3600
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    tax_summary:
      enabled: true
      position: 1
      size: "large"
      
    tax_liability_chart:
      enabled: true
      position: 2
      size: "large"
      
    capital_gains:
      enabled: true
      position: 3
      size: "medium"
      
    optimization_status:
      enabled: true
      position: 4
      size: "medium"
      
    alert_status:
      enabled: true
      position: 5
      size: "small"

# ============================================================
# TAX SCENARIOS
# ============================================================
tax_scenarios:
  # Scenario 1: Capital Gains
  capital_gains_scenario:
    description: "Capital gains tax scenario"
    purchase_price: 50000
    sale_price: 60000
    gain: 10000
    holding_period: 180  # days
    tax_rate: 0.20
    tax_liability: 2000
    after_tax_profit: 8000
    
  # Scenario 2: Tax Loss Harvesting
  tax_loss_harvesting_scenario:
    description: "Tax loss harvesting scenario"
    loss_position: -5000
    gain_position: 8000
    net_gain: 3000
    harvested_loss: 5000
    tax_saved: 1000  # 5000 * 0.20
    
  # Scenario 3: Long-Term vs Short-Term
  long_short_term_comparison:
    description: "Long-term vs short-term capital gains"
    gain: 10000
    short_term_rate: 0.30
    long_term_rate: 0.15
    short_term_tax: 3000
    long_term_tax: 1500
    tax_savings: 1500  # Long-term savings

# ============================================================
# TAX EXAMPLES
# ============================================================
tax_examples:
  # Example 1: Tax Calculation
  tax_calculation_example:
    description: "Tax Calculation Example"
    positions:
      - asset: "BTC"
        purchase_price: 40000
        sale_price: 50000
        quantity: 1.0
        gain: 10000
        holding_period: 200  # days
        tax_rate: 0.20
        tax_liability: 2000
      - asset: "ETH"
        purchase_price: 2500
        sale_price: 3000
        quantity: 10.0
        gain: 5000
        holding_period: 150  # days
        tax_rate: 0.20
        tax_liability: 1000
    total_gain: 15000
    total_tax_liability: 3000
    
  # Example 2: FIFO Cost Basis
  fifo_example:
    description: "FIFO Cost Basis Example"
    purchases:
      - date: "2026-01-15"
        quantity: 1.0
        price: 40000
        cost: 40000
      - date: "2026-02-15"
        quantity: 1.0
        price: 45000
        cost: 45000
    sale:
      date: "2026-07-15"
      quantity: 1.5
      price: 50000
      proceeds: 75000
    cost_basis: 62500  # 1.0 * 40000 + 0.5 * 45000
    gain: 12500  # 75000 - 62500
    
  # Example 3: Tax Optimization
  tax_optimization_example:
    description: "Tax Optimization Example"
    current_year_gains: 15000
    current_year_losses: -5000
    net_gain: 10000
    tax_rate: 0.20
    current_tax_liability: 2000
    
    # Optimize: Harvest additional losses
    additional_losses: -3000
    optimized_net_gain: 7000
    optimized_tax_liability: 1400
    tax_savings: 600

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    tax:
      general:
        enabled: false
        tax_calculation: "manual"
        tax_jurisdiction: "none"
        tax_reporting: false
        
    tax_calculation:
      settings:
        enabled: false
        
  # Staging Environment
  staging:
    tax:
      general:
        enabled: true
        tax_calculation: "automatic"
        tax_jurisdiction: "us"
        tax_reporting: true
        use_tax_lot_accounting: true
        
    tax_calculation:
      settings:
        enabled: true
        calculation_method: "fifo"
        include_commissions: true
        include_fees: true
        
    tax_reporting:
      settings:
        enabled: true
        report_frequency: "monthly"
        report_format: "json"
        
  # Production Environment
  production:
    tax:
      general:
        enabled: false  # Disabled by default in production
        tax_calculation: "automatic"
        tax_jurisdiction: "offshore"  # Offshore jurisdiction
        tax_reporting: false
        use_tax_lot_accounting: true
        tax_optimization: false
        
    tax_calculation:
      settings:
        enabled: false
        calculation_method: "fifo"
        include_commissions: true
        include_fees: true
        include_slippage: true
        
    tax_reporting:
      settings:
        enabled: false
        
    tax_optimization:
      settings:
        enabled: false
        
  # Demo Environment
  demo:
    tax:
      general:
        enabled: false
        tax_calculation: "manual"
        tax_jurisdiction: "none"
        tax_reporting: false
        
    tax_calculation:
      settings:
        enabled: false

# ============================================================
# END OF CONFIGURATION
# ============================================================
