# ============================================================
# CORRELATION THRESHOLDS
# ============================================================
correlation_thresholds:
  # General Thresholds
  general:
    very_high: 0.85
    high: 0.70
    moderate: 0.40
    low: 0.20
    very_low: 0.10
    negative: -0.20
    
  # Thresholds by Asset Class
  asset_class:
    cryptocurrency:
      very_high: 0.80
      high: 0.65
      moderate: 0.40
      low: 0.20
      
    forex:
      very_high: 0.85
      high: 0.70
      moderate: 0.40
      low: 0.20
      
    equity:
      very_high: 0.80
      high: 0.65
      moderate: 0.40
      low: 0.20
      
    commodity:
      very_high: 0.75
      high: 0.60
      moderate: 0.35
      low: 0.15
      
  # Decision Thresholds
  decision:
    diversification_threshold: 0.30
    hedging_threshold: 0.50
    concentration_threshold: 0.70
    risk_threshold: 0.60

# ============================================================
# CORRELATION REGIMES
# ============================================================
correlation_regimes:
  # Regime Definitions
  regimes:
    high_correlation:
      threshold: 0.70
      description: "High correlation regime"
      risk_multiplier: 1.5
      diversification_effect: 0.3
      
    normal_correlation:
      threshold: 0.40
      description: "Normal correlation regime"
      risk_multiplier: 1.0
      diversification_effect: 0.5
      
    low_correlation:
      threshold: 0.20
      description: "Low correlation regime"
      risk_multiplier: 0.7
      diversification_effect: 0.8
      
    negative_correlation:
      threshold: -0.20
      description: "Negative correlation regime"
      risk_multiplier: 0.5
      diversification_effect: 1.0
      
  # Regime Detection
  detection:
    method: "rolling_window"
    window: 30
    min_duration: 5
    transition_smoothing: true
    
  # Regime Transitions
  transitions:
    probability: 0.05
    smooth_transitions: true
    transition_window: 10

# ============================================================
# DYNAMIC CORRELATION
# ============================================================
dynamic_correlation:
  # DCC Model
  dcc:
    enabled: true
    model: "dcc"  # dcc, adcc, garch_dcc
    dcc_lag: 1
    garch_order: [1, 1]
    distribution: "normal"  # normal, t, ged
    forecast_horizon: 10
    max_iterations: 1000
    tolerance: 1e-6
    
  # EWMA Model
  ewma:
    enabled: true
    lambda: 0.94  # decay factor
    min_periods: 30
    use_correlation_ewma: true
    
  # Rolling Window
  rolling:
    enabled: true
    window: 60
    min_periods: 30
    step: 1
    
  # Forecast
  forecast:
    enabled: true
    horizon: 10
    confidence_interval: 0.95
    method: "monte_carlo"  # monte_carlo, bootstrap, analytical

# ============================================================
# CORRELATION-BASED RISK
# ============================================================
correlation_risk:
  # Risk Settings
  settings:
    enabled: true
    risk_factor_models:
      - "var_contribution"
      - "cvar_contribution"
      - "risk_parity"
      - "marginal_risk"
      
  # Risk Metrics
  metrics:
    correlation_risk:
      enabled: true
      calculation: "weighted"
      use_dynamic_weights: true
      
    diversification_ratio:
      enabled: true
      calculation: "risk_weighted"
      target_ratio: 1.5
      
    correlation_breakdown:
      enabled: true
      by_asset_class: true
      by_sector: true
      
  # Risk Limits
  limits:
    max_correlation_risk: 0.20
    target_correlation_risk: 0.10
    max_diversification_ratio: 2.0
    min_diversification_ratio: 1.0

# ============================================================
# CORRELATION MONITORING
# ============================================================
correlation_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "realtime"  # realtime, hourly, daily
    alert_threshold: 0.30  # 30% change
    critical_threshold: 0.50  # 50% change
    reporting_frequency: "daily"
    
  # Alert Conditions
  alerts:
    correlation_change_alert:
      enabled: true
      level: "warning"
      threshold: 0.30
      message: "Significant correlation change in {asset_pair}"
      
    correlation_break_alert:
      enabled: true
      level: "critical"
      threshold: 0.50
      message: "Correlation break detected in {asset_pair}"
      
    regime_change_alert:
      enabled: true
      level: "warning"
      threshold: 0.20
      message: "Correlation regime change detected"
      
    diversification_alert:
      enabled: true
      level: "warning"
      threshold: 0.30
      message: "Diversification score below threshold"
      
  # Monitoring Metrics
  metrics:
    - "current_correlation"
    - "correlation_change"
    - "correlation_regime"
    - "diversification_score"
    - "correlation_risk"
    - "diversification_ratio"
    - "correlation_breakdown"

# ============================================================
# CORRELATION REPORTING
# ============================================================
correlation_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "weekly"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    include_recommendations: true
    
  # Report Sections
  sections:
    correlation_summary:
      enabled: true
      include_correlation_matrix: true
      include_regime_analysis: true
      
    asset_correlations:
      enabled: true
      include_top_10: true
      include_bottom_10: true
      
    sector_correlations:
      enabled: true
      include_all_sectors: true
      include_correlation_heatmap: true
      
    dynamic_correlation:
      enabled: true
      include_trend_analysis: true
      include_forecast: true
      
    risk_analysis:
      enabled: true
      include_correlation_risk: true
      include_diversification_score: true
      
    recommendations:
      enabled: true
      include_hedging_suggestions: true
      include_diversification_suggestions: true

# ============================================================
# CORRELATION VISUALIZATION
# ============================================================
correlation_visualization:
  # Visualization Settings
  settings:
    enabled: true
    interactive: true
    color_scheme: "coolwarm"  # coolwarm, RdBu, seismic
    threshold_display: 0.30
    
  # Chart Types
  charts:
    heatmap:
      enabled: true
      annotate: true
      show_values: true
      
    dendrogram:
      enabled: true
      clustering_method: "ward"  # ward, complete, average, single
      show_labels: true
      
    network:
      enabled: true
      node_size: "correlation"
      edge_size: "correlation"
      layout: "force"  # force, circular, hierarchical
      
    time_series:
      enabled: true
      show_rolling: true
      show_regimes: true

# ============================================================
# CORRELATION INTEGRATION
# ============================================================
correlation_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "api"  # api, webhook, websocket, file
    
  # External Systems
  systems:
    risk_system:
      enabled: true
      endpoint: "/api/risk/correlation"
      update_frequency: "realtime"
      
    portfolio_system:
      enabled: true
      endpoint: "/api/portfolio/correlation"
      update_frequency: "realtime"
      
    trading_system:
      enabled: true
      endpoint: "/api/trading/correlation"
      update_frequency: "realtime"
      
    analytics_system:
      enabled: true
      endpoint: "/api/analytics/correlation"
      update_frequency: "daily"

# ============================================================
# CORRELATION SCENARIOS
# ============================================================
correlation_scenarios:
  # Scenario 1: Normal Market
  normal_market:
    description: "Normal market conditions"
    correlation_regime: "normal"
    avg_correlation: 0.40
    diversification_effect: 0.50
    
  # Scenario 2: High Correlation
  high_correlation:
    description: "High correlation market"
    correlation_regime: "high"
    avg_correlation: 0.70
    diversification_effect: 0.30
    
  # Scenario 3: Low Correlation
  low_correlation:
    description: "Low correlation market"
    correlation_regime: "low"
    avg_correlation: 0.20
    diversification_effect: 0.80
    
  # Scenario 4: Crisis Mode
  crisis_mode:
    description: "Market crisis"
    correlation_regime: "high"
    avg_correlation: 0.80
    diversification_effect: 0.20

# ============================================================
# CORRELATION EXAMPLES
# ============================================================
correlation_examples:
  # Example 1: Correlation Matrix
  correlation_matrix_example:
    assets: ["BTC", "ETH", "SOL", "ADA", "DOT"]
    matrix:
      - [1.00, 0.75, 0.65, 0.60, 0.55]
      - [0.75, 1.00, 0.70, 0.65, 0.60]
      - [0.65, 0.70, 1.00, 0.75, 0.70]
      - [0.60, 0.65, 0.75, 1.00, 0.70]
      - [0.55, 0.60, 0.70, 0.70, 1.00]
      
  # Example 2: Dynamic Correlation
  dynamic_correlation_example:
    asset_pair: ["BTC", "ETH"]
    correlations:
      - date: "2026-01-01"
        value: 0.75
      - date: "2026-01-15"
        value: 0.72
      - date: "2026-02-01"
        value: 0.80
      - date: "2026-02-15"
        value: 0.68
      - date: "2026-03-01"
        value: 0.85
        
  # Example 3: Correlation Regimes
  correlation_regimes_example:
    periods:
      - start: "2026-01-01"
        end: "2026-02-15"
        regime: "high"
        avg_correlation: 0.75
      - start: "2026-02-16"
        end: "2026-03-15"
        regime: "normal"
        avg_correlation: 0.45
      - start: "2026-03-16"
        end: "2026-04-15"
        regime: "low"
        avg_correlation: 0.25

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    correlation:
      general:
        enabled: true
        calculation_method: "pearson"
        lookback_period: 30
        update_frequency: "hourly"
        
    correlation_monitoring:
      alerts:
        correlation_change_alert:
          enabled: false
        correlation_break_alert:
          enabled: false
          
  # Staging Environment
  staging:
    correlation:
      general:
        enabled: true
        calculation_method: "pearson"
        lookback_period: 60
        update_frequency: "hourly"
        
    correlation_monitoring:
      alerts:
        correlation_change_alert:
          enabled: true
        correlation_break_alert:
          enabled: true
        regime_change_alert:
          enabled: true
          
  # Production Environment
  production:
    correlation:
      general:
        enabled: true
        calculation_method: "pearson"
        lookback_period: 60
        update_frequency: "daily"
        use_log_returns: true
        use_shrinkage: true
        
    correlation_monitoring:
      alerts:
        correlation_change_alert:
          enabled: true
          level: "warning"
        correlation_break_alert:
          enabled: true
          level: "critical"
        regime_change_alert:
          enabled: true
          level: "warning"
        diversification_alert:
          enabled: true
          level: "warning"
          
  # Demo Environment
  demo:
    correlation:
      general:
        enabled: true
        calculation_method: "pearson"
        lookback_period: 30
        update_frequency: "daily"
        
    correlation_monitoring:
      alerts:
        correlation_change_alert:
          enabled: true
        correlation_break_alert:
          enabled: false

# ============================================================
# END OF CONFIGURATION
# ============================================================
