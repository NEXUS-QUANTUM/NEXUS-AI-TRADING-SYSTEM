# ============================================================
# CORRELATION GENERAL SETTINGS
# ============================================================
correlation:
  # General Correlation Settings
  general:
    enabled: true
    calculation_method: "pearson"  # pearson, spearman, kendall, distance
    lookback_period: 60  # days
    min_data_points: 30
    update_frequency: "daily"  # realtime, hourly, daily, weekly
    use_log_returns: true
    remove_outliers: true
    outlier_threshold: 3.0  # standard deviations
    use_shrinkage: true
    shrinkage_method: "ledoit_wolf"  # ledoit_wolf, oracle, constant
    
  # Correlation Types
  types:
    historical_correlation:
      enabled: true
      calculation: "rolling"
      window: 60
      min_periods: 30
      
    dynamic_correlation:
      enabled: true
      model: "dcc"  # dcc, garch_dcc, ewma
      dcc_lag: 1
      garch_order: [1, 1]
      forecast_horizon: 10
      
    partial_correlation:
      enabled: true
      control_variables:
        - "market"
        - "sector"
        - "volatility"
        - "liquidity"
        
    rank_correlation:
      enabled: true
      method: "spearman"
      use_ties: true
      
    distance_correlation:
      enabled: true
      method: "energy"
      use_density: true

# ============================================================
# CORRELATION MATRIX
# ============================================================
correlation_matrix:
  # Matrix Settings
  settings:
    enabled: true
    calculation: "pearson"
    lookback: 60
    min_periods: 30
    use_shrinkage: true
    shrinkage_method: "ledoit_wolf"
    positive_definite: true
    regularization: 0.001
    
  # Matrix Features
  features:
    include_all_assets: true
    include_market_indices: true
    include_sector_indices: true
    include_benchmarks: true
    include_custom_assets: true
    
  # Matrix Storage
  storage:
    format: "numpy"  # numpy, pandas, json, parquet
    compression: true
    backup: true
    retention: 365  # days
    
  # Matrix Updates
  updates:
    frequency: "daily"
    full_recalc: "weekly"
    incremental: true
    
  # Matrix Analysis
  analysis:
    eigenvalue_decomposition: true
    principal_components: true
    factor_analysis: true
    clustering: true

