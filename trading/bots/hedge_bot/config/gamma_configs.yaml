# ============================================================
# GAMMA GENERAL SETTINGS
# ============================================================
gamma:
  # General Gamma Settings
  general:
    enabled: true
    calculation_method: "black_scholes"  # black_scholes, binomial, monte_carlo, finite_difference
    gamma_threshold: 0.0001  # Gamma threshold for alerts
    gamma_tolerance: 0.01  # 1% tolerance
    update_frequency: "realtime"  # realtime, hourly, daily
    use_gamma_scalping: true
    use_gamma_hedging: true
    use_gamma_exposure: true
    use_gamma_risk_management: true
    
  # Gamma Types
  types:
    gamma_hedging:
      enabled: true
      description: "Gamma hedging to manage convexity risk"
      
    gamma_scalping:
      enabled: true
      description: "Gamma scalping to profit from volatility"
      
    gamma_exposure:
      enabled: true
      description: "Gamma exposure measurement and management"
      
    gamma_risk:
      enabled: true
      description: "Gamma risk assessment and mitigation"
      
    gamma_trading:
      enabled: true
      description: "Gamma-based trading strategies"

# ============================================================
# GAMMA CALCULATION METHODS
# ============================================================
gamma_methods:
  # Black-Scholes Gamma
  black_scholes:
    enabled: true
    description: "Black-Scholes gamma calculation"
    formula: "N'(d1) / (S * σ * √T)"
    parameters:
      use_volatility_surface: true
      use_interest_rate_curve: true
      use_dividend_forecast: true
      
  # Binomial Gamma
  binomial:
    enabled: true
    description: "Binomial tree gamma calculation"
    steps: 100
    method: "crr"  # crr, jr, trigeorgis
    american: true
    early_exercise: true
    
  # Finite Difference Gamma
  finite_difference:
    enabled: true
    description: "Finite difference gamma calculation"
    method: "central"  # central, forward, backward
    step_size: 0.001
    accuracy: "high"
    
  # Monte Carlo Gamma
  monte_carlo:
    enabled: true
    description: "Monte Carlo gamma calculation"
    simulations: 10000
    steps: 252
    variance_reduction: true
    antithetic_variates: true

# ============================================================
# GAMMA HEDGING STRATEGIES
# ============================================================
gamma_hedging:
  # Strategy Settings
  settings:
    enabled: true
    strategy_type: "dynamic"  # dynamic, static, adaptive
    rebalancing_frequency: "realtime"  # realtime, hourly, daily
    rebalancing_threshold: 0.01  # 1% deviation
    hedging_instrument: "futures"  # futures, spot, options, swaps
    hedging_cost_limit: 0.001  # 0.1% of position
    
  # Strategy Types
  strategies:
    continuous_hedging:
      enabled: true
      description: "Continuous gamma hedging"
      rebalancing: "continuous"
      
    discrete_hedging:
      enabled: true
      description: "Discrete gamma hedging"
      rebalancing: "periodic"
      interval: 60  # minutes
      
    threshold_hedging:
      enabled: true
      description: "Threshold-based gamma hedging"
      rebalancing: "threshold"
      gamma_threshold: 0.02  # 2%
      
    adaptive_hedging:
      enabled: true
      description: "Adaptive gamma hedging"
      rebalancing: "adaptive"
      learning_rate: 0.1
      volatility_regime_aware: true
      
  # Hedging Costs
  costs:
    transaction_cost: 0.001
    bid_ask_spread: 0.0005
    slippage: 0.0001
    market_impact: 0.0002
    financing_cost: 0.0001

# ============================================================
# GAMMA SCALPING
# ============================================================
gamma_scalping:
  # Scalping Settings
  settings:
    enabled: true
    scalping_frequency: "realtime"
    scalping_threshold: 0.001  # 0.1%
    scalping_size: 0.05  # 5% of portfolio
    scalping_profit_target: 0.002  # 0.2%
    scalping_stop_loss: 0.001  # 0.1%
    
  # Scalping Strategies
  strategies:
    volatility_scalping:
      enabled: true
      description: "Scalping based on volatility movements"
      volatility_threshold: 0.02  # 2%
      
    price_scalping:
      enabled: true
      description: "Scalping based on price movements"
      price_threshold: 0.01  # 1%
      
    gamma_scalping:
      enabled: true
      description: "Scalping based on gamma changes"
      gamma_threshold: 0.0001
      
  # Scalping Execution
  execution:
    order_type: "market"
    time_in_force: "IOC"
    max_order_size: 1000
    min_order_size: 100
    slippage_tolerance: 0.001

# ============================================================
# GAMMA LIMITS
# ============================================================
gamma_limits:
  # General Gamma Limits
  general:
    max_gamma_exposure: 10000  # USD
    max_gamma_per_position: 0.25  # 25% of position
    max_net_gamma: 0.10  # 10% of portfolio
    
  # Gamma Limits by Asset Class
  asset_class:
    cryptocurrency:
      max_gamma_exposure: 5000
      max_gamma_per_position: 0.30
      max_net_gamma: 0.15
      
    forex:
      max_gamma_exposure: 10000
      max_gamma_per_position: 0.20
      max_net_gamma: 0.10
      
    equity:
      max_gamma_exposure: 20000
      max_gamma_per_position: 0.15
      max_net_gamma: 0.08
      
    commodity:
      max_gamma_exposure: 5000
      max_gamma_per_position: 0.25
      max_net_gamma: 0.12
      
  # Gamma Alert Thresholds
  alerts:
    gamma_deviation: 0.02  # 2% deviation
    gamma_change: 0.05  # 5% change
    gamma_breach: 0.10  # 10% breach

# ============================================================
# GAMMA MONITORING
# ============================================================
gamma_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "realtime"
    reporting_frequency: "daily"
    alert_threshold: 0.75  # 75% of limit
    critical_threshold: 0.90  # 90% of limit
    
  # Monitoring Metrics
  metrics:
    - "current_gamma"
    - "target_gamma"
    - "gamma_deviation"
    - "gamma_exposure"
    - "gamma_percentage"
    - "gamma_cost"
    - "rebalancing_frequency"
    - "scalping_profit"
    - "scalping_frequency"
    
  # Alerts
  alerts:
    gamma_limit_breach:
      enabled: true
      level: "critical"
      message: "Gamma limit breached for {asset}"
      
    gamma_deviation_alert:
      enabled: true
      level: "warning"
      message: "Gamma deviation exceeds threshold for {asset}"
      
    gamma_cost_alert:
      enabled: true
      level: "warning"
      message: "Gamma hedging cost exceeds threshold for {asset}"
      
    scalping_alert:
      enabled: true
      level: "info"
      message: "Gamma scalping executed for {asset}"

# ============================================================
# GAMMA REPORTING
# ============================================================
gamma_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "daily"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    
  # Report Sections
  sections:
    gamma_summary:
      enabled: true
      include_total_gamma: true
      include_net_gamma: true
      include_gamma_percentage: true
      
    position_gamma:
      enabled: true
      include_all_positions: true
      include_gamma_breakdown: true
      
    hedging_summary:
      enabled: true
      include_hedging_costs: true
      include_rebalancing: true
      include_hedging_effectiveness: true
      
    scalping_summary:
      enabled: true
      include_scalping_profits: true
      include_scalping_frequency: true
      include_scalping_effectiveness: true
      
    risk_analysis:
      enabled: true
      include_gamma_risk: true
      include_convexity_risk: true
      include_volatility_risk: true

# ============================================================
# GAMMA DASHBOARD
# ============================================================
gamma_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 5
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    gamma_summary:
      enabled: true
      position: 1
      size: "large"
      
    gamma_chart:
      enabled: true
      position: 2
      size: "large"
      
    position_gamma:
      enabled: true
      position: 3
      size: "medium"
      
    hedging_status:
      enabled: true
      position: 4
      size: "medium"
      
    scalping_status:
      enabled: true
      position: 5
      size: "medium"
      
    risk_status:
      enabled: true
      position: 6
      size: "small"
      
    alert_status:
      enabled: true
      position: 7
      size: "small"

# ============================================================
# GAMMA INTEGRATION
# ============================================================
gamma_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "api"  # api, webhook, websocket, file
    
  # External Systems
  systems:
    risk_system:
      enabled: true
      endpoint: "/api/risk/gamma"
      update_frequency: "realtime"
      
    trading_system:
      enabled: true
      endpoint: "/api/trading/gamma"
      update_frequency: "realtime"
      
    portfolio_system:
      enabled: true
      endpoint: "/api/portfolio/gamma"
      update_frequency: "realtime"
      
    analytics_system:
      enabled: true
      endpoint: "/api/analytics/gamma"
      update_frequency: "daily"

# ============================================================
# GAMMA SCENARIOS
# ============================================================
gamma_scenarios:
  # Scenario 1: Long Gamma
  long_gamma:
    description: "Long gamma position (positive convexity)"
    total_gamma: 0.05
    net_gamma: 0.05
    gamma_exposure: 5000  # USD
    convexity: "positive"
    characteristics:
      - "Profits from volatility"
      - "Losses from low volatility"
      - "Positive convexity"
      
  # Scenario 2: Short Gamma
  short_gamma:
    description: "Short gamma position (negative convexity)"
    total_gamma: -0.05
    net_gamma: -0.05
    gamma_exposure: -5000
    convexity: "negative"
    characteristics:
      - "Losses from volatility"
      - "Profits from low volatility"
      - "Negative convexity"
      
  # Scenario 3: Gamma Neutral
  gamma_neutral:
    description: "Gamma neutral position"
    total_gamma: 0.0
    net_gamma: 0.0
    gamma_exposure: 0
    convexity: "neutral"
    characteristics:
      - "No convexity exposure"
      - "Delta neutral"
      - "Static hedging"

# ============================================================
# GAMMA EXAMPLES
# ============================================================
gamma_examples:
  # Example 1: Call Option Gamma
  call_option_gamma:
    description: "Call option gamma calculation"
    parameters:
      underlying_price: 100
      strike_price: 100
      time_to_expiry: 30  # days
      volatility: 0.20
      risk_free_rate: 0.04
      dividend_yield: 0.01
    gamma: 0.03  # 3% gamma
    
  # Example 2: Put Option Gamma
  put_option_gamma:
    description: "Put option gamma calculation"
    parameters:
      underlying_price: 100
      strike_price: 100
      time_to_expiry: 30  # days
      volatility: 0.20
      risk_free_rate: 0.04
      dividend_yield: 0.01
    gamma: 0.03  # 3% gamma (same as call)
    
  # Example 3: Gamma Scalping
  gamma_scalping_example:
    description: "Gamma scalping example"
    position:
      asset: "BTC"
      quantity: 1
      price: 50000
      gamma: 0.03
    scalping:
      price_move: 500  # 1% move
      gamma_profit: 75  # 0.5 * gamma * price_move^2 * quantity

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    gamma:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "hourly"
        
    gamma_monitoring:
      alerts:
        gamma_limit_breach:
          enabled: false
        gamma_deviation_alert:
          enabled: false
          
  # Staging Environment
  staging:
    gamma:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "realtime"
        
    gamma_monitoring:
      alerts:
        gamma_limit_breach:
          enabled: true
        gamma_deviation_alert:
          enabled: true
        gamma_cost_alert:
          enabled: true
          
  # Production Environment
  production:
    gamma:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "realtime"
        use_gamma_scalping: true
        use_gamma_hedging: true
        use_gamma_exposure: true
        
    gamma_monitoring:
      alerts:
        gamma_limit_breach:
          enabled: true
          level: "critical"
        gamma_deviation_alert:
          enabled: true
          level: "warning"
        gamma_cost_alert:
          enabled: true
          level: "warning"
        scalping_alert:
          enabled: true
          level: "info"
          
  # Demo Environment
  demo:
    gamma:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "hourly"
        
    gamma_monitoring:
      alerts:
        gamma_limit_breach:
          enabled: false
        gamma_deviation_alert:
          enabled: true

# ============================================================
# END OF CONFIGURATION
# ============================================================
