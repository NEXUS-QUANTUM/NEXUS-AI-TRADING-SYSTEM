# ============================================================
# INVOICING GENERAL SETTINGS
# ============================================================
invoicing:
  # General Invoicing Settings
  general:
    enabled: true
    invoice_currency: "USD"
    invoice_format: "pdf"  # pdf, html, json, xml
    invoice_prefix: "INV-"
    invoice_number_format: "{prefix}{year}{month}{sequence:06d}"
    invoice_language: "en"
    invoice_timezone: "UTC"
    decimal_places: 2
    min_invoice_amount: 0.01
    auto_generate: true
    auto_send: true
    auto_reminder: true
    
  # Invoice Types
  types:
    standard_invoice:
      enabled: true
      description: "Standard invoice for services"
      template: "standard"
      
    proforma_invoice:
      enabled: true
      description: "Proforma invoice for advance payment"
      template: "proforma"
      
    credit_note:
      enabled: true
      description: "Credit note for refunds or adjustments"
      template: "credit_note"
      
    recurring_invoice:
      enabled: true
      description: "Recurring invoice for subscriptions"
      template: "recurring"
      
    final_invoice:
      enabled: true
      description: "Final invoice for completed services"
      template: "final"

