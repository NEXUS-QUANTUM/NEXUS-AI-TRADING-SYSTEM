# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    diversification:
      general:
        enabled: true
        update_frequency: "hourly"
        rebalance_threshold: 0.03  # 3%
        
    diversification_monitoring:
      alerts:
        low_diversification_alert:
          enabled: false
        critical_diversification_alert:
          enabled: false
          
  # Staging Environment
  staging:
    diversification:
      general:
        enabled: true
        update_frequency: "realtime"
        rebalance_threshold: 0.02  # 2%
        
    diversification_monitoring:
      alerts:
        low_diversification_alert:
          enabled: true
        critical_diversification_alert:
          enabled: true
        concentration_alert:
          enabled: true
        correlation_alert:
          enabled: true
          
  # Production Environment
  production:
    diversification:
      general:
        enabled: true
        update_frequency: "realtime"
        rebalance_threshold: 0.02
        target_diversification_score: 0.70
        min_diversification_score: 0.50
        
    diversification_monitoring:
      alerts:
        low_diversification_alert:
          enabled: true
          level: "warning"
        critical_diversification_alert:
          enabled: true
          level: "critical"
        concentration_alert:
          enabled: true
          level: "warning"
        correlation_alert:
          enabled: true
          level: "warning"
          
  # Demo Environment
  demo:
    diversification:
      general:
        enabled: true
        update_frequency: "hourly"
        rebalance_threshold: 0.03
        
    diversification_monitoring:
      alerts:
        low_diversification_alert:
          enabled: false
        critical_diversification_alert:
          enabled: false

# ============================================================
# END OF CONFIGURATION
# ============================================================
