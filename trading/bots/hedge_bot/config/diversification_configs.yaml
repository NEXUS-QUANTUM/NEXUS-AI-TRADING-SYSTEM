    sectors: 12
    regions: 6
    risk_factors: 6
    strategies: 5
    avg_correlation: 0.25
    
  # Scenario 2: Moderately Diversified
  moderately_diversified:
    description: "Moderately diversified portfolio"
    score: 0.60
    asset_classes: 4
    sectors: 8
    regions: 4
    risk_factors: 4
    strategies: 3
    avg_correlation: 0.35
    
  # Scenario 3: Poorly Diversified
  poorly_diversified:
    description: "Poorly diversified portfolio"
    score: 0.40
    asset_classes: 2
    sectors: 4
    regions: 2
    risk_factors: 2
    strategies: 1
    avg_correlation: 0.55
    
  # Scenario 4: Highly Concentrated
  highly_concentrated:
    description: "Highly concentrated portfolio"
    score: 0.20
    asset_classes: 1
    sectors: 1
    regions: 1
    risk_factors: 1
    strategies: 1
    avg_correlation: 0.80

