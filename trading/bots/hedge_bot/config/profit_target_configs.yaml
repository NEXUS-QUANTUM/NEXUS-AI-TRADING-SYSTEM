# ============================================================
# PROFIT TARGET GENERAL SETTINGS
# ============================================================
profit_target:
  # General Profit Target Settings
  general:
    enabled: true
    target_type: "dynamic"  # dynamic, fixed, adaptive, risk_based
    target_multiplier: 2.0  # Target = Risk * Multiplier
    min_target: 0.01  # 1% minimum target
    max_target: 0.20  # 20% maximum target
    default_target: 0.05  # 5% default target
    update_frequency: "realtime"
    use_trailing_target: true
    use_dynamic_adjustment: true
    use_volatility_adjustment: true
    
  # Target Types
  types:
    fixed_target:
      enabled: true
      description: "Fixed percentage profit target"
      percentage: 0.05
      
    risk_based_target:
      enabled: true
      description: "Risk-based profit target"
      risk_multiplier: 2.0
      
    volatility_based_target:
      enabled: true
      description: "Volatility-based profit target"
      volatility_multiplier: 1.5
      
    dynamic_target:
      enabled: true
      description: "Dynamic profit target based on market conditions"
      adjustment_factor: 0.1
      
    adaptive_target:
      enabled: true
      description: "Adaptive profit target learning from market patterns"
      learning_rate: 0.1

