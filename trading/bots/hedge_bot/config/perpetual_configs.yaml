# ============================================================
# PERPETUAL GENERAL SETTINGS
# ============================================================
perpetual:
  # General Perpetual Settings
  general:
    enabled: true
    trading_enabled: true
    exchange: "binance"  # binance, bybit, okx, bitget
    contract_type: "perpetual"
    leverage: 1.0
    max_leverage: 3.0
    margin_type: "isolated"  # isolated, cross
    position_mode: "one_way"  # one_way, hedge_mode
    update_frequency: "realtime"
    use_testnet: true
    
  # Perpetual Types
  types:
    usdt_perpetual:
      enabled: true
      description: "USDT-margined perpetual contracts"
      settlement_currency: "USDT"
      max_leverage: 3.0
      
    usdc_perpetual:
      enabled: true
      description: "USDC-margined perpetual contracts"
      settlement_currency: "USDC"
      max_leverage: 3.0
      
    coin_margined:
      enabled: true
      description: "Coin-margined perpetual contracts"
      settlement_currency: "BTC"
      max_leverage: 2.0
      
    inverse_perpetual:
      enabled: true
      description: "Inverse perpetual contracts"
      settlement_currency: "BTC"
      max_leverage: 2.0

