        audit_trail: true
        record_keeping: true
        
    aml_kyc:
      settings:
        enabled: true
        aml_level: "full"
        kyc_level: "full"
        sanctions_screening: true
        pep_screening: true
        transaction_monitoring: true
        reporting_to_authorities: true
        
    trading_compliance:
      settings:
        enabled: true
        prevent_market_manipulation: true
        prevent_insider_trading: true
        prevent_front_running: true
        ensure_best_execution: true
        
    position_limits:
      general:
        enabled: true
        apply_across_assets: true
        
    record_keeping:
      settings:
        enabled: true
        retention_period: 730
        encryption_enabled: true
        immutable_records: true
        
  # Demo Environment
  demo:
    regulatory:
      general:
        enabled: true
        regulatory_framework: "none"
        compliance_level: "basic"
        regulatory_reporting: false
        audit_trail: true
        
    aml_kyc:
      settings:
        enabled: false
        
    trading_compliance:
      settings:
        enabled: false

