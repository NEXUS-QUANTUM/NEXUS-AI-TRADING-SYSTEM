# ============================================================
# REGULATORY SCENARIOS
# ============================================================
regulatory_scenarios:
  # Scenario 1: Normal Operations
  normal_operations:
    description: "Normal regulatory compliance"
    compliance_status: "compliant"
    risk_level: "low"
    actions_required: "none"
    
  # Scenario 2: Compliance Breach
  compliance_breach:
    description: "Compliance breach scenario"
    compliance_status: "non_compliant"
    risk_level: "high"
    actions_required: 
      - "notify_authorities"
      - "stop_trading"
      - "investigate"
      
  # Scenario 3: Regulatory Change
  regulatory_change:
    description: "Regulatory change scenario"
    compliance_status: "pending_review"
    risk_level: "medium"
    actions_required:
      - "review_impact"
      - "update_policies"
      - "train_staff"
      
  # Scenario 4: Audit Triggered
  audit_triggered:
    description: "Audit triggered scenario"
    compliance_status: "under_audit"
    risk_level: "medium"
    actions_required:
      - "prepare_documentation"
      - "coordinate_with_auditors"
      - "address_findings"

