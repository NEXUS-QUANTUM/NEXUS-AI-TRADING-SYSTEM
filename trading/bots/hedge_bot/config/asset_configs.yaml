# ============================================================
# VOLATILITY CONFIGURATIONS
# ============================================================
volatility_configs:
  # Historical Volatility
  historical:
    lookback_days: 30
    calculation_method: "standard_deviation"
    annualization_factor: 252
    min_data_points: 20
    
  # Implied Volatility
  implied:
    calculation_method: "black_scholes"
    use_iv_rank: true
    use_iv_percentile: true
    lookback_days: 30
    
  # Volatility Surface
  surface:
    enabled: true
    tenors:
      - "1W"
      - "2W"
      - "1M"
      - "2M"
      - "3M"
      - "6M"
      - "1Y"
    strikes:
      - 0.8
      - 0.9
      - 1.0
      - 1.1
      - 1.2
      
  # Volatility Skew
  skew:
    enabled: true
    calculation_method: "put_call_skew"
    tenors:
      - "1M"
      - "3M"
      - "6M"
      
  # Volatility Regimes
  regimes:
    low_vol: 0.1
    medium_vol: 0.2
    high_vol: 0.3
    extreme_vol: 0.5

# ============================================================
# LIQUIDITY CONFIGURATIONS
# ============================================================
liquidity_configs:
  # Liquidity Requirements
  requirements:
    min_liquidity_score: 0.5
    min_trading_volume: 1000000
    min_market_depth: 100000
    max_spread_percent: 0.02
    
  # Liquidity Scoring
  scoring:
    weight_volume: 0.3
    weight_depth: 0.3
    weight_spread: 0.2
    weight_volume_ratio: 0.1
    weight_orders: 0.1
    
  # Liquidity Providers
  providers:
    tier1:
      - binance
      - bybit
      - coinbase
      - kraken
    tier2:
      - okx
      - kucoin
      - bitget
    tier3:
      - gateio
      - mexc

# ============================================================
# CORRELATION CONFIGURATIONS
# ============================================================
correlation_configs:
  # Correlation Matrix
  matrix:
    enabled: true
    lookback_days: 60
    calculation_method: "pearson"
    min_data_points: 30
    
  # Asset Correlations
  correlations:
    # Strong Positive Correlations
    strong_positive:
      - ["BTC", "ETH"]
      - ["SOL", "ADA"]
      - ["DOT", "AVAX"]
      - ["AAPL", "MSFT"]
      - ["GOOGL", "AMZN"]
      - ["GOLD", "SILVER"]
      
    # Strong Negative Correlations
    strong_negative:
      - ["BTC", "USD"]
      - ["GOLD", "USD"]
      - ["OIL", "USD"]
      - ["BTC", "OIL"]
      - ["GOLD", "BTC"]
      
    # Industry Correlations
    industry:
      technology:
        - ["AAPL", "MSFT"]
        - ["GOOGL", "AMZN"]
        - ["NVDA", "AMD"]
      finance:
        - ["JPM", "GS"]
        - ["BAC", "C"]
      energy:
        - ["XOM", "CVX"]
        - ["OIL", "NATURAL_GAS"]
        
  # Correlation Thresholds
  thresholds:
    very_high: 0.8
    high: 0.6
    moderate: 0.4
    low: 0.2
    very_low: 0.0

# ============================================================
# PRICE CONFIGURATIONS
# ============================================================
price_configs:
  # Price Sources
  sources:
    primary: "exchange"
    secondary: "oracle"
    fallback: "vwap"
    
  # Price Aggregation
  aggregation:
    method: "volume_weighted"
    sources_count: 3
    outlier_removal: true
    outlier_threshold: 0.03
    
  # Price Feeds
  feeds:
    exchange:
      enabled: true
      priority: 1
      update_interval: 1
      
    oracle:
      enabled: true
      priority: 2
      update_interval: 5
      providers:
        - chainlink
        - pyth
        - twap
        - uniswap
        
    vwap:
      enabled: true
      priority: 3
      update_interval: 10
      
  # Price Alerts
  alerts:
    enabled: true
    thresholds:
      price_change_percent: 0.05
      volume_spike_multiplier: 3.0
      spread_widening_percent: 0.01

# ============================================================
# RISK CONFIGURATIONS PER ASSET
# ============================================================
risk_configs_per_asset:
  cryptocurrency:
    max_position_size_percent: 0.05
    max_leverage: 3.0
    daily_loss_limit_percent: 0.05
    max_drawdown_percent: 0.15
    correlation_risk_factor: 0.7
    
  forex:
    max_position_size_percent: 0.10
    max_leverage: 10.0
    daily_loss_limit_percent: 0.03
    max_drawdown_percent: 0.10
    correlation_risk_factor: 0.8
    
  equity:
    max_position_size_percent: 0.05
    max_leverage: 2.0
    daily_loss_limit_percent: 0.04
    max_drawdown_percent: 0.12
    correlation_risk_factor: 0.6
    
  commodity:
    max_position_size_percent: 0.08
    max_leverage: 5.0
    daily_loss_limit_percent: 0.04
    max_drawdown_percent: 0.12
    correlation_risk_factor: 0.5

# ============================================================
# ASSET MONITORING
# ============================================================
asset_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_interval: 60
    realtime_updates: true
    
  # Metrics
  metrics:
    - "price"
    - "volume"
    - "liquidity"
    - "spread"
    - "volatility"
    - "correlation"
    - "open_interest"
    - "funding_rate"
    
  # Alerts
  alerts:
    enabled: true
    channels:
      - "telegram"
      - "slack"
      - "email"
      - "push"
      
  # Dashboards
  dashboards:
    enabled: true
    update_interval: 5
    widgets:
      - "price_chart"
      - "volume_chart"
      - "correlation_matrix"
      - "risk_metrics"
      - "position_summary"

# ============================================================
# END OF CONFIGURATION
# ============================================================
