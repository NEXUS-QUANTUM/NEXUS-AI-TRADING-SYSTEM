    sla_guarantee:
      name: "SLA Guarantee"
      description: "Service Level Agreement guarantee"
      available_in: ["enterprise"]

# ============================================================
# SUBSCRIPTION MONITORING
# ============================================================
subscription_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "daily"
    alert_threshold: 0.75  # 75% of limit
    critical_threshold: 0.90  # 90% of limit
    reporting_frequency: "daily"
    
  # Alert Conditions
  alerts:
    subscription_expiry:
      enabled: true
      level: "warning"
      threshold: 7  # days
      message: "Subscription expiring in {days} days"
      
    subscription_past_due:
      enabled: true
      level: "critical"
      message: "Subscription payment past due"
      
    subscription_limit:
      enabled: true
      level: "warning"
      threshold: 0.80
      message: "Subscription limit approaching: {limit}%"
      
    subscription_downgrade:
      enabled: true
      level: "info"
      message: "Subscription downgraded: {old} -> {new}"
      
  # Monitoring Metrics
  metrics:
    - "subscription_status"
    - "subscription_utilization"
    - "subscription_limits"
    - "subscription_changes"
    - "subscription_renewals"

# ============================================================
# SUBSCRIPTION REPORTING
# ============================================================
subscription_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "monthly"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    include_recommendations: true
    
  # Report Sections
  sections:
    subscription_summary:
      enabled: true
      include_active_subscriptions: true
      include_trials: true
      include_churn: true
      include_renewals: true
      
    plan_distribution:
      enabled: true
      include_by_plan: true
      include_by_region: true
      
    revenue_analysis:
      enabled: true
      include_monthly_revenue: true
      include_annual_revenue: true
      include_revenue_growth: true
      
    churn_analysis:
      enabled: true
      include_churn_rate: true
      include_churn_reasons: true
      include_retention_rate: true

# ============================================================
# SUBSCRIPTION DASHBOARD
# ============================================================
subscription_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 60
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    subscription_summary:
      enabled: true
      position: 1
      size: "large"
      
    plan_distribution:
      enabled: true
      position: 2
      size: "medium"
      
    revenue_chart:
      enabled: true
      position: 3
      size: "large"
      
    churn_analysis:
      enabled: true
      position: 4
      size: "medium"
      
    alert_status:
      enabled: true
      position: 5
      size: "small"

# ============================================================
# SUBSCRIPTION INTEGRATION
# ============================================================
subscription_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "api"  # api, webhook, websocket, file
    
  # External Systems
  systems:
    billing_system:
      enabled: true
      provider: "stripe"  # stripe, paypal, custom
      api_key: "${BILLING_API_KEY}"
      webhook_secret: "${BILLING_WEBHOOK_SECRET}"
      
    crm_system:
      enabled: true
      provider: "salesforce"  # salesforce, hubspot, custom
      api_key: "${CRM_API_KEY}"
      sync_customers: true
      sync_subscriptions: true
      
    email_system:
      enabled: true
      provider: "sendgrid"  # sendgrid, mailchimp, custom
      api_key: "${EMAIL_API_KEY}"
      send_welcome_emails: true
      send_renewal_emails: true

# ============================================================
# SUBSCRIPTION SCENARIOS
# ============================================================
subscription_scenarios:
  # Scenario 1: New Subscription
  new_subscription:
    description: "New subscription scenario"
    plan: "starter"
    trial_days: 7
    billing_cycle: "monthly"
    auto_renewal: true
    payment_method: "credit_card"
    
  # Scenario 2: Subscription Upgrade
  subscription_upgrade:
    description: "Subscription upgrade scenario"
    old_plan: "starter"
    new_plan: "professional"
    upgrade_date: "immediate"
    proration: true
    new_price: 149.00
    
  # Scenario 3: Subscription Downgrade
  subscription_downgrade:
    description: "Subscription downgrade scenario"
    old_plan: "professional"
    new_plan: "starter"
    downgrade_date: "end_of_cycle"
    proration: false
    new_price: 49.00
    
  # Scenario 4: Subscription Cancellation
  subscription_cancellation:
    description: "Subscription cancellation scenario"
    plan: "professional"
    cancellation_date: "end_of_cycle"
    reason: "cost_savings"
    reactivation: false

# ============================================================
# SUBSCRIPTION EXAMPLES
# ============================================================
subscription_examples:
