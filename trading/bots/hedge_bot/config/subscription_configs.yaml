# ============================================================
# SUBSCRIPTION GENERAL SETTINGS
# ============================================================
subscription:
  # General Subscription Settings
  general:
    enabled: true
    subscription_currency: "USD"
    billing_cycle: "monthly"  # monthly, quarterly, annual
    billing_day: 1  # Day of month for billing
    proration_enabled: true
    trial_period_days: 14
    grace_period_days: 3
    auto_renewal: true
    cancellation_policy: "end_of_cycle"  # end_of_cycle, immediate, prorated
    upgrade_policy: "immediate"  # immediate, end_of_cycle, prorated
    downgrade_policy: "end_of_cycle"  # end_of_cycle, immediate
    
  # Subscription Statuses
  statuses:
    - "active"
    - "trialing"
    - "past_due"
    - "canceled"
    - "expired"
    - "paused"
    
  # Subscription Actions
  actions:
    - "create"
    - "update"
    - "cancel"
    - "pause"
    - "resume"
    - "upgrade"
    - "downgrade"
    - "reactivate"

# ============================================================
# SUBSCRIPTION PLANS
# ============================================================
subscription_plans:
  # Plan Definitions
  plans:
    free:
      id: "free"
      name: "Free Plan"
      description: "Basic trading features for beginners"
      price: 0.00
      currency: "USD"
      billing_cycle: "monthly"
      trial_days: 0
      features:
        - "paper_trading"
        - "basic_charts"
        - "daily_signals"
        - "1_bot_limit"
        - "10_trades_per_day"
        - "basic_support"
      limits:
        max_bots: 1
        max_trades_per_day: 10
        max_positions: 5
        max_portfolio_value: 10000
        data_refresh_seconds: 60
        api_calls_per_minute: 30
        
    starter:
      id: "starter"
      name: "Starter Plan"
      description: "Essential trading tools for active traders"
      price: 49.00
      currency: "USD"
      billing_cycle: "monthly"
      trial_days: 7
      features:
        - "paper_trading"
        - "advanced_charts"
        - "realtime_signals"
        - "3_bot_limit"
        - "50_trades_per_day"
        - "email_support"
        - "basic_analytics"
        - "telegram_alerts"
      limits:
        max_bots: 3
        max_trades_per_day: 50
        max_positions: 20
        max_portfolio_value: 50000
        data_refresh_seconds: 30
        api_calls_per_minute: 60
        
    professional:
      id: "professional"
      name: "Professional Plan"
      description: "Professional trading platform for serious traders"
      price: 149.00
      currency: "USD"
      billing_cycle: "monthly"
      trial_days: 7
      features:
        - "paper_trading"
        - "premium_charts"
        - "realtime_signals"
        - "10_bot_limit"
        - "200_trades_per_day"
        - "priority_support"
        - "advanced_analytics"
        - "telegram_alerts"
        - "slack_integration"
        - "webhook_integration"
        - "api_access"
      limits:
        max_bots: 10
        max_trades_per_day: 200
        max_positions: 50
        max_portfolio_value: 250000
        data_refresh_seconds: 10
        api_calls_per_minute: 120
        
    enterprise:
      id: "enterprise"
      name: "Enterprise Plan"
      description: "Enterprise-grade trading solution for institutions"
      price: 499.00
      currency: "USD"
      billing_cycle: "monthly"
      trial_days: 14
      features:
        - "paper_trading"
        - "premium_charts"
        - "realtime_signals"
        - "unlimited_bots"
        - "unlimited_trades"
        - "24_7_support"
        - "enterprise_analytics"
        - "telegram_alerts"
        - "slack_integration"
        - "webhook_integration"
        - "api_access"
        - "white_label"
        - "dedicated_infrastructure"
        - "custom_development"
        - "sla_guarantee"
      limits:
        max_bots: 999
        max_trades_per_day: 9999
        max_positions: 999
        max_portfolio_value: 9999999
        data_refresh_seconds: 1
        api_calls_per_minute: 600

# ============================================================
# SUBSCRIPTION DISCOUNTS
# ============================================================
subscription_discounts:
  # Annual Discounts
  annual:
    starter:
      discount_percent: 15
      annual_price: 499.80
      savings: 88.20
      
    professional:
      discount_percent: 20
      annual_price: 1430.40
      savings: 357.60
      
    enterprise:
      discount_percent: 25
      annual_price: 4491.00
      savings: 1497.00
      
  # Volume Discounts
  volume:
    bots_5:
      type: "percentage"
      value: 5
      min_bots: 5
      applies_to: ["starter", "professional"]
      
    bots_10:
      type: "percentage"
      value: 10
      min_bots: 10
      applies_to: ["starter", "professional"]
      
    bots_25:
      type: "percentage"
      value: 15
      min_bots: 25
      applies_to: ["professional", "enterprise"]
      
  # Loyalty Discounts
  loyalty:
    duration_6_months:
      type: "percentage"
      value: 5
      min_duration_months: 6
      
    duration_12_months:
      type: "percentage"
      value: 10
      min_duration_months: 12
      
    duration_24_months:
      type: "percentage"
      value: 15
      min_duration_months: 24

