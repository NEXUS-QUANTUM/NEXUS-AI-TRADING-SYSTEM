# ============================================================
# DELTA GENERAL SETTINGS
# ============================================================
delta:
  # General Delta Settings
  general:
    enabled: true
    calculation_method: "black_scholes"  # black_scholes, binomial, monte_carlo, finite_difference
    target_delta: 0.0  # Delta neutral target (0 = neutral)
    delta_tolerance: 0.01  # 1% tolerance
    update_frequency: "realtime"  # realtime, hourly, daily
    use_greeks: true
    use_volatility_surface: true
    use_skew_adjustment: true
    use_rho_correction: false
    
  # Delta Types
  types:
    delta_hedging:
      enabled: true
      description: "Standard delta hedging"
      
    delta_gamma_hedging:
      enabled: true
      description: "Delta and gamma hedging"
      
    delta_vega_hedging:
      enabled: false
      description: "Delta and vega hedging"
      
    delta_theta_hedging:
      enabled: false
      description: "Delta and theta hedging"
      
    delta_rho_hedging:
      enabled: false
      description: "Delta and rho hedging"
      
  # Delta Calculation Parameters
  parameters:
    volatility: 0.20  # 20% implied volatility
    risk_free_rate: 0.04  # 4% risk-free rate
    dividend_yield: 0.01  # 1% dividend yield
    time_to_expiry: 30  # days
    strike_price: "at_the_money"  # at_the_money, in_the_money, out_of_the_money
    option_type: "european"  # european, american

# ============================================================
# DELTA CALCULATION METHODS
# ============================================================
delta_methods:
  # Black-Scholes Model
  black_scholes:
    enabled: true
    description: "Black-Scholes option pricing model"
    calculation: "closed_form"
    parameters:
      use_volatility_surface: true
      use_interest_rate_curve: true
      use_dividend_forecast: true
      
  # Binomial Model
  binomial:
    enabled: true
    description: "Binomial tree option pricing model"
    steps: 100
    method: "crr"  # crr, jr, trigeorgis
    american: true
    early_exercise: true
    
  # Monte Carlo Model
  monte_carlo:
    enabled: true
    description: "Monte Carlo simulation for option pricing"
    simulations: 10000
    steps: 252
    method: "euler"  # euler, milstein, heston
    variance_reduction: true
    antithetic_variates: true
    
  # Finite Difference Model
  finite_difference:
    enabled: true
    description: "Finite difference method for option pricing"
    method: "implicit"  # implicit, explicit, crank_nicolson
    grid_points: 100
    time_steps: 100
    stability_check: true

# ============================================================
# GREEKS CALCULATION
# ============================================================
greeks:
  # Greek Settings
  settings:
    enabled: true
    calculation_method: "finite_difference"  # finite_difference, analytical, monte_carlo
    update_frequency: "realtime"
    accuracy: "high"  # low, medium, high
    parallel_calculation: true
    
  # Delta (Δ)
  delta:
    enabled: true
    description: "Rate of change of option price with respect to underlying price"
    calculation: "first_derivative"
    tolerance: 0.001
    
  # Gamma (Γ)
  gamma:
    enabled: true
    description: "Rate of change of delta with respect to underlying price"
    calculation: "second_derivative"
    tolerance: 0.0001
    
  # Vega (ν)
  vega:
    enabled: true
    description: "Rate of change of option price with respect to volatility"
    calculation: "first_derivative"
    tolerance: 0.001
    volatility_units: "percentage_points"
    
  # Theta (Θ)
  theta:
    enabled: true
    description: "Rate of change of option price with respect to time"
    calculation: "first_derivative"
    tolerance: 0.001
    time_units: "days"
    
  # Rho (ρ)
  rho:
    enabled: true
    description: "Rate of change of option price with respect to interest rate"
    calculation: "first_derivative"
    tolerance: 0.001
    rate_units: "percentage_points"
    
  # Higher-Order Greeks
  higher_order:
    vanna: true
    charm: true
    speed: true
    zomma: true
    color: true
    ultima: true
    veta: true
    vera: true

# ============================================================
# DELTA HEDGING STRATEGIES
# ============================================================
delta_hedging:
  # Strategy Settings
  settings:
    enabled: true
    strategy_type: "dynamic"  # dynamic, static, adaptive
    rebalancing_frequency: "realtime"  # realtime, hourly, daily
    rebalancing_threshold: 0.01  # 1% deviation
    hedging_instrument: "futures"  # futures, spot, options, swaps
    hedging_cost_limit: 0.001  # 0.1% of position
    
  # Strategy Types
  strategies:
    continuous_hedging:
      enabled: true
      description: "Continuous delta hedging"
      rebalancing: "continuous"
      
    discrete_hedging:
      enabled: true
      description: "Discrete delta hedging"
      rebalancing: "periodic"
      interval: 60  # minutes
      
    threshold_hedging:
      enabled: true
      description: "Threshold-based delta hedging"
      rebalancing: "threshold"
      delta_threshold: 0.02  # 2%
      
    adaptive_hedging:
      enabled: true
      description: "Adaptive delta hedging"
      rebalancing: "adaptive"
      learning_rate: 0.1
      volatility_regime_aware: true
      
  # Hedging Costs
  costs:
    transaction_cost: 0.001
    bid_ask_spread: 0.0005
    slippage: 0.0001
    market_impact: 0.0002
    financing_cost: 0.0001

# ============================================================
# DELTA LIMITS
# ============================================================
delta_limits:
  # General Delta Limits
  general:
    max_delta_exposure: 100000  # USD
    max_delta_per_position: 0.25  # 25% of position
    max_net_delta: 0.10  # 10% of portfolio
    
  # Delta Limits by Asset Class
  asset_class:
    cryptocurrency:
      max_delta_exposure: 50000
      max_delta_per_position: 0.30
      max_net_delta: 0.15
      
    forex:
      max_delta_exposure: 100000
      max_delta_per_position: 0.20
      max_net_delta: 0.10
      
    equity:
      max_delta_exposure: 200000
      max_delta_per_position: 0.15
      max_net_delta: 0.08
      
    commodity:
      max_delta_exposure: 50000
      max_delta_per_position: 0.25
      max_net_delta: 0.12
      
  # Delta Alert Thresholds
  alerts:
    delta_deviation: 0.02  # 2% deviation
    delta_change: 0.05  # 5% change
    delta_breach: 0.10  # 10% breach

# ============================================================
# DELTA MONITORING
# ============================================================
delta_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "realtime"
    reporting_frequency: "daily"
    alert_threshold: 0.75  # 75% of limit
    critical_threshold: 0.90  # 90% of limit
    
  # Monitoring Metrics
  metrics:
    - "current_delta"
    - "target_delta"
    - "delta_deviation"
    - "delta_exposure"
    - "delta_percentage"
    - "hedging_cost"
    - "rebalancing_frequency"
    
  # Alerts
  alerts:
    delta_limit_breach:
      enabled: true
      level: "critical"
      message: "Delta limit breached for {asset}"
      
    delta_deviation_alert:
      enabled: true
      level: "warning"
      message: "Delta deviation exceeds threshold for {asset}"
      
    hedging_cost_alert:
      enabled: true
      level: "warning"
      message: "Hedging cost exceeds threshold for {asset}"
      
    rebalancing_alert:
      enabled: true
      level: "info"
      message: "Rebalancing executed for {asset}"

# ============================================================
# DELTA REPORTING
# ============================================================
delta_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "daily"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    
  # Report Sections
  sections:
    delta_summary:
      enabled: true
      include_total_delta: true
      include_net_delta: true
      include_delta_percentage: true
      
    position_delta:
      enabled: true
      include_all_positions: true
      include_delta_breakdown: true
      
    hedging_summary:
      enabled: true
      include_hedging_costs: true
      include_rebalancing: true
      include_hedging_effectiveness: true
      
    greeks_summary:
      enabled: true
      include_all_greeks: true
      include_greek_breakdown: true
      
    risk_analysis:
      enabled: true
      include_delta_risk: true
      include_gamma_risk: true
      include_vega_risk: true

# ============================================================
# DELTA DASHBOARD
# ============================================================
delta_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 5
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    delta_summary:
      enabled: true
      position: 1
      size: "large"
      
    delta_chart:
      enabled: true
      position: 2
      size: "large"
      
    greeks_summary:
      enabled: true
      position: 3
      size: "medium"
      
    position_delta:
      enabled: true
      position: 4
      size: "medium"
      
    hedging_status:
      enabled: true
      position: 5
      size: "small"
      
    alert_status:
      enabled: true
      position: 6
      size: "small"

# ============================================================
# DELTA INTEGRATION
# ============================================================
delta_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "api"  # api, webhook, websocket, file
    
  # External Systems
  systems:
    risk_system:
      enabled: true
      endpoint: "/api/risk/delta"
      update_frequency: "realtime"
      
    trading_system:
      enabled: true
      endpoint: "/api/trading/delta"
      update_frequency: "realtime"
      
    portfolio_system:
      enabled: true
      endpoint: "/api/portfolio/delta"
      update_frequency: "realtime"
      
    analytics_system:
      enabled: true
      endpoint: "/api/analytics/delta"
      update_frequency: "daily"

# ============================================================
# DELTA SCENARIOS
# ============================================================
delta_scenarios:
  # Scenario 1: Delta Neutral
  delta_neutral:
    description: "Delta neutral portfolio"
    total_delta: 0.0
    net_delta: 0.0
    delta_exposure: 0.0
    
  # Scenario 2: Slightly Positive
  slightly_positive:
    description: "Slightly positive delta"
    total_delta: 0.05
    net_delta: 0.05
    delta_exposure: 5000  # USD
    
  # Scenario 3: Slightly Negative
  slightly_negative:
    description: "Slightly negative delta"
    total_delta: -0.05
    net_delta: -0.05
    delta_exposure: -5000  # USD
    
  # Scenario 4: Highly Positive
  highly_positive:
    description: "Highly positive delta"
    total_delta: 0.20
    net_delta: 0.20
    delta_exposure: 20000  # USD
    
  # Scenario 5: Highly Negative
  highly_negative:
    description: "Highly negative delta"
    total_delta: -0.20
    net_delta: -0.20
    delta_exposure: -20000  # USD

# ============================================================
# DELTA EXAMPLES
# ============================================================
delta_examples:
  # Example 1: Call Option Delta
  call_option_delta:
    description: "Call option delta calculation"
    parameters:
      underlying_price: 100
      strike_price: 100
      time_to_expiry: 30  # days
      volatility: 0.20
      risk_free_rate: 0.04
      dividend_yield: 0.01
    delta: 0.52  # At-the-money call option delta
    
  # Example 2: Put Option Delta
  put_option_delta:
    description: "Put option delta calculation"
    parameters:
      underlying_price: 100
      strike_price: 100
      time_to_expiry: 30  # days
      volatility: 0.20
      risk_free_rate: 0.04
      dividend_yield: 0.01
    delta: -0.48  # At-the-money put option delta
    
  # Example 3: Hedging Example
  hedging_example:
    description: "Delta hedging example"
    position:
      asset: "BTC"
      quantity: 1
      price: 50000
      delta: 1.0
      value: 50000
    hedge:
      instrument: "BTC Futures"
      quantity: 1
      delta: 1.0
      value: -50000
    net_delta: 0.0

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    delta:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "hourly"
        
    delta_monitoring:
      alerts:
        delta_limit_breach:
          enabled: false
        delta_deviation_alert:
          enabled: false
          
  # Staging Environment
  staging:
    delta:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "realtime"
        
    delta_monitoring:
      alerts:
        delta_limit_breach:
          enabled: true
        delta_deviation_alert:
          enabled: true
        hedging_cost_alert:
          enabled: true
          
  # Production Environment
  production:
    delta:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "realtime"
        use_greeks: true
        use_volatility_surface: true
        use_skew_adjustment: true
        
    delta_monitoring:
      alerts:
        delta_limit_breach:
          enabled: true
          level: "critical"
        delta_deviation_alert:
          enabled: true
          level: "warning"
        hedging_cost_alert:
          enabled: true
          level: "warning"
        rebalancing_alert:
          enabled: true
          level: "info"
          
  # Demo Environment
  demo:
    delta:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "hourly"
        
    delta_monitoring:
      alerts:
        delta_limit_breach:
          enabled: false
        delta_deviation_alert:
          enabled: true

# ============================================================
# END OF CONFIGURATION
# ============================================================
