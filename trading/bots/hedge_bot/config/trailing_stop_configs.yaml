# ============================================================
# TRAILING STOP GENERAL SETTINGS
# ============================================================
trailing_stop:
  # General Trailing Stop Settings
  general:
    enabled: true
    trailing_stop_type: "dynamic"  # dynamic, fixed, adaptive, volatility_based
    default_trailing_distance: 0.03  # 3% default
    min_trailing_distance: 0.01  # 1% minimum
    max_trailing_distance: 0.10  # 10% maximum
    activation_threshold: 0.02  # 2% profit activates trailing
    update_frequency: "realtime"
    use_volatility_adjustment: true
    use_market_regime_adjustment: true
    use_asset_specific_stops: true
    lock_in_profit: true
    lock_in_threshold: 0.03  # 3% profit locks in
    
  # Trailing Stop Types
  types:
    fixed_trailing_stop:
      enabled: true
      description: "Fixed distance trailing stop"
      distance: 0.03  # 3%
      
    dynamic_trailing_stop:
      enabled: true
      description: "Dynamic trailing stop based on volatility"
      volatility_multiplier: 0.5
      
    adaptive_trailing_stop:
      enabled: true
      description: "Adaptive trailing stop learning from market patterns"
      learning_rate: 0.1
      
    volatility_based:
      enabled: true
      description: "Volatility-based trailing stop"
      atr_multiplier: 2.0
      atr_period: 14
      
    step_trailing_stop:
      enabled: true
      description: "Step-based trailing stop"
      step_size: 0.01  # 1%
      step_activation: 0.02  # 2%

