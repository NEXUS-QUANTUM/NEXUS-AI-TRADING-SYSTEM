# ============================================================
# MARGIN GENERAL SETTINGS
# ============================================================
margin:
  # General Margin Settings
  general:
    enabled: true
    margin_type: "isolated"  # isolated, cross, portfolio
    initial_margin_requirement: 0.10  # 10% initial margin
    maintenance_margin_requirement: 0.05  # 5% maintenance margin
    margin_call_threshold: 0.70  # 70% margin utilization
    liquidation_threshold: 0.90  # 90% margin utilization
    margin_optimization: true
    margin_optimization_method: "dynamic"  # dynamic, static, adaptive
    update_frequency: "realtime"  # realtime, hourly, daily
    use_collateral_optimization: true
    use_portfolio_margin: true
    
  # Margin Types
  types:
    isolated_margin:
      enabled: true
      description: "Isolated margin per position"
      risk: "position_specific"
      
    cross_margin:
      enabled: true
      description: "Cross margin across all positions"
      risk: "portfolio_aggregate"
      
    portfolio_margin:
      enabled: true
      description: "Portfolio-based margin with offsets"
      risk: "portfolio_correlation"
      
    initial_margin:
      enabled: true
      description: "Initial margin requirement"
      requirement: 0.10
      
    maintenance_margin:
      enabled: true
      description: "Maintenance margin requirement"
      requirement: 0.05

# ============================================================
# MARGIN REQUIREMENTS BY ASSET CLASS
# ============================================================
margin_requirements:
