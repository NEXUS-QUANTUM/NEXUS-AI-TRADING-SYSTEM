    maintenance_margin: 0.05  # 5%
    margin_call_threshold: 0.70
    liquidation_threshold: 0.90
    concentration_discount: false
    correlation_discount: false
    
    # Asset-Specific Requirements
    assets:
      BTC:
        initial_margin: 0.10
        maintenance_margin: 0.05
        concentration_discount: 0.20
      ETH:
        initial_margin: 0.12
        maintenance_margin: 0.06
        concentration_discount: 0.15
      SOL:
        initial_margin: 0.15
        maintenance_margin: 0.08
        concentration_discount: 0.10
      ADA:
        initial_margin: 0.15
        maintenance_margin: 0.08
        concentration_discount: 0.10
      DOT:
        initial_margin: 0.15
        maintenance_margin: 0.08
        concentration_discount: 0.10
      AVAX:
        initial_margin: 0.18
        maintenance_margin: 0.10
        concentration_discount: 0.05
      XRP:
        initial_margin: 0.14
        maintenance_margin: 0.07
        concentration_discount: 0.10
      LINK:
        initial_margin: 0.14
        maintenance_margin: 0.07
        concentration_discount: 0.10
      UNI:
        initial_margin: 0.16
        maintenance_margin: 0.08
        concentration_discount: 0.05
      AAVE:
        initial_margin: 0.16
        maintenance_margin: 0.08
        concentration_discount: 0.05
        
  # Forex
  forex:
    initial_margin: 0.02  # 2%
    maintenance_margin: 0.01  # 1%
    margin_call_threshold: 0.70
    liquidation_threshold: 0.90
    concentration_discount: true
    correlation_discount: true
    
    assets:
      EURUSD:
        initial_margin: 0.02
        maintenance_margin: 0.01
        concentration_discount: 0.30
      GBPUSD:
        initial_margin: 0.02
        maintenance_margin: 0.01
        concentration_discount: 0.30
      USDJPY:
        initial_margin: 0.02
        maintenance_margin: 0.01
        concentration_discount: 0.30
      USDCHF:
        initial_margin: 0.02
        maintenance_margin: 0.01
        concentration_discount: 0.30
      AUDUSD:
        initial_margin: 0.03
        maintenance_margin: 0.015
        concentration_discount: 0.25
      USDCAD:
        initial_margin: 0.03
        maintenance_margin: 0.015
        concentration_discount: 0.25
        
  # Equity
  equity:
    initial_margin: 0.05  # 5%
    maintenance_margin: 0.025  # 2.5%
    margin_call_threshold: 0.70
    liquidation_threshold: 0.90
    concentration_discount: true
    correlation_discount: true
    
    assets:
      SPY:
        initial_margin: 0.05
        maintenance_margin: 0.025
        concentration_discount: 0.25
      AAPL:
        initial_margin: 0.05
        maintenance_margin: 0.025
        concentration_discount: 0.20
      MSFT:
        initial_margin: 0.05
        maintenance_margin: 0.025
        concentration_discount: 0.20
      GOOGL:
        initial_margin: 0.05
        maintenance_margin: 0.025
        concentration_discount: 0.20
      AMZN:
        initial_margin: 0.06
        maintenance_margin: 0.03
        concentration_discount: 0.15
      TSLA:
        initial_margin: 0.08
        maintenance_margin: 0.04
        concentration_discount: 0.10
        
  # Commodity
  commodity:
    initial_margin: 0.08  # 8%
    maintenance_margin: 0.04  # 4%
    margin_call_threshold: 0.70
    liquidation_threshold: 0.90
    concentration_discount: false
    correlation_discount: false
    
    assets:
      GOLD:
        initial_margin: 0.06
        maintenance_margin: 0.03
        concentration_discount: 0.20
      SILVER:
        initial_margin: 0.08
        maintenance_margin: 0.04
        concentration_discount: 0.15
      OIL:
        initial_margin: 0.10
        maintenance_margin: 0.05
        concentration_discount: 0.10
      NATURAL_GAS:
        initial_margin: 0.12
        maintenance_margin: 0.06
        concentration_discount: 0.05

# ============================================================
# MARGIN CALCULATION
# ============================================================
margin_calculation:
  # Calculation Methods
  methods:
    simple_margin:
      enabled: true
      description: "Simple margin calculation"
      formula: "position_value * margin_requirement"
      
    risk_based_margin:
      enabled: true
      description: "Risk-based margin calculation"
      formula: "position_value * margin_requirement * risk_factor"
      
    volatility_adjusted_margin:
      enabled: true
      description: "Volatility-adjusted margin"
      formula: "position_value * margin_requirement * volatility_factor"
      
    portfolio_margin:
      enabled: true
      description: "Portfolio-level margin with offsets"
      formula: "sum(position_value * margin_requirement) - portfolio_offset"
      
  # Risk Factors
  risk_factors:
    volatility_risk:
      enabled: true
      factor: 1.0
      calculation: "volatility_scaled"
      
    concentration_risk:
      enabled: true
      factor: 1.0
      calculation: "concentration_scaled"
      
    correlation_risk:
      enabled: true
      factor: 1.0
      calculation: "correlation_scaled"
      
    liquidity_risk:
      enabled: true
      factor: 1.0
      calculation: "liquidity_scaled"
      
  # Offsets and Discounts
  offsets:
    hedging_offset:
      enabled: true
      discount: 0.50
      condition: "hedged_position"
      
    correlation_offset:
      enabled: true
      discount: 0.30
      condition: "correlated_assets"
      
    diversification_offset:
      enabled: true
      discount: 0.20
      condition: "diversified_portfolio"
      
    portfolio_offset:
      enabled: true
      discount: 0.15
      condition: "portfolio_margin"

# ============================================================
# MARGIN MONITORING
# ============================================================
margin_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "realtime"
    alert_threshold: 0.75  # 75% of limit
    critical_threshold: 0.90  # 90% of limit
    reporting_frequency: "realtime"
    
  # Alert Conditions
  alerts:
    margin_utilization_alert:
      enabled: true
      level: "warning"
      threshold: 0.70
      message: "Margin utilization high: {utilization}%"
      
    margin_call_alert:
      enabled: true
      level: "critical"
      threshold: 0.80
      message: "Margin call triggered: {utilization}%"
      
    margin_deficiency_alert:
      enabled: true
      level: "critical"
      threshold: 0.90
      message: "Margin deficiency: {deficiency}%"
      
    collateral_alert:
      enabled: true
      level: "warning"
      threshold: 0.70
      message: "Collateral utilization: {utilization}%"
      
  # Monitoring Metrics
  metrics:
    - "margin_utilization"
    - "initial_margin"
    - "maintenance_margin"
    - "collateral_utilization"
    - "margin_buffer"
    - "margin_deficiency"
    - "liquidation_risk"
    - "margin_call_risk"

# ============================================================
# MARGIN REPORTING
# ============================================================
margin_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "daily"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    include_recommendations: true
    
  # Report Sections
  sections:
    margin_summary:
      enabled: true
      include_initial_margin: true
      include_maintenance_margin: true
      include_margin_utilization: true
      include_collateral_utilization: true
      
    position_margin:
      enabled: true
      include_all_positions: true
      include_margin_breakdown: true
      include_risk_adjustments: true
      
    risk_analysis:
      enabled: true
      include_liquidation_risk: true
      include_margin_call_risk: true
      include_collateral_risk: true
      
    optimization_recommendations:
      enabled: true
      include_margin_optimization: true
      include_collateral_optimization: true
      include_risk_reduction: true

# ============================================================
# MARGIN DASHBOARD
# ============================================================
margin_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 5
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    margin_summary:
      enabled: true
      position: 1
      size: "large"
      
    margin_chart:
      enabled: true
      position: 2
      size: "large"
      
    position_margin:
      enabled: true
      position: 3
      size: "medium"
      
    risk_status:
      enabled: true
      position: 4
      size: "medium"
      
    collateral_status:
      enabled: true
      position: 5
      size: "medium"
      
    alert_status:
      enabled: true
      position: 6
      size: "small"

# ============================================================
# MARGIN INTEGRATION
# ============================================================
margin_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "api"  # api, webhook, websocket, file
    
  # External Systems
  systems:
    exchange_system:
      enabled: true
      endpoint: "/api/exchange/margin"
      update_frequency: "realtime"
      
    risk_system:
      enabled: true
      endpoint: "/api/risk/margin"
      update_frequency: "realtime"
      
    portfolio_system:
      enabled: true
      endpoint: "/api/portfolio/margin"
      update_frequency: "realtime"
      
    collateral_system:
      enabled: true
      endpoint: "/api/collateral/margin"
      update_frequency: "realtime"

# ============================================================
# MARGIN SCENARIOS
# ============================================================
margin_scenarios:
  # Scenario 1: Healthy Margin
  healthy_margin:
    description: "Healthy margin level"
    margin_utilization: 0.30
    collateral_utilization: 0.25
    risk_level: "low"
    action: "none"
    
  # Scenario 2: Elevated Margin
  elevated_margin:
    description: "Elevated margin level"
    margin_utilization: 0.60
    collateral_utilization: 0.50
    risk_level: "medium"
    action: "monitor"
    
  # Scenario 3: Margin Call
  margin_call:
    description: "Margin call scenario"
    margin_utilization: 0.80
    collateral_utilization: 0.70
    risk_level: "high"
    action: "add_collateral"
    
  # Scenario 4: Margin Deficiency
  margin_deficiency:
    description: "Margin deficiency scenario"
    margin_utilization: 0.95
    collateral_utilization: 0.90
    risk_level: "critical"
    action: "liquidation"

# ============================================================
# MARGIN EXAMPLES
# ============================================================
margin_examples:
  # Example 1: Margin Calculation
  margin_calculation_example:
    description: "Margin Calculation Example"
    position_value: 100000
    initial_margin: 0.10
    maintenance_margin: 0.05
    initial_margin_required: 10000
    maintenance_margin_required: 5000
    margin_utilization: 0.50
    
  # Example 2: Margin Call Calculation
  margin_call_example:
    description: "Margin Call Calculation Example"
    position_value: 100000
    initial_margin: 10000
    maintenance_margin: 5000
    equity: 8000
    margin_utilization: 0.80
    margin_call: true
    additional_margin_required: 2000
    
  # Example 3: Portfolio Margin
  portfolio_margin_example:
    description: "Portfolio Margin Example"
    positions:
      - asset: "BTC"
        value: 50000
        margin: 5000
      - asset: "ETH"
        value: 30000
        margin: 3600
      - asset: "SOL"
        value: 20000
        margin: 3000
    total_margin: 11600
    portfolio_offset: 0.20
    effective_margin: 9280

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    margin:
      general:
        enabled: true
        margin_type: "isolated"
        initial_margin_requirement: 0.05
        maintenance_margin_requirement: 0.025
        margin_call_threshold: 0.80
        liquidation_threshold: 0.95
        
    margin_monitoring:
      alerts:
        margin_utilization_alert:
          enabled: false
        margin_call_alert:
          enabled: false
        margin_deficiency_alert:
          enabled: false
          
  # Staging Environment
  staging:
    margin:
      general:
        enabled: true
        margin_type: "cross"
        initial_margin_requirement: 0.10
        maintenance_margin_requirement: 0.05
        margin_call_threshold: 0.75
        liquidation_threshold: 0.90
        
    margin_monitoring:
      alerts:
        margin_utilization_alert:
          enabled: true
        margin_call_alert:
          enabled: true
        margin_deficiency_alert:
          enabled: true
        collateral_alert:
          enabled: true
          
  # Production Environment
  production:
    margin:
      general:
        enabled: true
        margin_type: "portfolio"
        initial_margin_requirement: 0.10
        maintenance_margin_requirement: 0.05
        margin_call_threshold: 0.70
        liquidation_threshold: 0.90
        margin_optimization: true
        margin_optimization_method: "dynamic"
        
    margin_monitoring:
      alerts:
        margin_utilization_alert:
          enabled: true
          level: "warning"
        margin_call_alert:
          enabled: true
          level: "critical"
        margin_deficiency_alert:
          enabled: true
          level: "critical"
        collateral_alert:
          enabled: true
          level: "warning"
          
  # Demo Environment
  demo:
    margin:
      general:
        enabled: true
        margin_type: "isolated"
        initial_margin_requirement: 0.08
        maintenance_margin_requirement: 0.04
        margin_call_threshold: 0.75
        liquidation_threshold: 0.90
        
    margin_monitoring:
      alerts:
        margin_utilization_alert:
          enabled: true
        margin_call_alert:
          enabled: false
        margin_deficiency_alert:
          enabled: false

# ============================================================
# END OF CONFIGURATION
# ============================================================
