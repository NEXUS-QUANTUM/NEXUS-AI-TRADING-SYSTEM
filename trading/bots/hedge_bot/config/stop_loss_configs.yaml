        atr_multiplier: 2.2
        volatility_adjustment: 0.9
      SOL:
        fixed_stop: 0.08
        trailing_stop: 0.04
        atr_multiplier: 2.5
        volatility_adjustment: 1.2
      ADA:
        fixed_stop: 0.08
