# ============================================================
# STOP LOSS GENERAL SETTINGS
# ============================================================
stop_loss:
  # General Stop Loss Settings
  general:
    enabled: true
    stop_loss_type: "dynamic"  # dynamic, fixed, trailing, adaptive
    default_stop_loss: 0.05  # 5% default
    min_stop_loss: 0.01  # 1% minimum
    max_stop_loss: 0.20  # 20% maximum
    stop_loss_activation: "immediate"  # immediate, threshold, conditional
    update_frequency: "realtime"
    use_volatility_adjustment: true
    use_market_regime_adjustment: true
    use_asset_specific_stops: true
    
  # Stop Loss Types
  types:
    fixed_stop_loss:
      enabled: true
      description: "Fixed percentage stop loss"
      percentage: 0.05
      
    trailing_stop_loss:
      enabled: true
      description: "Trailing stop loss"
      trailing_distance: 0.03  # 3%
      activation_threshold: 0.02  # 2%
      
    dynamic_stop_loss:
      enabled: true
      description: "Dynamic stop loss based on volatility"
      volatility_multiplier: 2.0
      
    adaptive_stop_loss:
      enabled: true
      description: "Adaptive stop loss learning from market patterns"
      learning_rate: 0.1
      
    atr_stop_loss:
      enabled: true
      description: "ATR-based stop loss"
      atr_multiplier: 2.0
      atr_period: 14

# ============================================================
# STOP LOSS BY ASSET CLASS
# ============================================================
