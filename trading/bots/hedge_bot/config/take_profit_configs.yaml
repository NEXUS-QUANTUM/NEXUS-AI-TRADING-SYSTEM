# ============================================================
# TAKE PROFIT GENERAL SETTINGS
# ============================================================
take_profit:
  # General Take Profit Settings
  general:
    enabled: true
    take_profit_type: "dynamic"  # dynamic, fixed, trailing, adaptive
    default_take_profit: 0.10  # 10% default
    min_take_profit: 0.01  # 1% minimum
    max_take_profit: 0.30  # 30% maximum
    take_profit_activation: "immediate"  # immediate, threshold, conditional
    update_frequency: "realtime"
    use_volatility_adjustment: true
    use_market_regime_adjustment: true
    use_asset_specific_targets: true
    risk_reward_ratio: 2.0  # Default risk/reward ratio
    
  # Take Profit Types
  types:
    fixed_take_profit:
      enabled: true
      description: "Fixed percentage take profit"
      percentage: 0.10
      
    trailing_take_profit:
      enabled: true
      description: "Trailing take profit"
      trailing_distance: 0.05  # 5%
      activation_threshold: 0.02  # 2%
      
    dynamic_take_profit:
      enabled: true
      description: "Dynamic take profit based on volatility"
      volatility_multiplier: 1.5
      
    adaptive_take_profit:
      enabled: true
      description: "Adaptive take profit learning from market patterns"
      learning_rate: 0.1
      
    atr_take_profit:
      enabled: true
      description: "ATR-based take profit"
      atr_multiplier: 3.0
      atr_period: 14

