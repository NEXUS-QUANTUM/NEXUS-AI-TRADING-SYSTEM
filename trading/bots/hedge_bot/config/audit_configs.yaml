# ============================================================
# AUDIT GENERAL SETTINGS
# ============================================================
audit:
  # General Audit Settings
  general:
    enabled: true
    audit_level: "full"  # full, standard, basic, minimal
    audit_retention_days: 730  # 2 years
    audit_compression: true
    audit_encryption: true
    audit_signing: true
    audit_chain_of_custody: true
    
  # Audit Scope
  scope:
    trade_audit: true
    position_audit: true
    order_audit: true
    accounting_audit: true
    compliance_audit: true
    security_audit: true
    performance_audit: true
    system_audit: true
    user_audit: true
    api_audit: true
    
  # Audit Frequency
  frequency:
    realtime: true
    hourly: true
    daily: true
    weekly: true
    monthly: true
    quarterly: true
    annual: true

# ============================================================
# AUDIT LOGGING CONFIGURATION
# ============================================================
audit_logging:
  # Log Settings
  settings:
    log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    log_format: "json"  # json, text, csv, avro
    log_rotation: "daily"  # hourly, daily, weekly, monthly, size
    log_compression: "zstd"  # gzip, zstd, lz4, snappy
    log_retention_days: 365
    max_log_size_mb: 100
    
  # Log Categories
  categories:
    trade_logs:
      enabled: true
      retention_days: 730
      include_all_trades: true
      include_partial_trades: true
      include_cancelled_trades: true
      include_rejected_trades: true
      
    position_logs:
      enabled: true
      retention_days: 365
      include_position_changes: true
      include_value_changes: true
      include_pnl_changes: true
      include_margin_changes: true
      
    order_logs:
      enabled: true
      retention_days: 365
      include_order_submissions: true
      include_order_amendments: true
      include_order_cancellations: true
      include_order_executions: true
      
    accounting_logs:
      enabled: true
      retention_days: 730
      include_pnl_calculations: true
      include_fee_calculations: true
      include_margin_calculations: true
      include_reconciliation: true
      
    compliance_logs:
      enabled: true
      retention_days: 730
      include_rule_checks: true
      include_limit_checks: true
      include_risk_checks: true
      include_regulatory_checks: true
      
    security_logs:
      enabled: true
      retention_days: 365
      include_auth_events: true
      include_access_events: true
      include_api_events: true
      include_security_events: true
      
    performance_logs:
      enabled: true
      retention_days: 365
      include_execution_times: true
      include_throughput: true
      include_latency: true
      include_resource_usage: true
      
    system_logs:
      enabled: true
      retention_days: 365
      include_system_events: true
      include_error_events: true
      include_warning_events: true
      include_recovery_events: true
      
    user_logs:
      enabled: true
      retention_days: 365
      include_user_actions: true
      include_user_requests: true
      include_user_errors: true
      include_user_settings: true
      
    api_logs:
      enabled: true
      retention_days: 365
      include_api_requests: true
      include_api_responses: true
      include_api_errors: true
      include_api_performance: true

# ============================================================
# AUDIT STORAGE
# ============================================================
audit_storage:
  # Storage Settings
  settings:
    storage_type: "timescaledb"  # timescaledb, postgresql, mongodb, s3, filesystem
    storage_retention_policy:
      realtime: "30d"
      hourly: "90d"
      daily: "365d"
      weekly: "730d"
      monthly: "forever"
      
  # Database Storage
  database:
    enabled: true
    connection_pool_size: 10
    max_connections: 50
    timeout_seconds: 30
    batch_insert_size: 1000
    
  # File Storage
  file:
    enabled: true
    base_path: "/data/audit_logs"
    file_format: "parquet"  # parquet, csv, json
    file_compression: "zstd"
    partition_by: ["year", "month", "day"]
    
  # Cloud Storage
  cloud:
    enabled: false
    provider: "aws"  # aws, gcp, azure
    bucket_name: "nexus-audit-logs"
    region: "us-east-1"
    lifecycle_policy:
      transition_to_ia: 90
      transition_to_glacier: 365
      expiration: 730

# ============================================================
# AUDIT COMPLIANCE
# ============================================================
audit_compliance:
  # Regulatory Compliance
  regulatory:
    enabled: true
    frameworks:
      - "FCA"      # UK Financial Conduct Authority
      - "SEC"      # US Securities and Exchange Commission
      - "MAS"      # Monetary Authority of Singapore
      - "ESMA"     # European Securities and Markets Authority
      - "CFTC"     # US Commodity Futures Trading Commission
      - "FATF"     # Financial Action Task Force
      
  # Compliance Checks
  checks:
    trade_compliance:
      enabled: true
      check_trade_limits: true
      check_position_limits: true
      check_margin_requirements: true
      check_risk_limits: true
      
    regulatory_compliance:
      enabled: true
      check_reporting_requirements: true
      check_record_keeping: true
      check_best_execution: true
      check_transparency: true
      
    security_compliance:
      enabled: true
      check_access_controls: true
      check_authentication: true
      check_authorization: true
      check_encryption: true
      
    operational_compliance:
      enabled: true
      check_continuity: true
      check_backup: true
      check_recovery: true
      check_disaster_preparedness: true

# ============================================================
# AUDIT REPORTS
# ============================================================
audit_reports:
  # Report Generation
  generation:
    enabled: true
    generate_daily_reports: true
    generate_weekly_reports: true
    generate_monthly_reports: true
    generate_quarterly_reports: true
    generate_annual_reports: true
    generate_compliance_reports: true
    generate_regulatory_reports: true
    generate_audit_trail_reports: true
    
  # Report Formats
  formats:
    pdf: true
    excel: true
    csv: true
    json: true
    html: true
    
  # Report Templates
  templates:
    daily_audit_report:
      name: "Daily Audit Report"
      sections:
        - "Executive Summary"
        - "Trade Activity"
        - "Position Summary"
        - "Risk Metrics"
        - "Compliance Status"
        - "Security Events"
        - "System Health"
        
    weekly_audit_report:
      name: "Weekly Audit Report"
      sections:
        - "Executive Summary"
        - "Trade Analysis"
        - "Performance Metrics"
        - "Risk Analysis"
        - "Compliance Review"
        - "Security Review"
        - "Operational Review"
        
    monthly_audit_report:
      name: "Monthly Audit Report"
      sections:
        - "Executive Summary"
        - "Comprehensive Trade Analysis"
        - "Performance Analysis"
        - "Risk Management Review"
        - "Compliance Report"
        - "Security Report"
        - "System Performance"
        - "Recommendations"
        
  # Report Delivery
  delivery:
    save_to_database: true
    save_to_filesystem: true
    email_recipients:
      - "audit@nexusquantum.com"
      - "compliance@nexusquantum.com"
      - "legal@nexusquantum.com"
    slack_channels:
      - "#nexus-audit"
      - "#nexus-compliance"
    webhook_endpoints:
      - "https://api.nexusquantum.com/audit/webhook"

# ============================================================
# AUDIT ALERTS
# ============================================================
audit_alerts:
  # Alert Settings
  settings:
    enabled: true
    alert_levels:
      - "critical"
      - "high"
      - "medium"
      - "low"
    notification_channels:
      - "email"
      - "telegram"
      - "slack"
      - "push"
      
  # Alert Rules
  rules:
    # Trade Alerts
    trade_alerts:
      large_trade_alert:
        threshold: 100000
        level: "high"
        message: "Large trade detected: {size} {symbol}"
        
      unusual_trade_alert:
        threshold: 3  # standard deviations
        level: "medium"
        message: "Unusual trade pattern detected"
        
      failed_trade_alert:
        enabled: true
        level: "critical"
        message: "Trade execution failed: {reason}"
        
    # Risk Alerts
    risk_alerts:
      margin_alert:
        threshold: 0.70  # utilization
        level: "high"
        message: "High margin utilization: {utilization}%"
        
      drawdown_alert:
        threshold: 0.10  # 10%
        level: "high"
        message: "Drawdown exceeded: {drawdown}%"
        
      loss_alert:
        threshold: 0.05  # 5%
        level: "critical"
        message: "Daily loss exceeded: {loss}%"
        
    # Security Alerts
    security_alerts:
      failed_login_alert:
        threshold: 5
        window: "15m"
        level: "high"
        message: "Multiple failed logins: {count}"
        
      unauthorized_access_alert:
        enabled: true
        level: "critical"
        message: "Unauthorized access detected: {user}"
        
      api_key_alert:
        enabled: true
        level: "high"
        message: "API key usage anomaly: {key}"
        
    # System Alerts
    system_alerts:
      system_error_alert:
        enabled: true
        level: "critical"
        message: "System error: {error}"
        
      service_down_alert:
        enabled: true
        level: "critical"
        message: "Service down: {service}"
        
      performance_alert:
        threshold: 5.0  # seconds
        level: "medium"
        message: "Slow operation detected: {time}s"

# ============================================================
# AUDIT VALIDATION
# ============================================================
audit_validation:
  # Validation Settings
  settings:
    enabled: true
    validation_frequency: "daily"
    validation_depth: "full"  # full, sample, metadata
    
  # Validation Checks
  checks:
    data_integrity:
      enabled: true
      check_checksums: true
      check_signatures: true
      check_hash_chains: true
      check_data_consistency: true
      
    data_completeness:
      enabled: true
      check_missing_records: true
      check_duplicate_records: true
      check_timestamp_continuity: true
      check_reference_integrity: true
      
    data_accuracy:
      enabled: true
      check_pnl_recalculation: true
      check_position_reconciliation: true
      check_trade_reconciliation: true
      check_accounting_reconciliation: true
      
    data_compliance:
      enabled: true
      check_regulatory_requirements: true
      check_data_retention: true
      check_data_protection: true
      check_data_governance: true

# ============================================================
# AUDIT RECONCILIATION
# ============================================================
audit_reconciliation:
  # Reconciliation Settings
  settings:
    enabled: true
    reconciliation_frequency: "daily"
    reconciliation_method: "full"  # full, sample, exception
    auto_correction: false
    
  # Reconciliation Types
  types:
    trade_reconciliation:
      enabled: true
      compare_with_exchange: true
      compare_with_blockchain: true
      compare_with_counterparty: true
      tolerance: 0.01  # 1% tolerance
      
    position_reconciliation:
      enabled: true
      compare_with_exchange: true
      compare_with_portfolio: true
      compare_with_accounting: true
      tolerance: 0.01
      
    margin_reconciliation:
      enabled: true
      compare_with_exchange: true
      compare_with_risk_engine: true
      compare_with_accounting: true
      tolerance: 0.01
      
    pnl_reconciliation:
      enabled: true
      compare_with_accounting: true
      compare_with_portfolio: true
      compare_with_exchange: true
      tolerance: 0.001  # 0.1% tolerance
      
    balance_reconciliation:
      enabled: true
      compare_with_exchange: true
      compare_with_portfolio: true
      compare_with_accounting: true
      tolerance: 0.001

# ============================================================
# AUDIT ANALYTICS
# ============================================================
audit_analytics:
  # Analytics Settings
  settings:
    enabled: true
    analytics_frequency: "daily"
    analytics_depth: "full"  # full, summary, trend
    
  # Analytics Types
  types:
    trend_analysis:
      enabled: true
      lookback_days: 30
      metrics:
        - "trade_volume"
        - "trade_count"
        - "pnl"
        - "risk_metrics"
        - "performance_metrics"
        
    pattern_detection:
      enabled: true
      detect_anomalies: true
      detect_fraud: true
      detect_errors: true
      detect_inefficiencies: true
      
    performance_analytics:
      enabled: true
      analyze_execution_quality: true
      analyze_cost_effectiveness: true
      analyze_time_to_execute: true
      analyze_fill_rates: true
      
    risk_analytics:
      enabled: true
      analyze_risk_exposures: true
      analyze_concentrations: true
      analyze_correlations: true
      analyze_stress_scenarios: true

# ============================================================
# AUDIT CHAIN OF CUSTODY
# ============================================================
audit_chain_of_custody:
  # Chain of Custody Settings
  settings:
    enabled: true
    track_all_changes: true
    track_data_lineage: true
    track_processing_steps: true
    track_transformations: true
    
  # Tracking Elements
  elements:
    data_sources:
      tracked: true
      include_metadata: true
      include_timestamps: true
      include_validation: true
      
    processing_steps:
      tracked: true
      include_step_details: true
      include_parameters: true
      include_timestamps: true
      include_validation: true
      
    data_transformations:
      tracked: true
      include_transformation_logic: true
      include_parameters: true
      include_timestamps: true
      include_validation: true
      
    data_storage:
      tracked: true
      include_storage_details: true
      include_encryption: true
      include_access_logs: true
      include_retention: true

# ============================================================
# AUDIT PRIVACY
# ============================================================
audit_privacy:
  # Privacy Settings
  settings:
    enabled: true
    mask_sensitive_data: true
    anonymize_pii: true
    data_minimization: true
    purpose_limitation: true
    
  # Sensitive Data
  sensitive_data:
    - "api_keys"
    - "passwords"
    - "private_keys"
    - "seed_phrases"
    - "personal_identifiers"
    - "financial_accounts"
    - "trading_strategies"
    
  # Privacy Measures
  measures:
    data_masking:
      enabled: true
      mask_pattern: "***"
      mask_length: 8
      
    data_anonymization:
      enabled: true
      anonymization_method: "hash"  # hash, random, substitution
      salt: "nexus_quantum_salt"
      
    data_minimization:
      enabled: true
      retain_minimal_data: true
      delete_pii_after: 30
      aggregate_data: true

# ============================================================
# AUDIT BACKUP & RECOVERY
# ============================================================
audit_backup_recovery:
  # Backup Settings
  backup:
    enabled: true
    backup_frequency: "daily"
    backup_type: "full"  # full, incremental, differential
    backup_retention: 30
    backup_compression: true
    backup_encryption: true
    
  # Recovery Settings
  recovery:
    enabled: true
    recovery_point_objective: "1h"
    recovery_time_objective: "4h"
    recovery_testing: "monthly"
    recovery_automation: true
    
  # Disaster Recovery
  disaster_recovery:
    enabled: true
    dr_site: "secondary_region"
    dr_frequency: "daily"
    dr_retention: 90
    dr_testing: "quarterly"

# ============================================================
# AUDIT PERFORMANCE TUNING
# ============================================================
audit_performance:
  # Performance Settings
  settings:
    async_logging: true
    batch_processing: true
    batch_size: 1000
    queue_size: 10000
    max_concurrent_writers: 10
    
  # Optimization
  optimization:
    use_indexes: true
    use_partitioning: true
    use_compression: true
    use_caching: true
    cache_size: 1000
    
  # Resource Limits
  limits:
    max_memory_mb: 1024
    max_cpu_cores: 4
    max_io_ops: 1000
    max_network_bandwidth: "100Mbps"

# ============================================================
# AUDIT TROUBLESHOOTING
# ============================================================
audit_troubleshooting:
  # Debug Settings
  debug:
    enabled: false
    debug_logging: false
    trace_logging: false
    performance_metrics: true
    
  # Error Handling
  error_handling:
    retry_attempts: 3
    retry_delay: 5
    error_notification: true
    error_escalation: true
    
  # Recovery Procedures
  recovery_procedures:
    data_corruption:
      enabled: true
      recovery_method: "restore_from_backup"
      recovery_priority: "critical"
      
    system_failure:
      enabled: true
      recovery_method: "failover_to_secondary"
      recovery_priority: "critical"
      
    data_loss:
      enabled: true
      recovery_method: "restore_from_backup"
      recovery_priority: "critical"

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    audit:
      general:
        enabled: true
        audit_level: "full"
        audit_retention_days: 30
        
      logging:
        log_level: "DEBUG"
        
    compliance:
      regulatory:
        enabled: false
        
  # Staging Environment
  staging:
    audit:
      general:
        enabled: true
        audit_level: "standard"
        audit_retention_days: 90
        
      logging:
        log_level: "INFO"
        
    compliance:
      regulatory:
        enabled: true
        frameworks:
          - "FCA"
          
  # Production Environment
  production:
    audit:
      general:
        enabled: true
        audit_level: "full"
        audit_retention_days: 730
        
      logging:
        log_level: "INFO"
        
    compliance:
      regulatory:
        enabled: true
        frameworks:
          - "FCA"
          - "SEC"
          - "MAS"
          - "ESMA"
          - "CFTC"
          - "FATF"
          
  # Demo Environment
  demo:
    audit:
      general:
        enabled: true
        audit_level: "basic"
        audit_retention_days: 30
        
      logging:
        log_level: "INFO"
        
    compliance:
      regulatory:
        enabled: false

# ============================================================
# AUDIT INTEGRATION
# ============================================================
audit_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "webhook"  # webhook, api, message_queue, file_export
    
  # External Systems
  external_systems:
    compliance_system:
      enabled: true
      endpoint: "https://compliance.nexusquantum.com/api/audit"
      api_key: "${COMPLIANCE_API_KEY}"
      timeout: 30
      
    reporting_system:
      enabled: true
      endpoint: "https://reporting.nexusquantum.com/api/audit"
      api_key: "${REPORTING_API_KEY}"
      timeout: 30
      
    data_warehouse:
      enabled: true
      connection_string: "${DATA_WAREHOUSE_CONNECTION}"
      table_name: "audit_logs"
      
    monitoring_system:
      enabled: true
      endpoint: "https://monitoring.nexusquantum.com/api/audit"
      api_key: "${MONITORING_API_KEY}"
      timeout: 30

# ============================================================
# END OF CONFIGURATION
# ============================================================
