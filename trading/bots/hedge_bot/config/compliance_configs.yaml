# ============================================================
# COMPLIANCE GENERAL SETTINGS
# ============================================================
compliance:
  # General Compliance Settings
  general:
    enabled: true
    compliance_level: "full"  # full, standard, basic, minimal
    regulatory_framework: "multi"  # multi, fca, sec, mas, esma, cftc, fatf
    jurisdiction: "international"  # international, uk, us, singapore, eu
    compliance_check_interval: 60  # seconds
    auto_remediation: true
    audit_trail: true
    reporting_automation: true
    
  # Regulatory Frameworks
  frameworks:
    fca:
      enabled: true
      name: "Financial Conduct Authority"
      jurisdiction: "UK"
      requirements:
        - "client_money_handling"
        - "best_execution"
        - "market_abuse_prevention"
        - "transaction_reporting"
        - "record_keeping"
        - "risk_management"
        - "compliance_oversight"
        
    sec:
      enabled: true
      name: "Securities and Exchange Commission"
      jurisdiction: "USA"
      requirements:
        - "registration_requirements"
        - "disclosure_requirements"
        - "market_manipulation_prevention"
        - "insider_trading_prevention"
        - "record_keeping"
        - "audit_requirements"
        - "compliance_program"
        
    mas:
      enabled: true
      name: "Monetary Authority of Singapore"
      jurisdiction: "Singapore"
      requirements:
        - "licensing_requirements"
        - "business_conduct"
        - "market_conduct"
        - "client_protection"
        - "risk_management"
        - "compliance_oversight"
        - "reporting_requirements"
        
    esma:
      enabled: true
      name: "European Securities and Markets Authority"
      jurisdiction: "EU"
      requirements:
        - "miFID_II_compliance"
        - "market_abuse_prevention"
        - "transparency_requirements"
        - "position_limits"
        - "reporting_requirements"
        - "record_keeping"
        
    cftc:
      enabled: true
      name: "Commodity Futures Trading Commission"
      jurisdiction: "USA"
      requirements:
        - "derivatives_regulation"
        - "position_limits"
        - "margin_requirements"
        - "reporting_requirements"
        - "record_keeping"
        - "swap_data_reporting"
        
    fatf:
      enabled: true
      name: "Financial Action Task Force"
      jurisdiction: "International"
      requirements:
        - "aml_program"
        - "kyc_requirements"
        - "sanctions_screening"
        - "transaction_monitoring"
        - "suspicious_activity_reporting"
        - "record_keeping"

# ============================================================
# AML/KYC CONFIGURATION
# ============================================================
aml_kyc:
  # AML/KYC Settings
  settings:
    enabled: true
    aml_level: "full"  # full, standard, basic
    kyc_level: "full"  # full, standard, basic
    customer_due_diligence: "enhanced"  # enhanced, standard, simplified
    sanctions_screening: true
    pep_screening: true
    adverse_media_screening: true
    transaction_monitoring: true
    reporting_to_authorities: true
    
  # KYC Levels
  levels:
    basic:
      requirements:
        - "full_name"
        - "date_of_birth"
        - "nationality"
        - "email_address"
        - "phone_number"
      verification_methods:
        - "email_verification"
        - "phone_verification"
        
    standard:
      requirements:
        - "basic_requirements"
        - "government_id"
        - "address_proof"
        - "source_of_funds"
        - "tax_identification"
      verification_methods:
        - "document_verification"
        - "address_verification"
        - "database_verification"
        
    full:
      requirements:
        - "standard_requirements"
        - "enhanced_due_diligence"
        - "source_of_wealth"
        - "business_activities"
        - "related_parties"
        - "beneficial_owners"
        - "control_structure"
      verification_methods:
        - "face_to_face_verification"
        - "advanced_document_verification"
        - "third_party_verification"
        - "site_visit"
        
  # AML Monitoring
  monitoring:
    transaction_monitoring:
      enabled: true
      thresholds:
        single_transaction: 10000
        daily_aggregate: 50000
        weekly_aggregate: 200000
        monthly_aggregate: 500000
      monitoring_frequency: "realtime"
      
    sanctions_screening:
      enabled: true
      screening_frequency: "realtime"
      databases:
        - "OFAC"
        - "EU_Sanctions"
        - "UN_Sanctions"
        - "UK_Sanctions"
        - "Singapore_Sanctions"
        
    pep_screening:
      enabled: true
      screening_frequency: "daily"
      databases:
        - "World_Check"
        - "Dow_Jones"
        - "Refinitiv"
        
  # AML Reporting
  reporting:
    suspicious_activity_report:
      enabled: true
      threshold: 10000
      timeline: "immediate"
      
    currency_transaction_report:
      enabled: true
      threshold: 10000
      timeline: "15_days"
      
    annual_compliance_report:
      enabled: true
      timeline: "annual"

# ============================================================
# MARKET CONDUCT
# ============================================================
market_conduct:
  # Market Conduct Settings
  settings:
    enabled: true
    prevent_market_manipulation: true
    prevent_insider_trading: true
    prevent_front_running: true
    prevent_spoofing: true
    prevent_layering: true
    prevent_wash_trading: true
    ensure_best_execution: true
    maintain_market_integrity: true
    
  # Trading Restrictions
  restrictions:
    wash_trading:
      enabled: true
      detection_method: "pattern_recognition"
      threshold: 0.001  # 0.1% of volume
      
    spoofing:
      enabled: true
      detection_method: "order_book_analysis"
      threshold: 0.05  # 5% of orders
      
    layering:
      enabled: true
      detection_method: "pattern_recognition"
      threshold: 0.001  # 0.1% of volume
      
    front_running:
      enabled: true
      detection_method: "timing_analysis"
      threshold: 0.001  # 0.1% of volume
      
    insider_trading:
      enabled: true
      detection_method: "information_flow"
      threshold: "significant"
      
    market_manipulation:
      enabled: true
      detection_method: "pattern_recognition"
      threshold: 0.01  # 1% of market
        
  # Best Execution
  best_execution:
    enabled: true
    policy: "order_aggregation"  # order_aggregation, smart_routing, vwap
    monitoring_frequency: "realtime"
    reporting_frequency: "daily"
    
    execution_quality_metrics:
      - "price_improvement"
      - "fill_rate"
      - "execution_speed"
      - "slippage"
      - "market_impact"
      - "venue_analysis"
      
    venue_analysis:
      - venue: "primary_exchange"
        weight: 0.5
      - venue: "secondary_exchange"
        weight: 0.3
      - venue: "dark_pool"
        weight: 0.2

# ============================================================
# POSITION LIMITS
# ============================================================
position_limits:
  # General Position Limits
  general:
    enabled: true
    apply_across_assets: true
    apply_across_accounts: true
    reporting_frequency: "daily"
    alert_threshold: 0.80  # 80% of limit
    
  # Limits by Asset Class
  asset_class:
    cryptocurrency:
      absolute_limit: 1000000  # USD
      limit_as_percent_of_capital: 0.20  # 20%
      concentration_limit: 0.10  # 10% per asset
      
    forex:
      absolute_limit: 2000000  # USD
      limit_as_percent_of_capital: 0.30
      concentration_limit: 0.15
      
    equity:
      absolute_limit: 3000000
      limit_as_percent_of_capital: 0.25
      concentration_limit: 0.10
      
    commodity:
      absolute_limit: 1000000
      limit_as_percent_of_capital: 0.15
      concentration_limit: 0.08
      
  # Limits by Position Type
  position_type:
    spot:
      absolute_limit: 2000000
      limit_as_percent_of_capital: 0.30
      
    futures:
      absolute_limit: 1000000
      limit_as_percent_of_capital: 0.20
      
    perpetual:
      absolute_limit: 1000000
      limit_as_percent_of_capital: 0.20
      
    options:
      absolute_limit: 500000
      limit_as_percent_of_capital: 0.10
      
  # Aggregate Limits
  aggregate:
    total_position_limit: 5000000
    total_exposure_limit: 8000000
    gross_exposure_limit: 10000000
    net_exposure_limit: 5000000

# ============================================================
# RISK LIMITS
# ============================================================
risk_limits:
  # General Risk Limits
  general:
    enabled: true
    apply_across_all_positions: true
    realtime_monitoring: true
    alert_threshold: 0.75  # 75% of limit
    action_threshold: 0.90  # 90% of limit
    
  # Value at Risk Limits
  var:
    daily_var_limit: 100000  # USD
    weekly_var_limit: 300000
    monthly_var_limit: 500000
    confidence_level: 0.95
    
  # Stress Test Limits
  stress_test:
    stress_loss_limit: 500000
    scenario: "worst_case"
    
  # Margin Limits
  margin:
    initial_margin_limit: 1000000
    maintenance_margin_limit: 800000
    variation_margin_limit: 200000
    
  # Leverage Limits
  leverage:
    max_leverage: 3.0
    max_notional_leverage: 5.0
    max_effective_leverage: 4.0
    
  # Drawdown Limits
  drawdown:
    daily_drawdown_limit: 0.05  # 5%
    weekly_drawdown_limit: 0.10
    monthly_drawdown_limit: 0.15
    max_drawdown_limit: 0.20

# ============================================================
# TRANSACTION REPORTING
# ============================================================
transaction_reporting:
  # Reporting Settings
  settings:
    enabled: true
    reporting_interval: "daily"  # realtime, hourly, daily, weekly
    report_format: "json"  # json, csv, xml, pdf
    automate_reports: true
    archive_reports: true
    retention_period: 730  # days
    
  # Report Types
  types:
    trade_report:
      enabled: true
      frequency: "daily"
      fields:
        - "trade_id"
        - "timestamp"
        - "asset"
        - "side"
        - "quantity"
        - "price"
        - "value"
        - "counterparty"
        - "venue"
        - "execution_type"
        - "trade_status"
        
    order_report:
      enabled: true
      frequency: "daily"
      fields:
        - "order_id"
        - "timestamp"
        - "asset"
        - "side"
        - "order_type"
        - "quantity"
        - "limit_price"
        - "stop_price"
        - "time_in_force"
        - "order_status"
        
    position_report:
      enabled: true
      frequency: "daily"
      fields:
        - "position_id"
        - "timestamp"
        - "asset"
        - "quantity"
        - "average_price"
        - "current_price"
        - "unrealized_pnl"
        - "realized_pnl"
        - "margin"
        
    transaction_report:
      enabled: true
      frequency: "daily"
      fields:
        - "transaction_id"
        - "timestamp"
        - "type"
        - "asset"
        - "amount"
        - "counterparty"
        - "reference"
        - "status"
        
    regulatory_report:
      enabled: true
      frequency: "monthly"
      fields:
        - "reporting_period"
        - "jurisdiction"
        - "regulatory_body"
        - "report_type"
        - "data"
        - "submission_status"
        
  # Distribution
  distribution:
    internal:
      enabled: true
      recipients:
        - "compliance@nexusquantum.com"
        - "legal@nexusquantum.com"
        - "risk@nexusquantum.com"
        
    external:
      enabled: true
      recipients:
        - "regulatory_authority"
        - "auditors"
        - "clients"

# ============================================================
# RECORD KEEPING
# ============================================================
record_keeping:
  # Record Keeping Settings
  settings:
    enabled: true
    retention_period: 730  # days
    archival_period: 365  # days
    record_format: "json"  # json, csv, xml, parquet
    encryption_enabled: true
    compression_enabled: true
    immutable_records: true
    audit_trail_enabled: true
    
  # Record Types
  types:
    trade_records:
      enabled: true
      retention: 730
      include_all_trades: true
      include_order_data: true
      
    position_records:
      enabled: true
      retention: 730
      include_snapshots: true
      include_pnl: true
      
    accounting_records:
      enabled: true
      retention: 730
      include_ledger: true
      include_balances: true
      
    communication_records:
      enabled: true
      retention: 365
      include_client_communications: true
      include_internal_communications: true
      
    compliance_records:
      enabled: true
      retention: 730
      include_audit_trails: true
      include_compliance_checks: true
      
    system_records:
      enabled: true
      retention: 365
      include_system_logs: true
      include_access_logs: true
      
  # Storage
  storage:
    primary_storage: "database"
    secondary_storage: "cloud"
    archival_storage: "cold_storage"
    backup_storage: "backup_system"

# ============================================================
# COMPLIANCE MONITORING
# ============================================================
compliance_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "realtime"
    alert_threshold: 0.70  # 70% of limit
    critical_threshold: 0.90  # 90% of limit
    auto_escalation: true
    incident_management: true
    
  # Monitoring Areas
  areas:
    trade_compliance:
      enabled: true
      monitor_trade_limits: true
      monitor_position_limits: true
      monitor_risk_limits: true
      
    regulatory_compliance:
      enabled: true
      monitor_framework_compliance: true
      monitor_reporting_deadlines: true
      monitor_regulatory_changes: true
      
    operational_compliance:
      enabled: true
      monitor_system_availability: true
      monitor_data_integrity: true
      monitor_access_controls: true
      
    security_compliance:
      enabled: true
      monitor_security_breaches: true
      monitor_unauthorized_access: true
      monitor_data_protection: true
      
  # Alerts
  alerts:
    compliance_breach:
      enabled: true
      level: "critical"
      actions:
        - "notify_compliance_officer"
        - "stop_trading"
        - "investigate"
        
    regulatory_change:
      enabled: true
      level: "high"
      actions:
        - "notify_compliance_officer"
        - "review_impact"
        - "update_policies"
        
    reporting_failure:
      enabled: true
      level: "critical"
      actions:
        - "notify_compliance_officer"
        - "submit_manual_report"
        - "investigate"

# ============================================================
# COMPLIANCE TRAINING
# ============================================================
compliance_training:
  # Training Settings
  settings:
    enabled: true
    training_frequency: "annual"
    mandatory_for_all_employees: true
    certification_required: true
    training_automation: true
    record_keeping: true
    
  # Training Programs
  programs:
    induction_training:
      enabled: true
      duration: 2  # hours
      topics:
        - "compliance_overview"
        - "regulatory_framework"
        - "code_of_conduct"
        - "reporting_requirements"
        
    annual_refresher:
      enabled: true
      duration: 4  # hours
      topics:
        - "regulatory_updates"
        - "case_studies"
        - "best_practices"
        - "new_requirements"
        
    specialized_training:
      enabled: true
      duration: 8  # hours
      topics:
        - "aml_training"
        - "market_conduct"
        - "data_protection"
        - "cybersecurity"
        
  # Certification
  certification:
    required: true
    validity_period: 365  # days
    exam_required: true
    passing_score: 0.80

# ============================================================
# COMPLIANCE REPORTING
# ============================================================
compliance_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "monthly"
    report_format: "pdf"  # pdf, html, json, xml
    include_analytics: true
    include_recommendations: true
    auto_submit: true
    
  # Report Types
  types:
    monthly_compliance_report:
      enabled: true
      sections:
        - "executive_summary"
        - "compliance_metrics"
        - "breaches_and_incidents"
        - "regulatory_changes"
        - "training_status"
        - "recommendations"
        
    quarterly_compliance_report:
      enabled: true
      sections:
        - "monthly_compliance_report"
        - "quarterly_analysis"
        - "trend_analysis"
        - "risk_assessment"
        - "action_plan"
        
    annual_compliance_report:
      enabled: true
      sections:
        - "quarterly_compliance_report"
        - "annual_summary"
        - "performance_analysis"
        - "strategic_planning"
        - "regulatory_foresight"
        
  # Distribution
  distribution:
    internal:
      - "compliance_committee"
      - "executive_team"
      - "board_of_directors"
      
    external:
      - "regulatory_authority"
      - "external_auditors"
      - "clients"

# ============================================================
# INCIDENT MANAGEMENT
# ============================================================
incident_management:
  # Incident Settings
  settings:
    enabled: true
    incident_tracking: true
    escalation_policy: true
    remediation_planning: true
    reporting_to_authorities: true
    root_cause_analysis: true
    
  # Incident Types
  types:
    compliance_breach:
      enabled: true
      severity_levels:
        - "critical"
        - "high"
        - "medium"
        - "low"
      response_timeline:
        critical: "1_hour"
        high: "4_hours"
        medium: "24_hours"
        low: "72_hours"
        
    regulatory_breach:
      enabled: true
      severity_levels:
        - "critical"
        - "high"
      response_timeline:
        critical: "1_hour"
        high: "2_hours"
        
    reporting_failure:
      enabled: true
      severity_levels:
        - "high"
        - "medium"
      response_timeline:
        high: "4_hours"
        medium: "24_hours"
        
    operational_failure:
      enabled: true
      severity_levels:
        - "high"
        - "medium"
        - "low"
      response_timeline:
        high: "8_hours"
        medium: "24_hours"
        low: "72_hours"
        
  # Escalation
  escalation:
    levels:
      - level: 1
        role: "compliance_analyst"
        response_time: "15_minutes"
      - level: 2
        role: "compliance_officer"
        response_time: "30_minutes"
      - level: 3
        role: "head_of_compliance"
        response_time: "1_hour"
      - level: 4
        role: "chief_compliance_officer"
        response_time: "2_hours"

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    compliance:
      general:
        enabled: true
        compliance_level: "basic"
        auto_remediation: false
        audit_trail: true
        
    aml_kyc:
      settings:
        enabled: true
        aml_level: "basic"
        kyc_level: "basic"
        sanctions_screening: false
        transaction_monitoring: false
        
    market_conduct:
      settings:
        enabled: true
        prevent_market_manipulation: false
        prevent_insider_trading: false
        
    position_limits:
      general:
        enabled: false
        
    risk_limits:
      general:
        enabled: false
        
  # Staging Environment
  staging:
    compliance:
      general:
        enabled: true
        compliance_level: "standard"
        auto_remediation: true
        audit_trail: true
        
    aml_kyc:
      settings:
        enabled: true
        aml_level: "standard"
        kyc_level: "standard"
        sanctions_screening: true
        transaction_monitoring: true
        
    market_conduct:
      settings:
        enabled: true
        prevent_market_manipulation: true
        prevent_insider_trading: true
        
    position_limits:
      general:
        enabled: true
        alert_threshold: 0.70
        
    risk_limits:
      general:
        enabled: true
        alert_threshold: 0.70
        
  # Production Environment
  production:
    compliance:
      general:
        enabled: true
        compliance_level: "full"
        auto_remediation: true
        audit_trail: true
        
    aml_kyc:
      settings:
        enabled: true
        aml_level: "full"
        kyc_level: "full"
        sanctions_screening: true
        transaction_monitoring: true
        
    market_conduct:
      settings:
        enabled: true
        prevent_market_manipulation: true
        prevent_insider_trading: true
        ensure_best_execution: true
        
    position_limits:
      general:
        enabled: true
        alert_threshold: 0.80
        action_threshold: 0.90
        
    risk_limits:
      general:
        enabled: true
        alert_threshold: 0.75
        action_threshold: 0.90
        
  # Demo Environment
  demo:
    compliance:
      general:
        enabled: true
        compliance_level: "basic"
        auto_remediation: false
        audit_trail: true
        
    aml_kyc:
      settings:
        enabled: true
        aml_level: "basic"
        kyc_level: "basic"
        sanctions_screening: false
        transaction_monitoring: false
        
    market_conduct:
      settings:
        enabled: true
        prevent_market_manipulation: false
        prevent_insider_trading: false
        
    position_limits:
      general:
        enabled: false
        
    risk_limits:
      general:
        enabled: false

# ============================================================
# END OF CONFIGURATION
# ============================================================
