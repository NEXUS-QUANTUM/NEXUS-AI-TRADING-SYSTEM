# ============================================================
# POSITION SIZING GENERAL SETTINGS
# ============================================================
position_sizing:
  # General Position Sizing Settings
  general:
    enabled: true
    sizing_method: "risk_based"  # risk_based, fixed, kelly, optimal_f, volatility_based
    max_position_size: 10000  # USD
    min_position_size: 100  # USD
    default_position_size: 1000  # USD
    max_portfolio_risk: 0.02  # 2% of portfolio
    max_position_risk: 0.01  # 1% of portfolio
    use_dynamic_sizing: true
    use_correlation_adjustment: true
    use_volatility_adjustment: true
    update_frequency: "realtime"
    
  # Sizing Methods
  methods:
    fixed_sizing:
      enabled: true
      description: "Fixed position size"
      fixed_size: 1000
      
    risk_based_sizing:
      enabled: true
      description: "Risk-based position sizing"
      risk_per_trade: 0.01  # 1% of portfolio
      stop_loss_percentage: 0.05  # 5% stop loss
      
    kelly_criterion:
      enabled: true
      description: "Kelly Criterion position sizing"
      kelly_fraction: 0.25  # 25% of Kelly
      win_rate: 0.55
      win_loss_ratio: 2.0
      
    optimal_f:
      enabled: true
      description: "Optimal F position sizing"
      historical_returns: true
      lookback_period: 252  # days
      
    volatility_based:
      enabled: true
      description: "Volatility-based position sizing"
      target_volatility: 0.15
      position_volatility: 0.20

# ============================================================
# RISK-BASED SIZING
# ============================================================
risk_based_sizing:
  # Risk Parameters
  parameters:
    risk_per_trade: 0.01  # 1% of portfolio
    max_risk_per_trade: 0.02  # 2% of portfolio
    min_risk_per_trade: 0.005  # 0.5% of portfolio
    risk_per_day: 0.05  # 5% of portfolio
    risk_per_month: 0.15  # 15% of portfolio
    stop_loss_percentage: 0.05  # 5% stop loss
    take_profit_percentage: 0.10  # 10% take profit
    
  # Risk Calculation
  calculation:
    method: "var_based"  # var_based, historical, monte_carlo
    confidence_level: 0.95
    lookback_period: 30  # days
    use_correlation: true
    use_volatility: true
    
  # Risk Adjustments
  adjustments:
    volatility_adjustment: true
    correlation_adjustment: true
    liquidity_adjustment: true
    concentration_adjustment: true
    market_regime_adjustment: true

# ============================================================
# KELLY CRITERION SIZING
# ============================================================
kelly_sizing:
  # Kelly Parameters
  parameters:
    win_rate: 0.55  # 55% win rate
    win_loss_ratio: 2.0  # 2:1 win/loss ratio
    kelly_fraction: 0.25  # 25% of full Kelly
    max_kelly_fraction: 0.50  # 50% of full Kelly
    min_kelly_fraction: 0.10  # 10% of full Kelly
    
  # Kelly Calculation
  calculation:
    method: "standard"  # standard, fractional, optimal
    use_historical_data: true
    lookback_period: 90  # days
    update_frequency: "daily"
    
  # Kelly Adjustments
  adjustments:
    risk_adjustment: true
    drawdown_adjustment: true
    volatility_adjustment: true
    market_regime_adjustment: true

