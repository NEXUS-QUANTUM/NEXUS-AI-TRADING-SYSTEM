# ============================================================
# POSITION SIZING MONITORING
# ============================================================
position_sizing_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "realtime"
    alert_threshold: 0.75  # 75% of limit
    critical_threshold: 0.90  # 90% of limit
    reporting_frequency: "daily"
    
  # Alert Conditions
  alerts:
    position_size_alert:
      enabled: true
      level: "warning"
      threshold: 0.80
      message: "Position size approaching limit: {size}"
      
    risk_alert:
      enabled: true
      level: "warning"
      threshold: 0.80
      message: "Position risk approaching limit: {risk}%"
      
    sizing_deviation_alert:
      enabled: true
      level: "warning"
      threshold: 0.20
      message: "Position sizing deviation: {deviation}%"
      
  # Monitoring Metrics
  metrics:
    - "position_size"
    - "position_risk"
    - "portfolio_risk"
    - "sizing_deviation"
    - "risk_per_trade"
    - "risk_per_day"
    - "risk_per_month"

# ============================================================
# POSITION SIZING REPORTING
# ============================================================
position_sizing_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "daily"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    include_recommendations: true
    
  # Report Sections
  sections:
    sizing_summary:
      enabled: true
      include_current_sizes: true
      include_risk_metrics: true
      include_deviation: true
      
    asset_sizing:
      enabled: true
      include_by_asset_class: true
      include_by_asset: true
      include_limits: true
      
    risk_analysis:
      enabled: true
      include_risk_per_trade: true
      include_risk_per_day: true
      include_risk_per_month: true
      
    recommendations:
      enabled: true
      include_sizing_optimization: true
      include_risk_reduction: true
      include_asset_allocation: true

# ============================================================
# POSITION SIZING DASHBOARD
# ============================================================
position_sizing_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 5
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    sizing_summary:
      enabled: true
      position: 1
      size: "large"
      
    risk_summary:
      enabled: true
      position: 2
      size: "medium"
      
    asset_sizing:
      enabled: true
      position: 3
      size: "medium"
      
    risk_chart:
      enabled: true
      position: 4
      size: "large"
      
    alert_status:
      enabled: true
      position: 5
      size: "small"

# ============================================================
# POSITION SIZING SCENARIOS
# ============================================================
sizing_scenarios:
  # Scenario 1: Conservative Sizing
  conservative:
    description: "Conservative position sizing"
    position_size: 500
    risk_per_trade: 0.005  # 0.5%
    portfolio_risk: 0.01  # 1%
    kelly_fraction: 0.10
    
  # Scenario 2: Moderate Sizing
  moderate:
    description: "Moderate position sizing"
    position_size: 1000
    risk_per_trade: 0.01  # 1%
    portfolio_risk: 0.02  # 2%
    kelly_fraction: 0.25
    
  # Scenario 3: Aggressive Sizing
  aggressive:
    description: "Aggressive position sizing"
    position_size: 2000
    risk_per_trade: 0.02  # 2%
    portfolio_risk: 0.05  # 5%
    kelly_fraction: 0.40

# ============================================================
# POSITION SIZING EXAMPLES
# ============================================================
sizing_examples:
  # Example 1: Risk-Based Sizing
  risk_based_example:
    description: "Risk-Based Sizing Example"
    portfolio_value: 100000
    risk_per_trade: 0.01  # 1%
    stop_loss: 0.05  # 5%
    position_size: 20000  # (100000 * 0.01) / 0.05
    
  # Example 2: Kelly Criterion Sizing
  kelly_example:
    description: "Kelly Criterion Sizing Example"
    win_rate: 0.55
    win_loss_ratio: 2.0
    kelly_percentage: 0.25
    portfolio_value: 100000
    position_size: 13750  # (0.55 * 2.0 - 0.45) / 2.0 * 0.25 * 100000
    
  # Example 3: Volatility-Based Sizing
  volatility_example:
    description: "Volatility-Based Sizing Example"
    target_volatility: 0.15
    asset_volatility: 0.20
    portfolio_value: 100000
    position_size: 75000  # (0.15 / 0.20) * 100000

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
