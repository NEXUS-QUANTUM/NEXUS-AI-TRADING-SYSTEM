# ============================================================
# VEGA GENERAL SETTINGS
# ============================================================
vega:
  # General Vega Settings
  general:
    enabled: true
    calculation_method: "black_scholes"  # black_scholes, binomial, monte_carlo, finite_difference
    vega_threshold: 0.001  # Vega threshold for alerts
    vega_tolerance: 0.01  # 1% tolerance
    update_frequency: "realtime"  # realtime, hourly, daily
    use_volatility_hedging: true
    use_vega_hedging: true
    use_volatility_risk_management: true
    use_volatility_surface: true
    use_volatility_skew: true
    
  # Vega Types
  types:
    vega_hedging:
      enabled: true
      description: "Vega hedging to manage volatility risk"
      
    volatility_hedging:
      enabled: true
      description: "Volatility risk management"
      
    vega_risk:
      enabled: true
      description: "Vega risk assessment and mitigation"
      
    volatility_trading:
      enabled: true
      description: "Volatility-based trading strategies"
      
    vega_monitoring:
      enabled: true
      description: "Vega monitoring and alerts"

# ============================================================
# VEGA CALCULATION METHODS
# ============================================================
vega_methods:
  # Black-Scholes Vega
  black_scholes:
    enabled: true
    description: "Black-Scholes vega calculation"
    formula: "S * N'(d1) * √T"
    parameters:
      use_volatility_surface: true
      use_interest_rate_curve: true
      use_dividend_forecast: true
      
  # Binomial Vega
  binomial:
    enabled: true
    description: "Binomial tree vega calculation"
    steps: 100
    method: "crr"  # crr, jr, trigeorgis
    american: true
    early_exercise: true
    
  # Finite Difference Vega
  finite_difference:
    enabled: true
    description: "Finite difference vega calculation"
    method: "central"  # central, forward, backward
    step_size: 0.001
    accuracy: "high"
    
  # Monte Carlo Vega
  monte_carlo:
    enabled: true
    description: "Monte Carlo vega calculation"
    simulations: 10000
    steps: 252
    variance_reduction: true
    antithetic_variates: true

# ============================================================
# VEGA HEDGING STRATEGIES
# ============================================================
vega_hedging:
  # Strategy Settings
  settings:
    enabled: true
    strategy_type: "dynamic"  # dynamic, static, adaptive
    rebalancing_frequency: "realtime"  # realtime, hourly, daily
    rebalancing_threshold: 0.01  # 1% deviation
    hedging_instrument: "options"  # options, futures, swaps
    hedging_cost_limit: 0.001  # 0.1% of position
    
  # Strategy Types
  strategies:
    continuous_hedging:
      enabled: true
      description: "Continuous vega hedging"
      rebalancing: "continuous"
      
    discrete_hedging:
      enabled: true
      description: "Discrete vega hedging"
      rebalancing: "periodic"
      interval: 60  # minutes
      
    threshold_hedging:
      enabled: true
      description: "Threshold-based vega hedging"
      rebalancing: "threshold"
      vega_threshold: 0.02  # 2%
      
    adaptive_hedging:
      enabled: true
      description: "Adaptive vega hedging"
      rebalancing: "adaptive"
      learning_rate: 0.1
      volatility_regime_aware: true
      
  # Hedging Costs
  costs:
    transaction_cost: 0.001
    bid_ask_spread: 0.0005
    slippage: 0.0001
    market_impact: 0.0002
    financing_cost: 0.0001

# ============================================================
# VEGA LIMITS
# ============================================================
vega_limits:
  # General Vega Limits
  general:
    max_vega_exposure: 1000  # USD
    max_vega_per_position: 0.25  # 25% of position
    max_net_vega: 0.10  # 10% of portfolio
    
  # Vega Limits by Asset Class
  asset_class:
    cryptocurrency:
      max_vega_exposure: 500
      max_vega_per_position: 0.30
      max_net_vega: 0.15
      
    forex:
      max_vega_exposure: 1000
      max_vega_per_position: 0.20
      max_net_vega: 0.10
      
    equity:
      max_vega_exposure: 2000
      max_vega_per_position: 0.15
      max_net_vega: 0.08
      
    commodity:
      max_vega_exposure: 500
      max_vega_per_position: 0.25
      max_net_vega: 0.12
      
  # Vega Alert Thresholds
  alerts:
    vega_deviation: 0.02  # 2% deviation
    vega_change: 0.05  # 5% change
    vega_breach: 0.10  # 10% breach

# ============================================================
# VEGA MONITORING
# ============================================================
vega_monitoring:
  # Monitoring Settings
  settings:
    enabled: true
    monitoring_frequency: "realtime"
    reporting_frequency: "daily"
    alert_threshold: 0.75  # 75% of limit
    critical_threshold: 0.90  # 90% of limit
    
  # Monitoring Metrics
  metrics:
    - "current_vega"
    - "target_vega"
    - "vega_deviation"
    - "vega_exposure"
    - "vega_percentage"
    - "volatility_risk"
    - "vega_cost"
    - "rebalancing_frequency"
    
  # Alerts
  alerts:
    vega_limit_breach:
      enabled: true
      level: "critical"
      message: "Vega limit breached for {asset}"
      
    vega_deviation_alert:
      enabled: true
      level: "warning"
      message: "Vega deviation exceeds threshold for {asset}"
      
    vega_cost_alert:
      enabled: true
      level: "warning"
      message: "Vega hedging cost exceeds threshold for {asset}"
      
    volatility_alert:
      enabled: true
      level: "warning"
      message: "Significant volatility change for {asset}"

# ============================================================
# VEGA REPORTING
# ============================================================
vega_reporting:
  # Report Settings
  settings:
    enabled: true
    report_frequency: "daily"
    report_format: "json"  # json, csv, pdf, html
    include_analytics: true
    include_visualizations: true
    
  # Report Sections
  sections:
    vega_summary:
      enabled: true
      include_total_vega: true
      include_net_vega: true
      include_vega_percentage: true
      
    position_vega:
      enabled: true
      include_all_positions: true
      include_vega_breakdown: true
      
    hedging_summary:
      enabled: true
      include_hedging_costs: true
      include_rebalancing: true
      include_hedging_effectiveness: true
      
    volatility_analysis:
      enabled: true
      include_volatility_metrics: true
      include_volatility_surface: true
      include_volatility_skew: true
      
    risk_analysis:
      enabled: true
      include_volatility_risk: true
      include_vega_risk: true
      include_correlation_risk: true

# ============================================================
# VEGA DASHBOARD
# ============================================================
vega_dashboard:
  # Dashboard Settings
  settings:
    enabled: true
    refresh_interval: 5
    default_view: "summary"  # summary, details, analytics
    
  # Dashboard Widgets
  widgets:
    vega_summary:
      enabled: true
      position: 1
      size: "large"
      
    vega_chart:
      enabled: true
      position: 2
      size: "large"
      
    position_vega:
      enabled: true
      position: 3
      size: "medium"
      
    hedging_status:
      enabled: true
      position: 4
      size: "medium"
      
    volatility_surface:
      enabled: true
      position: 5
      size: "large"
      
    risk_status:
      enabled: true
      position: 6
      size: "small"
      
    alert_status:
      enabled: true
      position: 7
      size: "small"

# ============================================================
# VEGA INTEGRATION
# ============================================================
vega_integration:
  # Integration Settings
  settings:
    enabled: true
    integration_type: "api"  # api, webhook, websocket, file
    
  # External Systems
  systems:
    risk_system:
      enabled: true
      endpoint: "/api/risk/vega"
      update_frequency: "realtime"
      
    trading_system:
      enabled: true
      endpoint: "/api/trading/vega"
      update_frequency: "realtime"
      
    portfolio_system:
      enabled: true
      endpoint: "/api/portfolio/vega"
      update_frequency: "realtime"
      
    analytics_system:
      enabled: true
      endpoint: "/api/analytics/vega"
      update_frequency: "daily"

# ============================================================
# VEGA SCENARIOS
# ============================================================
vega_scenarios:
  # Scenario 1: Long Vega
  long_vega:
    description: "Long vega position (positive volatility exposure)"
    total_vega: 0.05
    net_vega: 0.05
    vega_exposure: 500  # USD
    volatility_exposure: "positive"
    characteristics:
      - "Profits from volatility increases"
      - "Long options"
      - "Positive vega"
      
  # Scenario 2: Short Vega
  short_vega:
    description: "Short vega position (negative volatility exposure)"
    total_vega: -0.05
    net_vega: -0.05
    vega_exposure: -500  # USD
    volatility_exposure: "negative"
    characteristics:
      - "Profits from volatility decreases"
      - "Short options"
      - "Negative vega"
      
  # Scenario 3: Vega Neutral
  vega_neutral:
    description: "Vega neutral position"
    total_vega: 0.0
    net_vega: 0.0
    vega_exposure: 0  # USD
    volatility_exposure: "neutral"
    characteristics:
      - "No volatility exposure"
      - "Hedged position"
      - "Vega neutral"

# ============================================================
# VEGA EXAMPLES
# ============================================================
vega_examples:
  # Example 1: Call Option Vega
  call_option_vega:
    description: "Call option vega calculation"
    parameters:
      underlying_price: 100
      strike_price: 100
      time_to_expiry: 30  # days
      volatility: 0.20
      risk_free_rate: 0.04
      dividend_yield: 0.01
    vega: 0.20  # $0.20 per 1% volatility change
    
  # Example 2: Put Option Vega
  put_option_vega:
    description: "Put option vega calculation"
    parameters:
      underlying_price: 100
      strike_price: 100
      time_to_expiry: 30  # days
      volatility: 0.20
      risk_free_rate: 0.04
      dividend_yield: 0.01
    vega: 0.20  # $0.20 per 1% volatility change (same as call)
    
  # Example 3: Vega Hedging
  vega_hedging_example:
    description: "Vega hedging example"
    position:
      asset: "BTC"
      quantity: 1
      vega: 0.20
      volatility: 0.20
    hedge:
      asset: "BTC Options"
      quantity: -0.20  # Short 0.20 vega
      vega: -1.0
    net_vega: 0.0
    hedging_effectiveness: 0.95

# ============================================================
# ENVIRONMENT-SPECIFIC CONFIGURATIONS
# ============================================================
environments:
  # Development Environment
  development:
    vega:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "hourly"
        
    vega_monitoring:
      alerts:
        vega_limit_breach:
          enabled: false
        vega_deviation_alert:
          enabled: false
          
  # Staging Environment
  staging:
    vega:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "realtime"
        
    vega_monitoring:
      alerts:
        vega_limit_breach:
          enabled: true
        vega_deviation_alert:
          enabled: true
        vega_cost_alert:
          enabled: true
          
  # Production Environment
  production:
    vega:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "realtime"
        use_volatility_hedging: true
        use_vega_hedging: true
        use_volatility_risk_management: true
        use_volatility_surface: true
        use_volatility_skew: true
        
    vega_monitoring:
      alerts:
        vega_limit_breach:
          enabled: true
          level: "critical"
        vega_deviation_alert:
          enabled: true
          level: "warning"
        vega_cost_alert:
          enabled: true
          level: "warning"
        volatility_alert:
          enabled: true
          level: "warning"
          
  # Demo Environment
  demo:
    vega:
      general:
        enabled: true
        calculation_method: "black_scholes"
        update_frequency: "hourly"
        
    vega_monitoring:
      alerts:
        vega_limit_breach:
          enabled: false
        vega_deviation_alert:
          enabled: true

# ============================================================
# END OF CONFIGURATION
# ============================================================
