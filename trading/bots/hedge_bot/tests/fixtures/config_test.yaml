# --- Full Valid Configuration ---
full_valid_config:
  bot:
    id: "test_hedge_bot"
    name: "Test Hedge Bot"
    version: "2.0.0-test"
    description: "Test instance of NEXUS Hedge Bot"
    enabled: true
    active: true
    environment: "testing"
    mode: "automatic"
    debug_mode: true
    log_level: "DEBUG"
    features:
      paper_trading: true
      mock_exchange: true
      synthetic_data: true
      auto_hedging: true
      auto_rebalancing: true
      ai_optimization: false

  exchange:
    name: "binance"
    type: "spot"
    sandbox: true
    testnet: true
    api:
      key: "test_api_key"
      secret: "test_api_secret"
      passphrase: "test_passphrase"
      timeout: 30
      retry_attempts: 3
      rate_limit: 1200
      use_hmac: true
      use_signing: true
    settings:
      use_mock_data: true
      use_websocket: true
      websocket_reconnect: true
      websocket_timeout: 30
    pairs:
      - "BTC/USDT"
      - "ETH/USDT"
      - "SOL/USDT"
      - "ADA/USDT"
      - "DOT/USDT"

  trading:
    order:
      type: "limit"
      time_in_force: "GTC"
      max_order_size: 10000
      min_order_size: 100
      slippage_tolerance: 0.001
      use_post_only: true
      use_reduce_only: false
    position:
      max_positions: 10
      max_leverage: 3.0
      target_hedge_ratio: 0.50
      min_hedge_ratio: 0.20
      max_hedge_ratio: 0.80
      position_monitoring: true
      auto_close: false
    execution:
      simulate_execution: true
      execution_delay: 100
      fill_probability: 1.0
      partial_fill_probability: 0.05
      execution_timeout: 30
      order_retry: true
      order_retry_attempts: 3

  hedge_strategy:
    config:
      hedge_ratio: 0.50
      hedge_threshold: 0.01
      max_hedge_position: 0.80
      min_hedge_position: 0.20
      dynamic_hedge_ratio: true
      rebalance_interval: 15
      volatility_lookback: 30
      correlation_lookback: 60
      ml_hedge_optimization: false
      adaptive_hedging: false
    execution:
