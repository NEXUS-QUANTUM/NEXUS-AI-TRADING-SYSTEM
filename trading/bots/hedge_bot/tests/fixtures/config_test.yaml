      time_in_force: "GTC"
      max_order_size: 10000
      min_order_size: 100
      slippage_tolerance: 0.001
      iceberg_order: false
      smart_routing: false
    risk:
      max_drawdown: 0.15
      daily_loss_limit: 0.05
      max_leverage: 3.0
      stop_loss: 0.10
      take_profit: 0.20
      trailing_stop: 0.03
      circuit_breaker: false

  hedging_strategies:
    delta_hedging:
      enabled: true
      parameters:
        target_delta: 0.0
        delta_tolerance: 0.01
        rebalancing_frequency: "realtime"
        hedging_instrument: "futures"
    gamma_hedging:
      enabled: false
      parameters:
        gamma_threshold: 0.0001
        gamma_tolerance: 0.01
        rebalancing_frequency: "realtime"
        gamma_scalping: false
    cross_hedging:
      enabled: false
      parameters:
        correlation_threshold: 0.70
        hedge_ratio: 0.50
        hedging_assets: []
    basis_hedging:
      enabled: false
      parameters:
        basis_threshold: 0.005
        basis_tolerance: 0.002
        hedging_instrument: "perpetual"

  directional_strategies:
    trend_following:
      enabled: false
      parameters:
        trend_period: 20
        signal_threshold: 0.01
        entry_signal: "crossover"
        exit_signal: "crossunder"
        indicators: []
    mean_reversion:
      enabled: false
      parameters:
        lookback_period: 20
        deviation_threshold: 2.0
        entry_signal: "oversold"
        exit_signal: "overbought"
        indicators: []
    momentum:
      enabled: false
      parameters:
        momentum_period: 14
        signal_threshold: 0.02
        entry_signal: "momentum_high"
        exit_signal: "momentum_low"

  arbitrage_strategies:
    funding_arbitrage:
      enabled: false
      parameters:
        min_funding_rate: 0.0005
        max_funding_rate: 0.005
        position_size: 0.10
        arbitrage_window: 8
    basis_arbitrage:
      enabled: false
      parameters:
        min_basis: 0.002
        max_basis: 0.01
        position_size: 0.05
        arbitrage_window: 24
    cross_exchange_arbitrage:
      enabled: false
      parameters:
        min_spread: 0.001
        max_spread: 0.005
        position_size: 0.05
        execution_timeout: 5
        exchanges: []

  risk_management:
    enabled: true
    risk_level: "moderate"
    max_risk_per_trade: 0.02
    max_risk_per_day: 0.05
    max_risk_per_month: 0.15
    risk_monitoring: true
    risk_alerts: true
    risk_limits: true
    position_sizing:
      method: "fixed"
      risk_per_trade: 0.01
      max_position_size: 10000
      min_position_size: 100
      use_correlation_adj: false
      use_volatility_adj: false
      kelly_fraction: 0.25
    limits:
      max_drawdown: 0.15
      daily_loss_limit: 0.05
      weekly_loss_limit: 0.10
      monthly_loss_limit: 0.15
      max_correlation: 0.70
      max_leverage: 3.0
      max_exposure: 1000000
      max_position_size: 10000

  risk_metrics:
    var:
      confidence_levels: [0.95, 0.99]
      horizons: [1, 5, 10]
      calculation_method: "historical"
      lookback_period: 252
    cvar:
      confidence_levels: [0.95, 0.99]
      horizons: [1, 5, 10]
      calculation_method: "historical"
    drawdown:
      max_drawdown_limit: 0.15
      drawdown_warning_threshold: 0.10
      drawdown_critical_threshold: 0.12
      drawdown_emergency_threshold: 0.14

  portfolio:
    id: "test_portfolio"
    name: "Test Trading Portfolio"
    currency: "USD"
    initial_balance: 100000
    current_balance: 100000
    allocation:
      method: "equal_weight"
      target_volatility: 0.15
      max_single_asset: 0.15
      max_sector: 0.40
      max_asset_class: 0.50
      min_assets: 5
      target_assets: 10
      rebalance_frequency: "daily"
      rebalance_threshold: 0.02
    performance:
      track_metrics: true
      benchmark: "SPY"
      risk_free_rate: 0.04
      performance_frequency: "daily"

  data:
    sources:
      market_data:
        provider: "mock"
        update_frequency: "realtime"
        cache: true
        cache_ttl: 5
      historical_data:
        provider: "file"
        lookback_period: 90
        granularity: "1h"
        min_data_points: 50
      sentiment_data:
        provider: "mock"
        update_frequency: "hourly"
        sources: []
    storage:
      database: "sqlite"
      cache: "memory"
      retention_days: 30
      compression: false
      backup: false
    quality:
      validate_data: true
      remove_outliers: true
      interpolate_missing: true
      min_data_points: 50
      outlier_threshold: 3.0
      data_quality_check: true

  ai_ml:
    config:
      enabled: false
      model_type: "ensemble"
      model_path: "/tmp/test_model.pkl"
      inference_batch_size: 50
      prediction_horizon: 60
      confidence_threshold: 0.60
      use_gpu: false
      use_cuda: false
    features: []
    training:
      enabled: false
      frequency: "daily"
      lookback_period: 30
      validation_split: 0.20
      epochs: 10
      early_stopping: true
      batch_size: 8
    prediction:
      enabled: false
      confidence_threshold: 0.60
      prediction_models: []

  monitoring:
    config:
      enabled: true
      monitoring_frequency: "realtime"
      alert_channels:
        - "console"
        - "file"
    health:
      check_interval: 30
      auto_recovery: true
      max_failures: 3
      recovery_timeout: 60
    alerts:
      trade_execution: true
      position_changes: true
      risk_breaches: true
      system_errors: true
      performance_issues: true
    metrics:
      - "pnl"
      - "win_rate"
      - "sharpe_ratio"
      - "max_drawdown"
      - "trade_count"
      - "volume_traded"
      - "response_time"
      - "error_rate"

  logging:
    config:
      enabled: true
      log_level: "DEBUG"
      log_format: "json"
      log_rotation: "daily"
      log_compression: false
      log_retention_days: 7
    files:
      main_log: "/tmp/test_hedge_bot.log"
      trade_log: "/tmp/test_trades.log"
      error_log: "/tmp/test_errors.log"
      audit_log: "/tmp/test_audit.log"
    categories:
      trade: true
      position: true
      risk: true
      system: true
      audit: true
      performance: true
      debug: true

  security:
    enabled: false
    encryption: false
    encryption_method: "AES-256-GCM"
    key_rotation_days: 30
    auth:
      enabled: false
      method: "jwt"
      token_expiry: 3600
      refresh_token_expiry: 86400
      multi_factor_auth: false
    authorization:
      enabled: false
      rbac: false
      permission_level: "admin"
    api:
      rate_limiting: false
      max_requests_per_minute: 60
      ip_whitelist: []
      ip_blacklist: []

  compliance:
    enabled: false
    regulatory_framework: "none"
    compliance_level: "basic"
    auto_remediation: false
    audit_trail: false
    aml_kyc:
      enabled: false
      screening: false
      reporting: false
    position_limits:
      enabled: false
    reporting:
      enabled: false
    record_keeping:
      enabled: false
      retention_days: 7
      immutable: false

  notifications:
    channels:
      email:
        enabled: false
        smtp_server: "localhost"
        smtp_port: 25
        username: "test"
        password: "test"
      telegram:
        enabled: false
        bot_token: "test_token"
        chat_id: "test_chat_id"
      slack:
        enabled: false
        webhook_url: "test_webhook"
        channel: "#test"
      push:
        enabled: false
        app_id: "test_app_id"
        api_key: "test_api_key"
    types:
      trade_execution: true
      position_update: true
      risk_alert: true
      system_error: true
      performance_report: true
      daily_summary: true

  backup:
    enabled: false
    schedule: "daily"
    time: "00:00:00"
    retention_days: 7
    compression: false
    encryption: false
    verification: false
    types:
      database: false
      configuration: false
      logs: false
      models: false
    storage:
      local: true
      cloud: false

  performance:
    enabled: true
    max_workers: 2
    batch_size: 50
    queue_size: 100
    use_async: false
    use_caching: true
    cache_ttl: 30
    use_connection_pooling: false
    resources:
      max_memory_mb: 512
      max_cpu_cores: 2
      max_concurrent_trades: 3
      max_order_rate: 5
    latency:
      target_latency_ms: 100
      max_latency_ms: 500
      latency_alert_threshold: 300
    throughput:
      target_tps: 50
      max_tps: 100
      throughput_alert_threshold: 80

