  modifiable:
    trading:
      position:
        max_leverage: 2.0
        target_hedge_ratio: 0.60
      order:
        max_order_size: 20000
        slippage_tolerance: 0.002
    
    hedge_strategy:
      config:
        hedge_ratio: 0.60
        hedge_threshold: 0.02
        rebalance_interval: 10
    
    risk_management:
      limits:
        max_drawdown: 0.10
        daily_loss_limit: 0.03

# ============================================================
# ERROR SCENARIO CONFIGURATIONS
# ============================================================

error_scenarios:
  # Database connection error
  db_connection_error:
    data:
      storage:
        database: "postgresql"
        connection_string: "postgresql://invalid:invalid@localhost:9999/invalid"
  
  # Exchange API error
  exchange_api_error:
    exchange:
      api:
        key: "invalid_key"
        secret: "invalid_secret"
        timeout: 1
        retry_attempts: 1
  
  # Rate limit error
  rate_limit_error:
    exchange:
      api:
        rate_limit: 1
    trading:
      order:
        max_order_rate: 10

