# --- Integration Test Configurations ---
integration_test:
  # Database integration
  database_integration:
    data:
      storage:
        database: "postgresql"
        cache: "redis"
        retention_days: 365
        compression: true
        backup: true
      quality:
        validate_data: true
        remove_outliers: true
        interpolate_missing: true
        min_data_points: 100

  # Exchange integration
  exchange_integration:
    exchange:
      name: "binance"
      type: "spot"
      sandbox: true
      settings:
        use_mock_data: false
        use_websocket: true
      pairs:
        - "BTC/USDT"
        - "ETH/USDT"
        - "SOL/USDT"

  # Notification integration
  notification_integration:
